<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATLAS Lesson Blocks Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Design tokens — taken from demo.atlaslearn.ai (Montserrat, navy header, teal primary)
   ========================================================================== */
:root {
  --navy: #31425D;
  --primary: #0D719A;
  --primary-ink: #0A5A7B;
  --primary-soft: #E6F2F7;
  --bg: #F6F7F9;
  --surface: #FFFFFF;
  --ink: #171A26;
  --muted: #5B6475;
  --line: #E1E5EB;
  --accent: #F5A623;
  --accent-ink: #8A5600;
  --accent-soft: #FEF4E1;
  --green: #1E8A5A;
  --green-soft: #E3F4EC;
  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 20px;
  --font: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  --topbar-h: 54px;
  --proto-h: 48px;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--topbar-h) + 24px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.7;
}
h1, h2, h3, h4, p, ul, ol { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ---------- Prototype controls (not part of the design) ---------- */
.proto {
  position: sticky; top: 0; z-index: 60; min-height: var(--proto-h);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
  padding: 6px 20px; background: #FFF8E6; border-bottom: 1px dashed var(--accent);
  font-size: 13px;
}
.proto b { color: var(--accent-ink); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); overflow: hidden; }
.seg button { border: 0; background: none; padding: 6px 14px; font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }

/* ---------- App chrome (mirrors production) ---------- */
.topbar {
  position: sticky; top: var(--proto-h); z-index: 50; height: var(--topbar-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; background: var(--navy); color: #fff; font-weight: 600;
}
.topbar button { border: 0; background: none; color: #fff; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.progressbar { position: sticky; top: calc(var(--proto-h) + var(--topbar-h)); z-index: 49; height: 4px; background: var(--line); }
.progressbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .12s linear; }

.layout {
  display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 0;
  max-width: 1280px; margin: 0 auto; padding: 24px 16px 96px;
}
.stage { display: grid; grid-template-columns: 280px minmax(0, 760px); justify-content: center; gap: 32px; }
.stage.no-rail { grid-template-columns: minmax(0, 840px); }

/* Icon rail */
.iconrail { position: sticky; top: calc(var(--proto-h) + var(--topbar-h) + 28px); align-self: start; display: grid; gap: 10px; }
.iconrail button {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--primary); display: grid; place-items: center;
}
.iconrail button:hover { background: var(--primary-soft); }

/* ---------- Course outline (left panel on desktop, drawer on smaller screens) ---------- */
.outline {
  position: sticky; top: calc(var(--proto-h) + var(--topbar-h) + 28px); align-self: start;
  max-height: calc(100vh - var(--proto-h) - var(--topbar-h) - 52px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 12px 14px; font-size: 13.5px;
}
.ol-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 0 6px; }
.outline h2 { font-size: 15px; font-weight: 700; line-height: 1.35; }
.ol-close { display: none; border: 0; background: var(--bg); border-radius: 8px; width: 32px; height: 32px; font-size: 16px; flex: none; }
.ol-count { margin: 8px 6px 6px; font-size: 12.5px; color: var(--muted); }
.ol-bar { margin: 0 6px 12px; height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.ol-bar i { display: block; height: 100%; width: 0; background: var(--green); transition: width .3s; }
.ol-list { list-style: none; padding: 0; display: grid; gap: 2px; }
.ol-item > button {
  display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; border: 0; background: none;
  padding: 8px 8px; border-radius: 10px; line-height: 1.35;
}
.ol-item > button:hover { background: var(--bg); }
.ol-item.cur > button { background: var(--primary-soft); }
.ol-item.cur .ol-name { font-weight: 600; }
.ol-status { flex: none; width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
.ol-item.cur .ol-status { border-color: var(--primary); }
.ol-item.cur .ol-status::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.ol-item.done .ol-status { background: var(--green); border-color: var(--green); }
.ol-item.done .ol-status::after { content: "✓"; width: auto; height: auto; background: none; }
.ol-text { min-width: 0; }
.ol-name { display: block; }
.ol-text small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
.ol-sections { list-style: none; margin: 2px 0 8px 29px; padding: 0 0 0 0; border-left: 2px solid var(--line); }
.ol-sections a { display: block; padding: 4px 10px; margin-left: -2px; border-left: 2px solid transparent; color: var(--muted); text-decoration: none; font-size: 12.5px; line-height: 1.4; }
.ol-sections a:hover { color: var(--ink); }
.ol-sections a.on { color: var(--primary-ink); font-weight: 600; border-left-color: var(--primary); }
.topbar .outline-btn { display: none; border: 0; background: rgba(255,255,255,.12); color: #fff; border-radius: 10px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; align-items: center; gap: 8px; }
.scrim { display: none; }

/* ---------- Lesson shell ---------- */
.lesson-card { background: var(--surface); border-radius: var(--radius-lg); box-shadow: 0 1px 2px rgba(23,26,38,.04); padding: 32px 36px 40px; }
.crumb { font-size: 12.5px; color: var(--muted); }
.lesson-title { display: flex; align-items: center; gap: 12px; font-size: clamp(26px, 3.4vw, 32px); font-weight: 700; line-height: 1.2; margin: 6px 0 12px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; font-weight: 600; font-size: 12.5px; color: var(--ink); }
.lesson-body { margin-top: 28px; padding-top: 28px; border-top: 1px solid var(--line); }
.lesson-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
  padding: 11px 22px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 8px;
}
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.jen {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 36px; padding: 8px 16px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font-size: 14px;
}

/* ==========================================================================
   BLOCKS
   ========================================================================== */
.block { margin: 0 0 44px; }
.block:last-child { margin-bottom: 0; }
.block h2.block-title { font-size: 22px; font-weight: 700; line-height: 1.3; margin-bottom: 14px; }
.block h3 { font-size: 17px; font-weight: 700; line-height: 1.35; margin-bottom: 6px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--primary-ink); margin-bottom: 6px; }
.lead { font-size: 18px; line-height: 1.7; }
.prose p + p { margin-top: 14px; }
.muted { color: var(--muted); }

/* Callout */
.callout { display: flex; gap: 14px; padding: 18px 20px; border-radius: var(--radius); background: var(--primary-soft); border-left: 5px solid var(--primary); }
.callout.note { background: var(--accent-soft); border-left-color: var(--accent); }
.callout.good { background: var(--green-soft); border-left-color: var(--green); }
.callout .ic { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: #fff; font-weight: 700; font-size: 15px; }
.callout.note .ic { background: var(--accent-ink); }
.callout.good .ic { background: var(--green); }
.callout strong { display: block; font-weight: 700; margin-bottom: 2px; }
.callout p { font-size: 15px; line-height: 1.65; }
.callout a, .link { color: var(--primary-ink); font-weight: 600; }

/* Card grid */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.card p { font-size: 14.5px; line-height: 1.6; color: var(--muted); }
.card .badge { width: 42px; height: 42px; border-radius: 12px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; margin-bottom: 12px; }
.card .num { width: 34px; height: 34px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; margin-bottom: 12px; }
.card.accent-top { border-top: 4px solid var(--primary); }

/* Checklist */
.checklist { display: flex; gap: 14px; align-items: flex-start; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); }
.checklist input { width: 22px; height: 22px; margin-top: 3px; accent-color: var(--primary); flex: none; }
.checklist label { cursor: pointer; }
.checklist label b { display: block; font-size: 17px; }
.checklist label span { display: block; color: var(--muted); font-size: 14.5px; line-height: 1.6; margin-top: 4px; }

/* Community / feature panel */
.panel { background: var(--navy); color: #fff; border-radius: var(--radius-lg); padding: 28px; display: grid; gap: 18px; }
.panel h2 { color: #fff; font-size: 22px; line-height: 1.3; }
.panel ul { list-style: none; padding: 0; display: grid; gap: 10px; }
.panel li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.55; }
.panel li::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: 8px; border-radius: 50%; background: var(--accent); }
.panel .fine { font-size: 13px; color: rgba(255,255,255,.8); }
.panel .btn { background: #fff; color: var(--navy); border-color: #fff; justify-self: start; }

/* Video */
.video { position: relative; border-radius: var(--radius); overflow: hidden; aspect-ratio: 16/9; background: #0f1724; display: grid; place-items: center; }
.video svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.play { position: relative; width: 76px; height: 76px; border-radius: 50%; border: 0; background: #fff; color: var(--primary); display: grid; place-items: center; box-shadow: 0 10px 28px rgba(0,0,0,.35); }
.video .vmeta { position: absolute; left: 18px; bottom: 14px; right: 18px; color: #fff; font-size: 14px; display: flex; justify-content: space-between; gap: 10px; }
.video .vmeta b { font-weight: 600; }
.chips-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; font-size: 13.5px; font-weight: 500; }
.chip.solid { background: var(--primary-soft); border-color: transparent; color: var(--primary-ink); font-weight: 600; }

/* Transcript */
details.disclosure { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
details.disclosure summary { cursor: pointer; padding: 16px 20px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
details.disclosure summary::-webkit-details-marker { display: none; }
details.disclosure summary::after { content: "+"; font-size: 22px; line-height: 1; color: var(--primary); }
details.disclosure[open] summary::after { content: "–"; }
details.disclosure .inner { padding: 0 20px 20px; font-size: 15px; line-height: 1.75; color: var(--muted); }
details.disclosure .inner p + p { margin-top: 12px; }
details.disclosure .inner h4 { color: var(--ink); font-size: 14px; margin: 18px 0 4px; }

/* Funnel */
.funnel-wrap { display: grid; gap: 18px; }
.who { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
.funnel { display: grid; gap: 6px; justify-items: center; }
.stage-btn {
  --w: 100%; width: var(--w); border: 2px solid transparent; border-radius: 12px; background: var(--primary-soft); color: var(--ink);
  padding: 12px 16px; text-align: center; font-weight: 600; font-size: 15px; position: relative; transition: background .15s, border-color .15s;
}
.stage-btn:hover { border-color: var(--primary); }
.stage-btn[aria-pressed="true"] { background: var(--primary); color: #fff; }
.stage-btn .start { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 11.5px; font-weight: 600; background: var(--accent); color: #3b2600; border-radius: 999px; padding: 1px 10px; display: none; }
.stage-btn.is-start .start { display: inline-block; }
.stage-detail { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 20px; font-size: 15px; min-height: 84px; }
.stage-detail b { display: block; font-size: 16px; margin-bottom: 2px; }

/* Stepper */
.stepper { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; counter-reset: s; }
.stepper li { position: relative; padding: 38px 8px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--muted); counter-increment: s; }
.stepper li::before {
  content: counter(s); position: absolute; top: 0; left: 0; width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--surface); border: 2px solid var(--line); color: var(--muted); z-index: 1;
}
.stepper li::after { content: ""; position: absolute; top: 13px; left: 30px; right: 4px; height: 2px; background: var(--line); }
.stepper li:last-child::after { display: none; }
.stepper li.done::before { content: "✓"; background: var(--green); border-color: var(--green); color: #fff; }
.stepper li.done::after { background: var(--green); }
.stepper li.now { color: var(--ink); font-weight: 600; }
.stepper li.now::before { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 0 0 4px var(--primary-soft); }
.stepper .here { display: inline-block; margin-top: 4px; font-size: 11.5px; font-weight: 600; color: var(--primary-ink); background: var(--primary-soft); border-radius: 999px; padding: 0 8px; }

/* Two-column definition */
.define { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.define .box { border-radius: var(--radius); padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); }
.define .box.hl { background: var(--primary-soft); border-color: transparent; }
.ticks { list-style: none; padding: 0; display: grid; gap: 8px; margin-top: 8px; }
.ticks li { display: flex; gap: 10px; font-size: 15px; line-height: 1.5; }
.ticks li::before { content: "✓"; color: var(--green); font-weight: 700; flex: none; }

/* Persona */
.persona { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.persona header { padding: 16px 20px; background: var(--primary-soft); display: flex; align-items: center; gap: 12px; }
.persona header .av { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
.persona header small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.persona header b { font-size: 16px; line-height: 1.3; }
.persona dl { margin: 0; padding: 6px 20px 16px; display: grid; gap: 12px; }
.persona dt { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
.persona dd { margin: 2px 0 0; font-size: 14.5px; line-height: 1.55; }
.persona dd ul { padding-left: 18px; }
.persona .chips-row { margin-top: 4px; }

/* Task / exercise */
.task { border: 2px solid var(--primary); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; }
.task-head { background: var(--primary); color: #fff; padding: 16px 22px; display: flex; gap: 12px; align-items: center; }
.task-head b { font-size: 17px; }
.task-head small { display: block; opacity: .9; font-size: 13px; line-height: 1.4; }
.task form { padding: 20px 22px 22px; display: grid; gap: 16px; }
.field label { display: block; font-weight: 600; font-size: 14.5px; margin-bottom: 2px; }
.field small { display: block; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.field input, .field textarea {
  width: 100%; font: inherit; font-size: 15px; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink);
}
.field textarea { min-height: 84px; resize: vertical; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px var(--primary-soft); }
.task-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.saved { margin-top: 18px; display: grid; gap: 14px; }
.saved .persona header { background: var(--green-soft); }
.saved .persona header .av { background: var(--green); }
.empty { padding: 16px; text-align: center; color: var(--muted); font-size: 14px; border: 1.5px dashed var(--line); border-radius: var(--radius); }
.saved-note { font-size: 13px; color: var(--muted); }

/* ---------- Lesson review (enhanced) ---------- */
.btn.primary.locked { background: var(--navy); border-color: var(--navy); }
.btn.primary.locked:hover { background: #26344b; }
.review { margin-top: 20px; background: var(--surface); border-radius: var(--radius-lg); box-shadow: 0 1px 2px rgba(23,26,38,.04); border: 2px solid transparent; padding: 28px 36px 32px; scroll-margin-top: calc(var(--topbar-h) + 40px); }
.review.nudge { animation: nudge .9s ease-out; }
@keyframes nudge { 0% { box-shadow: 0 0 0 0 rgba(13,113,154,.6); border-color: var(--primary); } 100% { box-shadow: 0 0 0 16px rgba(13,113,154,0); border-color: transparent; } }
.rv-head { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.rv-ic { flex: none; width: 46px; height: 46px; border-radius: 14px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; }
.review.passed .rv-ic { background: var(--green-soft); color: var(--green); }
.review h2 { font-size: 20px; font-weight: 700; line-height: 1.3; }
.rv-head p { font-size: 14px; color: var(--muted); line-height: 1.5; }
.rv-note { font-size: 15px; margin-bottom: 18px; }
.rv-dots { display: flex; gap: 6px; margin-bottom: 14px; }
.rv-dots span { flex: 1; height: 6px; border-radius: 999px; background: var(--line); }
.rv-dots span.ok { background: var(--green); }
.rv-dots span.bad { background: #D9534F; }
.rv-dots span.cur { background: var(--primary); }
.rv-count { font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.rv-q { font-size: 19px; font-weight: 700; line-height: 1.4; margin: 6px 0 16px; outline: none; }
.rv-opts { display: grid; gap: 10px; }
.rv-opt { display: flex; gap: 12px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; font-size: 15px; line-height: 1.5; background: var(--surface); }
.rv-opt:hover { border-color: var(--primary); }
.rv-opt input { position: absolute; opacity: 0; pointer-events: none; }
.rv-opt .l { flex: none; width: 28px; height: 28px; border-radius: 8px; background: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.rv-opt:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); }
.rv-opt:has(input:focus-visible) { outline: 3px solid var(--primary); outline-offset: 2px; }
/* :has(input) matches the specificity of the :checked rule above, so these win by coming later. */
.rv-opt.right, .rv-opt.right:has(input) { border-color: var(--green); background: var(--green-soft); }
.rv-opt.right .l { background: var(--green); color: #fff; }
.rv-opt.wrong, .rv-opt.wrong:has(input) { border-color: #D9534F; background: #FDECEA; }
.rv-opt.wrong .l { background: #D9534F; color: #fff; }
.rv-opt.locked { cursor: default; }
.rv-fb { margin-top: 14px; border-radius: 14px; padding: 14px 16px; font-size: 15px; line-height: 1.6; outline: none; }
.rv-fb.ok { background: var(--green-soft); }
.rv-fb.no { background: var(--accent-soft); }
.rv-fb b { display: block; }
.rv-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
.rv-skel { display: grid; gap: 12px; margin: 6px 0 4px; }
.rv-skel i { display: block; height: 46px; border-radius: 14px; background: linear-gradient(90deg, var(--line), var(--bg), var(--line)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
.rv-skel i:first-child { height: 26px; width: 70%; }
@keyframes shimmer { to { background-position: -200% 0; } }

    <details class="disclosure" style="margin-top:14px">
      <summary>Read the transcript</summary>
      <div class="inner">
        <p>What is digital marketing? Digital marketing is everywhere, from social media ads, search engines and websites, to emails and, even, online reviews. So, what exactly is digital marketing? Digital marketing is the use of digital technologies to create integrated, targeted and measurable communications with the purpose of acquiring and retaining customers. Digital marketing is a data-driven process, which allows you to target individual customers and provide personalized and interactive content, as well as ensure that you get measurable results across multiple channels.</p>
        <h4>Consideration 1 · Marketing objectives</h4>
        <p>The main goal of digital marketing is to reach customers at the moments that most influence their decisions. These moments, or touch points, can be understood through the customer journey funnel where customers begin at the wide end of the funnel with a number of potential options on their mind. As they gather more information, the number of options gradually reduce until they arrive at the conversion stage, where they potentially buy your product or sign up for your service. Finally, the post-sale phase becomes an important stage, where you'll try and retain this individual and make them a loyal customer. As a marketer, you hope to reach out to your customers at each stage of their customer journey and drive them towards the end of the funnel to become a loyal customer.</p>
        <p>Take customer one, for example. They just picked up photography as a hobby. They are searching for a suitable camera. Their customer journey starts from the awareness stage. Take customer two, a camera enthusiast looking to buy a digital camera. Their customer journey can start from the consideration stage where they are debating between different cameras.</p>
        <h4>Consideration 2 · Audience</h4>
        <p>Think about your own customers, what are their motivations and needs at each stage of the customer journey? What should your marketing objectives be to meet their needs?</p>
        <h4>Consideration 3 · Promoting your content</h4>
        <p>As a marketer, you'll want to be able to guide customer one and two through the funnel by addressing their needs. By providing them with a great experience at each stage, you hope to convince them to convert, and, ultimately, retain them as a loyal customer.</p>
        <h4>Consideration 4 · Measuring success</h4>
        <p>While the outcomes for customer one and two are the same, you can see that their customer journeys differ. Understanding how customer motivations and needs differ, allows you to identify your objectives at each stage. You can then meet potential buyers where they are, and encourage them to convert.</p>
        <p>These are the key points to consider when creating a digital marketing plan, and you will find out more about each stage as you progress through this course.</p>
      </div>
    </details>
  </section>

  <p class="legacy single">What is digital marketing? Digital marketing is everywhere, from social media ads, search engines and websites, to emails and, even, online reviews. So, what exactly is digital marketing? Digital marketing is the use of digital technologies to create integrated, targeted and measurable communications with the purpose of acquiring and retaining customers. Digital marketing is a data-driven process, which allows you to target individual customers and provide personalized and interactive content, as well as ensure that you get measurable results across multiple channels. How can we make the most of the benefits of digital marketing? Here is a list of considerations when you're deciding on how to design your digital marketing plan. 1. What are your marketing objectives? 2. Who is my audience and where are they located? 3. How do I promote the content? 4. How can I measure success? We begin with key consideration one: What are your marketing objectives? The main goal of digital marketing, is to reach customers at the moments that most influence their decisions. These moments, or touch points, can be understood through the customer journey funnel where customers begin at the wide end of the funnel with a number of potential options on their mind. As they gather more information, the number of options gradually reduce until they arrive at the conversion stage, where they potentially buy your product or sign up for your service. Finally, the post-sale phase becomes an important stage, where you'll try and retain this individual and make them a loyal customer. As a marketer, you hope to reach out to your customers at each stage of their customer journey and drive them towards the end of the funnel to become a loyal customer. [MUSIC] Take customer one, for example. They just picked up photography as a hobby. They are searching for a suitable camera. Their customer journey starts from the awareness stage. Take customer two, a camera enthusiast looking to buy a digital camera. Their customer journey can start from the consideration stage where they are debating between different cameras. Now, moving to key consideration two: Who is my audience and where are they located? Think about your own customers, what are their motivations and needs at each stage of the customer journey? What should your marketing objectives be to meet their needs? [MUSIC] Moving to key consideration three: how to promote your content. As a marketer, you'll want to be able to guide customer one and two through the funnel by addressing their needs. By providing them with a great experience at each stage, you hope to convince them to convert, and, ultimately, retain them as a loyal customer. Finally, we will discuss key consideration four: measuring success along the customer journey. While the outcomes for customer one and two are the same, you can see that their customer journeys differ. Understanding how customer motivations and needs differ, allows you to identify your objectives at each stage. You can then meet potential buyers where they are, and encourage them to convert. These are the key points to consider when creating a digital marketing plan, and you will find out more about each stage as you progress through this course.</p>

  function advance() {
    if (!isBuilt(state.lesson + 1)) { toast('Lesson ' + (state.lesson + 2) + ' is not part of this prototype'); return; }
    state.lesson++; render();
  }

  function onNext() {
    var l = state.lesson;
    if (l === QUIZ_IDX) { onNextQuiz(); return; }
    if (isDone(l)) { advance(); return; }
    if (state.mode === 'new') {
      var card = $('#review'), r = reviewState(l);
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.remove('nudge'); void card.offsetWidth; card.classList.add('nudge');

    } else {
      gates[l] = gates[l] || { stage: 'required', picks: [] };
      renderGate();
      var g = $('.gate-old'); if (g) g.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  // ==========================================================================
  // ENHANCED REVIEW — visible from the start, one question at a time, instant feedback
  // ==========================================================================
  function reviewState(l) { return reviews[l] || (reviews[l] = { phase: 'idle', idx: 0, picks: [], pick: null, checked: false, timer: null }); }

  function renderGate() {
    var m = $('#gateMount'); m.innerHTML = '';

    renderOutline();
    updateNav();
  }

  function renderReview(m) {

      h += done
        ? '<p class="rv-note">This lesson is complete. You can retake the review any time.</p><div class="rv-actions"><button class="btn" data-rv="start" type="button">Retake review</button><button class="btn primary" data-rv="continue" type="button">Next lesson ›</button></div>'
        : '<p class="rv-note">Pass this short review to mark the lesson complete and continue. You can read the lesson again whenever you like.</p><div class="rv-actions"><button class="btn primary" data-rv="start" type="button">Start review</button></div>';

    } else if (r.phase === 'active') {

      });

        h += '<div class="rv-fb ' + (ok ? 'ok' : 'no') + '" id="rvFb" tabindex="-1" role="status"><b>' + (ok ? 'Correct' : 'Not quite') + '</b>' + (ok ? '' : 'The answer is ' + 'ABCD'.charAt(q.a) + '. ') + esc(q.why) + '</div>';

      }

  function startReview() {
    var r = reviewState(state.lesson);

    renderGate();
    clearTimeout(r.timer);
    r.timer = setTimeout(function () {
      if (state.lesson !== lesson || state.mode !== 'new' || r.phase !== 'loading') return;
      r.phase = 'active'; renderGate(); focusEl('#rvQ');
    }, 1100);
  }

  function focusEl(sel) { var e = $(sel); if (e) e.focus({ preventScroll: false }); }

  $('#gateMount').addEventListener('change', function (e) {
    if (e.target.name === 'rv') {
      var r = reviewState(state.lesson); r.pick = +e.target.value;
      var c = $('[data-rv="check"]'); if (c) c.disabled = false;   // no re-render, keeps keyboard focus on the radio
    }
  });

  $('#gateMount').addEventListener('click', function (e) {
    var b = e.target.closest('[data-rv]'); if (b) { reviewAction(b.dataset.rv); return; }
    var g = e.target.closest('[data-gate]'); if (g) gateAction(g.dataset.gate);
  });

  function reviewAction(a) {
    var l = state.lesson, r = reviewState(l), qs = QUIZ[l];
    if (a === 'start' || a === 'retake') { startReview(); return; }
    if (a === 'continue') { advance(); return; }
    if (a === 'reread') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (a === 'later') { r.phase = 'idle'; r.idx = 0; r.picks = []; r.pick = null; r.checked = false; renderGate(); toast('No problem. Your answers were not saved.'); return; }
    if (a === 'check') {
      if (r.pick === null) return;
      r.picks[r.idx] = r.pick; r.checked = true; renderGate(); focusEl('#rvFb'); return;
    }
    if (a === 'next') {
      if (r.idx + 1 < qs.length) { r.idx++; r.pick = null; r.checked = false; renderGate(); focusEl('#rvQ'); return; }
      r.phase = 'result';
      var score = r.picks.filter(function (p, i) { return p === qs[i].a; }).length;

    }
  }

  // ==========================================================================
  // CURRENT (production) GATE — kept so stakeholders can compare
  // ==========================================================================
  function renderGateOld(m) {

    } else if (g.stage === 'questions') {
      h += '<h2>Lesson Review</h2><p class="sub">' + qs.length + ' questions · ' + PASS_MARK + '% to pass</p>';
      qs.forEach(function (q, i) {

        q.opts.forEach(function (o, j) { h += '<label><input type="radio" name="og' + i + '" value="' + j + '"' + (g.picks[i] === j ? ' checked' : '') + '> ' + 'ABCD'.charAt(j) + '. ' + esc(o) + '</label>'; });

  function gateAction(a) {
    var l = state.lesson, g = gates[l], qs = QUIZ[l];
    if (!g) return;
    if (a === 'cancel') { delete gates[l]; renderGate(); return; }
    if (a === 'start') {
      g.stage = 'loading'; renderGate();
      setTimeout(function () { if (gates[l] === g && state.mode === 'old') { g.stage = 'questions'; renderGate(); } }, 1100);
      return;
    }
    if (a === 'submit') {
      g.picks = qs.map(function (q, i) { var c = $('input[name="og' + i + '"]:checked'); return c ? +c.value : null; });
      if (g.picks.indexOf(null) !== -1) { g.msg = 'Please answer every question.'; renderGate(); return; }
      var score = g.picks.filter(function (p, i) { return p === qs[i].a; }).length;
      if (score >= needed(qs.length)) { markDone(l); delete gates[l]; renderGate(); toast('Review passed (' + score + '/' + qs.length + '). Next is now available.'); }
      else { g.msg = 'Not passed: ' + score + '/' + qs.length + '. Try again.'; g.picks = []; g.stage = 'required'; renderGate(); toast('Not passed (' + score + '/' + qs.length + ')'); }
    }
  }

  // ==========================================================================
  // COURSE QUIZ (lesson 13)

  // Answer key: production scores A, A, A, A as 4/4 (verified on the demo account). Q1 option A is
  // "tennis shoes ... high bounce rate", which contradicts the scenario, so the key below follows the
  // lesson content instead (C, A, D, A). Differs from production on Q1 and Q3: raise with the content team.
  // ==========================================================================
  var QUIZ_PASS = 75; // percent (3 of 4). A proposal, not production behaviour.
  var QUIZ_ICON = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.1-1.5 2.2M12 17h.01"/></svg>';
  var FINAL_QUIZ = [

      a: 2, why: 'The persona is a beginner at the awareness stage, and local running groups on social media are one of their touchpoints. Helpful, easy content there informs them without pushing a sale.' },
    { scenario: 'You are using earned marketing to increase engagement with your product. You select an influencer and are choosing between different social media promotion options.',
      stem: 'Which option is an example of earned marketing?',
      opts: ['You give the influencer a free sample of your product. The influencer can then choose to provide a review of their user experience.', 'The influencer promotes a product and provides a hyperlink or discount code that means they gets paid for every sale that can be traced back to that content.', 'You provide the influencer with a free trial and ask to check their content prior to posting.', 'You offer the influencer a free stay at your boutique hotel, in return for an honest review.'],
      a: 0, why: 'Earned marketing is exposure you earn rather than pay for. With a free sample the influencer is free to decide whether to review it. A paid-per-sale link is paid media.' },

  var quiz = { phase: 'intro', idx: 0, answers: [] };

  function personaCard(rows) {

  function renderQuiz() {

      h += '<div class="rv-actions"><button class="btn primary" type="button" data-qz="start">' + (before ? 'Retake quiz' : 'Start quiz') + '</button>' + (before ? '<button class="btn" type="button" data-qz="finish">Finish course ›</button>' : '') + '</div>';
    } else if (quiz.phase === 'q') {

      for (var i = 0; i < n; i++) h += '<button type="button" class="qz-step' + (quiz.answers[i] != null ? ' ans' : '') + (i === quiz.idx ? ' cur' : '') + '" data-qz-go="' + i + '" aria-label="Question ' + (i + 1) + (quiz.answers[i] != null ? ', answered' : ', not answered') + '"' + (i === quiz.idx ? ' aria-current="step"' : '') + '>' + (i + 1) + '</button>';

      qs.forEach(function (q, i) {

          '<div>Your answer: <b>' + letter(a) + '</b>. ' + esc(q.opts[a]) + '</div>' + (ok ? '' : '<div>Correct answer: <b>' + letter(q.a) + '</b>. ' + esc(q.opts[q.a]) + '</div>') + '<div class="why">' + esc(q.why) + '</div></div>';

        '<div class="chips-row" style="justify-content:center;margin:14px 0 4px"><span class="chip solid">13 lessons</span><span class="chip solid">' + (quiz.answers.length ? 'Quiz ' + sc + '/' + n : 'Quiz passed') + '</span></div>' +

  function quizAction(a) {
    var n = FINAL_QUIZ.length, focus = '#qzQ';

    else if (a === 'back') { if (quiz.idx > 0) quiz.idx--; }
    else if (a === 'next') { if (quiz.idx + 1 < n) quiz.idx++; else { quiz.phase = 'review'; focus = '#qzH'; } }
    else if (a === 'submit') {

    else if (a === 'finish') { quiz.phase = 'complete'; focus = '#qzH'; }
    else if (a === 'lessons') { toast('Opens the lesson list (as in production)'); return; }
    else if (a === 'courses') { window.location.href = COURSES_PAGE + '?prog=' + progParam(); return; }
    else if (a === 'back-course') { window.location.href = COURSE_PAGE + '?prog=' + progParam(); return; }
    renderQuiz(); renderOutline(); updateNav(); focusEl(focus);
    if (quiz.phase !== 'q') window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function onNextQuiz() {
    if (state.mode === 'old') { toast('Finish Course (as in production)'); return; }
    if (isDone(QUIZ_IDX)) { quizAction('finish'); return; }
    var r = $('#quizRoot'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' });
    toast('Pass the quiz to finish the course');
  }

  // ---- Current (production) quiz: all questions on one page, one Submit button, score only ----
  function renderQuizOld() {
    var root = $('#quizOld'); if (!root) return;
    var n = FINAL_QUIZ.length, h = '<span class="legacy-tag">Current layout (production)</span><div class="gate-old" style="margin:0;padding:0">';
    FINAL_QUIZ.forEach(function (q, i) {
      h += '<p class="q"><b>Q' + (i + 1) + '.</b> ' + esc(q.scenario) + '</p>';
      if (q.persona) {
        h += '<table class="legacy-table"><tr><td colspan="2">Persona 1: Customer A</td></tr>' + q.persona.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td>' + (Array.isArray(r[1]) ? r[1].map(esc).join('<br>') : esc(r[1])) + '</td></tr>'; }).join('') + '</table>';
      }
      q.opts.forEach(function (o, j) { h += '<label><input type="radio" name="qo' + i + '" value="' + j + '"' + (qold.picks[i] === j ? ' checked' : '') + (qold.done ? ' disabled' : '') + '> ' + letter(j) + '. ' + esc(o) + '</label>'; });
    });
    if (qold.done) { var s = quizScore(qold.picks); h += '<div class="row"><b>Score: ' + s + '/' + n + ' (' + Math.round(s / n * 100) + '%)</b><button class="btn" type="button" data-qo="retry">Retry</button></div>'; }
    else h += '<div class="row"><button class="btn primary" type="button" data-qo="submit">Submit Answers</button></div>';
    root.innerHTML = h + '</div>';
  }

  $('#lessonBody').addEventListener('change', function (e) {
    if (e.target.name === 'qz') {
      quiz.answers[quiz.idx] = +e.target.value;
      var nx = $('[data-qz="next"]'); if (nx) nx.disabled = false;     // update in place so keyboard focus stays on the radio
      var st = $('.qz-step.cur'); if (st) { st.classList.add('ans'); st.setAttribute('aria-label', 'Question ' + (quiz.idx + 1) + ', answered'); }
    } else if (/^qo\d$/.test(e.target.name || '')) { qold.picks[+e.target.name.slice(2)] = +e.target.value; }
  });
  $('#lessonBody').addEventListener('click', function (e) {
    var go = e.target.closest('[data-qz-go]');
    if (go) { quiz.idx = +go.dataset.qzGo; quiz.phase = 'q'; renderQuiz(); focusEl('#qzQ'); return; }
    var a = e.target.closest('[data-qz]'); if (a) { quizAction(a.dataset.qz); return; }
    var o = e.target.closest('[data-qo]');
    if (o) {
      if (o.dataset.qo === 'retry') qold = { picks: [], done: false };
      else if (qold.picks.filter(function (x) { return x != null; }).length < FINAL_QUIZ.length) { toast('Please answer every question.'); return; }
      else qold.done = true;
      renderQuizOld();
    }
  });

  // ==========================================================================
  // LESSON BLOCK BEHAVIOURS (funnel, personas, checklist)
  // ==========================================================================
  var STAGES = [
    { name: 'Awareness', text: 'Customers begin at the wide end of the funnel with a number of potential options on their mind.' },
    { name: 'Consideration', text: 'As they gather more information, the number of options gradually reduces. They are debating between different choices.' },
    { name: 'Conversion', text: 'Customers potentially buy your product or sign up for your service.' },
    { name: 'Post-sale: loyalty', text: 'An important stage where you try to retain the customer and make them loyal.' }
  ];
  var CUSTOMERS = {
    '1': { stage: 0, text: 'Customer 1 just picked up photography as a hobby and is searching for a suitable camera. Their journey starts at the awareness stage.' },
    '2': { stage: 1, text: 'Customer 2 is a camera enthusiast looking to buy a digital camera. Their journey can start at the consideration stage, debating between cameras.' }
  };

  function showStage(i, customerText) {
    $$('.stage-btn').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.dataset.stage === i)); });
    var d = $('#stageDetail'); if (!d) return;
    d.innerHTML = '<b></b><span></span>';
    d.querySelector('b').textContent = STAGES[i].name;
    d.querySelector('span').textContent = customerText || STAGES[i].text;
  }

  function initBlocks() {
    $$('[data-persist]').forEach(function (c) { c.checked = !!load(c.dataset.persist, false); });
    if ($('#funnel')) showStage(0);
    if ($('#personaForm')) renderPersonas();
  }

  function renderPersonas() {
    var list = $('#savedList'), data = load('atlas-proto-personas', []);
    list.innerHTML = '';
    if (!data.length) return;
    var h = make('h3'); h.textContent = 'Your personas (' + data.length + ')'; list.appendChild(h);
    data.forEach(function (p, idx) {
      var art = make('article', 'persona'), head = make('header');
      var av = make('div', 'av'); av.textContent = (p.name || '?').charAt(0).toUpperCase();
      var who = make('div'), sm = make('small'), nm = make('b');
      sm.textContent = 'Your persona ' + (idx + 1); nm.textContent = p.name; who.appendChild(sm); who.appendChild(nm);
      head.appendChild(av); head.appendChild(who);
      var del = make('button', 'btn'); del.type = 'button'; del.textContent = 'Remove';
      del.style.cssText = 'margin-left:auto;padding:4px 12px;font-size:13px'; del.dataset.remove = String(idx); head.appendChild(del);
      var dl = make('dl');
      [['Demographic', p.demo], ['Motivation & needs', p.needs], ['What you can do', p.do]].forEach(function (r) {
        if (!r[1]) return; var dt = make('dt'), dd = make('dd'); dt.textContent = r[0]; dd.textContent = r[1]; dl.appendChild(dt); dl.appendChild(dd);
      });
      if (p.touch && p.touch.length) {
        var dt2 = make('dt'); dt2.textContent = 'Digital touchpoints';
        var dd2 = make('dd'), row = make('div', 'chips-row');
        p.touch.forEach(function (t) { var c = make('span', 'chip'); c.textContent = t; row.appendChild(c); });
        dd2.appendChild(row); dl.appendChild(dt2); dl.appendChild(dd2);
      }
      art.appendChild(head); art.appendChild(dl); list.appendChild(art);
    });
  }

  // ---------- Delegated events (re-rendered blocks keep working) ----------
  $('#lessonBody').addEventListener('click', function (e) {
    var stage = e.target.closest('.stage-btn');
    if (stage) {
      $$('.stage-btn').forEach(function (b) { b.classList.remove('is-start'); });
      $$('[data-who]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.who === '')); });
      showStage(+stage.dataset.stage); return;
    }
    var who = e.target.closest('[data-who]');
    if (who) {
      $$('[data-who]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === who)); });
      $$('.stage-btn').forEach(function (b) { b.classList.remove('is-start'); });
      var c = CUSTOMERS[who.dataset.who];
      if (c) { $$('.stage-btn')[c.stage].classList.add('is-start'); showStage(c.stage, c.text); } else { showStage(0); }
      return;
    }
    var rm = e.target.closest('[data-remove]');
    if (rm) { var data = load('atlas-proto-personas', []); data.splice(+rm.dataset.remove, 1); save('atlas-proto-personas', data); renderPersonas(); return; }
    var t = e.target.closest('[data-toast]');
    if (t) { e.preventDefault(); toast(t.dataset.toast); }
  });
  $('#lessonBody').addEventListener('change', function (e) {
    if (e.target.matches('[data-persist]')) save(e.target.dataset.persist, e.target.checked);
  });
  $('#lessonBody').addEventListener('submit', function (e) {
    if (e.target.id !== 'personaForm') return;
    e.preventDefault();
    var f = e.target, name = f.name.value.trim(), note = $('#formNote');
    if (!name) { note.textContent = 'Give your persona a name first.'; f.name.focus(); return; }
    var data = load('atlas-proto-personas', []);
    data.push({
      name: name, demo: f.demo.value.trim(), needs: f.needs.value.trim(), do: f.do.value.trim(),
      touch: f.touch.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean)
    });
    save('atlas-proto-personas', data);
    f.reset(); note.textContent = 'Saved. Add another persona if you serve different customers.';
    renderPersonas();
  });

  document.addEventListener('click', function (e) {
    var t = e.target.closest('.iconrail [data-toast], #jenBtn');
    if (t && t.id === 'jenBtn') { toast('Learning assistant opens here (as in production)'); }
    else if (t) { toast(t.dataset.toast); }
  });

  // ---------- Outline + prototype controls ----------
  $('#olList').addEventListener('click', function (e) {
    var go = e.target.closest('[data-go]'); if (go) { goTo(+go.dataset.go); return; }
    if (e.target.closest('.ol-sections a')) closeDrawer();
  });
  $('#outlineBtn').addEventListener('click', openDrawer);
  $('#olClose').addEventListener('click', closeDrawer);
  $('#scrim').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeDrawer(); $('#outlineBtn').focus(); } });

  $$('[data-lesson]').forEach(function (b) { b.addEventListener('click', function () { state.lesson = +b.dataset.lesson; render(); }); });
  $$('[data-mode]').forEach(function (b) { b.addEventListener('click', function () { state.mode = b.dataset.mode; render(); }); });
  $('#resetBtn').addEventListener('click', function () {
    save('atlas-proto-done', {}); reviews = {}; gates = {}; resetQuiz(); render(); toast('Progress reset');
  });
  $('#prevBtn').addEventListener('click', function () {
    if (state.lesson > 0 && isBuilt(state.lesson - 1)) { state.lesson--; render(); }
    else if (state.lesson > 0) toast('Lesson ' + state.lesson + ' is not part of this prototype');
  });
  $('#nextBtn').addEventListener('click', onNext);
  $('#backBtn').addEventListener('click', function () { window.location.href = COURSE_PAGE + '?prog=' + progParam(); });

  // ---------- Reading progress + active section ----------
  function onScroll() {
    var doc = document.documentElement, max = doc.scrollHeight - window.innerHeight;
    $('#progressFill').style.width = (max > 0 ? Math.min(100, (window.scrollY / max) * 100) : 0) + '%';
    var current = null;
    $$('.ol-sections a').forEach(function (a) {
      var t = document.getElementById(a.dataset.target);
      if (t && t.getBoundingClientRect().top < window.innerHeight * 0.35) current = a.dataset.target;
    });
    $$('.ol-sections a').forEach(function (a) { a.classList.toggle('on', a.dataset.target === current); });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);

  // Deep links from the index page, e.g. ?lesson=13 or ?lesson=1&mode=old
  (function applyParams() {
    var q; try { q = new URLSearchParams(window.location.search); } catch (e) { return; }
    var l = parseInt(q.get('lesson'), 10) - 1;
    if (l >= 0 && l < COURSE.length && isBuilt(l)) state.lesson = l;
    if (q.get('mode') === 'old' || q.get('mode') === 'new') state.mode = q.get('mode');
  })();

  render();
})();
</script>
</body>
</html>
