<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Result</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar__title">Quiz Result</div>
    <div class="topbar__right">
      <span class="badge" id="marksBadge"></span>
      <button class="btn btn-download" id="downloadBtn">Download PDF</button>
    </div>
  </div>

  <div class="layout">
    <nav class="qnav" id="qnav"></nav>
    <main class="content">
      <div class="student-bar">
        <div>
          <div class="student-bar__name">Student Name</div>
          <div class="student-bar__value" id="studentName"></div>
        </div>
        <div>
          <div class="student-bar__name">Attempts</div>
          <div class="student-bar__value" id="attempt"></div>
        </div>
      </div>

      <div id="questions"></div>
      <div class="footer-note">Generated by Quiz Result &middot; sample data for MVP testing</div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="data.js"></script>
  <script src="render.js"></script>
  <script src="pdf-generator.js"></script>
</body>
</html>
