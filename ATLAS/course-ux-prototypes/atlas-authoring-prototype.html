<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATLAS Authoring Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Tokens. The admin shell follows demo.atlaslearn.ai/admin (Inter, teal, soft grey inputs);
   the preview pane uses the learner tokens (Montserrat) so authors see what learners see.
   ========================================================================== */
:root {
  --navy: #31425D;
  --primary: #0D719A; --primary-ink: #0A5A7B; --primary-soft: #E6F2F7;
  --bg: #F6F7F9; --surface: #FFFFFF; --ink: #171A26; --muted: #5B6475; --line: #E1E5EB; --field: #F3F5F8;
  --accent: #F5A623; --accent-ink: #8A5600; --accent-soft: #FEF4E1;
  --green: #1E8A5A; --green-soft: #E3F4EC; --red: #C43D2B; --red-soft: #FBE7E4;
  --radius: 16px; --radius-sm: 12px;
  --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --learner: "Montserrat", system-ui, sans-serif;
  --proto-h: 48px; --side-w: 220px;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 14.5px; line-height: 1.55; }
h1, h2, h3, h4, p, ul, ol { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---------- Prototype controls ---------- */
.proto { position: sticky; top: 0; z-index: 90; min-height: var(--proto-h); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 6px 20px; background: #FFF8E6; border-bottom: 1px dashed var(--accent); font-size: 13px; }
.proto b { color: var(--accent-ink); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); overflow: hidden; }
.seg button { border: 0; background: none; padding: 6px 14px; font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.proto .plain { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13px; }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: calc(100vh - var(--proto-h)); }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; position: sticky; top: var(--proto-h); height: calc(100vh - var(--proto-h)); overflow-y: auto; }
.side img { height: 42px; width: auto; align-self: flex-start; margin: 0 6px 18px; }
.side small { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; color: var(--muted); margin: 0 10px 8px; }
.side nav { display: grid; gap: 2px; }
.side nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; color: #3a4252; text-decoration: none; font-size: 14px; font-weight: 500; }
.side nav a:hover { background: var(--bg); }
.side nav a.on { background: #DCEBF2; color: var(--primary-ink); font-weight: 600; }
.side nav svg { flex: none; opacity: .85; }
.side .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px 4px; font-size: 13.5px; line-height: 1.3; }
.side .me i { width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-style: normal; font-weight: 600; }
.side .me span { display: block; font-size: 12px; color: var(--muted); }
.main { min-width: 0; }
.bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .r { display: flex; gap: 12px; align-items: center; }
.help { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 14px; font-weight: 600; font-size: 13.5px; }
.page { padding: 20px 24px 80px; max-width: 1640px; margin: 0 auto; }

/* ---------- Buttons, chips, fields ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 16px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: #b9c2d0; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-ink); }
.btn.ai { background: linear-gradient(135deg, #E9F6F8, #FFF4DC); border-color: #cfe6ea; color: var(--primary-ink); }
.btn.danger { color: var(--red); }
.btn.sm { padding: 5px 12px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.ico { border: 0; background: none; width: 32px; height: 32px; border-radius: 8px; color: var(--muted); display: inline-grid; place-items: center; }
.ico:hover { background: var(--bg); color: var(--ink); }
.ico.dng:hover { color: var(--red); background: var(--red-soft); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; line-height: 1.6; background: var(--bg); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--green-soft); color: var(--green); }
.chip.warn { background: var(--accent-soft); color: var(--accent-ink); }
.chip.bad { background: var(--red-soft); color: var(--red); }
.chip.info { background: var(--primary-soft); color: var(--primary-ink); }
.chip.draft { background: #EFE9FB; color: #5B3FB5; }
.in, .sel, .ta { width: 100%; border: 1px solid transparent; background: var(--field); border-radius: var(--radius-sm); padding: 9px 12px; font-size: 14px; line-height: 1.5; }
.in:focus, .sel:focus, .ta:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px var(--primary-soft); }
.ta { resize: vertical; min-height: 70px; }
.lbl { display: block; font-size: 12.5px; font-weight: 600; color: #3a4252; margin: 0 0 4px; }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.fld { display: grid; gap: 0; margin-bottom: 12px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tog { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; cursor: pointer; }
.tog input { width: 18px; height: 18px; accent-color: var(--primary); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }

/* ---------- Course header and tabs ---------- */
.ch { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 14px; }
.ch .back { border: 1px solid var(--line); background: var(--surface); width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
.ch h1 { font-size: 22px; line-height: 1.25; font-weight: 700; }
.ch .sub { font-size: 13px; color: var(--muted); }
.ch .acts { margin-left: auto; display: flex; gap: 8px; align-items: center; position: relative; }
.menu { position: absolute; right: 0; top: 44px; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(23,26,38,.16); padding: 6px; min-width: 190px; display: none; }
.menu.show { display: block; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
.menu button:hover { background: var(--bg); }
.menu .dng { color: var(--red); }
.tabs { display: inline-flex; gap: 4px; background: #ECEFF3; border-radius: 12px; padding: 4px; margin-bottom: 16px; }
.tabs button { border: 0; background: none; border-radius: 9px; padding: 7px 16px; font-weight: 500; font-size: 14px; color: #3a4252; }
.tabs button[aria-selected="true"] { background: #fff; font-weight: 600; box-shadow: 0 1px 2px rgba(23,26,38,.08); }

/* ---------- Content tab: structure | editor | preview ---------- */
.cw { display: grid; grid-template-columns: 290px minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.eside { display: grid; gap: 12px; position: sticky; top: calc(var(--proto-h) + 16px); max-height: calc(100vh - var(--proto-h) - 32px); overflow: auto; padding-bottom: 4px; }
.cv { position: relative; overflow: hidden; background: var(--primary-soft); display: grid; place-items: center; color: #fff; font-weight: 700; text-align: center; }
.cv img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cv span { padding: 0 14px; font-size: 15px; line-height: 1.3; text-shadow: 0 1px 6px rgba(0,0,0,.3); }
.cv.hero { aspect-ratio: 16 / 7; border-radius: 14px; }
.cv.wide { aspect-ratio: 16 / 5; border-radius: 12px; }
.cv.card { aspect-ratio: 16 / 10; }
.cvrow { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; margin-top: 12px; align-items: start; }
.cvside { display: grid; gap: 12px; }
.cvbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.cvside input[type="range"] { width: 100%; accent-color: var(--primary); }
.ccard { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.ccard .cb { padding: 12px 14px; display: grid; gap: 6px; }
.ccard b { font-size: 15px; line-height: 1.3; }
.ccard p { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ccard .cm { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.cvopts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cvopt { cursor: pointer; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; display: block; }
.cvopt:has(input:checked) { border-color: var(--primary); }
.cvopt input { position: absolute; opacity: 0; pointer-events: none; }
.cvopt:has(input:focus-visible) { outline: 3px solid var(--primary); outline-offset: 2px; }
@media (max-width: 760px) { .cvrow { grid-template-columns: 1fr; } .cvopts { grid-template-columns: 1fr; } }
.cv.none { background: repeating-linear-gradient(45deg, #EEF1F5, #EEF1F5 10px, #E6EAF0 10px, #E6EAF0 20px); color: var(--muted); }
.cv.none span { text-shadow: none; font-weight: 600; font-size: 13.5px; }
.lph { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.lph h1 { font-size: 24px; font-weight: 700; line-height: 1.2; }
.lprow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.lpg { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.lpc { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.lpc:hover { border-color: #b9c2d0; box-shadow: 0 6px 18px rgba(23,26,38,.08); }
.lpb { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 0; }
.lpb .cv.card { border-radius: 0; }
.lpt { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 14px 16px 0; }
.lpt b { font-size: 16px; line-height: 1.3; }
.lpd { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; padding: 6px 16px 0; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
.lpm { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 12px 16px 16px; }
.lpc.draft { border-style: dashed; }
.lpempty { grid-column: 1 / -1; padding: 40px 20px; text-align: center; }
.lpempty b { font-size: 16px; }
.emptyc { padding: 36px 28px; text-align: center; display: grid; justify-items: center; gap: 12px; }
.emptyc h2 { font-size: 20px; }
.emptyc p { color: var(--muted); max-width: 520px; }
.eico { width: 60px; height: 60px; border-radius: 18px; background: var(--primary-soft); color: var(--primary-ink); display: grid; place-items: center; }
.eacts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
.esteps { list-style: none; counter-reset: es; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 14px 0 0; padding: 0; text-align: left; width: 100%; max-width: 760px; }
.esteps li { counter-increment: es; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }
.esteps li::before { content: counter(es); width: 24px; height: 24px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; margin-bottom: 4px; }
.esteps b { font-size: 14px; }
.esteps span { font-size: 13px; color: var(--muted); }
.olp { display: grid; gap: 14px; max-height: 380px; overflow: auto; }
.olm { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.olls { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.olls li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; }
.olls input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); }
[data-tip] { cursor: help; }
.tipbox { position: fixed; z-index: 200; display: none; max-width: 270px; background: var(--navy); color: #fff; font: 500 12.5px/1.5 var(--ui); padding: 9px 12px; border-radius: 10px; box-shadow: 0 8px 24px rgba(23,26,38,.3); pointer-events: none; }
.kinds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.kind { display: grid; gap: 3px; border: 1.5px solid var(--line); border-radius: 14px; padding: 11px 13px; cursor: pointer; align-content: start; }
.kind:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); }
.kind input { position: absolute; opacity: 0; pointer-events: none; }
.kind:has(input:focus-visible) { outline: 3px solid var(--primary); outline-offset: 2px; }
.kind b { font-size: 14px; }
.kind span { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
label.btn:focus-within { outline: 3px solid var(--primary); outline-offset: 2px; }
@media (max-width: 640px) { .kinds { grid-template-columns: 1fr; } }
.h2 { font-size: 15.5px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px; }
.ow { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.ow2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; align-items: start; }
.ow-right { display: grid; gap: 14px; }
.objscroll { max-height: 560px; overflow: auto; padding-right: 4px; }
.orl { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
.orw { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; cursor: pointer; font-size: 14px; }
.orw:hover { background: var(--bg); }
.orw.on { background: var(--primary-soft); }
.orw input { width: 18px; height: 18px; accent-color: var(--primary); flex: none; }
.orw:has(input:focus-visible) { outline: 3px solid var(--primary); outline-offset: -1px; }
.orn { flex: 1; min-width: 0; }
.orw em { font-style: normal; font-size: 11px; color: var(--muted); }
.osl { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
.osr { border: 1px solid var(--line); border-radius: 12px; }
.osr.open { border-color: var(--primary); }
.osh { display: flex; align-items: center; gap: 4px; padding-right: 8px; }
.osb { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: none; text-align: left; padding: 10px 12px; font-size: 14px; font-weight: 600; }
.osb .ot { flex: 1; min-width: 0; }
.osb .chev { color: var(--muted); }
.osx { padding: 2px 12px 14px; display: grid; gap: 10px; }
.osm { display: grid; gap: 4px; }
.lns { display: flex; flex-wrap: wrap; gap: 6px; }
.ln { min-width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; }
.ln:hover { border-color: #b9c2d0; }
.ln[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
.linkb { border: 0; background: none; padding: 0; color: var(--primary-ink); font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }
.km2 { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.km2 .ow-right { position: sticky; top: calc(var(--proto-h) + 16px); }
.kmscroll { overflow: auto; max-height: 640px; }
.kmt { border-collapse: separate; border-spacing: 0; width: 100%; }
.kmt th, .kmt td { padding: 0; }
.kmc0 { position: sticky; left: 0; z-index: 2; background: var(--surface); min-width: 230px; max-width: 280px; text-align: left; padding: 8px 12px 8px 4px !important; border-bottom: 1px solid var(--line); }
.kmt thead .kmc0, .kmt tfoot .kmc0 { border-bottom: 0; }
.kt { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.35; }
.ks { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 4px; }
.kmg { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--primary-ink); text-align: left; padding: 0 0 6px 6px !important; border-left: 1px solid var(--line); }
.kmh { padding: 0 2px 6px !important; text-align: center; }
.kmh button { width: 34px; height: 28px; border: 0; background: none; border-radius: 8px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.kmh button:hover { background: var(--bg); }
.kmh.cur button { background: var(--primary-soft); color: var(--primary-ink); }
.kmx { text-align: center; border-bottom: 1px solid var(--line); padding: 4px 2px !important; }
.kmt tfoot .kmx, .kmt thead .kmx { border-bottom: 0; }
.kmx.cur { background: rgba(13,113,154,.05); }
.kmcell { width: 34px; height: 34px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-size: 15px; font-weight: 700; color: var(--primary-ink); }
.kmcell:hover { border-color: var(--primary); }
.kmcell.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.kmcell.sug { border-style: dashed; border-color: var(--accent); color: #8a5a00; background: #FFF8EA; }
.kmcell.sel { outline: 3px solid var(--navy); outline-offset: 1px; }
.kmn { display: inline-block; min-width: 24px; font-size: 12.5px; font-weight: 700; padding: 3px 0; border-radius: 8px; background: var(--bg); color: var(--muted); }
.kmn.zero { background: #FDECEC; color: #B3261E; }
.kmq { margin: 10px 0 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: #FFF8EA; border-radius: 0 10px 10px 0; font-size: 13px; line-height: 1.55; }
.kmq mark { background: #FFE2A1; padding: 0 2px; border-radius: 3px; }
.kmj { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: 13.5px; }
.kmj li { display: flex; gap: 8px; align-items: flex-start; }
@media (max-width: 1100px) { .km2 { grid-template-columns: minmax(0, 1fr); } .km2 .ow-right { position: static; } }
.ow-side { display: grid; gap: 14px; position: sticky; top: calc(var(--proto-h) + 16px); }
.orow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.srch { flex: 1; min-width: 200px; }
.og { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 16px 0 8px; }
.ocs { display: flex; flex-wrap: wrap; gap: 8px; }
.oc { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 13px; font-size: 13px; font-weight: 500; text-align: left; }
.oc:hover { border-color: #b9c2d0; }
.oc[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
.oc em { font-style: normal; font-size: 11px; opacity: .7; margin-left: 6px; }
.sugs { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.sugs li { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; }
.sugs li > div { flex: 1; min-width: 0; }
.sugs b { display: block; font-size: 13.5px; line-height: 1.4; }
.sugs .sp { flex: 1; }
.kmw { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
.kbl { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; max-height: 320px; overflow: auto; }
.kbi { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
.kbi:hover { background: var(--bg); }
.kbi input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--primary); }
.kbi b { display: block; font-size: 13.5px; font-weight: 600; }
/* Learner preview: full screen, the whole course with its outline */
dialog.dlg.pvdlg { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; border-radius: 0; overflow: hidden; }
.pvdlg #pvBody { display: flex; flex-direction: column; height: 100%; }
.pvh-pos { font-weight: 500; color: var(--muted); }
.pvwrap { flex: 1; min-height: 0; display: grid; grid-template-columns: 290px minmax(0, 1fr); }
.pvwrap.phone { grid-template-columns: minmax(0, 1fr); }
.pvdlg .pvs { min-height: 0; padding: 24px 20px 32px; }
.pvdlg .pvf { max-width: 760px; }
.pvdlg .pvf.phone { max-width: 360px; }
.pvo { overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 16px 12px; font-family: var(--learner); }
.pvo-h { padding: 0 8px 12px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
.pvo-h small, .pvo-m > small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pvo-h b { display: block; margin: 2px 0; font-size: 15px; line-height: 1.3; }
.pvo-h span { font-size: 12.5px; color: var(--muted); }
.pvo-m > small { padding: 10px 8px 6px; }
.pvo ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.pvo button { width: 100%; display: flex; gap: 10px; align-items: flex-start; padding: 8px; border: 0; border-radius: 10px; background: none; font: inherit; font-size: 13.5px; line-height: 1.35; text-align: left; color: var(--ink); cursor: pointer; }
.pvo button:hover { background: var(--bg); }
.pvo button[aria-current="page"] { background: var(--primary-soft); color: var(--primary-ink); font-weight: 600; }
.pvo .n { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); font-size: 11.5px; font-weight: 700; }
.pvo button[aria-current="page"] .n { background: var(--primary); color: #fff; }
.pvo .t em { display: block; margin-top: 2px; font-style: normal; font-weight: 400; font-size: 12px; color: var(--muted); }
.pvnav { max-width: 760px; margin: 16px auto 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.pvnav .btn { display: block; max-width: 48%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pvwrap.phone .pvnav { max-width: 360px; flex-direction: column-reverse; align-items: stretch; }
.pvwrap.phone .pvnav .btn { max-width: none; }
@media (max-width: 760px) { .pvwrap { grid-template-columns: minmax(0, 1fr); } .pvo { display: none; } }
@media (max-width: 1100px) { .ow2 { grid-template-columns: minmax(0, 1fr); } .ow, .kmw { grid-template-columns: minmax(0, 1fr); } .ow-side { position: static; } }
.st { padding: 14px; position: sticky; top: calc(var(--proto-h) + 16px); max-height: calc(100vh - var(--proto-h) - 32px); overflow-y: auto; }
.st h2 { font-size: 15px; font-weight: 700; }
.st .meta { font-size: 12.5px; color: var(--muted); margin: 2px 0 10px; }
.prog { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 8px 0 10px; }
.prog i { display: block; height: 100%; background: var(--green); border-radius: 999px; transition: width .3s; }
.mod { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; display: grid; gap: 8px; }
.mh { display: flex; align-items: center; gap: 6px; }
.mn { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--primary-ink); }
.mgh { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--primary-ink); padding: 10px 10px 2px; }
.ls { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 2px; }
.ls button { width: 100%; text-align: left; border: 0; background: none; border-radius: 10px; padding: 8px 10px; display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; }
.ls button:hover { background: var(--bg); }
.ls button[aria-current="true"] { background: var(--primary-soft); }
.ls .n { font-size: 12px; color: var(--muted); font-weight: 600; padding-top: 1px; }
.ls .t { font-size: 13.5px; font-weight: 500; line-height: 1.35; display: block; }
.ls .s { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 3px; align-items: center; font-size: 12px; color: var(--muted); }
.sfoot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--line); }
.sfoot .mini { width: 100%; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 11.5px; }
.st .add { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

.ed { display: grid; gap: 14px; min-width: 0; }
.lh { padding: 16px; display: grid; gap: 12px; }
.lh .top { display: grid; grid-template-columns: minmax(0, 1fr) 150px 130px; gap: 12px; }
.lh .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.legacy { background: var(--accent-soft); border: 1px solid #F3DDA8; border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px; }
.legacy b { font-size: 14.5px; }
.legacy p { font-size: 13.5px; color: #5c4a1c; }
.legacy .acts { display: flex; gap: 8px; flex-wrap: wrap; }
details.orig { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
details.orig summary { cursor: pointer; padding: 12px 16px; font-weight: 600; font-size: 14px; }
details.orig .txt { padding: 0 16px 14px; font-size: 13.5px; color: var(--muted); white-space: pre-wrap; max-height: 260px; overflow: auto; }

.bl { padding: 0; overflow: hidden; }
.bl.over { box-shadow: 0 -3px 0 var(--primary); }
.bl.drag { opacity: .45; }
.bh { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #FAFBFC; border-bottom: 1px solid var(--line); }
.bh .grip { cursor: grab; color: #9aa6b8; width: 24px; text-align: center; user-select: none; }
.bh .ic { width: 28px; height: 28px; border-radius: 8px; background: var(--primary-soft); color: var(--primary-ink); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.bh .nm { font-weight: 600; font-size: 14px; }
.bh .sp { flex: 1; }
.bb { padding: 14px 14px 4px; }
.bw { margin: 0 14px 14px; padding: 10px 12px; background: var(--bg); border-radius: 10px; font-size: 12.5px; color: var(--muted); }
.bw b { color: var(--ink); }
.draftbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 14px; background: #F4EFFD; border-bottom: 1px solid #E3D8F7; font-size: 13px; color: #4b3396; }
.draftbar .sp { flex: 1; min-width: 120px; }
.ol { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; background: #FCFCFD; }
.ol .oh { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.ol .oh .sp { flex: 1; }
.ins { display: flex; justify-content: center; margin: -4px 0; }
.ins button { border: 1px dashed #b9c2d0; background: var(--bg); color: var(--muted); border-radius: 999px; padding: 4px 14px; font-size: 13px; font-weight: 600; }
.ins button:hover { border-color: var(--primary); color: var(--primary-ink); background: var(--primary-soft); }
.addrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding: 6px 0; }

/* Lesson settings and checks */
.sec { padding: 0; overflow: hidden; }
.sec > summary { cursor: pointer; padding: 14px 16px; font-weight: 700; font-size: 14.5px; display: flex; align-items: center; gap: 10px; list-style: none; }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary::after { content: "+"; margin-left: auto; font-size: 20px; color: var(--primary); }
.sec[open] > summary::after { content: "–"; }
.sec .in-body { padding: 0 16px 16px; display: grid; gap: 4px; }
.chk { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.chk li { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; line-height: 1.5; }
.chk .d { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; margin-top: 1px; }
.chk .d.ok { background: var(--green); } .chk .d.warn { background: var(--accent); color: #3b2600; } .chk .d.bad { background: var(--red); }
.chk .fix { margin-left: auto; flex: none; }
.chk .fixes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.pub { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; }
.pub .sp { flex: 1; min-width: 160px; font-size: 13.5px; color: var(--muted); }
.pub b { color: var(--ink); }
.pairs { display: grid; gap: 8px; }
.pair { display: grid; grid-template-columns: 170px 1fr 32px; gap: 8px; align-items: start; }

/* Quiz editor */
.qe { padding: 14px 16px; display: grid; gap: 10px; }
.qe .qh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.qe .qh b { font-size: 14.5px; }
.opt { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.opt .l { width: 26px; height: 26px; border-radius: 8px; background: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 12.5px; }
.opt.ok .l { background: var(--green); color: #fff; }
.opt label.mk { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 12.5px; font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap; }
.opt label.mk input { margin: 0; accent-color: var(--green); }
.opt label.mk:hover { border-color: var(--green); }
.opt.ok label.mk { background: var(--green-soft); border-color: var(--green); color: var(--green); font-weight: 600; }
.aichk { background: #F4EFFD; border-radius: 12px; padding: 10px 12px; font-size: 13px; color: #3d2b82; display: grid; gap: 6px; }
.aichk .btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Preview pane (learner look) ---------- */
.pvw { position: sticky; top: calc(var(--proto-h) + 16px); max-height: calc(100vh - var(--proto-h) - 32px); display: flex; flex-direction: column; overflow: hidden; }
.pvh { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: #FAFBFC; font-size: 13px; font-weight: 600; }
.pvh .sp { flex: 1; }
.pvh .seg button { padding: 4px 10px; font-size: 12px; }
.pvs { overflow-y: auto; background: var(--bg); padding: 14px; }
.pvf { margin: 0 auto; background: var(--surface); border-radius: 18px; padding: 22px 22px 26px; font-family: var(--learner); font-size: 15px; line-height: 1.65; color: var(--ink); }
.pvf.phone { max-width: 340px; padding: 18px 16px 22px; font-size: 14.5px; }
.pv-title { font-size: 22px; font-weight: 700; line-height: 1.25; margin: 4px 0 8px; }
.pv-meta { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.pv-pill { border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; font-weight: 600; color: var(--ink); }
.pv-b { margin: 0 0 26px; }
.pv-lead { font-size: 16.5px; line-height: 1.7; margin-bottom: 26px; }
.pv-h { font-size: 18px; font-weight: 700; line-height: 1.3; margin: 0 0 10px; }
.pv-b p { margin: 0 0 8px; white-space: pre-wrap; }
.pv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.pv-card { border: 1px solid var(--line); border-top: 3px solid var(--primary); border-radius: 12px; padding: 12px 13px; background: var(--surface); }
.pv-card .num { width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12.5px; margin-bottom: 6px; }
.pv-card h4 { font-size: 14.5px; margin: 0 0 3px; line-height: 1.35; }
.pv-card p { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.55; }
.pv-card details { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.pv-card summary { cursor: pointer; color: var(--primary-ink); font-weight: 600; }
.pv-call { display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--primary-soft); border-left: 4px solid var(--primary); }
.pv-call.good { background: var(--green-soft); border-left-color: var(--green); }
.pv-call.note { background: var(--accent-soft); border-left-color: var(--accent); }
.pv-call i { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 12px; }
.pv-call.good i { background: var(--green); } .pv-call.note i { background: var(--accent-ink); }
.pv-call b { display: block; font-size: 14px; }
.pv-call p { margin: 0; font-size: 13.5px; }
.pv-link { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; }
.pv-link i { flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; font-style: normal; }
.pv-link small { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); }
.pv-link b { display: block; font-size: 14px; line-height: 1.35; }
.pv-link span { font-size: 12.5px; color: var(--muted); }
.pv-video { border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, #1d2b44, #0f1724); aspect-ratio: 16/9; display: grid; place-items: center; position: relative; }
.pv-video b { position: absolute; left: 12px; bottom: 8px; color: #fff; font-size: 12.5px; }
.pv-video i { width: 52px; height: 52px; border-radius: 50%; background: #fff; color: var(--primary); display: grid; place-items: center; font-style: normal; font-size: 18px; }
.pv-video.none { background: repeating-linear-gradient(45deg, #EEF1F5, #EEF1F5 10px, #E6EAF0 10px, #E6EAF0 20px); color: var(--muted); }
.pv-video.none b { position: static; color: var(--muted); font-weight: 600; text-align: center; padding: 0 12px; }
.pv-tr { margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; font-size: 12.5px; }
.pv-tr summary { cursor: pointer; padding: 8px 12px; font-weight: 600; }
.pv-tr div { padding: 0 12px 10px; color: var(--muted); white-space: pre-wrap; max-height: 140px; overflow: auto; }
.pv-fun { display: grid; gap: 5px; justify-items: center; }
.pv-fun button { border: 0; border-radius: 10px; background: var(--primary-soft); padding: 8px 10px; font-weight: 600; font-size: 13px; width: var(--w); position: relative; font-family: inherit; }
.pv-fun button.on { background: var(--primary); color: #fff; }
.pv-fun button em { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 10.5px; background: var(--accent); color: #3b2600; border-radius: 999px; padding: 0 8px; }
.pv-fund { margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 13px; }
.pv-fund b { display: block; }
.pv-per { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
.pv-per header { background: var(--primary-soft); padding: 8px 12px; font-weight: 700; font-size: 14px; }
.pv-per dl { margin: 0; padding: 4px 12px 10px; display: grid; gap: 2px; }
.pv-per dt { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.pv-per dd { margin: 0; font-size: 13px; }
.pv-task { border: 2px solid var(--primary); border-radius: 14px; overflow: hidden; }
.pv-task header { background: var(--primary); color: #fff; padding: 10px 13px; font-weight: 700; font-size: 14px; }
.pv-task .bd { padding: 12px 13px; display: grid; gap: 8px; }
.pv-task .bd p { margin: 0; font-size: 13px; }
.pv-task label { font-weight: 600; font-size: 12.5px; display: block; }
.pv-task small { color: var(--muted); display: block; font-size: 11.5px; }
.pv-task .fake { height: 30px; border-radius: 9px; background: var(--field); border: 1px solid var(--line); }
.pv-steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; counter-reset: s; }
.pv-steps li { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); counter-increment: s; }
.pv-steps li::before { content: counter(s); flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 11.5px; }
.pv-steps li.done::before { content: "✓"; background: var(--green); border-color: var(--green); color: #fff; }
.pv-steps li.now { color: var(--ink); font-weight: 600; }
.pv-steps li.now::before { background: var(--primary); border-color: var(--primary); color: #fff; }
.pv-def { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pv-def > div { border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; font-size: 13px; }
.pv-def > div.hl { background: var(--primary-soft); border-color: transparent; }
.pv-def h4 { font-size: 14px; margin: 0 0 3px; }
.pv-def ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.pv-def li::before { content: "✓ "; color: var(--green); font-weight: 700; }
.pv-wall { font-size: 13px; line-height: 1.5; color: #343846; white-space: pre-wrap; }
.pv-empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 13.5px; }
.pv-q { border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px; margin-bottom: 10px; font-size: 13px; }
.pv-q b { display: block; font-size: 13.5px; margin-bottom: 6px; }
.pv-q .o { display: flex; gap: 8px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); margin-top: 5px; }
.pv-q .o.ok { border-color: var(--green); background: var(--green-soft); }
.pv-q .o i { flex: none; font-style: normal; font-weight: 700; width: 18px; }

/* ---------- Current (production) replica ---------- */
.cur-ch { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.cur-ch h1 { font-size: 22px; font-weight: 700; }
.cur-ch .v { background: #19B7A6; color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 10px; }
.cur-ch .acts { margin-left: auto; display: flex; gap: 8px; }
.cur-ch .acts .btn { border-radius: 14px; }
.cur-mod { padding: 16px; display: grid; gap: 12px; }
.cur-mod .mt { display: flex; gap: 8px; align-items: center; font-weight: 700; }
.cur-les { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; background: #FCFCFD; }
.cur-les .t { display: grid; grid-template-columns: 20px 1fr 110px 70px 28px; gap: 8px; align-items: center; }
.cur-rt { border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.cur-rt .tb { display: flex; gap: 2px; flex-wrap: wrap; padding: 6px 8px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
.cur-rt .tb span { padding: 2px 7px; border-radius: 5px; }
.cur-rt .bd { padding: 10px 12px; font-size: 14px; white-space: pre-wrap; max-height: 240px; overflow: auto; line-height: 1.55; }
.cur-les .links { display: flex; gap: 14px; font-size: 13px; color: var(--primary-ink); font-weight: 500; }

/* ---------- Dialogs ---------- */
dialog.dlg { border: 0; padding: 0; border-radius: 20px; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 40px); overflow: auto; box-shadow: 0 24px 70px rgba(23,26,38,.35); color: var(--ink); animation: dlgIn .25s cubic-bezier(.2, .8, .2, 1); }
dialog.dlg::backdrop { background: rgba(23,26,38,.5); }
@keyframes dlgIn { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
.dg { padding: 22px 24px 20px; display: grid; gap: 16px; }
.dg .hd { display: flex; align-items: flex-start; gap: 12px; }
.dg .hd h2 { font-size: 19px; line-height: 1.3; }
.dg .hd p { color: var(--muted); font-size: 13.5px; }
.dg .hd .sp { flex: 1; }
.dsteps { display: flex; gap: 6px; }
.dsteps span { flex: 1; height: 5px; border-radius: 999px; background: var(--line); }
.dsteps span.on { background: var(--primary); }
.dft { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.dft .sp { margin-right: auto; font-size: 13px; color: var(--muted); }
.srcs { display: grid; gap: 10px; }
.src { display: grid; grid-template-columns: 22px 1fr; gap: 10px; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; }
.src:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); }
.src input { margin-top: 3px; accent-color: var(--primary); }
.src b { display: block; font-size: 14.5px; }
.src span { font-size: 13px; color: var(--muted); }
.src.off { opacity: .55; cursor: not-allowed; }
.opts { display: grid; gap: 10px; }
.opt2 { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; }
.opt2 input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--primary); }
.opt2 b { display: block; font-size: 14px; }
.opt2 span { font-size: 12.5px; color: var(--muted); }
.gprog { display: grid; gap: 10px; padding: 8px 0; }
.gp { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.gp .d { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 11px; color: #fff; }
.gp.on { color: var(--ink); font-weight: 600; } .gp.on .d { border-color: var(--primary); border-top-color: transparent; animation: spin .8s linear infinite; }
.gp.done { color: var(--ink); } .gp.done .d { background: var(--green); border-color: var(--green); }
@keyframes spin { to { transform: rotate(360deg); } }
.outl { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; max-height: 340px; overflow: auto; }
.outl li { display: grid; grid-template-columns: 22px 30px 1fr; gap: 10px; align-items: start; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.outl input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--primary); }
.outl .ic { width: 30px; height: 30px; border-radius: 8px; background: var(--primary-soft); color: var(--primary-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.outl b { font-size: 14px; display: block; }
.outl span { font-size: 12.5px; color: var(--muted); display: block; }
.blkgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.blkgrid button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 13px; display: grid; gap: 4px; }
.blkgrid button:hover { border-color: var(--primary); background: var(--primary-soft); }
.blkgrid .ic { width: 30px; height: 30px; border-radius: 8px; background: var(--primary-soft); color: var(--primary-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.blkgrid b { font-size: 14px; }
.blkgrid span { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.bulk { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; max-height: 300px; overflow: auto; }
.bulk li { display: flex; gap: 10px; align-items: center; font-size: 13.5px; padding: 6px 4px; }
.bulk .d { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); }
.bulk li.on .d { border-color: var(--primary); border-top-color: transparent; animation: spin .8s linear infinite; }
.bulk li.done .d { background: var(--green); border-color: var(--green); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--navy); color: #fff; border-radius: 12px; padding: 10px 18px; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 120; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.mini { font-size: 12.5px; color: var(--muted); }

/* ---------- Responsive ---------- */
.only-narrow { display: none; }
@media (max-width: 1360px) {
  .cw { grid-template-columns: 250px minmax(0, 1fr); }
  .eside { grid-column: 2; position: static; max-height: none; overflow: visible; }
  .pvw { display: none; position: static; max-height: none; }
  .cw.show-pv .pvw { display: flex; grid-column: 1 / -1; }
  .cw.show-pv .ed { display: none; }
  .only-narrow { display: inline-flex; }
}
@media (max-width: 980px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .cw { grid-template-columns: minmax(0, 1fr); }
  .st { position: static; max-height: none; }
  .lh .top { grid-template-columns: 1fr; }
  .pair { grid-template-columns: 1fr 32px; }
  .pair .in:first-child { grid-column: 1 / -1; }
  .row2 { grid-template-columns: 1fr; }
  .page { padding: 14px 12px 80px; }
  .cur-les .t { grid-template-columns: 1fr 100px; }
}
@media (max-width: 640px) { .proto { position: static; --proto-h: 0px; padding: 6px 12px; } :root { --proto-h: 0px; } }

<script>
(function () {
  'use strict';

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function uid() { return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function words(s) { return (String(s || '').trim().match(/\S+/g) || []).length; }
  function sentences(s) { return String(s).match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [String(s)]; }
  function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 2400); }

  // Storage can be blocked, so keep an in-memory copy too.
  // The store holds every course: dm = Digital Marketing (from production), nw = a course created in the prototype.
  var KEY = 'atlas-admin-proto-v2', memory = null;
  function loadState() {
    if (memory) return memory;
    try {
      var v = localStorage.getItem(KEY) || localStorage.getItem('atlas-admin-proto-v1'), o = v ? JSON.parse(v) : null;
      if (o && o.lessons) o = { dm: o, nw: null }; // saved before the course list existed
      dropRemovedBlocks(o);
      return o;
    } catch (e) { return null; }
  }
  // 'prepare' (Before you start) and 'community' (10,000 Women registration) were removed after team
  // feedback on 30 Oct 2026; older saved copies may still contain them.
  var REMOVED_TYPES = ['prepare', 'community'];
  function dropRemovedBlocks(store) {
    if (!store) return;
    ['dm', 'nw'].forEach(function (k) {
      var course = store[k];
      if (!course || !course.lessons) return;
      course.lessons.forEach(function (l) {
        if (l.blocks) l.blocks = l.blocks.filter(function (b) { return REMOVED_TYPES.indexOf(b.type) === -1; });
      });
    });
  }
  function saveState() { memory = STORE; try { localStorage.setItem(KEY, JSON.stringify(STORE)); } catch (e) { /* in-memory copy is enough */ } }

  // ==========================================================================
  // CONTENT. Titles, types, durations, the three converted lessons and the quiz come from the production
  // course. The converted blocks, the check questions, Jen's help and discussion starters are the sample
  // content built for the learner prototypes. Excerpts for lessons 4 to 12 are the real text, shortened.
  // ==========================================================================
  var TYPE_LABEL = { Article: 'Article', Video: 'Video', Scenario: 'Scenario', Quiz: 'Quiz' };
  var LESSONS = [
    ['Getting started', 'Article'], ['Developing a digital marketing campaign', 'Video'], ['Exercise 1: Finding your audience', 'Scenario'],
    ['Promoting your content', 'Article'], ['Using owned media', 'Video'], ['Using paid media', 'Video'], ['Using earned media', 'Article'],
    ['Exercise 2: Using viral marketing', 'Scenario'], ['Monitoring the success of your digital marketing campaign', 'Article'],
    ['Using social listening', 'Article'], ['Exercise 3: Reflect on your learning', 'Scenario'],
    ['Key tips for successfully managing a digital marketing campaign', 'Article'], ['Quiz', 'Quiz']
  ];
  var YT = 'https://youtu.be/OpGsOTBUshI';
  // Lesson 10 stays as rich text so the "Convert with AI" flow can be shown on this course.
  // In the learner prototype it is already converted (the result that flow is meant to produce).
  var AI_DEMO_IDX = 9;
  var LEGACY = {
    0: 'In this course, you will explore how digital marketing campaigns can be used to effectively communicate with your target customers to support your business and develop your business growth. You will develop a clear and comprehensive understanding of how to develop a digital marketing campaign. You will also examine ways of promoting your content using paid, earned and owned approaches such as search engine optimization and influencer marketing. You will then learn how to measure how successful your campaign is with your customers. Are you ready to start? To complete all the exercises in this course, it will be helpful for you to gather the documentation that you currently have on your marketing and sales activities. Do not worry if this documentation is limited – this course will provide guidance on how to develop and record digital marketing strategies for your business. If you are not yet confident with your market and customers, or these are changing, you may wish to first complete one of the other 10,000 Women courses, Fundamentals of Sales and Marketing. Register with 10,000 Women As well as sharing ideas with other participants in the discussion forums, you can register with 10,000 Women today to learn from other participants and graduates. […]',
    1: 'What is digital marketing? Digital marketing is everywhere, from social media ads, search engines and websites, to emails and, even, online reviews. So, what exactly is digital marketing? Digital marketing is the use of digital technologies to create integrated, targeted and measurable communications with the purpose of acquiring and retaining customers. [MUSIC] Take customer one, for example. They just picked up photography as a hobby. […]',
    2: 'When developing your digital marketing campaign, there are four key considerations: What are my marketing objectives? Who is my audience and where are they located? How do I promote the content? How can I measure the success of my campaign? Step 2: Identify Your Audience. A marketing persona is a semi-fictional representation of your ideal customer, based on real data from existing customers and market research. […] Task: On a document or notepad, write down potential personas for your own business. […]',
    3: 'One of the key features of 10,000 Women is the power of the network created between like-minded individuals. To make the most of this network, share your experiences with others, discuss the topics presented, and support other participants in identifying their own opportunities.\n\nGiven the range of digital content available, you can use the paid, earned and owned media (PEO) model to help you develop a digital marketing strategy that integrates paid, earned, shared, and owned approaches.\n\nOwned media\n\nOwned media refers to the digital channels and content that are in your control. That means you have full control of the messages of your digital marketing campaign, and of the story you want to tell about your product or service. This can include your own websites, your own brand pages on social media, email newsletters and your own mobile apps.\n\nPaid media\n\nPaid media refers to external marketing efforts that you will have to pay for. In other words, you pay third parties to broadcast your messages to others. Just like owned media, you also have control of the content. These can include paid search ads, display and shopping ads.\n\nEarned media\n\nEarned media refers to any publicity a company receives from unpaid promotional efforts. These are often generated by opinion leaders and other credible third party sources such as bloggers, journalists, and influencers. These can include the online reviews (or electronic word-of-mouth) you see on review websites.\n\nThe trick is to combine paid, earned and owned together to build your brand so that you are regarded as the expert in your field, even by your competitors.\n\nBy creating your own content, you can use owned media to set the tone, paid media to amplify the message and earned media to build relationships with key opinion leaders who may share your content with their followers.\n\nNow that you know what paid, earned and owned media are, try to identify those that you are already using.\n\nShare your thoughts below, explaining which paid, earned and owned media you are already using in your own business. Read what other participants have shared about their own PEO activities and discuss the following questions:\n\nWhich PEO approaches are working well for your, and other participants’ businesses?\n\nHow could you build on or improve your use of the PEO model?',
    4: 'Now that you have a general idea of the PEO Model, let\'s go into detail about how to use paid, owned and earned media in an integrated digital campaign. Let\'s begin with owned media. You may not be aware that you already have a number of digital tools at your disposal, including your own websites, your social media accounts and emails. Continuing our previous example with a digital camera, first and foremost, we need to tailor your content to the customer\'s needs, according to the customer journey stage. Then, we promote this personalized content on owned media channels that the customers will be most likely to use. [MUSIC] This process is search engine optimization (SEO): the practice of making changes to web page content to improve its visibility in unpaid search engine results. It is one of the ways we can utilize owned media to meet our marketing needs.',
    5: 'Paid Media in Digital Marketing\n\nNow let’s look at paid media.\n\nAfter creating marketing content tailored to your customers’ needs, you can use paid media to amplify your message.\n\nWhat is PPC?\n\nPPC (Pay-Per-Click) refers to sponsored listings on search engines and social media platforms. It is called pay-per-click because you only pay when someone clicks on your ad.\n\nHow to Design an Effective PPC Ad\n\nEvery PPC ad must perform three key actions. Attract attention: capture the interest of your target audience. Communicate a value proposition: explain why your product or service is worth purchasing. Invite action: encourage users to take the next step with a clear call to action such as “Buy Now”, “Shop” or “Learn More”.',
    6: 'You will now explore earned media and how this can be used in your digital marketing strategy.\n\nWhat is earned media?\n\nEarned media refers to any publicity a company receives from unpaid promotional efforts. It is often generated by opinion leaders and other third party sources like journalists, bloggers, and influencers.\n\nHow can you incentivize earned media?\n\nOne of the most common forms of earned media is word-of-mouth (WOM) marketing which is any verbal, informal, person-to-person communication. Earned media is an important aspect of an integrated digital marketing campaign, as 91% of customers regularly read online reviews.\n\nHow do you choose an influencer?\n\nWhen you are choosing an influencer, one of the things to consider is the number of followers they have. A nano-influencer can have up to 1,000 followers while mega influencers can have more than 1 million followers.',
    7: 'Another common form of earned media is viral marketing which is the process of getting customers to pass along a company’s marketing messages to friends, family, and colleagues. A common trait of all viral content is an emotional connection with their audience.\n\nTask\n\nIn a document or notepad, briefly answer the following question:\n\nWhat are some of the key things you would need to consider when using viral media in a marketing campaign for your products or services?',
    8: 'Now that you have learned how to use owned, paid, and earned media in a digital marketing campaign, you come to the final key consideration of your digital marketing campaign: how to measure its success.\n\nOwned media KPIs\n\nOwned media KPIs include the following: average position, page views, bounce rate.\n\nPaid media KPIs\n\nPaid media KPIs include the following: impressions, clicks, click-through-rate, cost per click, cost, conversions, conversion ratio.\n\nWhich measures should you select?\n\nUltimately, which KPIs you refer to should match your objectives.',
    9: 'Social listening is the monitoring of your brand’s social media channels for any customer feedback and direct mentions of your brand, or discussions regarding specific keywords, topics, competitors, or industries. This is then followed by an analysis to gain insights and action on these opportunities.\n\nWhy does it matter?\n\nSocial listening provides you with insights into the following areas: campaign and sentiment analysis, content research, influencer recognition.\n\nCampaign and sentiment analysis\n\nSentiment analysis is imperative for understanding how your audience reacts to your content at every stage of the customer journey.\n\nContent research\n\nWith social listening, you can also identify the content type that your audience likes.\n\nInfluencer recognition\n\nYou can also use social listening to find your current top influencers and identify the influencers in your industry.',
    10: 'Now that you understand what the various KPIs are and how they correspond to each stage of the customer journey, it is time to take stock of what you are currently doing in your business.\n\nSelect and save the document below. This is the Customer Journey Plan, and you can use this to take stock of which media and content you are already using and how they correspond to various customer journey objectives.',
    11: 'Now that you have explored all four key considerations, let’s review these considerations and reflect on what is required to create your own digital marketing campaign.\n\nKey considerations for developing your digital marketing campaign\n\n1. What are my marketing objectives? Set your objectives for your digital marketing campaign.\n\n2. Who and where is my audience? Reflect on the personas you created in lesson 1.\n\n3. How do I promote the content? Highlight the digital channels you can use to address their needs at each stage of the customer journey.\n\n4. How can I measure the success of my campaign? Make note of the KPIs you will need to monitor based on your customer journey objectives.'
  };

  // Terms Jen can explain (same definitions as in the learner prototype)
  var TERMS = {
    'Paid media': 'Paid media is promotion you pay for, such as search or social media advertising.',
    'Earned media': 'Earned media is attention you gain without paying for it directly, such as reviews, shares or press coverage.',
    'Owned media': 'Owned media is the channels you control, such as your website, blog, email list or social media profiles.',
    'Search engine optimization': 'Search engine optimization (SEO) is improving your content so search engines show it higher for relevant searches.',
    'Influencer marketing': 'Influencer marketing means working with people who have an audience, so they promote your product to the people who follow them.',
    'Social listening': 'Social listening means monitoring what people say about your brand online. It helps you shape your strategy and see how well you are engaging your audience.',
    'Bounce rate': 'Bounce rate is the share of visitors who leave after viewing only one page.',
    'Touchpoint': 'A touchpoint is any point where a customer meets your business, such as a social post, a search result, your website or an online review.',
    'Persona': 'A marketing persona is a semi-fictional picture of your ideal customer, built from real customer data and market research.',
    'Funnel': 'The customer journey funnel shows how people narrow from many options down to a purchase, and then to loyalty after the sale.',
    'Conversion': 'Conversion is when a customer takes the action you want, such as buying or signing up.',
    'PPC': 'PPC means pay-per-click: you pay each time someone clicks your advertisement.',
    'KPI': 'A KPI (key performance indicator) is a number you track to see whether a goal is being met, such as clicks, engagement or sales.'
  };

  // ---- Block library. `fields` drives the form on the left; RENDER draws the learner view on the right. ----
  var BLOCKS = {
    lead: { name: 'Intro paragraph', icon: '¶', desc: 'A short opening that says what the lesson is about.',
      make: function () { return { text: '' }; },
      fields: [{ k: 'text', t: 'area', label: 'Text', rows: 3 }] },
    text: { name: 'Text', icon: 'T', desc: 'A heading with a paragraph. Keep each one short.',
      make: function () { return { heading: '', body: '' }; },
      fields: [{ k: 'heading', t: 'text', label: 'Heading (optional)' }, { k: 'body', t: 'area', label: 'Text', rows: 5 }] },
    cards: { name: 'Cards', icon: '▦', desc: 'Two to four parallel ideas people can scan quickly.',
      make: function () { return { title: '', numbered: false, cards: [{ title: '', text: '', more: '' }, { title: '', text: '', more: '' }] }; },
      fields: [{ k: 'title', t: 'text', label: 'Section title (optional)' }, { k: 'numbered', t: 'toggle', label: 'Number the cards' },
        { k: 'cards', t: 'list', label: 'Cards', item: 'Card', add: 'Add card', sub: [{ k: 'title', t: 'text', label: 'Title' }, { k: 'text', t: 'area', label: 'Text', rows: 2 }, { k: 'more', t: 'area', label: 'Read more (optional detail)', rows: 2 }] }] },
    callout: { name: 'Key point', icon: '!', desc: 'A definition, tip or takeaway that should not be missed.',
      make: function () { return { variant: 'info', title: '', text: '' }; },
      fields: [{ k: 'variant', t: 'select', label: 'Style', opts: [['info', 'Information'], ['note', 'Heads-up'], ['good', 'Key takeaway']] }, { k: 'title', t: 'text', label: 'Title' }, { k: 'text', t: 'area', label: 'Text', rows: 3 }] },
    video: { name: 'Video with transcript', icon: '▶', desc: 'A video, with the transcript kept out of the way until wanted.',
      make: function () { return { url: '', title: '', transcript: '', clean: true }; },
      fields: [{ k: 'url', t: 'text', label: 'Video link', hint: 'YouTube, Vimeo or an uploaded file.' }, { k: 'title', t: 'text', label: 'Title' }, { k: 'transcript', t: 'area', label: 'Transcript', rows: 5 }, { k: 'clean', t: 'toggle', label: 'Remove sound cues such as [MUSIC] when showing the transcript' }] },
    stages: { name: 'Stage explorer', icon: '▼', desc: 'Learners pick a stage (for example a funnel) and see what it means.',
      make: function () { return { title: '', intro: '', stages: [{ name: '', text: '' }, { name: '', text: '' }], starts: [] }; },
      fields: [{ k: 'title', t: 'text', label: 'Title' }, { k: 'intro', t: 'area', label: 'Introduction', rows: 2 },
        { k: 'stages', t: 'list', label: 'Stages, top to bottom', item: 'Stage', add: 'Add stage', sub: [{ k: 'name', t: 'text', label: 'Name' }, { k: 'text', t: 'area', label: 'What it means', rows: 2 }] },
        { k: 'starts', t: 'list', label: 'Starting points to compare (optional)', item: 'Example', add: 'Add example', sub: [{ k: 'label', t: 'text', label: 'Who or what' }, { k: 'stage', t: 'number', label: 'Starts at stage #' }, { k: 'text', t: 'area', label: 'Explanation', rows: 2 }] }] },
    personas: { name: 'Persona cards', icon: '☺', desc: 'Example people with needs and how to help them.',
      make: function () { return { title: '', intro: '', personas: [{ name: '', demographic: '', needs: '', can: '', touch: '' }] }; },
      fields: [{ k: 'title', t: 'text', label: 'Title' }, { k: 'intro', t: 'text', label: 'Introduction' },
        { k: 'personas', t: 'list', label: 'Personas', item: 'Persona', add: 'Add persona', sub: [{ k: 'name', t: 'text', label: 'Name' }, { k: 'demographic', t: 'text', label: 'Demographic' }, { k: 'needs', t: 'text', label: 'Motivation and needs' }, { k: 'can', t: 'text', label: 'What you can do' }, { k: 'touch', t: 'text', label: 'Digital touchpoints (comma separated)' }] }] },
    task: { name: 'Practice task', icon: '✎', desc: 'An exercise with answer boxes. Answers are saved to the learner.',
      make: function () { return { title: 'Your task', prompt: '', fields: [{ label: 'Your answer', hint: '' }] }; },
      fields: [{ k: 'title', t: 'text', label: 'Title' }, { k: 'prompt', t: 'area', label: 'Instructions', rows: 3 },
        { k: 'fields', t: 'list', label: 'Answer boxes', item: 'Box', add: 'Add box', sub: [{ k: 'label', t: 'text', label: 'Label' }, { k: 'hint', t: 'text', label: 'Hint (optional)' }] }] },
    steps: { name: 'Where you are', icon: '①', desc: 'A short progress list that shows where this lesson sits in a bigger sequence.',
      make: function () { return { title: '', steps: ['', ''], current: 1 }; },
      fields: [{ k: 'title', t: 'text', label: 'Title' }, { k: 'steps', t: 'strings', label: 'Steps', add: 'Add step' }, { k: 'current', t: 'number', label: 'Current step #' }] },
    define: { name: 'Definition', icon: '≡', desc: 'A term explained, with what it is based on and what it helps with.',
      make: function () { return { title: '', intro: '', leftTitle: '', leftLead: '', left: [''], rightTitle: '', rightLead: '', right: [''] }; },
      fields: [{ k: 'title', t: 'text', label: 'Title' }, { k: 'intro', t: 'text', label: 'Introduction' }, { k: 'leftTitle', t: 'text', label: 'Left box: heading' }, { k: 'leftLead', t: 'text', label: 'Left box: lead-in' }, { k: 'left', t: 'strings', label: 'Left box: points', add: 'Add point' },
        { k: 'rightTitle', t: 'text', label: 'Right box: heading' }, { k: 'rightLead', t: 'text', label: 'Right box: lead-in' }, { k: 'right', t: 'strings', label: 'Right box: points', add: 'Add point' }] }
  };
  BLOCKS.flashcards = { name: 'Flashcards', icon: '▭', desc: 'Cards learners flip to test themselves, then mark what they know.',
    make: function () { return { title: 'Test yourself', cards: [{ front: '', back: '' }, { front: '', back: '' }] }; },
    fields: [{ k: 'title', t: 'text', label: 'Title' },
      { k: 'cards', t: 'list', label: 'Cards', item: 'Card', add: 'Add card', sub: [{ k: 'front', t: 'area', label: 'Front (question or term)', rows: 2 }, { k: 'back', t: 'area', label: 'Back (answer)', rows: 2 }] }] };
  var BLOCK_ORDER = ['lead', 'text', 'cards', 'callout', 'video', 'stages', 'personas', 'define', 'task', 'flashcards', 'steps'];

  function B(type, data, state, why) { return { id: uid(), type: type, data: data, state: state || 'reviewed', why: why || '' }; }

  // The three lessons already converted, written to match the learner prototype
  function blocksFor(i) {
    if (i === 0) return [
      B('lead', { text: 'In this course, you will explore how digital marketing campaigns can be used to effectively communicate with your target customers to support your business and develop your business growth.' }),
      B('cards', { title: 'What you will learn', numbered: false, cards: [
        { title: 'Plan', text: 'Develop a clear and comprehensive understanding of how to develop a digital marketing campaign.', more: '' },
        { title: 'Promote', text: 'Examine ways of promoting your content using paid, earned and owned approaches, such as search engine optimization and influencer marketing.', more: '' },
        { title: 'Measure', text: 'Learn how to measure how successful your campaign is with your customers.', more: '' }] }),
