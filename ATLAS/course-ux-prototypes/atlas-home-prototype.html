<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATLAS Home Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Design tokens — same as atlas-onboarding-prototype.html: ATLAS brand
   (Montserrat, navy, teal) plus the three logo colours as the path motif.
   ========================================================================== */
:root {
  --navy: #31425D;
  --navy-deep: #1E2A3E;
  --primary: #0D719A;
  --primary-ink: #0A5A7B;
  --primary-soft: #E6F2F7;
  --bg: #F6F7F9;
  --surface: #FFFFFF;
  --ink: #171A26;
  --muted: #5B6475;
  --line: #E1E5EB;
  --accent: #F5A623;
  --accent-ink: #8A5600;
  --accent-soft: #FEF4E1;
  --orange: #EF6A2E;
  --mark-teal: #1C8CB8;
  --violet: #6B4FD8;
  --violet-soft: #EFEBFC;
  --green: #1E8A5A;
  --green-soft: #E3F4EC;
  --radius: 16px;
  --radius-lg: 22px;
  --font: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Prototype bar (not part of the design) ---------- */
.proto { display: flex; align-items: center; gap: 8px 18px; padding: 8px 20px; background: #FFF8E6; border-bottom: 1px dashed var(--accent); font-size: 13px; overflow-x: auto; white-space: nowrap; }
.proto b { color: var(--accent-ink); font-weight: 600; }
.seg { display: inline-flex; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.seg button, .seg a { padding: 4px 12px; border-radius: 999px; font-size: 12.5px; color: var(--muted); text-decoration: none; }
.seg [aria-pressed="true"] { background: var(--navy); color: #fff; }
.proto > a { color: var(--primary-ink); font-size: 12.5px; }

/* ==========================================================================
   Hero: the one next step, on navy, with the course path
   ========================================================================== */
.hero { position: relative; overflow: hidden; color: #fff; background: radial-gradient(110% 120% at 15% 120%, #23476A 0%, var(--navy-deep) 60%); }
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 28px; }

.appbar { display: flex; align-items: center; gap: 28px; padding: 20px 0; }
.appbar .logo img { height: 26px; display: block; filter: brightness(0) invert(1); }
.appnav { display: flex; gap: 4px; flex: 1; }
.appnav a { padding: 8px 12px; border-radius: 999px; font-size: 14px; font-weight: 500; text-decoration: none; color: rgba(255, 255, 255, .66); }
.appnav a:hover { color: #fff; }
.appnav a[aria-current="page"] { color: #fff; background: rgba(255, 255, 255, .1); }
.me { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: linear-gradient(135deg, var(--accent), var(--orange)); }

.hero-body { padding: 36px 0 8px; display: grid; grid-template-columns: 1.25fr 1fr; gap: 40px; align-items: end; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 16px; color: var(--accent); }
.hero h1 { font-size: clamp(22px, 2.4vw, 28px); line-height: 1.2; font-weight: 300; margin: 0; color: rgba(255, 255, 255, .8); }
.hero h1 strong { display: block; margin-top: 10px; font-size: clamp(38px, 5.2vw, 62px); line-height: 1.04; font-weight: 700; letter-spacing: -.025em; color: #fff; }
.hero .sub { margin: 18px 0 0; font-size: 17px; color: rgba(255, 255, 255, .72); max-width: 520px; }
.hero-side { justify-self: end; text-align: right; }
.cta { display: inline-flex; align-items: center; gap: 12px; padding: 16px 30px; border-radius: 999px; font-weight: 600; font-size: 16px; text-decoration: none; background: #fff; color: var(--navy-deep); transition: transform .2s var(--ease), background .2s; }
.cta:hover { background: var(--accent-soft); transform: translateY(-1px); }
.cta svg { width: 18px; height: 18px; transition: transform .2s var(--ease); }
.cta:hover svg { transform: translateX(3px); }
.cta-note { display: block; margin-top: 12px; font-size: 13px; color: rgba(255, 255, 255, .55); }

/* The path: 13 lessons as dots along the curve, grouped into four stops */
.path { position: relative; margin: 28px 0 0; height: 170px; }
.path svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.path .track { fill: none; stroke: rgba(255, 255, 255, .14); stroke-width: 3; stroke-linecap: round; }
.path .run { fill: none; stroke: url(#runGrad); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 0 1; transition: stroke-dasharray 1.6s var(--ease) .2s; }
.lesson-dot { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--navy-deep); border: 2px solid rgba(255, 255, 255, .35); }
.lesson-dot.done { background: #fff; border-color: #fff; }
.lesson-dot.now { width: 22px; height: 22px; margin: -11px 0 0 -11px; background: var(--accent); border: 3px solid #fff; animation: pulse 2s ease-out 1.2s infinite; }
.lesson-dot.end { width: 20px; height: 20px; margin: -10px 0 0 -10px; background: var(--orange); border-color: #fff; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(245, 166, 35, .6); } 100% { box-shadow: 0 0 0 18px rgba(245, 166, 35, 0); } }
.here { position: absolute; transform: translate(-50%, calc(-100% - 22px)); font-size: 12px; font-weight: 600; background: var(--accent); color: var(--navy-deep); padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.here::after { content: ""; position: absolute; left: 50%; bottom: -4px; width: 8px; height: 8px; background: inherit; transform: translateX(-50%) rotate(45deg); }
.here.first { transform: translate(-14px, calc(-100% - 22px)); }
.here.first::after { left: 14px; }
.stop-label { position: absolute; transform: translate(-50%, 22px); text-align: center; white-space: nowrap; text-shadow: 0 0 8px var(--navy-deep), 0 0 3px var(--navy-deep); }
.stop-label b { display: block; font-size: 14px; font-weight: 600; }
.stop-label span { display: block; font-size: 12px; color: rgba(255, 255, 255, .55); }
.stop-label.last { transform: translate(calc(-100% + 14px), 22px); text-align: right; }
.stop-label.is-done b::before { content: "✓ "; color: var(--accent); }

.goal-line { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-top: 18px; padding: 18px 0 30px; border-top: 1px solid rgba(255, 255, 255, .1); font-size: 14px; color: rgba(255, 255, 255, .7); }
.goal-line b { color: #fff; font-weight: 600; }
.goal-line .also a { color: #fff; font-weight: 600; }

/* ==========================================================================
   Below the hero: at most three calm blocks
   ========================================================================== */
.below { padding: 56px 0 80px; }
.block { margin-top: 56px; }
.block:first-child { margin-top: 0; }
.block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.block h2 { margin: 0; font-size: 26px; font-weight: 300; letter-spacing: -.015em; }
.block h2 strong { font-weight: 700; }
.linkbtn { color: var(--primary-ink); font-weight: 600; font-size: 14px; text-decoration: none; }
.linkbtn:hover { text-decoration: underline; }

/* For today */
.today { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; list-style: none; margin: 0; padding: 0; }
.today a { display: flex; gap: 18px; align-items: flex-start; height: 100%; padding: 22px; border-radius: var(--radius-lg); background: var(--surface); border: 1.5px solid var(--line); text-decoration: none; transition: border-color .2s, transform .25s var(--ease), box-shadow .25s; }
.today a:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 14px 28px -20px rgba(13, 113, 154, .5); }
.today .face { flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; }
.today .t { flex: 1; min-width: 0; }
.today small { display: block; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.today b { display: block; margin-top: 4px; font-size: 17px; font-weight: 600; line-height: 1.35; }
.today q { display: block; margin-top: 8px; font-size: 14px; color: var(--muted); quotes: "“" "”"; }
.today .go { flex: none; align-self: center; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); }
.today .go svg { width: 16px; height: 16px; }

/* Your courses: each course is one row with its own mini path */
.courses { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius-lg); }
.courses li + li { border-top: 1px solid var(--line); }
.course { display: grid; grid-template-columns: 1fr minmax(180px, 1.1fr) auto; gap: 24px; align-items: center; padding: 20px 24px; text-decoration: none; }
.course:hover .ct b { color: var(--primary-ink); }
.ct b { display: block; font-size: 16px; font-weight: 600; transition: color .2s; }
.ct span { display: block; font-size: 13.5px; color: var(--muted); }
.ct .kind { display: inline-block; margin-bottom: 4px; font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ct .kind.pals { color: var(--violet); }
.mini { display: flex; gap: 4px; align-items: center; }
.mini i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.mini i.done { background: var(--primary); }
.mini i.now { background: var(--accent); height: 10px; }
.mini.pals i.done { background: var(--violet); }
.mini.complete i { background: var(--green); }
.state { font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--primary-ink); }
.state.complete { color: var(--green); }
.state.pals { color: var(--violet); }

/* Explore: the rest of ATLAS, small and last */
.explore { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; margin: 0; padding: 0; }
.explore a { display: inline-flex; align-items: center; gap: 10px; padding: 10px 16px 10px 12px; border-radius: 999px; background: var(--surface); border: 1.5px solid var(--line); font-size: 14px; font-weight: 500; text-decoration: none; transition: border-color .2s; }
.explore a:hover { border-color: var(--primary); }
.explore i { width: 10px; height: 10px; border-radius: 50%; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Entrance: hero text rises in once */
.rise { animation: rise .8s var(--ease) both; }
.rise.d1 { animation-delay: .12s; }
.rise.d2 { animation-delay: .24s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }

/* ---------- Small screens ---------- */
@media (max-width: 760px) {
  .wrap { padding: 0 18px; }
  .appbar { gap: 12px; padding: 16px 0; }
  .appbar .logo img { height: 22px; }
  .appnav { display: none; }
  .appbar .me { margin-left: auto; }
  .hero-body { grid-template-columns: 1fr; padding-top: 32px; gap: 24px; }
  .hero-side { justify-self: stretch; text-align: left; }
  .cta { width: 100%; justify-content: center; }
  .path { height: 170px; margin-top: 28px; }
  .stop-label b { font-size: 12px; }
  .stop-label span { display: none; }
  .today { grid-template-columns: 1fr; }
  .today .go { display: none; }
  .course { grid-template-columns: 1fr auto; gap: 10px 16px; padding: 18px; }
  .mini { grid-column: 1 / -1; grid-row: 2; }
  .block h2 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
}
</style>

  // Place the 13 lesson dots and the stop labels on the curve. The SVG is stretched
  // (preserveAspectRatio none), so points are converted to percentages of the box.
  function drawPath() {
    var box = document.getElementById('path');
    var track = document.getElementById('trackPath');
    var total = track.getTotalLength();
    var done = DONE[prog];
    var html = '';
    function at(i) {
      var p = track.getPointAtLength(total * i / 12);
      return { left: p.x / 10 + '%', top: p.y / 2 + '%' };
    }
    LESSONS.forEach(function (lesson, i) {
      var pos = at(i);
      var cls = i < done ? 'done' : (i === done ? 'now' : (i === 12 ? 'end' : ''));
      html += '<span class="lesson-dot ' + cls + '" style="left:' + pos.left + ';top:' + pos.top + '" title="Lesson ' + (i + 1) + ': ' + esc(lesson[0]) + '"></span>';
      if (i === done) html += '<span class="here' + (i === 0 ? ' first' : '') + '" style="left:' + pos.left + ';top:' + pos.top + '">You are here</span>';
    });
    STOPS.forEach(function (stop, s) {
      var first = s === 0 ? 0 : STOPS[s - 1].last + 1;
      var pos = at((first + stop.last) / 2);
      html += '<span class="stop-label' + (done > stop.last ? ' is-done' : '') + (s === STOPS.length - 1 ? ' last' : '') + '" style="left:' + pos.left + ';top:' + pos.top + '"><b>' + stop.title + '</b><span>' + stop.sub + '</span></span>';
    });
    box.insertAdjacentHTML('beforeend', html);
    // Grow the coloured line to the learner's position.
    var run = document.getElementById('runPath');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { run.style.strokeDasharray = (Math.min(done, 12) / 12) + ' 1'; });
    });
  }

        kind: 'Course', title: 'Digital Marketing Strategy',
        sub: done === 0 ? '13 lessons · about 1h 5m' : (done === 13 ? '13 of 13 lessons · completed' : done + ' of 13 lessons · next: ' + LESSONS[done][0]),
        bar: mini(13, done, done === 13 ? 'complete' : ''),
        state: done === 0 ? 'Start' : (done === 13 ? 'Completed' : 'Continue'), stateClass: done === 13 ? 'complete' : '',
        href: PAGES.course + '?prog=' + (done === 0 ? 'none' : (done === 13 ? 'done' : 'some')), order: done === 13 ? 2 : 0
      },
      {
        kind: 'PALS · adaptive', kindClass: 'pals', title: 'Hospitality 101',
        sub: '0 of 19 knowledge points · next: Market Trend Analysis',
        bar: mini(19, 0, 'pals'), state: 'Open', stateClass: 'pals', href: '#', toast: 'PALS (not part of the prototype)', order: 1
      },
      {
        kind: 'Course', title: 'Time Management Essentials', sub: '5 of 5 lessons · completed',
        bar: mini(5, 5, 'complete'), state: 'Completed', stateClass: 'complete', href: '#', toast: 'Time Management (not part of the prototype)', order: 3
      }
    ];
    rows.sort(function (a, b) { return a.order - b.order; });
    return '<section class="block" aria-labelledby="coursesH"><div class="block-head"><h2 id="coursesH">Your <strong>courses</strong></h2><a class="linkbtn" href="' + PAGES.courses + '">All courses</a></div><ul class="courses">' +
      rows.map(function (r) {
        return '<li><a class="course" href="' + r.href + '"' + (r.toast ? ' data-toast="' + r.toast + '"' : '') + '>' +
          '<span class="ct"><span class="kind ' + (r.kindClass || '') + '">' + r.kind + '</span><b>' + r.title + '</b><span>' + esc(r.sub) + '</span></span>' +
          r.bar + '<span class="state ' + r.stateClass + '">' + r.state + '</span></a></li>';
      }).join('') + '</ul></section>';
  }

  function exploreBlock() {
    var items = [
      ['CBL role-play', 'var(--green)'], ['Assessments', 'var(--accent)'], ['Psychometric assessment', 'var(--violet)'],
      ['Performance', 'var(--primary)'], ['Leaderboard', 'var(--orange)'], ['Ask Jen', 'var(--navy)']
    ];
    return '<section class="block" aria-labelledby="exploreH"><div class="block-head"><h2 id="exploreH">Explore <strong>ATLAS</strong></h2></div><ul class="explore">' +
      items.map(function (x) { return '<li><a href="#" data-toast="' + x[0] + ' (not part of the prototype)"><i style="background:' + x[1] + '"></i>' + x[0] + '</a></li>'; }).join('') +
      '</ul></section>';
  }

  // ==========================================================================
  // RENDER
  // ==========================================================================
  function render() {
    document.getElementById('app').innerHTML = hero() + '<main class="below"><div class="wrap">' + todayBlock() + coursesBlock() + exploreBlock() + '</div></main>';
    drawPath();
    document.querySelectorAll('[data-prog]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-prog') === prog)); });
  }

  var toastTimer;
  document.addEventListener('click', function (event) {
    var toastLink = event.target.closest('[data-toast]');
    if (toastLink) {
      event.preventDefault();
      var toast = document.getElementById('toast');
      toast.textContent = toastLink.getAttribute('data-toast');
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2200);
      return;
    }
    var progBtn = event.target.closest('[data-prog]');
    if (progBtn) {
      prog = progBtn.getAttribute('data-prog');
      history.replaceState(null, '', '?prog=' + prog);
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
