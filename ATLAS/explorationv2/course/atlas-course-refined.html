function openDialog(title,content,label='ATLAS'){lastFocus=$('#dialog').open?lastFocus:document.activeElement;$('#dialog-label').textContent=label;$('#dialog-content').innerHTML=`<h2 id="dialog-title">${title}</h2>${content}`;$('#dialog').setAttribute('aria-labelledby','dialog-title');if(!$('#dialog').open)$('#dialog').showModal();}

const sections=[
 {id:'the-model',label:'The three media types',html:()=>`<section class="article-section" id="the-model"><h2>One message. Three ways to share it.</h2><p>Great content needs a way to reach people. The <button class="text-link" data-glossary="peo">paid, earned and owned media model</button> helps you combine the channels you control, the reach you pay for, and the trust others build for you.</p><div class="media-comparison"><div class="media-column owned"><div class="media-symbol">${icon('book')}</div><h3>Owned media</h3><div class="media-sub">Your space. Your story.</div><p>Channels and content you control. Set the message and tell your product’s story in your own way.</p><ul><li>Your website</li><li>Brand social pages</li><li>Email newsletters & apps</li></ul></div><div class="media-column paid"><div class="media-symbol">${icon('target')}</div><h3>Paid media</h3><div class="media-sub">Give your message reach.</div><p>Pay a third party to put your content in front of people. You still control the message.</p><ul><li>Paid search ads</li><li>Display advertising</li><li>Shopping ads</li></ul></div><div class="media-column earned"><div class="media-symbol">${icon('chat')}</div><h3>Earned media</h3><div class="media-sub">Let others build trust.</div><p>Publicity from unpaid promotional efforts, often through credible third-party voices.</p><ul><li>Customer reviews</li><li>Editorial coverage</li><li>Unpaid recommendations</li></ul></div></div><div class="comparison-caption"><span>${icon('bulb')}The difference is how your message reaches your audience.</span><span>Three parts of one strategy.</span></div><details class="detail-accordion"><summary>Read the complete definitions${icon('down')}</summary><div class="prose"><p><strong>Owned media</strong> refers to the digital channels and content that are in your control. That means you have full control of the messages of your digital marketing campaign, and of the story you want to tell about your product or service. This can include your own websites, your own brand pages on social media, email newsletters and your own mobile apps.</p><p><strong>Paid media</strong> refers to external marketing efforts that you will have to pay for. In other words, you pay third parties to broadcast your messages to others. Just like owned media, you also have control of the content. These can include paid search ads, display and shopping ads.</p><p><strong>Earned media</strong> refers to any publicity a company receives from unpaid promotional efforts. These are often generated by opinion leaders and other credible third-party sources such as bloggers, journalists, and influencers. These can include online reviews on review websites.</p></div></details></section>`},
 {id:'working-together',label:'How they work together',html:()=>`<section class="article-section" id="working-together"><h2>The value is in the combination.</h2><p>The trick is to combine paid, earned and owned media to build your brand, so that you are regarded as an expert in your field—even by your competitors.</p><blockquote class="pull-quote"><p>Use owned media to set the tone.<br>Paid media to amplify the message.<br>Earned media to build relationships.</p><small>The PEO model in practice</small></blockquote><p>By creating your own content, you can build relationships with key opinion leaders who may share it with their followers.</p><div class="example-block"><span class="example-number">↗</span><div><div class="example-label">ILLUSTRATIVE EXAMPLE</div><h3>A camera shop launches a beginner’s guide.</h3><p>The shop publishes the guide on its own website, promotes it with a search ad, and earns an independent recommendation from a photography blogger.</p><div class="example-flow"><span>Your guide</span>${icon('arrow')}<span>A paid ad</span>${icon('arrow')}<span>A recommendation</span></div></div></div><div class="takeaway">${icon('bulb')}<div><strong>The idea to keep</strong><p>You don’t have to choose just one channel. Give each type of media a clear role in the same customer journey.</p></div></div></section>`},
 {id:'quick-check',label:'Try a quick check',html:()=>`<section class="article-section" id="quick-check"><h2>Can you spot the difference?</h2><p>A customer writes a review of your camera shop without being paid. Which type of media is it?</p><div class="knowledge-options"><button data-check="owned">Owned media</button><button data-check="paid">Paid media</button><button data-check="earned">Earned media</button></div><div id="knowledge-feedback" aria-live="polite"></div></section>`},
 {id:'make-it-yours',label:'Apply it to your business',html:()=>`<section class="article-section" id="make-it-yours"><h2>Now, make it yours.</h2><div class="reflection"><div class="reflection-header">${icon('notes')}<h3>Take a moment to reflect.</h3></div><p>Which paid, earned and owned channels are you already using? Think about what is working well and what you could improve.</p><label for="reflection-input">Your media mix</label><textarea id="reflection-input" placeholder="For example: Our website is owned media. We also…">${esc(reflection)}</textarea><div class="reflection-actions"><span>Private notes · kept while this preview is open</span><button class="button secondary" id="save-reflection">Keep my note${icon('check')}</button></div></div><div class="community-note">${icon('chat')}<p><strong>Learn from each other.</strong> One of the strengths of 10,000 Women is its network. Share your experiences, support other participants, and discuss which PEO approaches are working well. Consider how you could build on or improve your use of the model. Read and respond to other participants’ ideas in the course discussion.</p></div><button class="button secondary" id="open-discussion" style="margin-top:17px">Open course discussion${icon('chat')}</button></section>`}
];
function article(){
 return header('Article','Promoting your content','The right message matters. So does how it reaches your audience.',4)+objectives('Understand owned, paid and earned media—and how to make them work together.')+`<div class="mode-switch-row"><span>Choose your reading pace</span><div class="mode-switch" role="group" aria-label="Reading mode"><button data-mode="read" aria-pressed="${readingMode==='read'}">Full lesson</button><button data-mode="guided" aria-pressed="${readingMode==='guided'}">Step by step</button></div></div>`+(readingMode==='read'?sections.map(s=>s.html()).join(''):`<div class="guided-dots" aria-hidden="true">${sections.map((_,i)=>`<span class="${i<=guidedStep?'visited':''}"></span>`).join('')}</div><div class="guided-step-label">Part ${guidedStep+1} of ${sections.length} · ${sections[guidedStep].label}</div>${sections[guidedStep].html()}<div class="guided-controls"><button class="button secondary" id="guided-back" ${guidedStep===0?'disabled':''}>${icon('back')}Back</button><span>One idea at a time.</span><button class="button primary" id="guided-next">${guidedStep===3?'Back to full lesson':'Next part'}${icon('arrow')}</button></div>`);
}
const transcript=[
 ['What is digital marketing?',`Digital marketing is everywhere, from social media ads, search engines and websites, to emails and online reviews. Digital marketing is the use of digital technologies to create integrated, targeted and measurable communications with the purpose of acquiring and retaining customers.`,`It is a data-driven process, which allows you to target individual customers and provide personalized and interactive content, as well as get measurable results across multiple channels.`],
 ['Four questions to shape your plan',`What are your marketing objectives? Who is your audience and where are they located? How do you promote the content? How can you measure success? These are the four considerations to keep in mind when you design your digital marketing plan.`],
 ['Start with your marketing objectives',`The main goal of digital marketing is to reach customers at the moments that most influence their decisions. These moments, or touchpoints, can be understood through the customer journey funnel. Customers begin with a number of potential options in mind. As they gather information, their options reduce until they reach the conversion stage, where they may buy your product or sign up for your service.`,`The post-sale phase is where you try to retain the individual and make them a loyal customer. As a marketer, you hope to reach customers at each stage and help them move toward becoming a loyal customer.`],
 ['Understand your audience',`Customer one has just picked up photography as a hobby and is searching for a suitable camera. Their journey starts at the awareness stage. Customer two is a camera enthusiast looking to buy a digital camera. Their journey may begin at the consideration stage, comparing different cameras.`,`Think about your own customers: what are their motivations and needs at each stage? What should your marketing objectives be to meet those needs?`],
 ['Promote your content',`Guide customers through the funnel by addressing their needs. By providing a great experience at each stage, you hope to convince them to convert, and ultimately retain them as loyal customers.`],
 ['Measure success',`Although the outcome for the two customers may be the same, their journeys differ. Understanding how motivations and needs differ helps you identify objectives at each stage. You can meet potential buyers where they are and encourage them to convert. These are the key points to consider when creating a digital marketing plan.`]
];
function video(){return header('Video','Developing a digital<br>marketing campaign','Meet your customers where they are—and give every stage of their journey a purpose.',2)+`<div class="video-wrap" id="video-player"><button class="video-placeholder" id="load-video" aria-label="Play Developing a digital marketing campaign"><span class="video-preview-text"><span>DIGITAL MARKETING STRATEGY</span><strong>From first impression<br>to loyal customer.</strong></span><span class="video-funnel" aria-hidden="true"><span></span><span></span><span></span><span></span></span><span class="play-button">${icon('play')}</span></button></div><div class="video-source"><span>Course video · YouTube</span><span>Captions available in the player</span></div><div class="video-tabs" role="tablist" aria-label="Video resources"><button role="tab" data-video-tab="overview" aria-selected="${videoTab==='overview'}" class="${videoTab==='overview'?'active':''}">Key takeaways</button><button role="tab" data-video-tab="transcript" aria-selected="${videoTab==='transcript'}" class="${videoTab==='transcript'?'active':''}">Read transcript</button><button role="tab" data-video-tab="notes" aria-selected="${videoTab==='notes'}" class="${videoTab==='notes'?'active':''}">My notes</button></div><div id="video-tab-content" role="tabpanel">${videoTabContent()}</div>`;}
function videoTabContent(){if(videoTab==='transcript')return `<p class="format-note" style="margin:0 0 23px">Organized from the course transcript for easier reading. Sections are not synchronized to playback.</p>${transcript.map(([heading,...paragraphs])=>`<section class="transcript-block"><h3>${heading}</h3>${paragraphs.map(p=>`<p>${p}</p>`).join('')}</section>`).join('')}`;if(videoTab==='notes')return `<div class="video-notes"><label for="video-note-input">What stands out to you?</label><textarea id="video-note-input" class="notes-textarea" placeholder="Write a thought, an example, or something to ask Jen…">${esc(videoNotes)}</textarea><p class="format-note">Your notes stay in this preview while the page is open.</p></div>`;return `<section class="article-section" id="video-takeaways"><h2>Four questions for a stronger campaign.</h2><ol class="numbered-insights"><li><span class="number">01</span><div><strong>What do you want to achieve?</strong><p>Set your objectives around the moments that influence customer decisions.</p></div></li><li><span class="number">02</span><div><strong>Who are you trying to reach?</strong><p>Understand their motivations, needs, and stage in the customer journey.</p></div></li><li><span class="number">03</span><div><strong>Where will your content work best?</strong><p>Choose channels that help people discover, consider, and buy from you.</p></div></li><li><span class="number">04</span><div><strong>How will you measure success?</strong><p>Connect your measures to your objectives at each stage of the journey.</p></div></li></ol><div class="takeaway">${icon('bulb')}<div><strong>Keep this in mind</strong><p>Two customers can reach the same destination through very different journeys.</p></div></div></section>`;}
function scenario(){return header('Scenario','Find the people<br>behind the audience.','Build a marketing persona that turns “our customers” into someone you understand.',3)+`<section class="scenario-brief" id="scenario-brief"><span>YOUR CHALLENGE</span><h2>You’re planning your next campaign.<br>Who needs to hear from you?</h2><p>Once your marketing objectives are clear, identify who your audience is and where they are active online. Use the examples below, then build a persona for your own business.</p></section><section class="article-section" id="persona-examples"><h2>Same product. Different people.</h2><p>A <button class="text-link" data-glossary="persona">marketing persona</button> is a semi-fictional representation of your ideal customer, grounded in customer data and market research. Consider these two people looking for a camera.</p><div class="persona-grid"><div class="persona-card"><div class="persona-head"><span class="persona-avatar">01</span><div><h3>The new hobbyist</h3><span>Customer 1</span><span class="stage-pill">Awareness stage</span></div></div><div class="persona-details"><dl><dt>MOTIVATION & NEEDS</dt><dd>Casually interested in photography. Looking for an entry-level digital camera.</dd><dt>HOW YOU CAN HELP</dt><dd>Explain the options and let them know you sell these products.</dd><dt>DIGITAL TOUCHPOINTS</dt><dd>Search results, photography hobby groups, and online reviews.</dd></dl></div></div><div class="persona-card"><div class="persona-head"><span class="persona-avatar">02</span><div><h3>The camera enthusiast</h3><span>Customer 2</span><span class="stage-pill">Consideration stage</span></div></div><div class="persona-details"><dl><dt>MOTIVATION & NEEDS</dt><dd>Very interested in photography. Comparing different digital cameras.</dd><dt>HOW YOU CAN HELP</dt><dd>Provide detailed camera comparisons to help them decide.</dd><dt>DIGITAL TOUCHPOINTS</dt><dd>Search engine results and influencer marketing.</dd></dl></div></div></div><details class="detail-accordion"><summary>What counts as a digital touchpoint?${icon('down')}</summary><div><p>Any interaction between your customer and your business across digital channels: social media, search engines, websites, or online reviews. Identifying where your audience is active helps you match content to their needs at the right stage.</p></div></details></section><section class="worksheet" id="persona-worksheet"><div class="worksheet-header"><h2>Sketch your own persona.</h2><span id="worksheet-count">0 of 4 fields</span></div><p>Use what you know about your customers. A useful starting point is better than a perfect description.</p>${[['demographic','Who are they?','Describe a relevant demographic or customer group.','For example: First-time camera buyers who…'],['needs','What motivates them?','Think about their needs and where they are in the buying journey.','They’re looking for…'],['offer','How can you help?','What information or experience would make their next decision easier?','We could help by…'],['touchpoints','Where can you reach them?','Name the digital channels they already use.','They spend time on…']].map(([key,label,help,placeholder])=>`<div class="field"><label for="field-${key}">${label}</label><p class="field-help">${help}</p><textarea id="field-${key}" data-field="${key}" placeholder="${placeholder}">${esc(worksheet[key])}</textarea></div>`).join('')}<div class="worksheet-actions"><button class="button primary" id="review-persona">Review my persona${icon('arrow')}</button><button class="button secondary" id="download-persona">Download note</button><small>Private to this local preview</small></div><div id="worksheet-feedback" aria-live="polite"></div></section><p class="format-note">Adapted from the course exercise. Review gives a simple completeness check, not AI evaluation.</p>`;}
const questions=[
 {title:'Which approach best supports this customer at the awareness stage?',context:'A beginner runner is looking for entry-level shoes to train for a first half-marathon. They need clear information about available options.',chips:['Beginner runner','Awareness stage','Search · Social · Reviews'],options:['Develop a tennis-shoe webpage and aim for a high bounce rate.','Identify influencers whose ads resonate with experienced runners.','Create easy-to-understand running-shoe fitting content for social media.','Create “Buy Now” PPC ads for expert-range running shoes.'],correct:2,explanation:'At the awareness stage, approachable educational content helps a beginner understand their options before being asked to buy.'},
 {title:'Which option leaves the influencer free to choose whether to review your product?',context:'You are considering earned-media promotion. Think about whether a review is independent or a required part of an agreement.',options:['Give a free sample with no obligation to publish a review.','Pay a commission for every sale from an affiliate link.','Provide a free trial and require approval of the post.','Offer a hotel stay in exchange for a review.'],correct:0,explanation:'The first option does not require promotional content in return. Incentives and material relationships may still require disclosure; do not assume that a free product makes promotion independent.'},
 {title:'Which result most directly indicates that your campaign is driving purchases?',context:'You are reviewing KPIs for a pay-per-click ad on social media.',options:['The ad has been seen by more than 30,000 customers.','People click the ad, then quickly close the page.','The ad has low engagement.','Customers move through the funnel and purchase the product.'],correct:3,explanation:'Purchases are directly connected to a conversion objective. Views can tell you about reach, but do not on their own show that people are buying.'},
 {title:'How can social listening help a campaign that is struggling to engage people?',context:'Your brand manager suggests understanding the conversation around your business and campaign.',options:['Use campaign and sentiment analysis to understand engagement and adjust the strategy.','Treat social listening as another name for all paid, earned, and owned media.','Only identify competitors’ influencers and persuade them to switch.','Assume it always creates surprising content that goes viral.'],correct:0,explanation:'Listening helps you understand what people are saying and feeling, so you can make more informed adjustments to your campaign.'}
];
function quiz(){return header('Quiz','Put your learning<br>into perspective.','Connect the ideas to real decisions. Take your time—you can review every answer before submitting.',13)+`<div id="quiz-body">${quizBody()}</div>`;}
function quizBody(){
 if(quizSubmitted){const score=answers.filter((a,i)=>a===questions[i].correct).length;return `<section class="quiz-intro"><div class="score-display">${score}<span> / 4</span></div><h2>${score===4?'You’re connecting the dots.':'Every check is a chance to learn.'}</h2><p>Here’s how your answers connect to the lesson. This is a practice result in the local prototype.</p><button class="button secondary" id="quiz-retry">Try again${icon('arrow')}</button></section>${questions.map((q,i)=>`<section class="result-item"><strong>Question ${i+1}<span class="result-status ${answers[i]===q.correct?'':'incorrect'}">${answers[i]===q.correct?'Correct':'Revisit'}</span></strong><p>${q.explanation}</p></section>`).join('')}`;}
 if(!quizStarted)return `<section class="quiz-intro"><h2>A quick check. A clearer picture.</h2><p>Explore four situations from digital marketing. Choose one answer for each, then review your choices before seeing the explanations.</p><div class="quiz-stats"><div><strong>4</strong><span>Questions</span></div><div><strong>5 min</strong><span>Suggested time</span></div><div><strong>No rush</strong><span>Untimed practice</span></div></div><button class="button primary" id="start-quiz">Start practice${icon('arrow')}</button></section><p class="format-note">Questions are adapted from this course for interaction testing. Results do not change your ATLAS account.</p>`;
 if(quizReview)return `<section class="article-section"><h2>Ready to check your understanding?</h2><p>Review your choices. You can go back to any question before submitting.</p>${questions.map((q,i)=>`<button class="quiz-review-row" data-review-question="${i}"><span>0${i+1}</span><div><strong>${q.title}</strong><small>${answers[i]===null?'Not answered':esc(q.options[answers[i]])}</small></div>${icon('chevron')}</button>`).join('')}<div class="quiz-bottom" style="margin-top:24px"><button class="button secondary" id="review-back">${icon('back')}Back</button><button class="button primary" id="submit-quiz" ${answers.some(a=>a===null)?'disabled':''}>Submit practice answers${icon('check')}</button></div></section>`;
 const q=questions[quizIndex];return `<div class="quiz-nav" aria-label="Question navigation">${questions.map((_,i)=>`<button data-question="${i}" class="${i===quizIndex?'current':''} ${answers[i]!==null?'answered':''}" aria-label="Question ${i+1}${answers[i]!==null?', answered':''}" ${i===quizIndex?'aria-current="step"':''}>${i+1}</button>`).join('')}<span>${answers.filter(a=>a!==null).length} of 4 answered</span></div><section class="quiz-question"><h2>${q.title}</h2><div class="quiz-context"><strong>The situation</strong><p>${q.context}</p>${q.chips?`<div class="context-chips">${q.chips.map(c=>`<span>${c}</span>`).join('')}</div>`:''}</div><div class="quiz-options" role="group" aria-label="Answer choices">${q.options.map((option,i)=>`<button class="quiz-option ${answers[quizIndex]===i?'selected':''}" data-answer="${i}" aria-pressed="${answers[quizIndex]===i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${option}</span></button>`).join('')}</div><div class="quiz-bottom"><button class="button secondary" id="quiz-back" ${quizIndex===0?'disabled':''}>${icon('back')}Previous</button><button class="button primary" id="quiz-next" ${answers[quizIndex]===null?'disabled':''}>${quizIndex===3?'Review answers':'Next question'}${icon('arrow')}</button></div></section>`;
}
function renderRail(){const toc=current==='article'?sections.map(s=>[s.id,s.label]):current==='video'?[['video-player','Watch the video'],['video-tab-content','Explore the takeaways']]:current==='scenario'?[['scenario-brief','Your challenge'],['persona-examples','Meet the two personas'],['persona-worksheet','Build your persona']]:[];$('#lesson-rail').innerHTML=`${toc.length?`<div class="rail-label">IN THIS LESSON</div><nav class="page-toc" aria-label="On this page">${toc.map(([id,label],i)=>`<button data-anchor="${id}" class="${i===0?'active':''}">${label}</button>`).join('')}</nav>`:`<div class="rail-label">TAKE YOUR TIME</div><p style="font-size:12px;line-height:1.9;color:#748da1;margin-bottom:25px">You can move between questions and change your answers before submitting.</p>`}<div class="rail-jen"><div class="jen-mark">${icon('spark')}</div><h3>A little help from Jen.</h3><p>${current==='scenario'?'Turn what you know about your customers into a useful starting point.':'Make sense of an idea, or see it from a different angle.'}</p><button data-jen="Explain this lesson simply">Explain this simply${icon('arrow')}</button><button data-jen="Give me an example">Give me an example${icon('arrow')}</button></div><div class="rail-note">${icon('notes')}<span>A thought worth keeping?<br>Use the notes icon above.</span></div>`;$$('[data-anchor]').forEach(button=>button.onclick=()=>{if(current==='article'&&readingMode==='guided'){guidedStep=sections.findIndex(s=>s.id===button.dataset.anchor);renderLesson();}else $('#'+button.dataset.anchor)?.scrollIntoView({behavior:motion()});});$$('[data-jen]').forEach(button=>button.onclick=()=>showJen(button.dataset.jen));}
function motion(){return matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth';}
function showLesson(id){if(!sampleOrder.includes(id))return;captureDrafts();current=id;closeSidebar();renderLesson();window.scrollTo({top:0,behavior:'instant'});$('#lesson').focus({preventScroll:true});}
function captureDrafts(){if($('#reflection-input'))reflection=$('#reflection-input').value;if($('#video-note-input'))videoNotes=$('#video-note-input').value;$$('[data-field]').forEach(f=>worksheet[f.dataset.field]=f.value);}
function renderLesson(){const index=outline.findIndex(l=>l[2]===current);$('#lesson-position').textContent=`Lesson ${index+1} of 13`;$('#lesson').innerHTML=({article,video,scenario,quiz}[current])();renderOutline();renderRail();$('#bookmark').classList.toggle('saved',bookmarks.has(current));$('#bookmark').setAttribute('aria-pressed',String(bookmarks.has(current)));$('#bookmark').setAttribute('aria-label',bookmarks.has(current)?'Remove saved lesson':'Save lesson');const sampleIndex=sampleOrder.indexOf(current);$('#previous-lesson').disabled=sampleIndex===0;$('#previous-title').textContent=sampleIndex>0?lessonNames[sampleOrder[sampleIndex-1]]:'First preview';$('#next-lesson').innerHTML=(current==='quiz'?'Finish practice':'Complete & continue')+icon(current==='quiz'?'check':'arrow');$('#next-lesson').disabled=current==='quiz'&&!quizSubmitted;$('#footer-hint').textContent=current==='quiz'&&!quizSubmitted?'Submit the practice quiz to finish.':'A little progress, every day.';bindLesson();requestAnimationFrame(updateReadingProgress);}
function bindLesson(){
 $$('[data-mode]').forEach(b=>b.onclick=()=>{captureDrafts();readingMode=b.dataset.mode;guidedStep=0;renderLesson();});
 if($('#guided-back'))$('#guided-back').onclick=()=>{captureDrafts();guidedStep--;renderLesson();$('.mode-switch-row').scrollIntoView({behavior:motion(),block:'start'});};
 if($('#guided-next'))$('#guided-next').onclick=()=>{captureDrafts();if(guidedStep===3)readingMode='read';else guidedStep++;renderLesson();$('.mode-switch-row').scrollIntoView({behavior:motion(),block:'start'});};
 $$('[data-glossary]').forEach(b=>b.onclick=()=>openDialog(b.dataset.glossary==='peo'?'Paid, earned and owned media':'Marketing persona',`<p>${b.dataset.glossary==='peo'?'A way to plan how your content reaches people: use channels you own, distribution you pay for, and publicity you earn from others. Each plays a different role in the same strategy.':'A semi-fictional representation of an ideal customer, based on real customer data and market research. It helps you connect their needs to the right content and channels.'}</p>`,'A CONCEPT, MADE CLEAR'));

 if($('#video-note-input'))$('#video-note-input').oninput=e=>videoNotes=e.target.value;

 if($('#review-persona'))$('#review-persona').onclick=()=>{captureDrafts();const missing=Object.entries(worksheet).filter(([,value])=>!value.trim());$('#worksheet-feedback').innerHTML=missing.length?`<div class="feedback-box"><strong>A little more detail will help.</strong>Fill in ${missing.length===1?'the remaining field':`the ${missing.length} remaining fields`} so your persona covers who they are, what they need, how you help, and where to reach them.</div>`:'<div class="feedback-box"><strong>Your first sketch covers all four areas.</strong>Now ask yourself:<ul><li>Which details come from real customer evidence?</li><li>Does your offer address the need you described?</li><li>Are these channels places this customer actually uses?</li></ul></div>';};

function refreshQuiz(){const focusWasInside=$('#quiz-body').contains(document.activeElement);$('#quiz-body').innerHTML=quizBody();bindQuiz();$('#next-lesson').disabled=!quizSubmitted;$('#footer-hint').textContent=quizSubmitted?'Your practice result is ready.':'Submit the practice quiz to finish.';if(focusWasInside){const title=$('#quiz-body h2');if(title){title.tabIndex=-1;title.focus({preventScroll:true});}}}
function bindQuiz(){if($('#start-quiz'))$('#start-quiz').onclick=()=>{quizStarted=true;refreshQuiz();};$$('[data-answer]').forEach(b=>b.onclick=()=>{answers[quizIndex]=Number(b.dataset.answer);$$('[data-answer]').forEach(item=>{item.classList.toggle('selected',item===b);item.setAttribute('aria-pressed',String(item===b));});$('#quiz-next').disabled=false;$('.quiz-nav>span').textContent=`${answers.filter(a=>a!==null).length} of 4 answered`;$('.quiz-nav button.current').classList.add('answered');});$$('[data-question]').forEach(b=>b.onclick=()=>{quizIndex=Number(b.dataset.question);refreshQuiz();});if($('#quiz-back'))$('#quiz-back').onclick=()=>{quizIndex--;refreshQuiz();};if($('#quiz-next'))$('#quiz-next').onclick=()=>{if(quizIndex===3)quizReview=true;else quizIndex++;refreshQuiz();};$$('[data-review-question]').forEach(b=>b.onclick=()=>{quizReview=false;quizIndex=Number(b.dataset.reviewQuestion);refreshQuiz();});if($('#review-back'))$('#review-back').onclick=()=>{quizReview=false;refreshQuiz();};if($('#submit-quiz'))$('#submit-quiz').onclick=()=>{if(answers.some(a=>a===null))return;quizSubmitted=true;refreshQuiz();$('#quiz-body').scrollIntoView({behavior:motion()});};if($('#quiz-retry'))$('#quiz-retry').onclick=()=>{answers=[null,null,null,null];quizIndex=0;quizReview=false;quizSubmitted=false;quizStarted=true;refreshQuiz();};}
function showJen(prompt=''){openDialog('A little clarity from Jen.',`<p class="dialog-subnote">Local preview · Sample guidance, not a live AI connection.</p><div class="chat-log" id="chat-log" role="log" aria-label="Conversation with Jen"><div class="chat-message">You’re exploring <strong>${lessonNames[current]}</strong>. What would help this idea click?</div></div><div class="jen-suggestions"><button data-chat-prompt="Explain this lesson simply">Explain simply</button><button data-chat-prompt="Give me an example">Give an example</button></div><form class="chat-form" id="chat-form"><input id="chat-input" aria-label="Ask Jen about this lesson" placeholder="Ask about this lesson…" maxlength="600" required><button class="button primary" aria-label="Send question">${icon('arrow')}</button></form>`,'LEARN WITH JEN');function respond(message){const log=$('#chat-log');const user=document.createElement('div');user.className='chat-message user';user.textContent=message;log.append(user);const answer=document.createElement('div');answer.className='chat-message';const example=/example/i.test(message);answer.textContent=current==='article'?(example?'Imagine a camera shop: its beginner’s guide on its website is owned media; a search ad promoting the guide is paid media; an independent blogger recommending it is earned media. The same idea reaches people in three ways.':'Owned media is a space you control. Paid media is reach you buy. Earned media is publicity other people choose to give you. A strong campaign can connect all three.'):current==='scenario'?'Start with one customer you understand. Describe what they need, what would help them decide, and where they already look for information. Use evidence where you have it and mark assumptions to check later.':current==='video'?'A campaign starts with four questions: What is your objective? Who is your audience? How will you reach them? How will you measure success? The answers should fit the customer’s stage in the journey.':'Focus on the customer’s needs and the objective in each situation. Choose an answer, then use the explanations after submission to reflect on your reasoning.';log.append(answer);log.scrollTop=log.scrollHeight;}if(prompt)respond(prompt);$('#chat-form').onsubmit=e=>{e.preventDefault();const input=$('#chat-input');const message=input.value.trim();if(message){respond(message);input.value='';}};$$('[data-chat-prompt]').forEach(b=>b.onclick=()=>respond(b.dataset.chatPrompt));}
$$('[data-action="help"]').forEach(b=>b.onclick=()=>showJen());$$('[data-action="notes"]').forEach(b=>b.onclick=()=>{openDialog('Keep the thought.','<p>Notes for your learning journey, kept while this preview is open.</p><textarea id="global-notes" class="notes-textarea" aria-label="Your course notes" placeholder="A thought, an example, a question…" style="margin-top:18px;min-height:180px">'+esc(notes)+'</textarea><button class="button primary" id="save-notes">Keep my notes'+icon('check')+'</button>','YOUR NOTES');$('#global-notes').oninput=e=>notes=e.target.value;$('#save-notes').onclick=()=>{notes=$('#global-notes').value;closeDialog();toast('Your notes are kept in this preview.');};});
$('#bookmark').onclick=()=>{if(bookmarks.has(current))bookmarks.delete(current);else bookmarks.add(current);const saved=bookmarks.has(current);$('#bookmark').classList.toggle('saved',saved);$('#bookmark').setAttribute('aria-pressed',String(saved));$('#bookmark').setAttribute('aria-label',saved?'Remove saved lesson':'Save lesson');toast(saved?'Lesson added to your saved list.':'Lesson removed from your saved list.');};
$('#font-size').onclick=()=>{const large=document.body.classList.toggle('large-text');$('#font-size').setAttribute('aria-pressed',String(large));$('#font-size').setAttribute('aria-label',large?'Use standard text size':'Increase text size');};
$('#previous-lesson').onclick=()=>{const i=sampleOrder.indexOf(current);if(i>0)showLesson(sampleOrder[i-1]);};
$('#next-lesson').onclick=()=>{if(current==='quiz'&&!quizSubmitted)return;completed.add(current);if(current==='quiz'){renderOutline();openDialog('You’ve finished the practice.','<p>You explored the four lesson formats: watch, apply, read, and check your understanding.</p><p class="dialog-subnote">Completion is only reflected in this local prototype. Your live ATLAS progress is unchanged.</p><div class="overview-preview-list">'+sampleOrder.map(id=>`<button data-revisit="${id}">${icon(id)}<span><strong>${lessonNames[id]}</strong><small>Revisit ${id} preview</small></span></button>`).join('')+'</div>','A STEP FORWARD');$$('[data-revisit]').forEach(b=>b.onclick=()=>{closeDialog();showLesson(b.dataset.revisit);});}else{const next=sampleOrder[sampleOrder.indexOf(current)+1];showLesson(next);toast('Lesson complete in this preview.');}};
function closeSidebar(){$('#course-sidebar').classList.remove('open');$('#sidebar-overlay').classList.remove('open');$('#mobile-menu').setAttribute('aria-expanded','false');}
$('#mobile-menu').onclick=()=>{const open=$('#course-sidebar').classList.toggle('open');$('#sidebar-overlay').classList.toggle('open',open);$('#mobile-menu').setAttribute('aria-expanded',String(open));};$('#sidebar-overlay').onclick=closeSidebar;$('#outline-toggle').onclick=()=>{const hidden=document.body.classList.toggle('focus-mode');$('#outline-toggle').setAttribute('aria-expanded',String(!hidden));};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSidebar();});
let scrollScheduled=false;function updateReadingProgress(){const lesson=$('#lesson');const top=lesson.offsetTop;const length=lesson.offsetHeight-innerHeight+150;const percent=length<=0?100:Math.min(100,Math.max(0,(scrollY-top+140)/length*100));$('#reading-progress-fill').style.width=percent+'%';const targets=$$('[data-anchor]');let active=targets[0];targets.forEach(b=>{const target=$('#'+b.dataset.anchor);if(target&&target.getBoundingClientRect().top<220)active=b;});targets.forEach(b=>b.classList.toggle('active',b===active));scrollScheduled=false;}window.addEventListener('scroll',()=>{if(!scrollScheduled){scrollScheduled=true;requestAnimationFrame(updateReadingProgress);}},{passive:true});
renderLesson();
</script><script>// A restrained refinement of the existing ATLAS lesson page.
const refBaseRender=renderLesson;
header=function(type,title,deck,number){if(type==='Scenario')title='Exercise 1: Finding your audience';if(type==='Quiz')title='Quiz';return `<header class="lesson-header"><div class="ref-heading-top"><span>Module 1 <span class="ref-dot">/</span> Digital Marketing Strategy</span><span class="ref-preview-label">Local design preview</span></div><h1 class="lesson-title">${icon(type.toLowerCase())}${title.replace(/<br>/g,' ')}</h1><div class="lesson-meta"><span class="type-pill">${type}</span><span class="duration">${icon('clock')}5 min</span><span class="ref-lesson-number">Lesson ${number} of 13</span><button id="ref-text-size" class="ref-text-size" aria-label="Change reading text size">Aa <span>Text size</span></button></div></header>`;};
article=function(){return header('Article','Promoting your content','',4)+`<div class="ref-article"><div class="ref-goal">${icon('target')}<div><strong>In this lesson</strong><p>Understand owned, paid and earned media, then consider how they work together in your business.</p></div></div><section class="ref-section"><h2>Three ways to reach your audience</h2><p>Given the range of digital content available, you can use the paid, earned and owned media (PEO) model to help you develop a digital marketing strategy that integrates paid, earned, shared, and owned approaches.</p><div class="ref-media-grid"><section class="ref-media"><div class="ref-media-icon">${icon('book')}</div><h3>Owned media</h3><span class="ref-media-caption">The channels you control</span><p>Owned media refers to the digital channels and content that are in your control. That means you have full control of the messages of your digital marketing campaign, and of the story you want to tell about your product or service.</p><div class="ref-media-examples"><strong>Examples</strong><ul><li>Your website</li><li>Brand social media pages</li><li>Email newsletters</li><li>Your mobile apps</li></ul></div></section><section class="ref-media"><div class="ref-media-icon">${icon('target')}</div><h3>Paid media</h3><span class="ref-media-caption">The reach you pay for</span><p>Paid media refers to external marketing efforts that you will have to pay for. In other words, you pay third parties to broadcast your messages to others. Just like owned media, you also have control of the content.</p><div class="ref-media-examples"><strong>Examples</strong><ul><li>Paid search ads</li><li>Display advertising</li><li>Shopping ads</li></ul></div></section><section class="ref-media"><div class="ref-media-icon">${icon('chat')}</div><h3>Earned media</h3><span class="ref-media-caption">The publicity others create</span><p>Earned media refers to any publicity a company receives from unpaid promotional efforts. These are often generated by opinion leaders and other credible third-party sources such as bloggers, journalists, and influencers.</p><div class="ref-media-examples"><strong>Example</strong><ul><li>Online reviews (electronic word of mouth) on review websites</li></ul></div></section></div></section><section class="ref-section"><h2>How they work together</h2><p>The trick is to combine paid, earned and owned media to build your brand so that you are regarded as an expert in your field, even by your competitors.</p><blockquote class="ref-quote"><p>Use <strong>owned media</strong> to set the tone,<br><strong>paid media</strong> to amplify the message,<br>and <strong>earned media</strong> to build relationships.</p></blockquote><p>By creating your own content, you can build relationships with key opinion leaders who may share your content with their followers.</p><div class="ref-example"><span>${icon('bulb')}</span><div><strong>An example in practice</strong><p>A camera shop publishes a beginner’s guide on its website, promotes it with a paid search ad, and receives an independent recommendation from a photography blogger.</p><small>Illustrative example added for this design preview.</small></div></div></section><section class="ref-section ref-reflection"><span class="ref-small-label">APPLY WHAT YOU’VE LEARNED</span><h2>Think about your own business</h2><p>Now that you know what paid, earned and owned media are, try to identify those that you are already using.</p><label for="reflection-input">Which approaches are working well? What could you build on or improve?</label><textarea id="reflection-input" placeholder="Write a few thoughts before joining the discussion…">${esc(reflection)}</textarea><div class="reflection-actions"><span>Private note · kept while this preview is open</span><button class="button secondary" id="save-reflection">Keep my note ${icon('check')}</button></div></section><section class="ref-community"><div class="ref-community-icon">${icon('chat')}</div><div><h3>Learn from each other</h3><p>One of the key features of <em>10,000 Women</em> is the power of the network created between like-minded individuals. To make the most of this network, share your experiences, discuss the topics presented, and support other participants in identifying their own opportunities.</p><p>Share which paid, earned and owned media you already use in your business. Read other participants’ posts, discuss what is working well, and consider how you could improve your use of the PEO model. Take time to comment on the posts you find interesting.</p><button id="open-discussion" class="ref-link">Open course discussion ${icon('arrow')}</button></div></section></div>`;};
renderLesson=function(){refBaseRender();const articleEl=$('#lesson'),content=document.createElement('div');content.className='ref-content';[...articleEl.children].filter(el=>!el.classList.contains('lesson-header')).forEach(el=>content.append(el));articleEl.append(content);const learn=document.createElement('div');learn.className='ref-learn';learn.innerHTML=`<span>${icon('spark')} Review the key ideas in this lesson.</span><button class="button secondary" id="ref-learn-jen">${icon('spark')}Learn with Jen</button>`;articleEl.append(learn);$('#ref-learn-jen').onclick=refFlashcards;$('#ref-text-size').onclick=()=>{$('#font-size').click();$('#ref-text-size').setAttribute('aria-pressed',String(document.body.classList.contains('large-text')));};$('#ref-text-size').setAttribute('aria-pressed',String(document.body.classList.contains('large-text')));const index=outline.findIndex(l=>l[2]===current);$('#ref-position').textContent=`${index+1} / 13`;$('#ref-course-progress').style.width=`${completed.size/13*100}%`;$('#next-lesson').innerHTML=(current==='quiz'?'Finish practice':'Next')+icon('arrow');$('#previous-lesson').innerHTML=icon('back')+'<span>Previous</span>';$('#footer-hint').textContent=current==='quiz'&&!quizSubmitted?'Submit your practice answers to finish.':`${index+1} of 13 lessons · Module 1`;};
// The shared renderer expects this element even after we simplify the footer.
const refPrevious=document.createElement('span');refPrevious.id='previous-title';refPrevious.hidden=true;document.body.append(refPrevious);
function refCourse(){openDialog('Digital Marketing Strategy','<p class="dialog-subnote">Four interactive lesson previews. Your live course progress is unchanged.</p><div class="overview-preview-list">'+outline.map(([title,type,id])=>`<button ${id?`data-ref-open="${id}"`:'disabled'}>${icon(type.toLowerCase())}<span><strong>${esc(title)}</strong><small>${type} · 5 min${id?'':' · Preview unavailable'}</small></span></button>`).join('')+'</div>','COURSE CONTENT');$$('[data-ref-open]').forEach(b=>b.onclick=()=>{closeDialog();showLesson(b.dataset.refOpen);});}
function refDiscussion(){openDialog('Course discussion','<p>Share which paid, earned and owned channels are working for your business, then learn from other participants’ experiences.</p><p class="dialog-subnote">This local design preview does not connect to live discussions or post messages.</p>','DISCUSS THIS LESSON');}
function refFlashcards(){const examples={article:[['What is owned media?','Channels and content you control, such as your website, brand pages, newsletters, and apps.'],['How do the three media types work together?','Use owned media to set the tone, paid media to amplify the message, and earned media to build relationships.']],video:[['What are the four campaign questions?','What is your objective? Who is your audience? How will you promote your content? How will you measure success?']],scenario:[['What should a useful persona describe?','The customer, their needs and motivations, how you can help, and where they are active online.']],quiz:[['How should you approach each situation?','Connect the customer’s needs and the campaign objective to the choice that best fits them.']]};const cards=examples[current];openDialog('Review with Jen',`<p class="dialog-subnote">Sample flashcards for this local preview.</p><div class="ref-flashcards">${cards.map(([q,a])=>`<details><summary>${q}<span>Reveal answer</span></summary><p>${a}</p></details>`).join('')}</div>`,'LEARN WITH JEN');}
$('#ref-back').onclick=refCourse;$('#ref-outline').onclick=refCourse;$('#ref-discussion').onclick=refDiscussion;$('#ref-ask').onclick=()=>showJen();$('#ref-share').onclick=()=>{openDialog('Share this course','<p>Sharing would use the published ATLAS course link.</p><p class="dialog-subnote">This is a local design preview. No link has been sent or published.</p>','SHARE COURSE');};
// Preserve the working bookmark and note controls from the shared prototype.
$('#ref-bookmark-slot').append($('#bookmark'));$('#ref-notes-slot').append($('[data-action="notes"]'));renderLesson();
</script>
