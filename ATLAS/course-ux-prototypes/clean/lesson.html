  <p class="legacy single">Now that you have a general idea of the PEO Model, let's go into detail about how to use paid, owned and earned media in an integrated digital campaign. Let's begin with owned media. You may not be aware that you already have a number of digital tools at your disposal, including your own websites, your social media accounts and emails. Continuing our previous example with a digital camera, first and foremost, we need to tailor your content to the customer's needs, according to the customer journey stage. Then, we promote this personalized content on owned media channels that the customers will be most likely to use. Customer one is in the awareness stage. You'll need to provide them with information on various digital cameras and ensure that you're carrying the products that they will like. You know that one of the ways that you can reach customer one is via search engines. You know that customer one would search online for various digital camera options that could be suitable for them. Thus, your aim is to ensure that your website would pop up on their search results page. How can we achieve this? First, by understanding how individuals search. At the awareness stage, individuals are often in an abstract mindset. Like customer one, they are simply searching for more information. Thus, they tend to use more general and broad terms. In customer one's case, they are likely to use general and broad search terms or keywords such as 'digital camera'. Since they just want more information on the types of digital cameras available to them, an informational search result, like the following would likely catch their attention. In contrast, customer two is further down the customer journey. Customer two is likely to have a more concrete mindset. Since they are more informed on the cameras they like, customer two would also use more specific search terms or keywords, and perhaps mention specific brands and models. Customer two is in the consideration stage of the customer journey. Correspondingly, they use the keyword 'mid-range camera reviews' to look for reviews and comparisons between various mid-range cameras. Given that customer two is interested in comparisons between digital cameras, they are more likely to click on the following search result. How can we ensure that our website pops up in both customer one and customer two's search results page? To make our web pages appear on the top of the search results page, we need to ensure that the search term or keywords are incorporated into the content of our web pages. This process is called keyword mapping, assigning keywords to specific web pages based on your keyword research. You've learned just now that customer one uses the keyword 'digital cameras' in their search. Thus, create a category web page on digital cameras using this very keyword. This will ensure that your digital camera category page appears high on the results page when customers like customer one searches using keyword 'digital camera'. Similarly, you'll know that customer two is looking for mid-range camera reviews. To ensure that your web page would appear on customer two's search results page, you can create a sub-category page of mid-range cameras, incorporating customer two's keyword. By offering customer two the information they want, such as reviews and comparisons, your web page will appear when customer two is searching for such information. In summary, when creating a website for your brand, it is essential to develop different web pages to address the varying customer needs as they progress along the customer journey. As the customers tend to progress from abstract to a more concrete mindset, as they move along the customer journey, we can create more general web pages that gradually link to more specific ones. For example, we can create a general home page about digital cameras to address customers at the awareness stage of the customer journey, and increasingly specific product pages to address customers at the conversion stage. By mapping broad to specific keywords on these web pages, we make sure we address the varying needs of our target customers as they progress along the customer journey. This process is search engine optimization (SEO): the practice of making changes to web page content to improve its visibility in unpaid search engine results. It is one of the ways we can utilize owned media to meet our marketing needs. In short, we need to prioritize the quality and authority of our content. This can be done by: posting fresh content, for example, a press section or blog; connecting with your customer, by incorporating the keywords they use in your web pages; or, before publishing, asking yourself, how will this help my audience? What information can I offer that my audience can't get elsewhere? How can I make this content more consumable? By tailoring the content on your owned media to the target customers, and meeting their customer journey objectives, you can use owned media as part of a successful, integrated digital marketing campaign. Mantsha: My name is Mantsha Pheeha, I'm from South Africa, based in Johannesburg and I run a business called Talent Unleashed. So, at Talent Unleashed, we are content creators. Most of our content is delivered through books, through coaching and consulting services, and also through speaking engagements. So, that's what we do. We create the content and then deliver it mostly to corporates and organizations, but also to individuals. So, some of the successful owned media or social media platforms that I've had, I think one, the biggest one for me is the website, because it's a SEO-enabled as well, as people are searching just for generic topics, they are able to find my information there. So, I think that has been quite a breath of fresh air because it doesn't mean I have to be there to make every single sale and I think that has happened with the books and with the coaching as well. Well, the most important thing if you want to reach your customers, not just your audience, because I think in the short time that I've used social media I realized that you can have a big audience that won't necessarily translate into customers, into paying customers. You can get lots of likes, lots of comments, lots of engagement, but it may not necessarily turn out to be customers. Building your audience is important, and be patient when you're building your audience. Share information, share content, add value to your clients. And, what I've found is that they have this loyalty to use, such that the minute you put something that is for sale, they want to support you, not only engaging with them as a seller, but engaging with them as a member of the community. So, as slow as engaging may seem, engage with your audience, build your audience, be intentional about it, and then it seems sales become easier. I have not reached that place where the sales happen on their own. Like some of the big stars, when they land a book or they land a CD, it sells itself. I haven't yet reached there, but I can see that I'm building up towards there.</p>

    <p>You will now explore earned media and how this can be used in your digital marketing strategy.</p>
    <p>You will learn about different types of earned media, how to incentivize earned media effectively, the role that influencers can play and how to choose a suitable influencer to increase interest in your product and attract your product personas.</p>
    <p>What is earned media?</p>
    <p>Earned media refers to any publicity a company receives from unpaid promotional efforts. It is often generated by opinion leaders and other third party sources like journalists, bloggers, and influencers.</p>
    <p>Earned media can come in many forms, such as:</p><p>reviews left by previous customers on shopping platforms</p><p>detailed video reviews</p><p>social media posts on the product/service.</p>
    <p>How can you incentivize earned media?</p>
    <p>One of the most common forms of earned media is word-of-mouth (WOM) marketing which is any verbal, informal, person-to-person communication. Earned media is an important aspect of an integrated digital marketing campaign, as 91% of customers regularly read online reviews and 20%-50% of all purchasing decisions are driven by WOM marketing. However, it isn't easy to control what customers say about your brand, product or service.</p>
    <p>To solve the issue, you can incentivize WOM marketing. One of the ways of doing this is through influencer marketing. Influencer marketing means leveraging individuals who have influence over potential buyers and creating marketing activities around these individuals to drive a brand message to the larger market.</p>
    <p>In addition to monetary payment, there are many other ways of incentivizing influencers to provide favorable WOM. In the UK, payment can also be in-kind, including any type of incentive from gifts to free products and services such as hotel stays or free trips.</p>
    <p>How can influencers help?</p>
    <p>Marketers can have control over the content which influencers put out. This can include everything from the pre-approval of content, specific use of hashtags, timing and frequency of posts to specifying key themes and messages including images and styles. In short, you can incentivize influencers to amplify the messages you have generated in your owned and paid media.</p>
    <p>It is important to be transparent and get your chosen influencer to disclose these incentives accordingly. When they have received payment for the WOM and you have control, the post should be labelled as an “Advertisement" or "Ad”. However, if you didn’t have control over the content, the post should be labelled as a “Sponsorship”.</p>
    <p>Customers could respond negatively once they’ve learnt that the influencer was incentivized to provide a positive review. One way of mitigating this is to allow the influencers to provide a balanced review, containing both positive and negative aspects. Consumers also react positively to incentivized reviews if they believe that the influencers are driven by their inner desires and passions. It could be beneficial to pick influencers who are genuinely interested in the product or service that you are offering.</p>
    <p>How do you choose an influencer?</p>
    <p>When you are choosing an influencer, one of the things to consider is the number of followers they have. A 'nano-influencer' can have up to 1,000 followers while 'mega influencers' can have more than 1 million followers.</p>
    <p>While mega influencers are great at raising awareness of your brand/product/service, influencers with smaller followings can often establish a closer and more meaningful connection with their audience. Therefore, they are more likely to appear to be genuinely interested in a particular product, so their messages could be less affected by incentivization. This means that influencers with smaller followers could be deemed more credible and thus more useful at the later stages of the customer journey.</p>
    <p>As an example, let’s return to our marketing persona, Customer 2 (the camera enthusiast).</p>
    <p>As a camera enthusiast, Customer 2 'follows' an influencer who is a professional photographer online. Considering the role that influencers can play in the customer journey, it might be worthwhile to incentivize such influencers, especially if they are genuinely interested in your product and can provide detailed reviews. You could even offer discount codes for them to disseminate to help push customers like Customer 2 further along their customer journey and purchase your product.</p>
    <p>By making the most of earned marketing approaches such as WOM marketing and identifying appropriate influencers to attract customers, you can use earned media as part of a successful integrated digital marketing campaign.</p>

    <p>Another common form of earned media is viral marketing which is the process of getting customers to pass along a company’s marketing messages to friends, family, and colleagues. This often comes in the form of videos, ads, and other marketing content that are so infectious that customers will seek it out or pass it along to friends.</p>
    <p>A common trait of all viral content is an emotional connection with their audience.<br>Viral ads often evoke surprise and other emotions, capturing the imagination of their target personas. Humor also works well, especially if it’s related to the product.</p>
    <p>You can also promote content sharing by embedding social media links in your content and connecting with your audience in the comments.</p>
    <p>Unsurprisingly, many marketers would love their content to go viral as it generates a great deal of awareness and reach at a very low cost. Furthermore, as the content is often shared by friends and family, it also lends the persuasive message some credibility.</p>

  <div class="legacy">
    <p>Now that you have learned how to use owned, paid, and earned media in a digital marketing campaign, you come to the final key consideration of your digital marketing campaign: how to measure its success.</p>
    <p>Owned media (Webpages)</p>
    <p>You have learned how to optimize your website to market your brand, product or service using owned media. Specifically, you explored mapping the relevant keywords to the webpages based on your various customer journey objectives. Now let’s go through the key performance indicators (KPIs) to measure its effectiveness.</p>
    <p>Owned media KPIs include the following:</p><p>average position</p><p>page views</p><p>bounce rate.</p>
    <p>Average position</p><p>Average position indicates how well your webpage is positioned on search engine results pages. Since your aim is to rank high on the results page, the smaller the number, the better.</p>
    <p>Page views</p><p>Page views displays the number of views you have had for a particular page on your website. You can also find out when and which events drove page views. These times and events can serve as potential touchpoints to reach out to more customers.</p>
    <p>Bounce rate</p><p>The bounce rate is the percentage of visitors who navigate away after viewing one page.</p>
    <p>A high bounce rate can mean:</p><p>your content does not match your target customer’s needs</p><p>the page has low quality content</p><p>visitors found the information they needed quickly and exited the page. For reference, an excellent bounce rate is between 26 to 40% while an average is between 41 and 55%.</p>
    <p>You could expect the bounce rates to differ across different type of webpages. When your webpage is awareness-driven and aimed at customers like Customer 1 (hobbyist), who is searching for more information, you will want to achieve an excellent bounce rate as you want Customer 1 to stay on your website viewing different pages to push them along the customer journey funnel.</p>
    <p>On the other hand, for Customer 2 (camera enthusiast), who is at the later stages of the customer journey, and debating between cameras, a conversion-driven webpage with a clear call-to-action like “Buy Now” and product comparisons could provide Customer 2 with all the information they need on one page, boosting the bounce rate. In other words, a higher bounce rate might not always be a bad sign. It depends on your customer journey objectives.</p>
    <p>Paid media (PPC and social media ads)</p>
    <p>Earlier, you learned about how to use paid media in your digital marketing campaign.</p>
    <p>Specifically, you explored how to use PPC ads to promote your marketing content. What are the KPIs you can use to gauge how effective these ads were?</p>
    <p>Paid media KPIs include the following:</p><p>impressions</p><p>clicks</p><p>click-through-rate</p><p>cost per click</p><p>cost</p><p>conversions</p><p>conversion ratio.</p>
    <p>Impressions</p><p>Impressions refer to the number of times your ad is displayed on the search engine results pages or social media platform. This KPI gives you an idea of the amount of traffic that the ad is receiving. Put differently, it gives you an idea on the amount of awareness you are generating.</p>
    <p>While impressions give you an idea if the ad is appearing on the search engine results page or social media platform, it does not mean that your target customer sees it. For that, you can rely on clicks.</p>
    <p>Clicks</p><p>Clicks are the number of times the PPC ad is clicked on. This KPI indicates the level of engagement the ad is receiving.</p>
    <p>Click-through-rate (CTR)</p><p>The click-through-rate is the number of impressions that attracted a click. Just like clicks, this KPI also gives you an idea about the level of engagement the ad is receiving. If the CTR is low, it suggests that the ad content does not really match the target customer’s needs and needs to be revised.</p>
    <p>Cost per click (CPC)</p><p>This is the average cost per click on the ad.</p>
    <p>Cost</p><p>This is the budget spent on the ad. Recall that you do not pay for PPC ads unless they are clicked on. Thus, the budget spent is the CPC x the number of clicks. For example, if the ad’s CPC is $0.83 and was clicked on 2,101 times, then its cost amounts to $0.83 x 2,101 = $1,742.</p>
    <p>Conversions</p><p>Conversions are the number of purchases or sign-ups. This KPI is a good indication of the quality of your traffic.</p>
    <p>Conversion ratio</p><p>This is the percentage of visitors who converted. For example, if 2,101 people clicked on your ad and 140 people purchased the product, then your conversion ratio is 6.66%.</p>
    <p>Which measures should you select?</p>
    <p>Ultimately, which KPIs you refer to should match your objectives. If your PPC ad was aimed at Customer 1 (hobbyist) and you just wanted to generate awareness of your product, then KPIs like impressions, clicks and CTR will serve as good indicators.</p>
    <p>If your ad was aimed at Customer 2 (camera enthusiast) and you intended to push him further down the funnel to convert and purchase your product, conversions and conversion-rates will serve as better indicators of your ad’s success.</p>
    <p>In this step you have learned about measuring the success of your digital marketing activities. If you would like to learn more about evaluating your marketing and sales activities, you can choose to complete one of the other 10,000 Women courses, Fundamentals of Sales and Marketing.</p>

    else if (state.mode === 'new') renderReview(m); else renderGateOld(m);

  }

  function renderReview(m) {
    var l = state.lesson, r = reviewState(l), qs = QUIZ[l], n = qs.length, done = isDone(l);

      h += '<div class="rv-head"><div class="rv-ic">' + BRAIN + '</div><div><h2>' + (done ? 'Review passed' : 'Lesson review') + '</h2><p>' + n + ' questions · about 1 minute · pass mark ' + PASS_MARK + '% (' + needed(n) + ' of ' + n + ' correct)</p></div></div>';
      h += done
        ? '<p class="rv-note">This lesson is complete. You can retake the review any time.</p><div class="rv-actions"><button class="btn" data-rv="start" type="button">Retake review</button><button class="btn primary" data-rv="continue" type="button">Next lesson ›</button></div>'
        : '<p class="rv-note">' + (isPending(l) ? 'You chose to do this review later. Complete it to mark the lesson done.' : 'Pass this short review to mark the lesson complete and continue. You can read the lesson again whenever you like.') + '</p><div class="rv-actions"><button class="btn primary" data-rv="start" type="button">Start review</button></div>';
    } else if (r.phase === 'loading') {
      h += '<div class="rv-head"><div class="rv-ic">' + BRAIN + '</div><div><h2>Preparing your questions…</h2><p>' + (r.slow ? 'This is taking longer than usual. You can keep waiting, or come back to it later.' : 'Based on what you just read') + '</p></div></div><div class="rv-skel" role="status" aria-live="polite"><i></i><i></i><i></i></div>' +

      h += '<div class="rv-head" role="alert"><div class="rv-ic err" aria-hidden="true">!</div><div><h2 id="rvErr" tabindex="-1">' + (off ? 'You are offline' : 'We could not prepare your questions') + '</h2><p>' +
        (off ? 'Reconnect to start the review. Your progress in this lesson is saved on this device.' : 'This is on our side, and your progress is safe. Try again, or do the review later.') + '</p></div></div>' +
        '<div class="rv-actions"><button class="btn primary" type="button" data-rv="start"' + (off && isOffline() ? ' disabled' : '') + '>Try again</button><button class="btn" type="button" data-rv="defer">Do the review later</button></div>';
    } else if (r.phase === 'active') {
      var q = qs[r.idx], dots = '';
      for (var i = 0; i < n; i++) {
        var c = i < r.idx || (i === r.idx && r.checked) ? (r.picks[i] === qs[i].a ? 'ok' : 'bad') : (i === r.idx ? 'cur' : '');
        dots += '<span class="' + c + '"></span>';
      }
      h += '<div class="rv-dots" aria-hidden="true">' + dots + '</div>';
      h += '<div class="rv-count">Question ' + (r.idx + 1) + ' of ' + n + '</div>';
      h += '<h2 class="rv-q" id="rvQ" tabindex="-1">' + esc(q.q) + '</h2>';
      h += '<div class="rv-opts" role="radiogroup" aria-labelledby="rvQ">';
      q.opts.forEach(function (o, i) {
        var cls = 'rv-opt';
        if (r.checked) cls += ' locked' + (i === q.a ? ' right' : (i === r.pick ? ' wrong' : ''));
        h += '<label class="' + cls + '"><input type="radio" name="rv" value="' + i + '"' + (r.pick === i ? ' checked' : '') + (r.checked ? ' disabled' : '') + '><span class="l">' + 'ABCD'.charAt(i) + '</span><span>' + esc(o) + '</span></label>';
      });
      h += '</div>';
      if (r.checked) {
        var ok = r.pick === q.a;
        h += '<div class="rv-fb ' + (ok ? 'ok' : 'no') + '" id="rvFb" tabindex="-1" role="status"><b>' + (ok ? 'Correct' : 'Not quite') + '</b>' + (ok ? '' : 'The answer is ' + 'ABCD'.charAt(q.a) + '. ') + esc(q.why) + '</div>';
        h += '<div class="rv-actions"><button class="btn primary" data-rv="next" type="button">' + (r.idx + 1 < n ? 'Next question' : 'See result') + '</button></div>';
      } else {
        h += '<div class="rv-actions"><button class="btn primary" data-rv="check" type="button"' + (r.pick === null ? ' disabled' : '') + '>Check answer</button><button class="btn" data-rv="later" type="button">Not now</button></div>';
      }
    } else if (r.phase === 'result') {
      var score = r.picks.filter(function (p, i) { return p === qs[i].a; }).length, pass = score >= needed(n);
      card.className = 'review' + (pass ? ' passed' : '');

        });

      }

    card.innerHTML = h; m.appendChild(card);
  }

  // Generating the questions can be slow or fail (or the learner can be offline). Each outcome has its own state.
  function startReview() {
    var l = state.lesson, r = reviewState(l);
    r.phase = 'loading'; r.idx = 0; r.picks = []; r.pick = null; r.checked = false; r.slow = false; r.error = null;
    clearTimeout(r.timer); clearTimeout(r.slowTimer);
    renderGate();
    var here = function () { return state.lesson === l && state.mode === 'new'; };
    var finish = function (phase, error) {
      if (r.phase !== 'loading') return;
      clearTimeout(r.slowTimer); r.slow = false; r.phase = phase; r.error = error || null;
      if (here()) { renderGate(); focusEl(phase === 'error' ? '#rvErr' : '#rvQ'); }
    };
    if (isOffline()) { r.timer = setTimeout(function () { finish('error', 'offline'); }, 600); return; }
    var failNow = hasSim('fail') || (hasSim('fail-once') && !r.failedOnce);
    r.slowTimer = setTimeout(function () { if (r.phase === 'loading') { r.slow = true; if (here()) renderGate(); } }, 3500);
    r.timer = setTimeout(function () {
      if (failNow) { r.failedOnce = true; finish('error', 'server'); } else finish('active');
    }, failNow ? 1800 : (hasSim('slow') ? 7000 : 1100));
  }

  // "Do the review later": the lesson is not marked done, but the learner is not stuck behind a broken review
  var KEY_PENDING = 'atlas-proto-pending';
  function pendingMap() { return load(KEY_PENDING, {}); }
  function isPending(i) { return !!pendingMap()[i]; }
  function setPending(i, on) { var m = pendingMap(); if (on) m[i] = true; else delete m[i]; save(KEY_PENDING, m); }

  function focusEl(sel) { var e = $(sel); if (e) e.focus({ preventScroll: false }); }

  $('#gateMount').addEventListener('change', function (e) {
    if (e.target.name === 'rv') {
      var r = reviewState(state.lesson); r.pick = +e.target.value;
      var c = $('[data-rv="check"]'); if (c) c.disabled = false;   // no re-render, keeps keyboard focus on the radio
    }
  });

  $('#gateMount').addEventListener('click', function (e) {
    var b = e.target.closest('[data-rv]'); if (b) { reviewAction(b.dataset.rv); return; }
    var g = e.target.closest('[data-gate]'); if (g) gateAction(g.dataset.gate);
  });

  function reviewAction(a) {
    var l = state.lesson, r = reviewState(l), qs = QUIZ[l];
    if (a === 'start' || a === 'retake') { startReview(); return; }
    if (a === 'continue') { advance(); return; }
    if (a === 'cancel') { clearTimeout(r.timer); clearTimeout(r.slowTimer); r.phase = 'idle'; r.slow = false; renderGate(); return; }
    if (a === 'defer') { setPending(l, true); r.phase = 'idle'; renderGate(); toast('Saved for later. The review will be waiting for you.'); advance(); return; }
    if (a === 'reread') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (a === 'later') { r.phase = 'idle'; r.idx = 0; r.picks = []; r.pick = null; r.checked = false; renderGate(); toast('No problem. Your answers were not saved.'); return; }
    if (a === 'check') {
      if (r.pick === null) return;
      r.picks[r.idx] = r.pick; r.checked = true; renderGate(); focusEl('#rvFb'); return;
    }
    if (a === 'next') {
      if (r.idx + 1 < qs.length) { r.idx++; r.pick = null; r.checked = false; renderGate(); focusEl('#rvQ'); return; }
      r.phase = 'result';
      var score = r.picks.filter(function (p, i) { return p === qs[i].a; }).length;
      if (score >= needed(qs.length)) markDone(l);
      renderGate(); focusEl('#rvRes');
    }
  }

  // ==========================================================================
  // CURRENT (production) GATE — kept so stakeholders can compare

    } else if (g.stage === 'questions') {

  function gateAction(a) {
    var l = state.lesson, g = gates[l], qs = QUIZ[l];
    if (!g) return;
    if (a === 'cancel') { delete gates[l]; renderGate(); return; }
    if (a === 'start') {
      g.stage = 'loading'; renderGate();
      setTimeout(function () { if (gates[l] === g && state.mode === 'old') { g.stage = 'questions'; renderGate(); } }, 1100);

  var QUIZ_PASS = 75; // percent (3 of 4). A proposal, not production behaviour.

      a: 0, why: 'Earned marketing is exposure you earn rather than pay for. With a free sample the influencer is free to decide whether to review it. A paid-per-sale link is paid media.' },

  function quizAction(a) {

  var DISC = { sort: 'new', kind: 'comment', replyTo: null, draft: '', failedOnce: false };
  var PEOPLE = { you: { name: 'You', ini: 'Y', c: '#0D719A' } };
  var AVC = ['#6B5BD2', '#C2410C', '#0F766E', '#B4236B', '#3F6FB5', '#8A5600'];
  function person(n, i) { return { name: n, ini: n.replace(/[^A-Z]/g, '').slice(0, 2) || n.charAt(0), c: AVC[i % AVC.length] }; }
  var DISC_SEED = {   // ago is in minutes
    0: [
      { id: 's0a', who: person('Dewi K.', 0), ago: 4320, kind: 'question', likes: 3, text: 'I only have a few sales notes from last year. Is that enough for the exercises?',
        replies: [{ id: 's0a1', who: person('Anita R.', 2), role: 'fac', ago: 4100, likes: 2, text: 'Yes, that is enough. The course will guide you on how to develop and record your strategies, so start with what you have.' }] },
      { id: 's0b', who: person('Rina P.', 1), ago: 1500, kind: 'question', likes: 2, text: 'Did anyone take Fundamentals of Sales and Marketing first? Was it worth it?',
        replies: [{ id: 's0b1', who: person('Maya T.', 3), ago: 900, likes: 1, text: 'I did. It helped me describe my customers clearly before starting this course.' }] }
    ],
    1: [
      { id: 's1a', who: person('Sari W.', 4), ago: 2880, kind: 'comment', likes: 4, text: 'The funnel finally clicked for me. My regulars are already at the loyalty stage, so I should focus on reaching new people at awareness.', replies: [] },
      { id: 's1b', who: person('Hana B.', 5), ago: 600, kind: 'question', likes: 1, text: 'Where do email newsletters fit: owned or earned media?',
        replies: [{ id: 's1b1', who: person('Anita R.', 2), role: 'fac', ago: 420, likes: 3, text: 'Owned. You control the list and the content. Earned would be someone else sharing or reviewing it.' }] }
    ],
    2: [
      { id: 's2a', who: person('Lia M.', 0), ago: 5760, kind: 'comment', likes: 3, text: 'Sharing my first persona: Weekend baker, 25 to 40, finds me on Instagram. Feedback welcome.', replies: [] },
      { id: 's2b', who: person('Nadia R.', 1), ago: 720, kind: 'question', likes: 2, text: 'Can one business have more than one persona?',
        replies: [{ id: 's2b1', who: person('Anita R.', 2), role: 'fac', ago: 600, likes: 2, text: 'Yes, and it helps. Different customers need different messages and different touchpoints.' }] }
    ],
    3: [
      { id: 's3a', who: person('Putri A.', 3), ago: 2160, kind: 'comment', likes: 5, text: 'Owned: my Instagram shop and a WhatsApp catalogue. Paid: nothing yet. Earned: Google reviews from regulars. Paid is my gap.',
        replies: [{ id: 's3a1', who: person('Anita R.', 2), role: 'fac', ago: 1900, likes: 2, text: 'Good start. Your reviews are earned media you can reuse on your own page. A small boosted post could amplify the best one.' }] },
      { id: 's3b', who: person('Grace O.', 4), ago: 480, kind: 'question', likes: 1, text: 'Is a post that a customer shares from my page owned or earned?', replies: [] }
    ],
    10: [
      { id: 's10a', who: person('Siti N.', 1), ago: 300, kind: 'comment', likes: 2, text: 'Filling in the plan showed me I do nothing at the loyalty stage. Starting a simple monthly email to past customers.', replies: [] }
    ],
    7: [
      { id: 's7a', who: person('Mei L.', 5), ago: 1440, kind: 'comment', likes: 3, text: 'My first thought for the task: anything funny must still look like our brand. A joke that confuses people about what we sell is a risk.',
        replies: [{ id: 's7a1', who: person('Anita R.', 2), role: 'fac', ago: 1200, likes: 2, text: 'Exactly the point about humour related to the product. Also plan who answers the comments if it does spread.' }] }
    ]
  };

  function discMine() { return load(KEY_DISC, []); }
  function discLiked() { return load(KEY_LIKES, {}); }
  function agoLabel(m) {
    if (m < 1) return 'Just now';
    if (m < 60) return Math.round(m) + ' min ago';
    if (m < 1440) return Math.round(m / 60) + ' h ago';
    var d = Math.round(m / 1440); return d + (d === 1 ? ' day ago' : ' days ago');
  }
  // Everything for the current lesson as top-level comments with their replies
  function discThread() {
    var mine = discMine().filter(function (x) { return x.lesson === state.lesson; }), liked = discLiked(), now = Date.now();
    function fromMine(x) { return { id: x.id, who: PEOPLE.you, mine: true, ago: Math.max(0, (now - x.ts) / 60000), kind: x.kind, likes: 0, text: x.text, pending: x.pending, failed: x.failed }; }
    function seeded(s) { return { id: s.id, who: s.who, role: s.role, ago: s.ago, kind: s.kind, likes: s.likes + (liked[s.id] ? 1 : 0), liked: !!liked[s.id], text: s.text }; }
    var top = (DISC_SEED[state.lesson] || []).map(function (s) { var t = seeded(s); t.replies = (s.replies || []).map(seeded); return t; });
    mine.filter(function (x) { return !x.parent; }).forEach(function (x) { var t = fromMine(x); t.replies = []; top.push(t); });
    mine.filter(function (x) { return x.parent; }).forEach(function (x) { top.forEach(function (t) { if (t.id === x.parent) t.replies.push(fromMine(x)); }); });
    top.forEach(function (t) { t.replies.sort(function (a, b) { return b.ago - a.ago; }); });   // oldest reply first
    top.sort(function (a, b) { return DISC.sort === 'top' ? ((b.likes - a.likes) || (a.ago - b.ago)) : (a.ago - b.ago); });
    return top;
  }
  function discCount() { return discThread().reduce(function (n, t) { return n + 1 + t.replies.length; }, 0); }
  function updateDiscUi() {
    if (!$('#discBadge')) return;
    var c = discCount();
    $('#discBadge').textContent = c || ''; $('#discCount').textContent = c || '';
  }

  var I_LIKE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11v9H4a1 1 0 01-1-1v-7a1 1 0 011-1zM7 11l4-8a2 2 0 012 2v4h5.5a2 2 0 012 2.3l-1 6.5A2 2 0 0117.5 19H7"/></svg>';
  function dcItem(c, parent) {
    var who = c.who, state_ = '';
    if (c.pending) state_ = '<p class="dc-state">Waiting for a connection. We will post it as soon as you are back online.</p>';
    else if (c.failed) state_ = '<p class="dc-state bad" role="alert">Could not post your comment. <button type="button" data-d="retry" data-id="' + c.id + '">Try again</button></p>';
    var acts = '';
    if (!c.pending && !c.failed) {
      acts = '<div class="dc-acts">' + (c.mine ? '' : '<button type="button" data-d="like" data-id="' + c.id + '" aria-pressed="' + !!c.liked + '">' + I_LIKE + 'Helpful' + (c.likes ? ' · ' + c.likes : '') + '</button>') +
        (parent ? '' : '<button type="button" data-d="reply" data-id="' + c.id + '">Reply</button>') +
        (c.mine ? '<button type="button" class="del" data-d="del" data-id="' + c.id + '">Delete</button>' : '') + '</div>';
    } else if (c.failed || c.pending) acts = '<div class="dc-acts"><button type="button" class="del" data-d="del" data-id="' + c.id + '">Delete</button></div>';
    return '<article class="dc' + (c.pending ? ' wait' : '') + '" data-id="' + c.id + '"><div class="dc-av" style="--c:' + who.c + '" aria-hidden="true">' + esc(who.ini) + '</div><div class="dc-main">' +
      '<div class="dc-meta"><b>' + esc(who.name) + '</b>' + (c.role === 'fac' ? '<span class="dc-tag fac">Facilitator</span>' : '') + (c.mine ? '<span class="dc-tag you">You</span>' : '') +
      (c.kind === 'question' ? '<span class="dc-tag q">Question</span>' : '') + '<span>' + (c.pending ? 'Not sent yet' : agoLabel(c.ago)) + '</span></div>' +
      '<p class="dc-text">' + esc(c.text) + '</p>' + state_ + acts +
      (parent ? '' : (c.replies.length ? '<div class="dc-replies">' + c.replies.map(function (r) { return dcItem(r, true); }).join('') + '</div>' : '') +
        (DISC.replyTo === c.id ? '<form class="dc-reply-form" data-reply="' + c.id + '"><textarea aria-label="Write a reply to ' + esc(who.name) + '" placeholder="Write a reply"></textarea><div class="row"><button class="btn" type="button" data-d="cancel">Cancel</button><button class="btn primary" type="submit">Reply</button></div></form>' : '')) +
      '</div></article>';
  }

  function renderDisc() {
    if (!$('#discView')) return;
    var allowed = jenAllowed(), body = $('#discBody'), th = allowed ? discThread() : [];
    $('#discForm').style.display = allowed ? '' : 'none'; $('#discFine').style.display = allowed ? '' : 'none';
    if (!allowed) {
      $('#discCtx').innerHTML = 'Discussion · <b>' + esc(COURSE[state.lesson].title) + '</b>';
      body.innerHTML = '<div class="jp-rest"><span class="jp-av" aria-hidden="true">💬</span><b>Discussion opens after you submit</b><span>Talking about answers while you are taking the quiz would give them away. You can join in as soon as you submit.</span></div>';
      return;
    }
    var total = th.reduce(function (n, t) { return n + 1 + t.replies.length; }, 0);
    $('#discCtx').innerHTML = 'Discussion · <b>' + esc(COURSE[state.lesson].title) + '</b>';
    body.innerHTML = '<div class="dc-sort" role="group" aria-label="Sort comments"><span>' + total + ' comment' + (total === 1 ? '' : 's') + ' ·</span><button type="button" data-dsort="new" aria-pressed="' + (DISC.sort === 'new') + '">Newest</button><button type="button" data-dsort="top" aria-pressed="' + (DISC.sort === 'top') + '">Most helpful</button></div>' +
      (th.length ? '<div class="dcs">' + th.map(function (t) { return dcItem(t, false); }).join('') + '</div>'
        : '<div class="nt-empty"><b>Start the conversation</b><span>Ask a question or share what you took from this lesson.</span></div>');
    var f = body.querySelector('.dc-reply-form textarea'); if (f) { f.value = DISC.draft; f.focus({ preventScroll: false }); }
    $$('[data-dkind]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.dkind === DISC.kind)); });
    $('#discInput').placeholder = DISC.kind === 'question' ? 'Ask the group a question' : 'Share a thought with the group';
  }

  function discPost(text, parent, kind) {
    text = (text || '').trim(); if (!text) return;
    var list = discMine(), it = { id: 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), lesson: state.lesson, parent: parent || null, text: text, kind: parent ? 'comment' : kind, ts: Date.now(), pending: isOffline(), failed: false };
    if (!it.pending && hasSim('comment') && !DISC.failedOnce) { DISC.failedOnce = true; it.failed = true; }   // demo: ?sim=comment makes the first post fail
    list.push(it); save(KEY_DISC, list); DISC.replyTo = null; updateDiscUi(); jenRefresh();
    if (it.pending) toast('Saved. We will post it when you are back online.');
  }
  function discFlush() {
    var list = discMine(), n = 0;
    list.forEach(function (x) { if (x.pending) { x.pending = false; x.ts = Date.now(); n++; } });
    if (n) { save(KEY_DISC, list); toast(n === 1 ? 'Your comment was posted' : n + ' comments were posted'); }
  }
  function discRetry(id) {
    var list = discMine(); list.forEach(function (x) { if (x.id === id) { x.failed = false; x.pending = isOffline(); x.ts = Date.now(); } });
    save(KEY_DISC, list); jenRefresh();
  }
  function discDelete(id) {
    save(KEY_DISC, discMine().filter(function (x) { return x.id !== id && x.parent !== id; }));
    updateDiscUi(); jenRefresh(); toast('Comment deleted');
  }

  $('#discBody').addEventListener('click', function (e) {
    var s = e.target.closest('[data-dsort]'); if (s) { DISC.sort = s.dataset.dsort; renderDisc(); return; }
    var b = e.target.closest('[data-d]'); if (!b) return;
    var id = b.dataset.id, a = b.dataset.d;
    if (a === 'like') { var m = discLiked(); if (m[id]) delete m[id]; else m[id] = true; save(KEY_LIKES, m); renderDisc(); }
    else if (a === 'reply') { DISC.replyTo = id; DISC.draft = ''; renderDisc(); }
    else if (a === 'cancel') { DISC.replyTo = null; DISC.draft = ''; renderDisc(); }
    else if (a === 'del') discDelete(id);
    else if (a === 'retry') discRetry(id);
  });
  $('#discBody').addEventListener('input', function (e) { if (e.target.closest('.dc-reply-form')) DISC.draft = e.target.value; });   // keeps a half-written reply if the list redraws
  $('#discBody').addEventListener('submit', function (e) {
    var f = e.target.closest('.dc-reply-form'); if (!f) return;
    e.preventDefault(); DISC.draft = ''; discPost(f.querySelector('textarea').value, f.dataset.reply);
  });
  $('#discBody').addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && DISC.replyTo) { e.stopPropagation(); DISC.replyTo = null; DISC.draft = ''; renderDisc(); }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.closest('.dc-reply-form')) { e.preventDefault(); e.target.closest('form').requestSubmit(); }
  });
  $('#discForm').addEventListener('submit', function (e) { e.preventDefault(); var i = $('#discInput'); var v = i.value; i.value = ''; i.style.height = ''; $('#discSend').disabled = true; discPost(v, null, DISC.kind); });
  $('#discInput').addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(120, this.scrollHeight) + 'px'; $('#discSend').disabled = !this.value.trim(); });
  $('#discInput').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#discForm').requestSubmit(); } });
  $('#discForm').addEventListener('click', function (e) { var k = e.target.closest('[data-dkind]'); if (k) { DISC.kind = k.dataset.dkind; renderDisc(); $('#discInput').focus(); } });
  $('#discRail').addEventListener('click', function () {
    if (state.mode === 'old') { toast('Not available in this preview'); return; }
    if (JEN.open && JEN.tab === 'disc') closeJen(); else openPanel('disc');
  });

  // ==========================================================================
  // SELECTED TEXT — Ask Jen, Highlight, Add note
  // ==========================================================================
  var selCache = null;
  function hideSel() { $('#selBar').classList.remove('show'); }
  function maybeSel() {
    var sel = window.getSelection(), txt = sel ? sel.toString().trim() : '';
    if (state.mode !== 'new' || state.lesson === QUIZ_IDX || !sel || !sel.rangeCount || sel.isCollapsed || txt.length < 3 || txt.length > 600) { hideSel(); return; }
    var range = sel.getRangeAt(0), c = range.commonAncestorContainer, el = c.nodeType === 1 ? c : c.parentElement;
    if (!el || !el.closest('#lessonBody') || el.closest(HL_EXCLUDE)) { hideSel(); return; }
    var blk = el.closest('.block'), r = range.getBoundingClientRect(), bar = $('#selBar');
    selCache = { text: txt, block: blk ? blk.id : '' };
    bar.style.left = '0px';                    // measure at a known position first, so a long bar cannot be measured while it is squeezed at the edge
    bar.classList.add('show');
    var w = bar.getBoundingClientRect().width, half = w / 2, margin = 8;
    bar.style.left = Math.min(window.innerWidth - half - margin, Math.max(half + margin, r.left + r.width / 2)) + 'px';
    bar.style.top = Math.max(70, r.top - 50) + 'px';
  }
  var selTimer;
  document.addEventListener('selectionchange', function () { clearTimeout(selTimer); selTimer = setTimeout(maybeSel, 180); });
  window.addEventListener('scroll', hideSel, { passive: true });
  $('#selBar').addEventListener('mousedown', function (e) { e.preventDefault(); });   // keep the selection while clicking
  $('#selBar').addEventListener('click', function (e) { var b = e.target.closest('[data-sel]'); if (b) selAct(b.dataset.sel); });
  function selAct(a) {
    var c = selCache; if (!c) return;
    if (a === 'ask') {
      hideSel(); window.getSelection().removeAllRanges(); openPanel('jen');
      if (JEN.open) { setPanelTab('jen'); jenSend('Explain: “' + shorten(c.text, 70) + '”', { html: jenExplain(c.text, c.block) }); }
    } else if (a === 'hl') hlCreate(false);
    else if (a === 'note') hlCreate(true);
  }
  document.addEventListener('keydown', function (e) {   // keyboard route for the toolbar: Alt+J, Alt+H, Alt+N
    if (!e.altKey || !$('#selBar').classList.contains('show')) return;
    var a = { KeyJ: 'ask', KeyH: 'hl', KeyN: 'note' }[e.code];
    if (a) { e.preventDefault(); selAct(a); }
  });

  // The Jen tab
  $('#jenForm').addEventListener('submit', function (e) { e.preventDefault(); var i = $('#jenInput'); var v = i.value; i.value = ''; i.style.height = ''; $('#jenSend').disabled = true; jenSend(v); });
  $('#jenInput').addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(120, this.scrollHeight) + 'px'; $('#jenSend').disabled = !this.value.trim(); });
  $('#jenInput').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#jenForm').requestSubmit(); } });
  $('#jenBody').addEventListener('click', function (e) {
    var r = e.target.closest('[data-jretry]'); if (r) { jenRetry(+r.dataset.jretry); return; }
    var c = e.target.closest('[data-jchip]'); if (!c) return;
    var label = c.textContent; jenSend(label, { id: c.dataset.jchip });
  });
  $('.jp-tabs').addEventListener('click', function (e) { var b = e.target.closest('[data-ptab]'); if (b) setPanelTab(b.dataset.ptab); });
  $('.jp-tabs').addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var i = PANEL_TABS.indexOf(JEN.tab) + (e.key === 'ArrowRight' ? 1 : -1), next = PANEL_TABS[(i + PANEL_TABS.length) % PANEL_TABS.length];
    setPanelTab(next); $('#tab' + { jen: 'Jen', notes: 'Notes', disc: 'Disc' }[next]).focus();
  });
  $('#jenClose').addEventListener('click', function () { closeJen(); });
  $('#jenScrim').addEventListener('click', function () { closeJen(); });
  $('#jenNew').addEventListener('click', function () { clearTimeout(JEN.timer); JEN.busy = false; delete JEN.chats[state.lesson]; renderJen(); });

  // ==========================================================================
  // PICK UP WHERE YOU LEFT OFF — remembers the section and how far into it the learner read
  // ==========================================================================
  var posIgnoreUntil = 0, posTimer;
  function posMap() { return load(KEY_POS, {}); }
  function currentPos() {
    var blocks = $$('#lessonBody .block'), line = 130;
    for (var i = 0; i < blocks.length; i++) {
      var r = blocks[i].getBoundingClientRect();
      if (r.bottom > line) return { block: blocks[i].id, frac: Math.max(0, Math.min(1, (line - r.top) / Math.max(1, r.height))) };
    }
    return null;
  }
  function savePos() {
    if (state.mode !== 'new' || state.lesson === QUIZ_IDX || Date.now() < posIgnoreUntil) return;
    var m = posMap(), maxY = document.documentElement.scrollHeight - window.innerHeight;
    if (window.scrollY < 300 || window.scrollY > maxY - 120) { if (m[state.lesson]) { delete m[state.lesson]; save(KEY_POS, m); } return; }   // back at the top, or finished reading
    var p = currentPos(); if (!p) return;
    m[state.lesson] = p; save(KEY_POS, m);
  }
  window.addEventListener('scroll', function () { clearTimeout(posTimer); posTimer = setTimeout(savePos, 300); }, { passive: true });
  function renderResume() {
    var old = $('#resumeBar'); if (old) old.remove();
    if (state.mode !== 'new' || state.lesson === QUIZ_IDX || isDone(state.lesson)) return;
    var p = posMap()[state.lesson], blk = p && document.getElementById(p.block);
    if (!blk) return;
    var bar = make('div', 'resume'); bar.id = 'resumeBar'; bar.setAttribute('role', 'status');
    bar.innerHTML = '<span class="ic" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span><span class="t"><b>Pick up where you left off</b><span>' + esc(secName(blk)) + '</span></span>' +
      '<button class="btn primary" type="button" data-resume="go">Continue</button><button class="rs-x" type="button" data-resume="drop" aria-label="Start from the top"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
    $('#lessonBody').insertBefore(bar, $('#lessonBody').firstChild);
    var y = blk.getBoundingClientRect().top + window.scrollY + p.frac * blk.offsetHeight - 130;
    if (y < 400) { bar.remove(); return; }   // too close to the top to be worth offering
    bar.dataset.y = String(Math.round(y));
  }
  $('#lessonBody').addEventListener('click', function (e) {
    var b = e.target.closest('[data-resume]'); if (!b) return;
    var bar = $('#resumeBar'); if (bar) bar.remove();   // removing it moves the page, so measure the target afterwards
    var p = posMap()[state.lesson], blk = p && document.getElementById(p.block);
    if (b.dataset.resume === 'go' && blk) {
      posIgnoreUntil = Date.now() + 1500;
      window.scrollTo({ top: blk.getBoundingClientRect().top + window.scrollY + p.frac * blk.offsetHeight - 130, behavior: 'smooth' });
    } else { var m = posMap(); delete m[state.lesson]; save(KEY_POS, m); }
  });

  // Connection banner: stays while offline, then confirms the return for a moment
  var netWasOff = false, netTimer;
  function updateNet() {
    var bar = $('#netBar'), off = isOffline();
    clearTimeout(netTimer);
    if (off) { bar.className = 'net-bar show off'; bar.innerHTML = '<b>You are offline.</b> <span>Your work is saved on this device. Reviews and Jen need a connection.</span>'; }
    else if (netWasOff) { bar.className = 'net-bar show on'; bar.innerHTML = '<b>You are back online.</b>'; netTimer = setTimeout(function () { bar.className = 'net-bar'; }, 3200); }
    else bar.className = 'net-bar';
    var changed = off !== netWasOff; netWasOff = off;
    if (changed && !off) discFlush();   // comments written offline are posted now
    if (changed) { jenRefresh(); var r = reviews[state.lesson]; if (r && r.phase === 'error' && state.mode === 'new') renderGate(); }   // refresh "Try again" now that the connection changed
  }
  window.addEventListener('online', updateNet); window.addEventListener('offline', updateNet);

  function notesOnRender() { posIgnoreUntil = Date.now() + 900; hlApply(); renderRail(); renderResume(); updateNet(); }
  function jenOnRender() { hideSel(); closeNoteCard(false); if (state.mode !== 'new') closeJen(true); else jenRefresh(); }

  // ---------- Reading progress + active section ----------
  function onScroll() {
    var doc = document.documentElement, max = doc.scrollHeight - window.innerHeight;
    $('#progressFill').style.width = (max > 0 ? Math.min(100, (window.scrollY / max) * 100) : 0) + '%';
    var current = null;
    $$('.ol-sections a').forEach(function (a) {
      var t = document.getElementById(a.dataset.target);
      if (t && t.getBoundingClientRect().top < window.innerHeight * 0.35) current = a.dataset.target;
    });
    $$('.ol-sections a').forEach(function (a) { a.classList.toggle('on', a.dataset.target === current); });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);

  // Deep links from the index page, e.g. ?lesson=13 or ?lesson=1&mode=old
  (function applyParams() {
    var q; try { q = new URLSearchParams(window.location.search); } catch (e) { return; }
    var l = parseInt(q.get('lesson'), 10) - 1;
    if (l >= 0 && l < COURSE.length && isBuilt(l)) state.lesson = l;
    if (q.get('mode') === 'old' || q.get('mode') === 'new') state.mode = q.get('mode');
  })();

  render();
})();
</script>
</body>
