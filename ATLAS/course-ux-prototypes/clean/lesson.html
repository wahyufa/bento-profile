<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATLAS Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Design tokens — taken from demo.atlaslearn.ai (Montserrat, navy header, teal primary)
   ========================================================================== */
:root {
  --navy: #31425D;
  --primary: #0D719A;
  --primary-ink: #0A5A7B;
  --primary-soft: #E6F2F7;
  --bg: #F6F7F9;
  --surface: #FFFFFF;
  --ink: #171A26;
  --muted: #5B6475;
  --line: #E1E5EB;
  --accent: #F5A623;
  --accent-ink: #8A5600;
  --accent-soft: #FEF4E1;
  --green: #1E8A5A;
  --green-soft: #E3F4EC;
  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 20px;
  --font: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  --topbar-h: 54px;
  --proto-h: 48px;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--topbar-h) + 24px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.7;
}
h1, h2, h3, h4, p, ul, ol { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ---------- Prototype controls (not part of the design) ---------- */
.proto {
  position: sticky; top: 0; z-index: 60; min-height: var(--proto-h);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
  padding: 6px 20px; background: #FFF8E6; border-bottom: 1px dashed var(--accent);
  font-size: 13px;
}
.proto b { color: var(--accent-ink); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); overflow: hidden; }
.seg button { border: 0; background: none; padding: 6px 14px; font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
/* 13 lesson buttons: scroll sideways on narrow screens instead of being cut off */
.seg[aria-label="Lesson"] { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg[aria-label="Lesson"] button { flex: none; padding: 6px 11px; }

/* ---------- App chrome (mirrors production) ---------- */
.topbar {
  position: sticky; top: var(--proto-h); z-index: 50; height: var(--topbar-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; background: var(--navy); color: #fff; font-weight: 600;
}
.topbar button { border: 0; background: none; color: #fff; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.progressbar { position: sticky; top: calc(var(--proto-h) + var(--topbar-h)); z-index: 49; height: 4px; background: var(--line); }
.progressbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .12s linear; }

.layout {
  display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 0;
  max-width: 1440px; margin: 0 auto; padding: 24px 16px 96px;
}
/* The lesson column is wide for visuals (cards, video, personas). Long text keeps a readable line length separately. */
.stage {
  display: grid; grid-template-columns: 280px minmax(0, 880px); justify-content: center; column-gap: 32px;
  transition: grid-template-columns .45s cubic-bezier(.4, 0, .2, 1), column-gap .45s cubic-bezier(.4, 0, .2, 1);
}
.stage.no-rail { grid-template-columns: minmax(0, 840px); }
/* Focus mode: the outline is hidden and the lesson gets the full width. */
/* The outline column shrinks to nothing while the panel fades and slides away, so the lesson glides wider. */
.stage.focus { grid-template-columns: 0px minmax(0, 980px); column-gap: 0; }
.stage.focus .outline { opacity: 0; transform: translateX(-28px); visibility: hidden; pointer-events: none; transition: opacity .2s ease, transform .45s cubic-bezier(.4, 0, .2, 1), visibility 0s linear .45s; }

/* Icon rail */
.iconrail { position: sticky; top: calc(var(--proto-h) + var(--topbar-h) + 28px); align-self: start; display: grid; gap: 10px; }
.iconrail button {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--primary); display: grid; place-items: center;
}
.iconrail button:hover { background: var(--primary-soft); }

/* ---------- Course outline (left panel on desktop, drawer on smaller screens) ---------- */
.outline {
  /* Fixed width so the text does not re-wrap while the column animates */
  width: 280px; justify-self: start;
  transition: opacity .3s ease .12s, transform .45s cubic-bezier(.4, 0, .2, 1), visibility 0s;
  position: sticky; top: calc(var(--proto-h) + var(--topbar-h) + 28px); align-self: start;
  max-height: calc(100vh - var(--proto-h) - var(--topbar-h) - 52px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 12px 14px; font-size: 13.5px;
}
.ol-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 0 6px; }
.outline h2 { font-size: 15px; font-weight: 700; line-height: 1.35; }
.ol-close { display: grid; place-items: center; border: 0; background: var(--bg); border-radius: 8px; width: 32px; height: 32px; font-size: 16px; flex: none; }
.ol-count { margin: 8px 6px 6px; font-size: 12.5px; color: var(--muted); }
.ol-bar { margin: 0 6px 12px; height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.ol-bar i { display: block; height: 100%; width: 0; background: var(--green); transition: width .3s; }
.ol-list { list-style: none; padding: 0; display: grid; gap: 2px; }
.ol-item > button {
  display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; border: 0; background: none;
  padding: 8px 8px; border-radius: 10px; line-height: 1.35;
}
.ol-item > button:hover { background: var(--bg); }
.ol-item.cur > button { background: var(--primary-soft); }
.ol-item.cur .ol-name { font-weight: 600; }
.ol-status { flex: none; width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
.ol-item.cur .ol-status { border-color: var(--primary); }
.ol-item.cur .ol-status::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.ol-item.done .ol-status { background: var(--green); border-color: var(--green); }
.ol-item.done .ol-status::after { content: "✓"; width: auto; height: auto; background: none; }
.ol-text { min-width: 0; }
.ol-name { display: block; }
.ol-text small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
.ol-sections { list-style: none; margin: 2px 0 8px 29px; padding: 0 0 0 0; border-left: 2px solid var(--line); }
.ol-sections a { display: block; padding: 4px 10px; margin-left: -2px; border-left: 2px solid transparent; color: var(--muted); text-decoration: none; font-size: 12.5px; line-height: 1.4; }
.ol-sections a:hover { color: var(--ink); }
.ol-sections a.on { color: var(--primary-ink); font-weight: 600; border-left-color: var(--primary); }
body[data-mode="new"] .topbar .outline-btn { display: inline-flex; }
.topbar .outline-btn { display: none; border: 0; background: rgba(255,255,255,.12); color: #fff; border-radius: 10px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; align-items: center; gap: 8px; }
.scrim { display: none; }

/* ---------- Lesson shell ---------- */
.lesson-card { background: var(--surface); border-radius: var(--radius-lg); box-shadow: 0 1px 2px rgba(23,26,38,.04); padding: 32px 36px 40px; }
.crumb { font-size: 12.5px; color: var(--muted); }
.lesson-title { display: flex; align-items: center; gap: 12px; font-size: clamp(26px, 3.4vw, 32px); font-weight: 700; line-height: 1.2; margin: 6px 0 12px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; font-weight: 600; font-size: 12.5px; color: var(--ink); }
.lesson-body { margin-top: 28px; padding-top: 28px; border-top: 1px solid var(--line); }
.lesson-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
  padding: 11px 22px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 8px;
}
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.jen {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 36px; padding: 8px 16px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font-size: 14px;
}

/* ==========================================================================
   BLOCKS
   ========================================================================== */
.block { margin: 0 0 44px; }
.block:last-child { margin-bottom: 0; }
.block h2.block-title { font-size: 22px; font-weight: 700; line-height: 1.3; margin-bottom: 14px; }
.block h3 { font-size: 17px; font-weight: 700; line-height: 1.35; margin-bottom: 6px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--primary-ink); margin-bottom: 6px; }
.lead { font-size: 18px; line-height: 1.7; }
.lead, .block > p, .prose p { max-width: 62ch; }   /* Montserrat is wide: 62ch is about 75 characters per line */
.prose p + p { margin-top: 14px; }
.muted { color: var(--muted); }

/* Callout */
.callout { display: flex; gap: 14px; padding: 18px 20px; border-radius: var(--radius); background: var(--primary-soft); border-left: 5px solid var(--primary); }
.callout.note { background: var(--accent-soft); border-left-color: var(--accent); }
.callout.good { background: var(--green-soft); border-left-color: var(--green); }
.callout .ic { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: #fff; font-weight: 700; font-size: 15px; }
.callout.note .ic { background: var(--accent-ink); }
.callout.good .ic { background: var(--green); }
.callout strong { display: block; font-weight: 700; margin-bottom: 2px; }
.callout p { font-size: 15px; line-height: 1.65; }
.callout a, .link { color: var(--primary-ink); font-weight: 600; }

/* Card grid */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.card p { font-size: 14.5px; line-height: 1.6; color: var(--muted); }
.card .badge { width: 42px; height: 42px; border-radius: 12px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; margin-bottom: 12px; }
.card .num { width: 34px; height: 34px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; margin-bottom: 12px; }
.card.accent-top { border-top: 4px solid var(--primary); }

/* Checklist */
/* Preparation: one action card (with its reassurance) and one optional link, same border, radius and 14px gap */
.prep { display: grid; gap: 14px; }
.prep-card, .prep-link { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.prep-card { overflow: hidden; transition: border-color .2s, box-shadow .2s; }
.prep-card:has(input:checked) { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.prep-check { display: flex; gap: 16px; align-items: flex-start; padding: 20px 22px; cursor: pointer; }
.prep-check input { position: absolute; opacity: 0; pointer-events: none; }
.prep-check .box { flex: none; width: 26px; height: 26px; margin-top: 1px; border-radius: 8px; border: 2px solid #B9C2D0; background: var(--surface); color: #fff; display: grid; place-items: center; font-size: 15px; font-weight: 700; transition: background .15s, border-color .15s; }
.prep-check .box::after { content: "✓"; transform: scale(0); transition: transform .15s; }
.prep-check input:checked + .box { background: var(--primary); border-color: var(--primary); }
.prep-check input:checked + .box::after { transform: scale(1); }
.prep-check input:focus-visible + .box { outline: 3px solid var(--primary); outline-offset: 2px; }
.prep-check .txt b { display: block; font-size: 17px; line-height: 1.4; }
.prep-check .txt span { display: block; color: var(--muted); font-size: 14.5px; line-height: 1.6; margin-top: 4px; }
/* The icon sits in the checkbox column (26px) and the text lines up with the label above it */
.prep-ease { display: flex; gap: 16px; align-items: flex-start; margin: 0; padding: 14px 22px 16px; background: var(--primary-soft); font-size: 14.5px; line-height: 1.6; }
.prep-ease svg { flex: none; margin: 3px 4px 0; color: var(--primary); }
.prep-ease b { font-weight: 600; }
.prep-link { display: flex; gap: 16px; align-items: center; padding: 18px 22px; text-decoration: none; color: inherit; transition: border-color .15s, box-shadow .15s; width: 100%; font: inherit; text-align: left; cursor: pointer; }
.prep-link:hover { border-color: var(--primary); box-shadow: 0 6px 18px rgba(23,26,38,.08); }
.prep-link .ic { flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; }
.prep-link .t { flex: 1; min-width: 0; }
.prep-link small { display: block; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); }
.prep-link b { display: block; font-size: 16px; line-height: 1.4; }
.prep-link .t > span { display: block; color: var(--muted); font-size: 14.5px; line-height: 1.6; margin-top: 2px; }
.prep-link .go { flex: none; color: var(--primary); transition: transform .15s; }
.prep-link:hover .go { transform: translateX(3px); }

/* Community / feature panel */
.panel { background: var(--navy); color: #fff; border-radius: var(--radius-lg); padding: 28px; display: grid; gap: 18px; }
.panel h2 { color: #fff; font-size: 22px; line-height: 1.3; }
.panel ul { list-style: none; padding: 0; display: grid; gap: 10px; }
.panel li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.55; }
.panel li::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: 8px; border-radius: 50%; background: var(--accent); }
.panel .fine { font-size: 13px; color: rgba(255,255,255,.8); }
.panel .btn { background: #fff; color: var(--navy); border-color: #fff; justify-self: start; }

/* Video */
.video { position: relative; border-radius: var(--radius); overflow: hidden; aspect-ratio: 16/9; background: #0f1724; display: grid; place-items: center; }
.video svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.play { position: relative; width: 76px; height: 76px; border-radius: 50%; border: 0; background: #fff; color: var(--primary); display: grid; place-items: center; box-shadow: 0 10px 28px rgba(0,0,0,.35); }
.video .vmeta { position: absolute; left: 18px; bottom: 14px; right: 18px; color: #fff; font-size: 14px; display: flex; justify-content: space-between; gap: 10px; }
.video .vmeta b { font-weight: 600; }
.chips-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; font-size: 13.5px; font-weight: 500; }
.chip.solid { background: var(--primary-soft); border-color: transparent; color: var(--primary-ink); font-weight: 600; }

/* Transcript */
details.disclosure { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
details.disclosure summary { cursor: pointer; padding: 16px 20px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
details.disclosure summary::-webkit-details-marker { display: none; }
details.disclosure summary::after { content: "+"; font-size: 22px; line-height: 1; color: var(--primary); }
details.disclosure[open] summary::after { content: "–"; }
details.disclosure .inner { padding: 0 20px 20px; font-size: 15px; line-height: 1.75; color: var(--muted); }
details.disclosure .inner p + p { margin-top: 12px; }
details.disclosure .inner h4 { color: var(--ink); font-size: 14px; margin: 18px 0 4px; }

/* Funnel */
.funnel-wrap { display: grid; gap: 18px; }
.who { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
.funnel { display: grid; gap: 6px; justify-items: center; }
.stage-btn {
  --w: 100%; width: var(--w); border: 2px solid transparent; border-radius: 12px; background: var(--primary-soft); color: var(--ink);
  padding: 12px 16px; text-align: center; font-weight: 600; font-size: 15px; position: relative; transition: background .15s, border-color .15s;
}
.stage-btn:hover { border-color: var(--primary); }
.stage-btn[aria-pressed="true"] { background: var(--primary); color: #fff; }
.stage-btn .start { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 11.5px; font-weight: 600; background: var(--accent); color: #3b2600; border-radius: 999px; padding: 1px 10px; display: none; }
.stage-btn.is-start .start { display: inline-block; }
.stage-detail { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 20px; font-size: 15px; min-height: 84px; }
.stage-detail b { display: block; font-size: 16px; margin-bottom: 2px; }

/* Stepper */
.stepper { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; counter-reset: s; }
.stepper li { position: relative; padding: 38px 8px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--muted); counter-increment: s; }
.stepper li::before {
  content: counter(s); position: absolute; top: 0; left: 0; width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--surface); border: 2px solid var(--line); color: var(--muted); z-index: 1;
}
.stepper li::after { content: ""; position: absolute; top: 13px; left: 30px; right: 4px; height: 2px; background: var(--line); }
.stepper li:last-child::after { display: none; }
.stepper li.done::before { content: "✓"; background: var(--green); border-color: var(--green); color: #fff; }
.stepper li.done::after { background: var(--green); }
.stepper li.now { color: var(--ink); font-weight: 600; }
.stepper li.now::before { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 0 0 4px var(--primary-soft); }
.stepper .here { display: inline-block; margin-top: 4px; font-size: 11.5px; font-weight: 600; color: var(--primary-ink); background: var(--primary-soft); border-radius: 999px; padding: 0 8px; }

/* Two-column definition */
.define { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.define .box { border-radius: var(--radius); padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); }
.define .box.hl { background: var(--primary-soft); border-color: transparent; }
.ticks { list-style: none; padding: 0; display: grid; gap: 8px; margin-top: 8px; }
.ticks li { display: flex; gap: 10px; font-size: 15px; line-height: 1.5; }
.ticks li::before { content: "✓"; color: var(--green); font-weight: 700; flex: none; }

/* Persona */
.persona { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.persona header { padding: 16px 20px; background: var(--primary-soft); display: flex; align-items: center; gap: 12px; }
.persona header .av { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
.persona header small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.persona header b { font-size: 16px; line-height: 1.3; }
.persona dl { margin: 0; padding: 6px 20px 16px; display: grid; gap: 12px; }
.persona dt { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
.persona dd { margin: 2px 0 0; font-size: 14.5px; line-height: 1.55; }
.persona dd ul { padding-left: 18px; }
.persona .chips-row { margin-top: 4px; }

/* Task / exercise */
.task { border: 2px solid var(--primary); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; }
.task-head { background: var(--primary); color: #fff; padding: 16px 22px; display: flex; gap: 12px; align-items: center; }
.task-head b { font-size: 17px; }
.task-head small { display: block; opacity: .9; font-size: 13px; line-height: 1.4; }
.task form { padding: 20px 22px 22px; display: grid; gap: 16px; }
.field label { display: block; font-weight: 600; font-size: 14.5px; margin-bottom: 2px; }
.field small { display: block; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.field input, .field textarea {
  width: 100%; font: inherit; font-size: 15px; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink);
}
.field textarea { min-height: 84px; resize: vertical; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px var(--primary-soft); }
.task-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }

/* Flashcards */
.fc-meta { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--muted); margin-bottom: 10px; }
.fc-card { display: grid; align-content: center; justify-items: center; gap: 8px; width: 100%; min-height: 190px; padding: 26px 28px; border: 2px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); text-align: center; cursor: pointer; font: inherit; color: inherit; transition: background .2s, border-color .2s; }
.fc-card:hover { border-color: var(--primary); }
.fc-card small { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); }
.fc-card b { font-size: 19px; line-height: 1.45; font-weight: 600; }
.fc-card .fc-hint { font-size: 13px; color: var(--muted); }
.fc-card.flip { background: var(--primary-soft); border-color: var(--primary); }
.fc-card.flip b { font-weight: 500; font-size: 17px; }
.fc-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; min-height: 44px; align-items: center; }
.fc-done { text-align: center; padding: 26px 20px; border: 2px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
.fc-done b { display: block; font-size: 20px; margin-bottom: 4px; }
.fc-done .fc-actions { margin-top: 16px; }
@media (prefers-reduced-motion: reduce) { .fc-card { transition: none; } }

/* Resources */
.res { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.res li { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.res li > div { flex: 1; min-width: 0; }
.res b { display: block; font-size: 15.5px; line-height: 1.35; }
.res small { color: var(--muted); font-size: 13px; }

/* ---------- Blocks added for lessons 4 to 12 ---------- */
/* Flow: a short sequence where each step builds on the previous one */
.flow { list-style: none; padding: 0; margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; counter-reset: f; }
.flow li { position: relative; counter-increment: f; padding: 16px 18px 16px 56px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); font-size: 14.5px; line-height: 1.5; }
.flow li::before { content: counter(f); position: absolute; left: 16px; top: 15px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: #fff; font-weight: 700; font-size: 13px; }
.flow b { display: block; font-size: 15.5px; }
.flow span { color: var(--muted); }
/* Search term shown like a search box */
.kw { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 8px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
.kw::before { content: ""; width: 12px; height: 12px; border: 2px solid var(--muted); border-radius: 50%; }
/* Self-check list the learner can tick */
.checklist { list-style: none; padding: 0; display: grid; gap: 8px; }
.checklist label { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); font-size: 15px; line-height: 1.5; cursor: pointer; }
.checklist input { width: 20px; height: 20px; margin: 1px 0 0; flex: none; accent-color: var(--green); }
.checklist label:has(input:checked) { border-color: var(--green); background: var(--green-soft); }
/* Think first, then reveal */
.reveal summary { cursor: pointer; font-weight: 600; color: var(--primary-ink); }
.reveal[open] summary { margin-bottom: 6px; }
.reveal p { font-size: 14.5px; }
/* Task without a submit: answers save as the learner types */
.task .task-body { padding: 20px 22px 22px; display: grid; gap: 16px; }
/* Number tiles (KPIs) */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { padding: 14px 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
.stat b { display: block; font-size: 15px; }
.stat span { display: block; margin-top: 2px; font-size: 13.5px; line-height: 1.45; color: var(--muted); }
/* Calculator */
.calc { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); padding: 20px 22px; display: grid; gap: 16px; }
.calc-in { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.calc-in label { display: grid; gap: 6px; font-size: 13.5px; font-weight: 600; }
.calc-in input { font: inherit; font-weight: 500; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.calc-in input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px var(--primary-soft); }
.calc-out { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.calc-out div { padding: 14px 16px; border-radius: var(--radius); background: var(--primary-soft); }
.calc-out small { display: block; font-size: 12.5px; font-weight: 600; color: var(--primary-ink); }
.calc-out b { display: block; font-size: 22px; line-height: 1.3; }
.calc-out span { font-size: 13px; color: var(--muted); }
/* Journey plan: one card per funnel stage */
.plan { display: grid; gap: 12px; }
.plan-stage { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 16px 18px; display: grid; gap: 10px; }
.plan-stage h3 { margin: 0; display: flex; align-items: center; gap: 10px; }
.plan-stage h3 i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--navy); color: #fff; font-style: normal; font-size: 12.5px; }
.plan-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.plan-row label { display: grid; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.plan-row input { font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
.plan-row input:focus { outline: none; border-color: var(--primary); background: #fff; }
.plan-hint { font-size: 13px; color: var(--muted); }
@media (max-width: 640px) { .plan-row { grid-template-columns: 1fr; } }
/* Lesson 12 recap: one numbered consideration per section, with the learner's own notes */
.recap { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 16px; }
.recap > .num { width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 700; }
.recap .block-title { margin-bottom: 6px; }
.go-link { margin-top: 14px; padding: 0; border: 0; background: none; font: inherit; font-size: 14.5px; font-weight: 600; color: var(--primary-ink); cursor: pointer; }
.go-link:hover { text-decoration: underline; }
.mine { margin-top: 14px; padding: 14px 16px; border-radius: var(--radius); background: var(--primary-soft); font-size: 14.5px; }
.mine small { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--primary-ink); }
.mine dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; }
.mine dt { font-weight: 600; }
.mine dd { margin: 0; color: var(--ink); }
.mine.empty { background: var(--bg); color: var(--muted); }
@media (max-width: 640px) { .recap { grid-template-columns: minmax(0, 1fr); gap: 10px; } .mine dl { grid-template-columns: minmax(0, 1fr); } .mine dd { margin-bottom: 6px; } }
.res-ic { flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--primary-soft); color: var(--primary-ink); display: grid; place-items: center; font-weight: 700; font-size: 12px; letter-spacing: .04em; }
@media (max-width: 520px) { .res li { flex-wrap: wrap; } .res li .btn { width: 100%; } }
.saved { margin-top: 18px; display: grid; gap: 14px; }
.saved .persona header { background: var(--green-soft); }
.saved .persona header .av { background: var(--green); }
.empty { padding: 16px; text-align: center; color: var(--muted); font-size: 14px; border: 1.5px dashed var(--line); border-radius: var(--radius); }
.saved-note { font-size: 13px; color: var(--muted); }

/* ---------- Lesson review (enhanced) ---------- */
.btn.primary.locked { background: var(--navy); border-color: var(--navy); }
.btn.primary.locked:hover { background: #26344b; }
.review { margin-top: 20px; background: var(--surface); border-radius: var(--radius-lg); box-shadow: 0 1px 2px rgba(23,26,38,.04); border: 2px solid transparent; padding: 28px 36px 32px; scroll-margin-top: calc(var(--topbar-h) + 40px); }
.review.nudge { animation: nudge .9s ease-out; }
@keyframes nudge { 0% { box-shadow: 0 0 0 0 rgba(13,113,154,.6); border-color: var(--primary); } 100% { box-shadow: 0 0 0 16px rgba(13,113,154,0); border-color: transparent; } }
.rv-head { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.rv-ic { flex: none; width: 46px; height: 46px; border-radius: 14px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; }
.review.passed .rv-ic { background: var(--green-soft); color: var(--green); }
.review h2 { font-size: 20px; font-weight: 700; line-height: 1.3; }
.rv-head p { font-size: 14px; color: var(--muted); line-height: 1.5; }
.rv-note { font-size: 15px; margin-bottom: 18px; }
.rv-dots { display: flex; gap: 6px; margin-bottom: 14px; }
.rv-dots span { flex: 1; height: 6px; border-radius: 999px; background: var(--line); }
.rv-dots span.ok { background: var(--green); }
.rv-dots span.bad { background: #D9534F; }
.rv-dots span.cur { background: var(--primary); }
.rv-count { font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.rv-q { font-size: 19px; font-weight: 700; line-height: 1.4; margin: 6px 0 16px; outline: none; }
.rv-opts { display: grid; gap: 10px; }
.rv-opt { display: flex; gap: 12px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; font-size: 15px; line-height: 1.5; background: var(--surface); }
.rv-opt:hover { border-color: var(--primary); }
.rv-opt input { position: absolute; opacity: 0; pointer-events: none; }
.rv-opt .l { flex: none; width: 28px; height: 28px; border-radius: 8px; background: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.rv-opt:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); }
.rv-opt:has(input:focus-visible) { outline: 3px solid var(--primary); outline-offset: 2px; }
/* :has(input) matches the specificity of the :checked rule above, so these win by coming later. */
.rv-opt.right, .rv-opt.right:has(input) { border-color: var(--green); background: var(--green-soft); }
.rv-opt.right .l { background: var(--green); color: #fff; }
.rv-opt.wrong, .rv-opt.wrong:has(input) { border-color: #D9534F; background: #FDECEA; }
.rv-opt.wrong .l { background: #D9534F; color: #fff; }
.rv-opt.locked { cursor: default; }
.rv-fb { margin-top: 14px; border-radius: 14px; padding: 14px 16px; font-size: 15px; line-height: 1.6; outline: none; }
.rv-fb.ok { background: var(--green-soft); }
.rv-fb.no { background: var(--accent-soft); }
.rv-fb b { display: block; }
.rv-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
.rv-skel { display: grid; gap: 12px; margin: 6px 0 4px; }
.rv-skel i { display: block; height: 46px; border-radius: 14px; background: linear-gradient(90deg, var(--line), var(--bg), var(--line)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
.rv-skel i:first-child { height: 26px; width: 70%; }
@keyframes shimmer { to { background-position: -200% 0; } }
.rv-result { text-align: center; padding: 6px 0 4px; }
.rv-result .big { width: 72px; height: 72px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; font-size: 34px; font-weight: 700; color: #fff; background: var(--green); }
.rv-result.fail .big { background: var(--accent-ink); }
.rv-result h3 { font-size: 22px; margin-bottom: 4px; }
.rv-result p { color: var(--muted); font-size: 15px; }
.rv-missed { text-align: left; margin-top: 18px; display: grid; gap: 12px; }
.rv-missed article { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: 14.5px; line-height: 1.55; }
.rv-missed b { display: block; margin-bottom: 4px; }
.rv-result .rv-actions { justify-content: center; }

/* Current (production) gate, kept for comparison */
.gate-old { margin-top: 20px; background: var(--surface); border-radius: var(--radius-lg); padding: 22px 26px; }
.gate-old h2 { font-size: 16px; font-weight: 700; }
.gate-old .sub { font-size: 13px; color: var(--muted); }
.gate-old .q { font-weight: 500; margin: 16px 0 6px; font-size: 14.5px; }
.gate-old label { display: block; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin-bottom: 6px; font-size: 14px; cursor: pointer; }
.gate-old .row { display: flex; gap: 12px; align-items: center; margin-top: 14px; }
.gate-old .row .link { background: none; border: 0; }
.gate-old .msg { font-size: 14px; margin-top: 12px; }
.gate-old .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.5); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; margin-right: 8px; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 640px) { .review { padding: 22px 18px 26px; border-radius: var(--radius); } }

/* ---------- Course quiz (lesson 13) ---------- */
.qz-title { font-size: 22px; font-weight: 700; line-height: 1.3; outline: none; }
.qz-steps { display: flex; gap: 8px; margin-bottom: 16px; }
.qz-step { flex: 1; height: 40px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; }
.qz-step.ans { background: var(--primary-soft); border-color: transparent; color: var(--primary-ink); }
.qz-step.cur { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.qz-scn { background: var(--bg); border-radius: 14px; padding: 16px 18px; margin: 6px 0 20px; font-size: 15.5px; line-height: 1.65; }
.qz-scn .eyebrow { margin-bottom: 4px; }
.qz-scn .persona { margin-top: 14px; background: var(--surface); }
.qz-review { list-style: none; padding: 0; display: grid; gap: 10px; margin: 16px 0; }
.qz-review li { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.qz-review .n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.qz-review .t { flex: 1; min-width: 0; }
.qz-review .t b { display: block; font-size: 15px; line-height: 1.4; }
.qz-review .t span { font-size: 14px; color: var(--muted); line-height: 1.5; }
.qz-review .change { flex: none; border: 0; background: none; color: var(--primary-ink); font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.qz-ring { --p: 0; width: 108px; height: 108px; margin: 0 auto 14px; border-radius: 50%; background: conic-gradient(var(--green) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; }
.qz-ring.fail { background: conic-gradient(var(--accent-ink) calc(var(--p) * 1%), var(--line) 0); }
.qz-ring::after { content: attr(data-label); width: 86px; height: 86px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 26px; font-weight: 700; }
.qz-list { display: grid; gap: 12px; margin-top: 22px; text-align: left; }
.qz-bd { border: 1px solid var(--line); border-left-width: 5px; border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; font-size: 14.5px; line-height: 1.55; }
.qz-bd.ok { border-left-color: var(--green); }
.qz-bd.bad { border-left-color: #D9534F; }
.qz-bd h3 { font-size: 15px; font-weight: 700; display: flex; gap: 10px; line-height: 1.4; margin: 0; }
.qz-bd .mark { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; }
.qz-bd.ok .mark { background: var(--green); }
.qz-bd.bad .mark { background: #D9534F; }
.qz-bd .why { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.legacy-table { border-collapse: collapse; width: 100%; margin: 8px 0 12px; font-size: 15px; }
.legacy-table td { border: 1px solid #444; padding: 8px 12px; vertical-align: top; }
.legacy-table tr:first-child td { font-weight: 700; }

/* ---------- Optional first step: "Fundamentals of Sales and Marketing" ---------- */
.prep-link.on { border-color: var(--green); }
.prep-link.on .ic { background: var(--green-soft); color: var(--green); }
.prep-link small.ok { color: var(--green); }
.ol-item.fund .ol-status { border-style: dashed; border-color: var(--accent-ink); }
dialog.fund { border: 0; padding: 0; border-radius: var(--radius-lg); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; color: var(--ink); background: var(--surface); box-shadow: 0 24px 70px rgba(23,26,38,.35); animation: fundIn .28s cubic-bezier(.2, .8, .2, 1); }
dialog.fund::backdrop { background: rgba(23,26,38,.5); animation: fundFade .2s ease-out; }
@keyframes fundIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes fundFade { from { opacity: 0; } to { opacity: 1; } }
.fund-in { padding: 26px 28px 24px; display: grid; gap: 18px; }
.fund-top { display: flex; gap: 14px; align-items: flex-start; }
.fund-top .ic { flex: none; width: 48px; height: 48px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; }
.fund-top .tt { flex: 1; min-width: 0; }
.fund-top small { display: block; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); }
.fund-top h2 { font-size: 20px; line-height: 1.3; font-weight: 700; outline: none; }
.fund-top p { color: var(--muted); font-size: 14px; line-height: 1.5; }
.fund-x { flex: none; border: 0; background: none; width: 36px; height: 36px; border-radius: 10px; color: var(--muted); display: grid; place-items: center; margin: -4px -6px 0 0; }
.fund-x:hover { background: var(--bg); color: var(--ink); }
.fund-lead { font-size: 15px; line-height: 1.65; }
.fund-qs { display: grid; gap: 10px; }
.fund-row { display: flex; gap: 14px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; transition: border-color .15s; }
.fund-row:has(input:checked) { border-color: #B9D6E3; }
.fund-row > span { font-size: 14.5px; line-height: 1.5; }
.fund-opts { display: flex; gap: 6px; flex: none; }
.fund-opts label { cursor: pointer; }
.fund-opts input { position: absolute; opacity: 0; pointer-events: none; }
.fund-opts label span { display: block; border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 14px; font-size: 13.5px; font-weight: 600; transition: background .15s, border-color .15s, color .15s; }
.fund-opts label:hover span { border-color: var(--primary); }
.fund-opts input:checked + span { background: var(--navy); border-color: var(--navy); color: #fff; }
.fund-opts input:focus-visible + span { outline: 3px solid var(--primary); outline-offset: 2px; }
.fund-res { border-radius: 16px; padding: 16px 18px; background: var(--primary-soft); display: grid; gap: 6px; }
.fund-res.good { background: var(--green-soft); }
.fund-res h3 { font-size: 17px; line-height: 1.35; font-weight: 700; margin: 0; }
.fund-res p, .fund-res li { font-size: 14.5px; line-height: 1.6; }
.fund-res ul { margin: 2px 0 0; padding-left: 18px; }
.fund-done { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 4px 0 2px; }
.fund-done .big { width: 60px; height: 60px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 28px; font-weight: 700; animation: fundPop .4s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes fundPop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
.fund-done h3 { font-size: 19px; margin: 0; }
.fund-done p { color: var(--muted); font-size: 14.5px; line-height: 1.6; max-width: 40ch; }
.fund-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.fund-link { border: 0; background: none; color: var(--primary-ink); font-weight: 600; font-size: 14.5px; padding: 8px 6px; text-decoration: underline; text-underline-offset: 3px; margin-right: auto; }
@media (max-width: 640px) {
  dialog.fund { margin: auto 0 0; width: 100%; max-width: 100%; border-radius: 20px 20px 0 0; max-height: 90vh; }
  .fund-in { padding: 22px 18px 20px; }
  .fund-row { flex-direction: column; align-items: flex-start; }
  .fund-actions { flex-direction: column-reverse; align-items: stretch; }
  .fund-actions .btn { width: 100%; }
  .fund-link { margin: 0 auto; }
}

/* ---------- Community registration (10,000 Women) ---------- */
.panel #regArea { display: grid; gap: 14px; justify-items: start; }
.panel #regArea .fine { margin: 0; }
.reg-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.14); border-radius: 999px; padding: 5px 16px 5px 10px; font-weight: 600; font-size: 14.5px; }
.reg-badge i { width: 20px; height: 20px; border-radius: 50%; background: var(--green); display: grid; place-items: center; font-style: normal; font-size: 12px; }
.reg-links { display: flex; gap: 10px; flex-wrap: wrap; }
.reg-benefits { list-style: none; padding: 0; display: grid; gap: 10px; }
.reg-benefits li { display: flex; gap: 12px; font-size: 14.5px; line-height: 1.6; }

.reg-check { display: flex; gap: 14px; align-items: flex-start; cursor: pointer; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; transition: border-color .2s, box-shadow .2s; }
.reg-check:has(input:checked) { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.reg-check input { position: absolute; opacity: 0; pointer-events: none; }
.reg-check .box { flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 7px; border: 2px solid #B9C2D0; background: var(--surface); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 700; transition: background .15s, border-color .15s; }
.reg-check .box::after { content: "✓"; transform: scale(0); transition: transform .15s; }
.reg-check input:checked + .box { background: var(--primary); border-color: var(--primary); }

.reg-check input:focus-visible + .box { outline: 3px solid var(--primary); outline-offset: 2px; }
.reg-check b { display: block; font-size: 15px; line-height: 1.4; }

/* ---------- Discussion ---------- */
.jp-head .jp-tabs button { padding: 8px 11px; font-size: 13.5px; white-space: nowrap; }
.jp-head .jp-tabs { overflow-x: auto; scrollbar-width: none; }
.jp-form.dc-form { flex-direction: column; align-items: stretch; gap: 8px; }
.dc-kind { display: flex; gap: 6px; }
.dc-kind button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.dc-kind button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.dc-row { display: flex; gap: 8px; align-items: flex-end; }
.dc-row textarea { flex: 1; resize: none; max-height: 120px; border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 14px; font: inherit; font-size: 14.5px; line-height: 1.5; background: var(--bg); }
.dc-row textarea:focus { outline: none; border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 3px var(--primary-soft); }
.dc-sort { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.dc-sort button { border: 0; background: none; padding: 3px 10px; border-radius: 999px; font-weight: 600; font-size: 12.5px; color: var(--muted); }
.dc-sort button[aria-pressed="true"] { background: var(--primary-soft); color: var(--primary-ink); }
.dcs { list-style: none; padding: 0; margin: 0; display: grid; gap: 16px; }
.dc { display: flex; gap: 10px; align-items: flex-start; }
.dc-av { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--c, var(--primary)); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12.5px; }
.dc-main { flex: 1; min-width: 0; }
.dc-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 12.5px; color: var(--muted); }
.dc-meta b { color: var(--ink); font-size: 13.5px; }
.dc-tag { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 0 8px; line-height: 17px; }
.dc-tag.fac { background: var(--green-soft); color: var(--green); }
.dc-tag.q { background: var(--accent-soft); color: var(--accent-ink); }
.dc-tag.you { background: var(--primary-soft); color: var(--primary-ink); }
.dc-text { margin: 2px 0 0; font-size: 14.5px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.dc.wait .dc-text { color: var(--muted); }
.dc-state { margin: 4px 0 0; font-size: 12.5px; color: var(--accent-ink); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.dc-state.bad { color: #B3261E; }
.dc-state button { border: 0; background: none; padding: 0; color: var(--primary-ink); font-weight: 600; font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }
.dc-acts { display: flex; gap: 4px; margin: 4px 0 0 -6px; }
.dc-acts button { border: 0; background: none; border-radius: 8px; padding: 3px 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
.dc-acts button:hover { background: var(--bg); color: var(--ink); }
.dc-acts button[aria-pressed="true"] { color: var(--primary-ink); }
.dc-acts button[aria-pressed="true"] svg { fill: currentColor; }
.dc-acts .del:hover { color: #B3261E; }
.dc-replies { margin-top: 10px; display: grid; gap: 12px; padding-left: 12px; border-left: 2px solid var(--line); }
.dc-replies .dc-av { width: 28px; height: 28px; font-size: 11px; }
.dc-reply-form { margin-top: 10px; display: grid; gap: 8px; }
.dc-reply-form textarea { width: 100%; min-height: 64px; resize: vertical; border: 1.5px solid var(--line); border-radius: 12px; padding: 9px 12px; font: inherit; font-size: 14px; line-height: 1.5; background: var(--bg); }
.dc-reply-form textarea:focus { outline: none; border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 3px var(--primary-soft); }
.dc-reply-form .row { display: flex; gap: 8px; justify-content: flex-end; }
.dc-reply-form .btn { padding: 6px 16px; font-size: 13.5px; border-radius: 12px; }

/* ---------- Offline, slow and failed states ---------- */
.rv-ic.err { background: #FDECEA; color: #B3261E; font-weight: 700; font-size: 22px; }
.net-bar { position: fixed; z-index: 57; left: 50%; transform: translateX(-50%); top: calc(var(--proto-h) + var(--topbar-h) + 16px); display: none; align-items: center; gap: 8px; max-width: calc(100vw - 24px); padding: 9px 18px; border-radius: 999px; font-size: 13.5px; line-height: 1.4; box-shadow: 0 8px 22px rgba(23,26,38,.2); animation: popCentered .2s ease-out; }
.net-bar.show { display: flex; }
.net-bar.off { background: #3b2a12; color: #fff; }
.net-bar.on { background: var(--green); color: #fff; }

/* ---------- Notes: highlights, notes, bookmark ---------- */
.iconrail button { position: relative; }
.iconrail button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
.iconrail button[aria-pressed="true"] svg { fill: currentColor; }
.iconrail .badge-n { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--primary); color: #fff; font-size: 11.5px; font-weight: 700; line-height: 20px; text-align: center; }
.iconrail .badge-n:empty { display: none; }
mark.hl { background: #FFE9A8; color: inherit; border-radius: 3px; padding: 1px 0; cursor: pointer; box-decoration-break: clone; -webkit-box-decoration-break: clone; transition: background .15s; }
mark.hl:hover { background: #FFDC73; }
mark.hl:focus-visible { outline: 3px solid var(--primary); outline-offset: 1px; }
mark.hl.has-note { border-bottom: 2px dotted #B98900; }
mark.hl.hl-last.has-note::after { content: "✎"; font-size: .7em; margin-left: 3px; color: #8A5600; vertical-align: super; }
mark.hl.pulse { animation: hlPulse 1.4s ease-out; }
@keyframes hlPulse { 0% { box-shadow: 0 0 0 0 rgba(245,166,35,.7); } 100% { box-shadow: 0 0 0 14px rgba(245,166,35,0); } }
/* Centred with translateX(-50%), so its entrance animation must keep that translate (a plain jmIn would replace it) */
@keyframes popCentered { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }
.sel-bar { position: fixed; z-index: 58; display: none; gap: 2px; padding: 4px; background: var(--navy); color: #fff; border-radius: 999px; box-shadow: 0 8px 22px rgba(23,26,38,.28); transform: translateX(-50%); animation: popCentered .18s ease-out; }
.sel-bar.show { display: inline-flex; }
.sel-bar button { border: 0; background: none; color: #fff; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sel-bar button:hover { background: rgba(255,255,255,.16); }
.sel-bar button + button { border-left: 1px solid rgba(255,255,255,.18); border-radius: 0; }
.sel-bar button:first-child { border-radius: 999px 0 0 999px; }
.sel-bar button:last-child { border-radius: 0 999px 999px 0; }
.note-card { position: fixed; z-index: 59; display: none; width: min(340px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 44px rgba(23,26,38,.24); padding: 14px; gap: 10px; animation: jmIn .18s ease-out; }
.note-card.show { display: grid; }
.nc-quote { font-size: 13px; color: var(--muted); line-height: 1.5; border-left: 3px solid #FFDC73; padding-left: 10px; max-height: 4.6em; overflow: hidden; }
.note-card textarea { width: 100%; min-height: 84px; resize: vertical; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 14.5px; line-height: 1.5; background: var(--bg); }
.note-card textarea:focus { outline: none; border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 3px var(--primary-soft); }
.nc-actions { display: flex; gap: 8px; align-items: center; }
.nc-actions .btn { padding: 7px 16px; font-size: 14px; border-radius: 12px; }
.nc-del { border: 0; background: none; color: #B3261E; font-weight: 600; font-size: 13.5px; padding: 6px 4px; margin-right: auto; }
.jp-tabs { flex: 1; display: flex; gap: 4px; min-width: 0; }
.jp-tabs button { border: 0; background: none; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.jp-tabs button:hover { background: var(--bg); color: var(--ink); }
.jp-tabs button[aria-selected="true"] { background: var(--primary-soft); color: var(--primary-ink); }
.jp-tabs .g { width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg, #1B9AAA, #F2B134); color: #fff; display: grid; place-items: center; font-size: 11px; }
.jp-tabs em { font-style: normal; background: var(--primary); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 11.5px; font-weight: 700; line-height: 18px; }
.jp-tabs em:empty { display: none; }
.jp-view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.jp-view[hidden] { display: none; }
.nl { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.nt { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; background: var(--surface); transition: border-color .15s; }
.nt:hover { border-color: #B9D6E3; }
.nt-jump { border: 0; background: none; text-align: left; padding: 0 0 0 10px; border-left: 3px solid #FFDC73; font-size: 14px; line-height: 1.55; color: var(--ink); }
.nt-jump:hover { color: var(--primary-ink); }
.nt-note { margin: 0; font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; }
.nt-meta { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.nt-meta small { flex: 1; min-width: 0; font-size: 12.5px; }
.nt-meta button { border: 0; background: none; color: var(--primary-ink); font-weight: 600; font-size: 13px; padding: 4px 6px; border-radius: 8px; }
.nt-meta button:hover { background: var(--bg); }
.nt-meta .del { color: #B3261E; }
.nt.lost .nt-jump { border-left-color: var(--line); color: var(--muted); cursor: default; }
.nt-empty { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 34px 14px; color: var(--muted); font-size: 14.5px; line-height: 1.6; }
.nt-empty .ic { width: 56px; height: 56px; border-radius: 50%; background: #FFF4CC; color: #8A5600; display: grid; place-items: center; }
.nt-empty b { color: var(--ink); font-size: 16px; }

/* ---------- Learn with Jen ---------- */
.iconrail .jen-rail { background: linear-gradient(135deg, #1B9AAA, #F2B134); color: #fff; border: 0; font-size: 19px; }
.iconrail .jen-rail:hover { filter: brightness(1.06); background: linear-gradient(135deg, #1B9AAA, #F2B134); }
.layout { transition: padding-right .35s cubic-bezier(.4, 0, .2, 1); }
@media (min-width: 1280px) { body.jen-open .layout { padding-right: 416px; } }   /* the lesson makes room instead of being covered */
.jen-panel {
  position: fixed; z-index: 56; top: calc(var(--proto-h) + var(--topbar-h) + 4px); right: 0; bottom: 0; width: 400px;
  display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--line); box-shadow: -12px 0 36px rgba(23,26,38,.10);
  transform: translateX(104%); visibility: hidden; transition: transform .35s cubic-bezier(.4, 0, .2, 1), visibility 0s linear .35s;
}
body.jen-open .jen-panel { transform: none; visibility: visible; transition: transform .35s cubic-bezier(.4, 0, .2, 1), visibility 0s; }
.jen-scrim { display: none; }
.jp-head { display: flex; align-items: center; gap: 12px; padding: 16px 12px 14px 20px; border-bottom: 1px solid var(--line); }
.jp-av { flex: none; width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #1B9AAA, #F2B134); color: #fff; display: grid; place-items: center; font-size: 18px; }
.jp-head > div { flex: 1; min-width: 0; }
.jp-head b { display: block; font-size: 16px; line-height: 1.2; }
.jp-head small { color: var(--muted); font-size: 12.5px; }
.jp-icon { flex: none; border: 0; background: none; width: 36px; height: 36px; border-radius: 10px; color: var(--muted); display: grid; place-items: center; }
.jp-icon:hover { background: var(--bg); color: var(--ink); }
.jp-ctx { padding: 9px 20px; font-size: 12.5px; color: var(--muted); background: var(--bg); border-bottom: 1px solid var(--line); line-height: 1.4; }
.jp-ctx b { color: var(--ink); font-weight: 600; }
.jp-body { flex: 1; overflow-y: auto; padding: 18px 20px; display: grid; gap: 14px; align-content: start; scroll-behavior: smooth; }
.jm { display: flex; gap: 10px; align-items: flex-start; animation: jmIn .28s ease-out; }
.jm.me { justify-content: flex-end; }
.jm .av { flex: none; width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #1B9AAA, #F2B134); color: #fff; display: grid; place-items: center; font-size: 13px; margin-top: 2px; }
.jm .bub { border-radius: 16px; padding: 11px 14px; font-size: 14.5px; line-height: 1.6; min-width: 0; }
.jm.jen .bub { background: var(--bg); border-top-left-radius: 4px; }
.jm.me .bub { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; max-width: 86%; }
.bub p { margin: 0; }
.bub p + p, .bub ul + p, .bub ol + p { margin-top: 8px; }
.bub ul, .bub ol { margin: 6px 0 0; padding-left: 18px; }
.bub li + li { margin-top: 4px; }
.jm .bub.err { background: #FDECEA; border-top-left-radius: 4px; display: grid; gap: 4px; justify-items: start; }
.jm .bub.err b { color: #8F2A1F; }
.jen-retry { border: 0; background: none; padding: 4px 0 0; color: var(--primary-ink); font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.resume { display: flex; align-items: center; gap: 14px; background: var(--primary-soft); border-radius: 14px; padding: 12px 12px 12px 16px; margin-bottom: 28px; animation: jmIn .3s ease-out; }
.resume .ic { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; }
.resume .t { flex: 1; min-width: 0; font-size: 14px; line-height: 1.4; }
.resume .t b { display: block; font-size: 14.5px; }
.resume .t span { color: var(--muted); }
.resume .btn { padding: 8px 18px; font-size: 14px; border-radius: 12px; }
.resume .rs-x { flex: none; border: 0; background: none; width: 34px; height: 34px; border-radius: 10px; color: var(--muted); display: grid; place-items: center; }
.resume .rs-x:hover { background: rgba(255,255,255,.7); color: var(--ink); }
@media (max-width: 640px) { .resume { flex-wrap: wrap; } .resume .t { flex-basis: calc(100% - 52px); } .resume .btn { margin-left: 50px; } }
.jm .bub.typing { display: flex; gap: 5px; padding: 15px 16px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: #9AA6B8; animation: jenBlink 1.2s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes jmIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes jenBlink { 0%, 80%, 100% { opacity: .3; transform: scale(.85); } 40% { opacity: 1; transform: scale(1); } }
.jp-chips { display: flex; flex-wrap: wrap; gap: 8px; padding-left: 38px; }   /* suggestions sit under Jen's last message and scroll with the chat */
.jp-chips button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13.5px; font-weight: 500; transition: border-color .15s, background .15s; }
.jp-chips button:hover { border-color: var(--primary); background: var(--primary-soft); }
.jp-chips button:disabled { opacity: .5; cursor: default; }
.jp-form { flex: none; display: flex; gap: 8px; align-items: flex-end; padding: 10px 16px 8px 20px; }
.jp-form textarea { flex: 1; resize: none; max-height: 120px; border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 14px; font: inherit; font-size: 14.5px; line-height: 1.5; background: var(--bg); }
.jp-form textarea:focus { outline: none; border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 3px var(--primary-soft); }
.jp-send { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--primary); color: #fff; display: grid; place-items: center; }
.jp-send:disabled { opacity: .4; cursor: default; }
.jp-fine { flex: none; margin: 0; padding: 0 20px 14px; font-size: 11.5px; color: var(--muted); line-height: 1.4; }
.jp-rest { display: grid; gap: 8px; justify-items: center; text-align: center; padding: 36px 12px; color: var(--muted); font-size: 14.5px; }
.jp-rest b { color: var(--ink); font-size: 16px; }
.jp-rest .jp-av { margin-bottom: 4px; }
.jen-fab { display: none; position: fixed; z-index: 54; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 52px; height: 52px; border-radius: 50%; border: 0; background: linear-gradient(135deg, #1B9AAA, #F2B134); color: #fff; font-size: 22px; place-items: center; box-shadow: 0 8px 22px rgba(23,26,38,.28); }
@media (max-width: 860px) {
  /* The side rail is hidden here, so Jen gets a floating button instead */
  body[data-mode="new"] .jen-fab { display: grid; }
  body.jen-open .jen-fab { display: none; }
  .jen-panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: min(84vh, 680px); border-left: 0; border-radius: 20px 20px 0 0; transform: translateY(104%); z-index: 75; box-shadow: 0 -12px 40px rgba(23,26,38,.2); }
  body.jen-open .jen-panel { transform: none; }
  body.jen-open .jen-scrim { display: block; position: fixed; inset: 0; z-index: 74; background: rgba(23,26,38,.4); }
}

/* Current (before) view */
.legacy { font-size: 14px; line-height: 1.45; }
.legacy p { margin: 0 0 6px; }
.legacy.single { font-size: 16px; line-height: 1.65; }
.legacy-tag { display: inline-block; font-size: 12px; font-weight: 600; background: #FDECEA; color: #9B2C1F; border-radius: 6px; padding: 2px 10px; margin-bottom: 14px; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--navy); color: #fff;
  border-radius: 12px; padding: 10px 18px; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 80;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Responsive ---------- */
@media (max-width: 1199px) {
  .stage, .stage.focus { grid-template-columns: minmax(0, 900px); }
  /* The outline becomes a drawer opened from the app bar. */
  .outline {
    position: fixed; z-index: 70; top: 0; left: 0; bottom: 0; width: min(340px, 88vw); max-height: none;
    border-radius: 0 var(--radius) var(--radius) 0; transform: translateX(-104%); transition: transform .25s; padding-top: 16px;
    box-shadow: 0 0 40px rgba(23,26,38,.25);
  }
  body.drawer .outline { transform: none; }
  body.drawer .scrim { display: block; position: fixed; inset: 0; z-index: 65; background: rgba(23,26,38,.45); }
}
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); padding: 12px 12px 80px; }
  /* Under 860px the side rail becomes a row above the lesson so share, bookmark and notes stay reachable */
  .iconrail { order: -1; position: static; display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 10px; }
  .iconrail button { width: 40px; height: 40px; border-radius: 12px; }
  .iconrail .jen-rail { display: none; }
}
@media (max-width: 640px) {
  :root { --topbar-h: 50px; --proto-h: 0px; }
  /* The prototype bar wraps to several lines here, so let it scroll away instead of overlapping the app bar. */
  .proto { position: static; padding: 6px 12px; }
  .lesson-card { padding: 22px 18px 28px; border-radius: var(--radius); }
  .lead { font-size: 17px; }
  .prep-check { padding: 18px; gap: 14px; }
  .prep-ease { padding: 14px 18px 16px; gap: 14px; }
  .prep-link { padding: 16px 18px; }
  .prep-link .go { display: none; }
  .define { grid-template-columns: 1fr; }

        <p>What is digital marketing? Digital marketing is everywhere, from social media ads, search engines and websites, to emails and, even, online reviews. So, what exactly is digital marketing? Digital marketing is the use of digital technologies to create integrated, targeted and measurable communications with the purpose of acquiring and retaining customers. Digital marketing is a data-driven process, which allows you to target individual customers and provide personalized and interactive content, as well as ensure that you get measurable results across multiple channels.</p>
        <h4>Consideration 1 · Marketing objectives</h4>
        <p>The main goal of digital marketing is to reach customers at the moments that most influence their decisions. These moments, or touch points, can be understood through the customer journey funnel where customers begin at the wide end of the funnel with a number of potential options on their mind. As they gather more information, the number of options gradually reduce until they arrive at the conversion stage, where they potentially buy your product or sign up for your service. Finally, the post-sale phase becomes an important stage, where you'll try and retain this individual and make them a loyal customer. As a marketer, you hope to reach out to your customers at each stage of their customer journey and drive them towards the end of the funnel to become a loyal customer.</p>

        <p>Think about your own customers, what are their motivations and needs at each stage of the customer journey? What should your marketing objectives be to meet their needs?</p>

    <p>Given the range of digital content available, you can use the paid, earned and owned media (PEO) model to help you develop a digital marketing strategy that integrates paid, earned, shared, and owned approaches.</p>
    <p>Owned media</p>
    <p>Owned media refers to the digital channels and content that are in your control. That means you have full control of the messages of your digital marketing campaign, and of the story you want to tell about your product or service. This can include your own websites, your own brand pages on social media, email newsletters and your own mobile apps.</p>
    <p>Paid media</p>
    <p>Paid media refers to external marketing efforts that you will have to pay for. In other words, you pay third parties to broadcast your messages to others. Just like owned media, you also have control of the content. These can include paid search ads, display and shopping ads.</p>
    <p>Earned media</p>
    <p>Earned media refers to any publicity a company receives from unpaid promotional efforts. These are often generated by opinion leaders and other credible third party sources such as bloggers, journalists, and influencers. These can include the online reviews (or electronic word-of-mouth) you see on review websites.</p>
    <p>The trick is to combine paid, earned and owned together to build your brand so that you are regarded as the expert in your field, even by your competitors.</p>
    <p>By creating your own content, you can use owned media to set the tone, paid media to amplify the message and earned media to build relationships with key opinion leaders who may share your content with their followers.</p>

        <p>Now that you have a general idea of the PEO Model, let's go into detail about how to use paid, owned and earned media in an integrated digital campaign. Let's begin with owned media. You may not be aware that you already have a number of digital tools at your disposal, including your own websites, your social media accounts and emails. Continuing our previous example with a digital camera, first and foremost, we need to tailor your content to the customer's needs, according to the customer journey stage. Then, we promote this personalized content on owned media channels that the customers will be most likely to use. Customer one is in the awareness stage. You'll need to provide them with information on various digital cameras and ensure that you're carrying the products that they will like.</p>
        <h4>How customers search</h4>
        <p>You know that one of the ways that you can reach customer one is via search engines. You know that customer one would search online for various digital camera options that could be suitable for them. Thus, your aim is to ensure that your website would pop up on their search results page. How can we achieve this? First, by understanding how individuals search. At the awareness stage, individuals are often in an abstract mindset. Like customer one, they are simply searching for more information. Thus, they tend to use more general and broad terms. In customer one's case, they are likely to use general and broad search terms or keywords such as 'digital camera'. Since they just want more information on the types of digital cameras available to them, an informational search result would likely catch their attention.</p>
        <p>In contrast, customer two is further down the customer journey. Customer two is likely to have a more concrete mindset. Since they are more informed on the cameras they like, customer two would also use more specific search terms or keywords, and perhaps mention specific brands and models. Customer two is in the consideration stage of the customer journey. Correspondingly, they use the keyword 'mid-range camera reviews' to look for reviews and comparisons between various mid-range cameras.</p>
        <h4>Keyword mapping</h4>
        <p>How can we ensure that our website pops up in both customer one and customer two's search results page? To make our web pages appear on the top of the search results page, we need to ensure that the search term or keywords are incorporated into the content of our web pages. This process is called keyword mapping, assigning keywords to specific web pages based on your keyword research. Customer one uses the keyword 'digital cameras' in their search. Thus, create a category web page on digital cameras using this very keyword. Similarly, customer two is looking for mid-range camera reviews, so you can create a sub-category page of mid-range cameras, incorporating customer two's keyword.</p>
        <p>In summary, when creating a website for your brand, it is essential to develop different web pages to address the varying customer needs as they progress along the customer journey. We can create more general web pages that gradually link to more specific ones: a general home page about digital cameras for the awareness stage, and increasingly specific product pages for the conversion stage. This process is search engine optimization (SEO): the practice of making changes to web page content to improve its visibility in unpaid search engine results.</p>
        <h4>Quality and authority</h4>
        <p>We need to prioritize the quality and authority of our content. This can be done by: posting fresh content, for example, a press section or blog; connecting with your customer, by incorporating the keywords they use in your web pages; or, before publishing, asking yourself, how will this help my audience? What information can I offer that my audience can't get elsewhere? How can I make this content more consumable?</p>
        <h4>Mantsha Pheeha, Talent Unleashed (South Africa)</h4>
        <p>At Talent Unleashed, we are content creators. Most of our content is delivered through books, through coaching and consulting services, and also through speaking engagements. The biggest owned media for me is the website, because it's SEO-enabled as well: as people are searching just for generic topics, they are able to find my information there. It doesn't mean I have to be there to make every single sale. You can have a big audience that won't necessarily translate into paying customers. Building your audience is important, and be patient when you're building your audience. Share information, share content, add value to your clients. Engage with your audience, build your audience, be intentional about it, and then sales become easier.</p>
