<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATLAS Career Planner Admin Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Career Planner, admin side (A1 Skills framework, A2 Departments & roles, A3 Learning paths).
   The shell follows demo.atlaslearn.ai/admin (Inter, teal, soft grey inputs), the same as
   the authoring prototypes. Sample data is illustrative until Tunas Muda sends their lists.
   ========================================================================== */
:root {
  --navy: #31425D;
  --primary: #0D719A; --primary-ink: #0A5A7B; --primary-soft: #E6F2F7;
  --bg: #F6F7F9; --surface: #FFFFFF; --ink: #171A26; --muted: #5B6475; --line: #E1E5EB; --field: #F3F5F8;
  --accent: #F5A623; --accent-ink: #8A5600; --accent-soft: #FEF4E1;
  --green: #1E8A5A; --green-soft: #E3F4EC; --red: #C43D2B; --red-soft: #FBE7E4;
  --violet: #5B3FB5; --violet-soft: #EFE9FB;
  /* Path types */
  --foundation: #0A5A7B; --foundation-soft: #E6F2F7;
  --role: #1E8A5A; --role-soft: #E3F4EC;
  --growth: #5B3FB5; --growth-soft: #EFE9FB;
  --radius: 16px; --radius-sm: 12px;
  --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --proto-h: 48px; --side-w: 232px;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 14.5px; line-height: 1.55; }
h1, h2, h3, h4, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---------- Prototype controls ---------- */
.proto { position: sticky; top: 0; z-index: 90; min-height: var(--proto-h); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 6px 20px; background: #FFF8E6; border-bottom: 1px dashed var(--accent); font-size: 13px; }
.proto b { color: var(--accent-ink); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); overflow: hidden; }
.seg button { border: 0; background: none; padding: 6px 14px; font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.proto .plain { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13px; }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: calc(100vh - var(--proto-h)); }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; position: sticky; top: var(--proto-h); height: calc(100vh - var(--proto-h)); overflow-y: auto; }
.side img { height: 42px; width: auto; align-self: flex-start; margin: 0 6px 18px; }
.side small { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; color: var(--muted); margin: 0 10px 8px; }
.side nav { display: grid; gap: 2px; }
.side nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; color: #3a4252; text-decoration: none; font-size: 14px; font-weight: 500; }
.side nav a:hover { background: var(--bg); }
.side nav a.on { background: #DCEBF2; color: var(--primary-ink); font-weight: 600; }
.side nav svg { flex: none; opacity: .85; }
.side .grp { margin: 6px 0 2px; padding: 6px 4px 4px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.side .grp-h { display: flex; align-items: center; gap: 8px; padding: 4px 6px 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; color: var(--navy); }
.side .grp-h em { font-style: normal; font-size: 10.5px; letter-spacing: .02em; background: var(--accent-soft); color: var(--accent-ink); border-radius: 999px; padding: 0 8px; }
.side .grp a { padding-left: 14px; }
.side .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px 4px; font-size: 13.5px; line-height: 1.3; }
.side .me i { width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-style: normal; font-weight: 600; }
.side .me span { display: block; font-size: 12px; color: var(--muted); }
.main { min-width: 0; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .crumb { font-size: 13px; color: var(--muted); }
.bar .crumb a { color: var(--muted); text-decoration: none; }
.bar .crumb a:hover { color: var(--primary-ink); text-decoration: underline; }
.bar .r { display: flex; gap: 12px; align-items: center; }
.menu-btn { display: none; place-items: center; width: 38px; height: 38px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; color: var(--ink); flex: none; }
.nav-scrim { display: none; position: fixed; inset: 0; z-index: 140; background: rgba(23,26,38,.4); }
.help { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 14px; font-weight: 600; font-size: 13.5px; }
.page { padding: 22px 24px 80px; max-width: 1320px; margin: 0 auto; }

/* ---------- Buttons, chips, fields ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 16px; font-weight: 600; font-size: 14px; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: #b9c2d0; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-ink); }
.btn.danger { color: var(--red); }
.btn.sm { padding: 5px 12px; font-size: 13px; border-radius: 10px; }
.btn.link { border: 0; background: none; padding: 4px 6px; color: var(--primary-ink); }
.btn.link:hover { text-decoration: underline; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.ico { border: 0; background: none; width: 32px; height: 32px; border-radius: 8px; color: var(--muted); display: inline-grid; place-items: center; flex: none; }
.ico:hover { background: var(--bg); color: var(--ink); }
.ico.dng:hover { color: var(--red); background: var(--red-soft); }
.ico:disabled { opacity: .3; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; line-height: 1.6; background: var(--bg); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--green-soft); color: var(--green); }
.chip.warn { background: var(--accent-soft); color: var(--accent-ink); }
.chip.info { background: var(--primary-soft); color: var(--primary-ink); }
.chip.sfw { background: #EEF0F4; color: #4A5468; }
.chip.t-foundation { background: var(--foundation-soft); color: var(--foundation); }
.chip.t-role { background: var(--role-soft); color: var(--role); }
.chip.t-growth { background: var(--growth-soft); color: var(--growth); }
.in, .sel, .ta { width: 100%; border: 1px solid transparent; background: var(--field); border-radius: var(--radius-sm); padding: 9px 12px; font-size: 14px; line-height: 1.5; }
.in:focus, .sel:focus, .ta:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px var(--primary-soft); }
.in.sm, .sel.sm { padding: 6px 10px; font-size: 13.5px; border-radius: 10px; }
.ta { resize: vertical; min-height: 70px; }
.lbl { display: block; font-size: 12.5px; font-weight: 600; color: #3a4252; margin: 0 0 4px; }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.fld { display: grid; gap: 0; margin-bottom: 14px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.muted { color: var(--muted); }
.mini { font-size: 12.5px; color: var(--muted); }

/* ---------- Page header ---------- */
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 18px; }
.ph h1 { font-size: 24px; font-weight: 700; line-height: 1.25; }
.ph p { color: var(--muted); margin-top: 4px; max-width: 70ch; }
.ph .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13.5px; font-weight: 600; text-decoration: none; margin-bottom: 10px; }
.back:hover { color: var(--primary-ink); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13.5px; color: var(--muted); margin-bottom: 16px; }
.stats b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.note { display: flex; gap: 12px; align-items: flex-start; background: var(--primary-soft); color: #20364A; border-radius: 14px; padding: 12px 16px; font-size: 13.5px; margin-bottom: 16px; }
.note b { color: var(--primary-ink); }
.note .x { margin-left: auto; }
.oq { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--accent-ink); background: var(--accent-soft); border-radius: 8px; padding: 2px 8px; }

/* ---------- A1 Skills framework ---------- */
.fw-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.fw-tools .in { max-width: 320px; }
.cat { margin-bottom: 14px; overflow: hidden; }
.cat-h { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.cat-h .nm { font-size: 16px; font-weight: 700; }
.cat-h .ct { font-size: 13px; color: var(--muted); }
.cat-h .acts { margin-left: auto; display: flex; gap: 2px; }
.sk { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
.sk:last-child { border-bottom: 0; }
.sk:hover { background: #FAFBFC; }
.sk input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--primary); }
.sk .nm { font-weight: 600; }
.sk .nm small { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); }
.sk .use { font-size: 12.5px; color: var(--muted); text-align: right; white-space: nowrap; }
.sk .acts { display: flex; gap: 2px; }
.sk.sel { background: var(--primary-soft); }
.add-row { padding: 10px 18px 14px; display: flex; gap: 8px; align-items: center; }
.add-row .in { max-width: 340px; }
.selbar { position: sticky; bottom: 16px; z-index: 20; display: flex; align-items: center; gap: 12px; background: var(--navy); color: #fff; border-radius: 14px; padding: 10px 12px 10px 18px; margin-top: 12px; box-shadow: 0 10px 30px rgba(23,26,38,.25); }
.selbar .btn { border-color: transparent; }
.selbar .btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
.arch { margin-top: 18px; }
.arch summary { cursor: pointer; font-weight: 600; color: var(--muted); padding: 6px 2px; }
.empty { text-align: center; padding: 48px 24px; display: grid; gap: 10px; justify-items: center; }
.empty h2 { font-size: 20px; }
.empty p { color: var(--muted); max-width: 52ch; }
.start2 { display: grid; grid-template-columns: repeat(2, minmax(0, 260px)); gap: 14px; margin-top: 10px; }
.start2 button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 16px; display: grid; gap: 4px; }
.start2 button:hover { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.start2 b { font-size: 15px; }
.start2 span { font-size: 13px; color: var(--muted); }

/* ---------- A2 Departments & roles ---------- */
.dr { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 20px; align-items: start; }
.depts { padding: 10px; display: grid; gap: 2px; position: sticky; top: calc(var(--proto-h) + 16px); }
.depts h2 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 10px; }
.depts button.d { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; border-radius: 10px; padding: 9px 10px; font-weight: 500; }
.depts button.d:hover { background: var(--bg); }
.depts button.d[aria-current="true"] { background: #DCEBF2; color: var(--primary-ink); font-weight: 600; }
.depts button.d span { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.roles { display: grid; gap: 12px; }
.rc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; padding: 16px 18px; text-decoration: none; color: inherit; }
.rc:hover { border-color: #b9c2d0; box-shadow: 0 2px 10px rgba(23,26,38,.05); }
.rc h3 { font-size: 16px; font-weight: 700; }
.rc .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.rc .nums { display: flex; gap: 18px; font-size: 13px; color: var(--muted); align-self: center; }
.rc .nums b { display: block; color: var(--ink); font-size: 16px; font-variant-numeric: tabular-nums; }
.rc .paths { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.legacy { padding: 14px 18px; display: flex; gap: 14px; align-items: center; background: #FAFBFC; border-style: dashed; }
.legacy p { font-size: 13.5px; color: var(--muted); }

.rd { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.sec { padding: 18px 20px; margin-bottom: 16px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sec-h h2 { font-size: 16px; font-weight: 700; }
.sec-h p { font-size: 13px; color: var(--muted); }
.title-in { font-size: 22px; font-weight: 700; border: 1px solid transparent; background: transparent; border-radius: 10px; padding: 2px 8px; margin-left: -8px; width: 100%; }
.title-in:hover { background: var(--field); }
.title-in:focus { outline: none; background: #fff; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.req { display: grid; gap: 0; }
.rq { display: grid; grid-template-columns: minmax(0, 1fr) auto 32px; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.rq:first-child { border-top: 0; }
.rq .nm { font-weight: 600; }
.rq .nm small { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); }
.band { display: inline-grid; grid-template-columns: repeat(5, auto); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.band button { border: 0; border-left: 1px solid var(--line); background: var(--surface); padding: 5px 9px; font-size: 12px; font-weight: 600; color: var(--muted); }
.band button:first-child { border-left: 0; }
.band button.fill { background: var(--primary-soft); color: var(--primary-ink); }
.band button.on { background: var(--primary); color: #fff; }
.band-key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.band-key b { color: var(--ink); font-weight: 600; }
.plist { display: grid; gap: 8px; }
.pl { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.pl .n { width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; flex: none; }
.pl .t { min-width: 0; flex: 1; }
.pl .t b { display: block; }
.pl .t span { font-size: 12.5px; color: var(--muted); }
.pl-arrow { font-size: 12.5px; color: var(--muted); padding-left: 38px; }
.side-card { padding: 16px 18px; margin-bottom: 14px; }
.side-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
.avs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; color: #fff; }

/* ---------- A3 Learning paths ---------- */
.ptype { margin-bottom: 22px; }
.ptype-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.ptype-h h2 { font-size: 16px; font-weight: 700; }
.ptype-h p { font-size: 13px; color: var(--muted); }
.pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.pc { display: grid; gap: 10px; padding: 16px 18px; text-decoration: none; color: inherit; border-top: 4px solid var(--line); }
.pc.foundation { border-top-color: var(--foundation); }
.pc.role { border-top-color: var(--role); }
.pc.growth { border-top-color: var(--growth); }
.pc:hover { box-shadow: 0 2px 10px rgba(23,26,38,.06); }
.pc h3 { font-size: 15.5px; font-weight: 700; }
.pc .who { font-size: 13px; color: var(--muted); }
.pc .stg { display: flex; gap: 4px; }
.pc .stg i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.pc .stg i.ch { background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 9px); }
.pc .ft { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
.order { padding: 14px 18px; margin-bottom: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 13.5px; }
.order b { font-weight: 700; }
.order .arr { color: var(--muted); }

.pb { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.stage { padding: 0; margin-bottom: 0; overflow: hidden; }
.stage-h { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: #FAFBFC; }
.stage-h .no { width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13.5px; flex: none; }
.stage-h .nm { flex: 1; min-width: 180px; font-weight: 700; font-size: 15.5px; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 4px 8px; }
.stage-h .nm:hover { background: var(--field); }
.stage-h .nm:focus { outline: none; background: #fff; border-color: var(--primary); }
.stype { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.stype button { border: 0; background: none; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.stype button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.stage-b { padding: 6px 18px 14px; }
.it { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.it:last-child { border-bottom: 0; }
.it .t b { display: block; font-weight: 600; }
.it .t span { font-size: 12.5px; color: var(--muted); }
.kind { font-size: 11.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; border-radius: 6px; padding: 2px 8px; text-align: center; }
.k-Course { background: var(--primary-soft); color: var(--primary-ink); }
.k-PALS { background: var(--green-soft); color: var(--green); }
.k-CBL { background: var(--accent-soft); color: var(--accent-ink); }
.k-Assessment { background: var(--violet-soft); color: var(--violet); }
.it .ren { font-size: 12.5px; }
.it .ren select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 3px 6px; font-size: 12.5px; }
.it .acts { display: flex; gap: 0; }
.choose { display: grid; gap: 12px; padding: 12px 0 4px; }
.choose .rule { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-weight: 600; }
.choose .rule input { width: 64px; text-align: center; }
.choose .modes { display: grid; gap: 8px; }
.choose label.mode { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.choose label.mode:has(input:checked) { border-color: var(--primary); background: #F7FBFD; }
.choose label.mode input { margin-top: 4px; accent-color: var(--primary); }
.choose label.mode b { display: block; }
.choose label.mode span { font-size: 12.5px; color: var(--muted); }
.pool { display: flex; flex-wrap: wrap; gap: 6px; }
.stage-f { display: flex; gap: 8px; padding: 0 18px 14px; flex-wrap: wrap; }
.unlock { display: flex; align-items: center; gap: 10px; padding: 8px 0 8px 32px; font-size: 13px; color: var(--muted); }
.unlock::before { content: ""; width: 2px; height: 26px; background: var(--line); margin-left: -18px; margin-right: 6px; }
.addstage { width: 100%; border: 1.5px dashed #c6cedb; background: transparent; border-radius: 14px; padding: 14px; font-weight: 600; color: var(--primary-ink); margin-top: 12px; }
.addstage:hover { border-color: var(--primary); background: #F7FBFD; }
.sum dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; }
.sum dt { color: var(--muted); }
.sum dd { margin: 0; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.skl { display: flex; flex-wrap: wrap; gap: 6px; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; }

  function doMerge() {
    var sel = selectedSkills(); if (sel.length < 2) return;
    var before = clone(D);
    var keep;
    if (MRG.keep === 'new') {
      var nm = ($('#mergeName') ? $('#mergeName').value : MRG.name).trim();
      if (!nm) { toast('Type a name for the merged skill'); return; }
      keep = S(uid('s'), nm); sel[0].cat.skills.push(keep);
    } else keep = skillById(MRG.keep).s;
    keep.mergedIds = keep.mergedIds || [];
    sel.forEach(function (x) {
      if (x.s === keep) return;
      keep.aliases.push(x.s.name); keep.mergedIds.push(x.s.id); (x.s.mergedIds || []).forEach(function (id) { keep.mergedIds.push(id); }); x.s.aliases.forEach(function (a) { keep.aliases.push(a); });
      x.cat.skills.splice(x.cat.skills.indexOf(x.s), 1);
    });
    // Role requirements point at the kept skill; duplicates keep the higher target
    D.roles.forEach(function (r) {
      var out = [];
      r.skills.forEach(function (rs) {
        var k = skillById(rs.s), id = k ? k.s.id : rs.s;
        var ex = out.filter(function (o) { return o.s === id; })[0];
        if (ex) ex.t = Math.max(ex.t, rs.t); else out.push({ s: id, t: rs.t });
      });
      r.skills = out;
    });
    UI.selected = {};
    persist(); closeDlg(); render();
    toastUndo('Merged into "' + keep.name + '"', before);
  }

        }).join('') + '</div><button class="ico dng" type="button" data-act="rmreq" data-i="' + i + '" aria-label="Remove ' + esc(k ? k.s.name : 'skill') + '" title="Remove">' + I.x + '</button></div>';
    }).join('') + '</div>';
    h += '<div class="band-key"><span>Target band, from Skills Analytics:</span>' + BANDS.map(function (b, i) { return '<span><b>' + (i + 1) + '</b> ' + b + '</span>'; }).join('') + '</div>';
    h += '<p class="mini" style="margin-top:8px"><span class="oq">Open question</span> Bands or completion only for now? Depends on Skills Analytics scoring.</p></section>';

    h += '<section class="card sec"><div class="sec-h"><div><h2>Learning paths</h2><p>Everyone in this role is enrolled in these, in this order.</p></div></div><div class="plist">';
    var seq = f.concat(ps), n = 0;
    seq.forEach(function (p, i) {
      n++;
      h += (i ? '<div class="pl-arrow">↓ Opens when the path above is complete</div>' : '') +
        '<div class="pl"><span class="n">' + n + '</span><span class="t"><b>' + esc(p.name) + '</b><span>' + PATH_TYPES[p.type].label + ' path · ' + plural(p.stages.length, 'stage') + (p.type === 'foundation' ? ' · everyone' : '') + (p.active ? '' : ' · Draft') + '</span></span>' +
        '<span class="chip t-' + p.type + '">' + PATH_TYPES[p.type].label + '</span><a class="btn sm" href="#path/' + p.id + '">Open</a></div>';
    });
    if (!ps.length) h += '<div class="pl" style="border-style:dashed"><span class="n" style="background:var(--line);color:var(--muted)">' + (n + 1) + '</span><span class="t"><b>No role path yet</b><span>Create one so people in this role get role-specific learning.</span></span><button class="btn primary sm" type="button" data-act="newrolepath">Create role path</button></div>';
    h += '</div>';
    if (g.length) h += '<p class="mini" style="margin-top:12px">Growth paths (' + esc(g.map(function (p) { return p.name; }).join(', ')) + ') are for nominated staff only, so they are not attached to roles.</p>';
    h += '</section></div>';

    var inRole = D.staff.filter(function (u) { return u.role === r.id; });
    h += '<aside><div class="card side-card"><h3>People in this role</h3><p class="mini">' + plural(inRole.length, 'staff member') + ' · ' + esc((deptById(r.dept) || {}).name || '') + '</p><div class="avs">' +
      inRole.slice(0, 8).map(function (u) { return '<a href="#person/' + u.id + '" title="' + esc(u.name) + '" style="text-decoration:none">' + avatar(u) + '</a>'; }).join('') + (inRole.length > 8 ? '<span class="av" style="background:var(--line);color:var(--muted)">+' + (inRole.length - 8) + '</span>' : '') +
      '</div><a class="btn sm" href="#staff" data-a4role="' + r.id + '">Manage in Staff assignments</a></div>' +
      '<div class="card side-card"><h3>Skills this role\'s paths cover</h3>' + coverage(r) + '</div>' +
      '<div class="card side-card"><h3>Remove this role</h3><p class="mini" style="margin-bottom:10px">People keep their learning records. Their role paths stop.</p><button class="btn danger sm" type="button" data-act="delrole">Remove role</button></div></aside></div>';
    return h;
  }
  // Which required skills the attached paths actually teach. Gaps show where content is missing.
  function coverage(r) {
    if (!r.skills.length) return '<p class="mini">Add required skills to see coverage.</p>';
    var taught = {};
    D.paths.filter(function (p) { return p.type === 'foundation' || (p.type === 'role' && p.roles.indexOf(r.id) !== -1); }).forEach(function (p) {
      p.stages.forEach(function (st) {
        var items = st.type === 'choose' ? poolItems(st) : st.items.map(function (it) { return contentById(it.c); }).filter(Boolean);
        items.forEach(function (c) { contentSkills(c).forEach(function (s) { taught[s] = 1; }); });
      });
    });
    var miss = r.skills.filter(function (rs) { var k = skillById(rs.s); return !k || !taught[k.s.id]; });
    return '<p class="mini" style="margin-bottom:8px">' + (r.skills.length - miss.length) + ' of ' + r.skills.length + ' required skills are taught by its paths.</p>' +
      (miss.length ? '<div class="skl">' + miss.map(function (rs) { return '<span class="chip warn" title="No content in this role\'s paths is tagged with this skill">' + esc(skillName(rs.s)) + '</span>'; }).join('') + '</div><p class="mini" style="margin-top:8px">Add content tagged with these skills to a path.</p>' : '<span class="chip ok">All covered</span>');
  }

      h += '<div class="grp-t">' + esc(cat.name) + '</div><div class="opt-list">' + list.map(function (s) {
        var on = have.indexOf(s.id) !== -1;
        return '<label class="opt"><input type="checkbox" data-reqpick="' + s.id + '"' + (on ? ' checked disabled' : '') + '><span class="t"><b>' + esc(s.name) + '</b>' + (on ? '<span>Already required</span>' : '') + '</span></label>';
      }).join('') + '</div>';
    });

      '<div class="dg-f"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="button" data-act="doaddreq">Add skills</button></div>';

        '<div class="fld"><label class="lbl" for="fName">Name</label><input class="in" id="fName" value="' + esc(d.name) + '" placeholder="e.g. Admissions"></div>' +
        '<div class="fld"><label class="lbl" for="fHead">Department head <span class="muted" style="font-weight:400">(optional)</span></label><input class="in" id="fHead" value="' + esc(d.head) + '" placeholder="Name"></div></div>' +
        '<div class="dg-f"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="button" data-save="dept" data-id="' + (id || '') + '">' + (id ? 'Save' : 'Add department') + '</button></div>';

        '<div class="row2"><div class="fld"><label class="lbl" for="fDept">Department</label><select class="sel" id="fDept">' + D.departments.map(function (x) { return '<option value="' + x.id + '"' + (x.id === UI.dept ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') + '</select></div>' +
        '<div class="fld"><label class="lbl" for="fLevel">Level <span class="muted" style="font-weight:400">(optional)</span></label><select class="sel" id="fLevel">' + LEVELS.map(function (l) { return '<option value="' + l + '">' + (l || 'No level') + '</option>'; }).join('') + '</select></div></div></div>' +

    } else if (kind === 'cat') {
      d = id ? D.categories.filter(function (c) { return c.id === id; })[0] : { name: '' };
      h = '<div class="dg-h"><div><h2 id="dlgTitle">' + (id ? 'Rename category' : 'Add category') + '</h2><p>Learners see these categories, so use names they recognise.</p></div><button class="ico" type="button" data-close aria-label="Close">' + I.x + '</button></div><div class="dg-b">' +
        '<div class="fld"><label class="lbl" for="fName">Category name</label><input class="in" id="fName" value="' + esc(d.name) + '" placeholder="e.g. Communication"></div></div>' +
        '<div class="dg-f"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="button" data-save="cat" data-id="' + (id || '') + '">' + (id ? 'Save' : 'Add category') + '</button></div>';
    } else if (kind === 'skill') {
      d = skillById(id).s;
      h = '<div class="dg-h"><div><h2 id="dlgTitle">Rename skill</h2><p>Roles, paths and reports update everywhere. The old name stays as an alias.</p></div><button class="ico" type="button" data-close aria-label="Close">' + I.x + '</button></div><div class="dg-b">' +
        '<div class="fld"><label class="lbl" for="fName">Skill name</label><input class="in" id="fName" value="' + esc(d.name) + '"></div></div>' +
        '<div class="dg-f"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="button" data-save="skill" data-id="' + id + '">Save</button></div>';
    } else if (kind === 'path') {
      var preset = id || '';
      h = '<div class="dg-h"><div><h2 id="dlgTitle">New learning path</h2><p>A path is a sequence of stages. Learners only see the stage they are on.</p></div><button class="ico" type="button" data-close aria-label="Close">' + I.x + '</button></div><div class="dg-b">' +
        '<div class="lbl">Type</div><div class="opt-list" style="margin-bottom:14px">' + Object.keys(PATH_TYPES).map(function (t, i) {
          return '<label class="opt"><input type="radio" name="ptype" value="' + t + '"' + ((preset ? t === 'role' : i === 0) ? ' checked' : '') + '><span class="t"><b>' + PATH_TYPES[t].label + '</b><span>' + PATH_TYPES[t].who + ' ' + PATH_TYPES[t].eg + '.</span></span><span class="chip t-' + t + '">' + PATH_TYPES[t].label + '</span></label>';
        }).join('') + '</div>' +
        '<div class="fld"><label class="lbl" for="fName">Path name</label><input class="in" id="fName" placeholder="e.g. Admissions Officer path" value="' + (preset ? esc((roleById(preset) || {}).title + ' path') : '') + '"></div>' +
        '<div class="fld" id="fRoleWrap"' + (preset ? '' : ' hidden') + '><label class="lbl" for="fRole">For role</label><select class="sel" id="fRole">' + D.roles.map(function (x) { return '<option value="' + x.id + '"' + (x.id === preset ? ' selected' : '') + '>' + esc(x.title) + '</option>'; }).join('') + '</select></div></div>' +
        '<div class="dg-f"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="button" data-save="path">Create path</button></div>';
    }
    $('#dlgBody').innerHTML = h; openDlg();
    var f = $('#fName'); if (f) { f.focus(); f.select(); }
  }

  // ==========================================================================
  // A3 Learning paths
  // ==========================================================================
  function viewPaths() {
    var h = '<div class="ph"><div><h1>Learning paths</h1><p>Ordered stages across Courses, PALS, CBL and Assessments. Learners see only the stage they are on; the next opens when it is complete.</p></div>' +
      '<div class="acts"><button class="btn primary" type="button" data-act="newpath">+ New path</button></div></div>';
    if (!D.paths.length) return h + '<section class="card empty"><h2>No learning paths yet</h2><p>Most organisations start with one Foundation path for compliance, then one Role path per role.</p><button class="btn primary" type="button" data-act="newpath">+ New path</button></section>';
    var f = D.paths.filter(function (p) { return p.type === 'foundation'; });
    h += '<div class="card order"><b>Order for a new joiner:</b>' + (f.length ? f.map(function (p) { return '<span class="chip t-foundation">' + esc(p.name) + '</span>'; }).join('') : '<span class="chip warn">No Foundation path</span>') +
      '<span class="arr">→</span><span class="chip t-role">Their role path</span><span class="arr">→</span><span class="chip t-growth">Growth, if nominated</span>' +
      '<span class="mini" style="margin-left:auto">Groups still work alongside paths for one-off assignments.</span></div>';
    Object.keys(PATH_TYPES).forEach(function (t) {
      var list = D.paths.filter(function (p) { return p.type === t; });
      h += '<section class="ptype"><div class="ptype-h"><h2>' + PATH_TYPES[t].label + ' paths</h2><p>' + PATH_TYPES[t].who + '</p></div><div class="pcards">';
      list.forEach(function (p) {
        var items = p.stages.reduce(function (n, st) { return n + (st.type === 'choose' ? (st.n || 0) : st.items.length); }, 0);
        var mins = p.stages.reduce(function (n, st) { return n + stageMins(st); }, 0);
        var who = t === 'foundation' ? 'Everyone' : (t === 'growth' ? enrolled(p) + ' nominated staff' : (p.roles.map(function (id) { return (roleById(id) || {}).title; }).filter(Boolean).join(', ') || 'No role attached'));
        h += '<a class="card pc ' + t + '" href="#path/' + p.id + '"><div style="display:flex;justify-content:space-between;gap:10px"><h3>' + esc(p.name) + '</h3>' + (p.active ? '<span class="chip ok">Active</span>' : '<span class="chip">Draft</span>') + '</div>' +
          '<span class="who">' + esc(who) + '</span><div class="stg" aria-hidden="true">' + p.stages.map(function (st) { return '<i class="' + (st.type === 'choose' ? 'ch' : '') + '"></i>'; }).join('') + '</div>' +
          '<div class="ft"><span>' + plural(p.stages.length, 'stage') + ' · ' + plural(items, 'item') + ' · about ' + fmtMins(mins) + '</span><span>' + (p.active ? enrolled(p) + ' enrolled' : enrolled(p) + ' when active') + '</span></div></a>';
      });
      if (!list.length) h += '<button class="card pc ' + t + '" type="button" data-act="newpath" style="text-align:left;border-style:dashed"><h3>+ New ' + PATH_TYPES[t].label.toLowerCase() + ' path</h3><span class="who">' + PATH_TYPES[t].eg + '</span></button>';
      h += '</div></section>';
    });
    return h;
  }

  function viewPath(id) {
    var p = pathById(id);
    if (!p) return '<a class="back" href="#paths">' + I.back + 'Learning paths</a><div class="card empty"><h2>This path no longer exists</h2></div>';
    var h = '<a class="back" href="#paths">' + I.back + 'Learning paths</a>';
    h += '<div class="ph" style="align-items:center"><div style="flex:1;min-width:260px"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span class="chip t-' + p.type + '">' + PATH_TYPES[p.type].label + ' path</span></div>' +
      '<label class="sr" for="pathName">Path name</label><input class="title-in" id="pathName" data-pf="name" value="' + esc(p.name) + '"></div>' +
      '<div class="acts" style="align-items:center"><span class="status"><button class="switch" type="button" role="switch" aria-checked="' + !!p.active + '" data-act="toggleactive" aria-label="Active"></button>' + (p.active ? 'Active' : 'Draft') + '</span>' +
      '<button class="btn" type="button" data-act="preview">' + I.eye + 'Preview as learner</button></div></div>';
    h += '<div class="pb"><div>';
    p.stages.forEach(function (st, i) {
      if (i) h += '<div class="unlock">' + I.lock + 'Stage ' + (i + 1) + ' opens when stage ' + i + ' is complete</div>';
      h += stageCard(p, st, i);
    });
    if (!p.stages.length) h += '<div class="card empty" style="padding:28px"><p>Add the first stage. A stage is a step learners finish before the next one opens.</p></div>';
    h += '<button class="addstage" type="button" data-act="addstage">+ Add stage</button></div>';
    h += '<aside>' + pathSide(p) + '</aside></div>';
    return h;
  }

  function stageCard(p, st, i) {
    var h = '<section class="card stage" aria-label="Stage ' + (i + 1) + '"><div class="stage-h"><span class="no">' + (i + 1) + '</span>' +
      '<label class="sr" for="sn-' + st.id + '">Stage name</label><input class="nm" id="sn-' + st.id + '" data-sf="name" data-st="' + st.id + '" value="' + esc(st.name) + '" placeholder="Stage name">' +
      '<div class="stype" role="group" aria-label="Stage type"><button type="button" data-stype="required" data-st="' + st.id + '" aria-pressed="' + (st.type === 'required') + '" title="Learners complete every item">Required</button><button type="button" data-stype="choose" data-st="' + st.id + '" aria-pressed="' + (st.type === 'choose') + '" title="Learners pick items from a pool">Choose-from</button></div>' +
      '<span style="display:flex"><button class="ico" type="button" data-act="stageup" data-st="' + st.id + '" aria-label="Move stage up"' + (i ? '' : ' disabled') + '>' + I.up + '</button><button class="ico" type="button" data-act="stagedown" data-st="' + st.id + '" aria-label="Move stage down"' + (i < p.stages.length - 1 ? '' : ' disabled') + '>' + I.down + '</button><button class="ico dng" type="button" data-act="delstage" data-st="' + st.id + '" aria-label="Remove stage ' + (i + 1) + '">' + I.del + '</button></span></div><div class="stage-b">';
    if (st.type === 'required') {
      if (!st.items.length) h += '<p class="mini" style="padding:10px 0">No content yet. Learners finish every item in this stage.</p>';
      st.items.forEach(function (it, j) { h += itemRow(p, st, it, j); });
      h += '</div><div class="stage-f"><button class="btn sm" type="button" data-act="additems" data-st="' + st.id + '">+ Add content</button><span class="mini" style="align-self:center">Learners complete all ' + plural(st.items.length, 'item') + '. About ' + fmtMins(stageMins(st)) + '.</span></div>';
    } else {
      var pool = poolItems(st);
      h += '<div class="choose"><div class="rule"><label for="n-' + st.id + '">Learners complete</label><input class="in sm" type="number" min="1" max="' + Math.max(1, pool.length) + '" id="n-' + st.id + '" data-sf="n" data-st="' + st.id + '" value="' + (st.n || 1) + '"><span>of ' + plural(pool.length, 'item') + ' in the pool</span></div>' +
        '<div class="modes" role="radiogroup" aria-label="Pool for stage ' + (i + 1) + '">' +
        '<label class="mode"><input type="radio" name="pm-' + st.id + '" value="category" data-pmode="' + st.id + '"' + (st.pool.mode === 'category' ? ' checked' : '') + '><span><b>Everything tagged with a category</b><span>New content tagged later joins the pool automatically.</span>' +
        (st.pool.mode === 'category' ? '<select class="sel sm" style="margin-top:8px;max-width:280px" data-pcat="' + st.id + '" aria-label="Category">' + D.categories.map(function (c) { return '<option value="' + c.id + '"' + (c.id === st.pool.cat ? ' selected' : '') + '>' + esc(c.name) + ' (' + catContent(c.id).length + ')</option>'; }).join('') + '</select>' : '') + '</span></label>' +
        '<label class="mode"><input type="radio" name="pm-' + st.id + '" value="list" data-pmode="' + st.id + '"' + (st.pool.mode === 'list' ? ' checked' : '') + '><span><b>A list you pick</b><span>Only the items you choose.</span></span></label></div>';
      if (pool.length) h += '<div><div class="lbl">In the pool</div><div class="pool">' + pool.map(function (c) { return '<span class="chip" title="' + c.kind + ' · ' + c.mins + ' min">' + esc(c.title) + (st.pool.mode === 'list' ? ' <button class="ico" style="width:18px;height:18px" type="button" data-act="rmpool" data-st="' + st.id + '" data-c="' + c.id + '" aria-label="Remove ' + esc(c.title) + '">×</button>' : '') + '</span>'; }).join('') + '</div></div>';
      else h += '<p class="mini">The pool is empty. ' + (st.pool.mode === 'category' ? 'No content is tagged with this category yet.' : 'Add items to the list.') + '</p>';
      h += '<p class="mini"><span class="oq">Open question</span> Count items (as shown) or "cover these skills"? To decide in scoping.</p></div></div>';
      h += '<div class="stage-f">' + (st.pool.mode === 'list' ? '<button class="btn sm" type="button" data-act="additems" data-st="' + st.id + '">+ Add to pool</button>' : '') + '<span class="mini" style="align-self:center">About ' + fmtMins(stageMins(st)) + ' for a learner.</span></div>';
    }
    return h + '</section>';
  }
  function itemRow(p, st, it, j) {
    var c = contentById(it.c); if (!c) return '';
    return '<div class="it"><span class="kind k-' + c.kind + '">' + c.kind + '</span><div class="t"><b>' + esc(c.title) + '</b><span>' + c.mins + ' min · ' + esc(contentSkills(c).map(skillName).join(', ') || 'No skills tagged') + '</span></div>' +
      '<label class="ren">' + '<span class="sr">Renewal for ' + esc(c.title) + '</span><select data-renew="' + j + '" data-st="' + st.id + '" title="Compliance renewal: the item comes back to the learner\'s path when it expires">' + RENEW.map(function (r) { return '<option value="' + r[0] + '"' + (r[0] === (it.renew || '') ? ' selected' : '') + '>' + r[1] + '</option>'; }).join('') + '</select></label>' +
      '<span class="acts"><button class="ico" type="button" data-act="itemup" data-st="' + st.id + '" data-j="' + j + '" aria-label="Move up"' + (j ? '' : ' disabled') + '>' + I.up + '</button><button class="ico" type="button" data-act="itemdown" data-st="' + st.id + '" data-j="' + j + '" aria-label="Move down"' + (j < st.items.length - 1 ? '' : ' disabled') + '>' + I.down + '</button><button class="ico dng" type="button" data-act="rmitem" data-st="' + st.id + '" data-j="' + j + '" aria-label="Remove ' + esc(c.title) + '">' + I.x + '</button></span></div>';
  }
  function pathSide(p) {
    var h = '<div class="card side-card"><h3>Who gets this path</h3>';
    if (p.type === 'foundation') h += '<p class="mini">Everyone in the organisation, and new staff as soon as they join. ' + enrolled(p) + ' enrolled.</p>';
    else if (p.type === 'growth') h += '<p class="mini">Staff HR nominates. Managers can recommend people.</p><p style="margin:8px 0"><b>' + enrolled(p) + '</b> nominated</p><a class="btn sm" href="#staff">Nominate in Staff assignments</a>';
    else h += '<p class="mini" style="margin-bottom:8px">Everyone in these roles, now and when they join the role.</p><div class="opt-list">' + D.roles.map(function (r) {
      return '<label class="opt" style="padding:8px 10px"><input type="checkbox" data-prole="' + r.id + '"' + (p.roles.indexOf(r.id) !== -1 ? ' checked' : '') + '><span class="t"><b>' + esc(r.title) + '</b><span>' + esc((deptById(r.dept) || {}).name || '') + ' · ' + staffCount(r.id) + ' staff</span></span></label>';
    }).join('') + '</div>';
    h += '</div>';

  // ==========================================================================
  // Progress model (sample). Real progress comes from completion events; here each person's
  // place in a path is derived from their sample profile so the reports have something to show.
  // ==========================================================================
  function staffCount(roleId) { return D.staff.filter(function (u) { return u.role === roleId; }).length; }
  function personById(id) { for (var i = 0; i < D.staff.length; i++) if (D.staff[i].id === id) return D.staff[i]; return null; }
  function personPaths(u) {
    if (!u.role) return [];
    return D.paths.filter(function (p) { return p.active && (p.type === 'foundation' || (p.type === 'role' && (p.roles.indexOf(u.role) !== -1 || (u.kept || []).indexOf(p.id) !== -1)) || (p.type === 'growth' && u.nominated)); });
  }
  function foundationDone(u) { return u.joined >= 14; }
  // { state: done | progress | overdue | locked, stage: index of the active stage, of: stage count }
  function pstate(u, p) {
    var n = p.stages.length;
    if (!n) return { state: 'locked', stage: 0, of: 0 };
    if (p.type === 'foundation') return foundationDone(u) ? { state: 'done', stage: n, of: n } : { state: 'progress', stage: u.joined < 5 ? 0 : Math.min(1, n - 1), of: n };
    if (!foundationDone(u)) return { state: 'locked', stage: 0, of: n };
    var roleIdx = u.joined > 700 ? n : (u.seed * 7 + 1) % (n + 1);
    if (p.type === 'role') return roleIdx >= n ? { state: 'done', stage: n, of: n } : { state: u.seed % 4 === 1 ? 'overdue' : 'progress', stage: roleIdx, of: n };
    var rp = D.paths.filter(function (x) { return x.active && x.type === 'role' && x.roles.indexOf(u.role) !== -1; })[0];
    if (rp && pstate(u, rp).state !== 'done') return { state: 'locked', stage: 0, of: n };
    return { state: 'progress', stage: u.seed % n, of: n };
  }
  // Compliance items (renewing items in Foundation paths) and when each expires for this person
  function renewItems() {
    var out = [];
    D.paths.filter(function (p) { return p.active && p.type === 'foundation'; }).forEach(function (p) { p.stages.forEach(function (st) { (st.items || []).forEach(function (it) { if (it.renew && contentById(it.c)) out.push({ c: contentById(it.c), years: +it.renew }); }); }); });
    return out;
  }
  function compliance(u) {
    if (!u.role || !foundationDone(u)) return [];
    return renewItems().map(function (r, j) { return { c: r.c, days: ((u.seed * 53 + j * 97 + 400) % 700) - 40 }; });
  }
  function dueLabel(days) { return days < 0 ? 'Expired ' + (-days) + ' days ago' : 'Due in ' + plural(days, 'day'); }
  var STATE_LABEL = { done: 'Complete', progress: 'In progress', overdue: 'Overdue', locked: 'Not open yet' };
  function stateChip(u, p) {
    var s = pstate(u, p), short = PATH_TYPES[p.type].label;
    if (s.state === 'done') return '<span class="chip ok" title="' + esc(p.name) + ': complete">' + short + ' ✓</span>';
    if (s.state === 'locked') return '<span class="chip" title="' + esc(p.name) + ': opens later">' + short + ' · later</span>';
    return '<span class="chip ' + (s.state === 'overdue' ? 'bad' : 'info') + '" title="' + esc(p.name) + ': stage ' + (s.stage + 1) + ' of ' + s.of + (s.state === 'overdue' ? ', overdue' : '') + '">' + short + ' ' + (s.stage + 1) + '/' + s.of + (s.state === 'overdue' ? ' · overdue' : '') + '</span>';
  }
  function avatar(u, size) { return '<span class="av" style="background:' + AVC[(u.seed || 0) % AVC.length] + (size ? ';width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size * .4) + 'px' : '') + '" aria-hidden="true">' + esc(u.name.charAt(0)) + '</span>'; }
  function joinedLabel(d) { return d < 30 ? 'Joined ' + plural(d, 'day') + ' ago' : (d < 365 ? 'Joined ' + Math.round(d / 30) + ' months ago' : 'Joined ' + (d / 365).toFixed(1).replace('.0', '') + ' years ago'); }

      persist(); closeDlg(); render(); toast('Skill renamed everywhere');
    } else if (kind === 'path') {
      var type = ($('input[name="ptype"]:checked') || {}).value || 'role';
      var p = { id: uid('p'), type: type, name: name, active: false, roles: type === 'role' ? [$('#fRole').value] : [], after: type === 'foundation' ? '' : (D.paths.filter(function (x) { return x.type === 'foundation'; })[0] || {}).id || '', nominated: 0,
        stages: [{ id: uid('st'), name: 'Stage 1', type: 'required', items: [] }] };
      D.paths.push(p); persist(); closeDlg(); go('#path/' + p.id); toast('Path created as a draft. Add content to stage 1.');
    }
  }

  function act(name, el) {
    var p, st, i, j, before;
    switch (name) {
      // A1
      case 'import': openImport(); break;
      case 'addcat': case 'addcat-first': openForm('cat'); break;
      case 'renamecat': openForm('cat', el.dataset.id); break;
      case 'delcat':
        var cat = D.categories.filter(function (c) { return c.id === el.dataset.id; })[0];
        var used = cat.skills.some(function (s) { return rolesUsing(s.id).length || contentUsing(s.id).length; });
        if (used) { toast('Move or archive its skills first: some are used by roles or content'); break; }
        before = clone(D); D.categories.splice(D.categories.indexOf(cat), 1); persist(); render(); toastUndo('Category "' + cat.name + '" removed', before); break;
      case 'addskill': addSkill(el.dataset.id); break;
      case 'renameskill': openForm('skill', el.dataset.id); break;
      case 'archive':
        before = clone(D); var k = skillById(el.dataset.id).s; k.archived = true; delete UI.selected[k.id]; persist(); render();
        toastUndo('"' + k.name + '" archived. Past records keep it.', before); break;
      case 'unarchive': skillById(el.dataset.id).s.archived = false; persist(); render(); toast('Skill restored'); break;
      case 'clearsel': UI.selected = {}; render(); break;
      case 'merge': openMerge(); break;
      case 'domerge': doMerge(); break;
      // A2
      case 'adddept': openForm('dept'); break;
      case 'editdept': openForm('dept', el.dataset.id); break;
      case 'addrole': if (D.departments.length) openForm('role'); break;
      case 'addreq': openAddReq(); break;
      case 'doaddreq':
        var r = roleById(ROUTE.id), n = 0;
        $$('[data-reqpick]:checked:not(:disabled)').forEach(function (c) { r.skills.push({ s: c.dataset.reqpick, t: 3 }); n++; });
        persist(); closeDlg(); render(); if (n) toast(plural(n, 'skill') + ' added at Competent'); break;
      case 'rmreq': before = clone(D); roleById(ROUTE.id).skills.splice(+el.dataset.i, 1); persist(); render(); toastUndo('Skill removed from this role', before); break;
      case 'newrolepath': openForm('path', ROUTE.id); break;
      case 'delrole':
        before = clone(D); var rr = roleById(ROUTE.id); D.roles.splice(D.roles.indexOf(rr), 1); D.paths.forEach(function (x) { x.roles = x.roles.filter(function (id) { return id !== rr.id; }); });
        persist(); go('#roles'); toastUndo('Role "' + rr.title + '" removed', before); break;
      // A3
      case 'newpath': openForm('path'); break;
      case 'toggleactive': p = curPath(); p.active = !p.active; persist(); render(); toast(p.active ? 'Active: enrolment starts for ' + enrolled(p) + ' people' : 'Back to draft: nobody new is enrolled'); break;
      case 'preview': openPreview(); break;
      case 'addstage': p = curPath(); p.stages.push({ id: uid('st'), name: 'Stage ' + (p.stages.length + 1), type: 'required', items: [] }); persist(); render(); var ins = $$('.stage-h .nm'); if (ins.length) ins[ins.length - 1].focus(); break;
      case 'delstage': before = clone(D); p = curPath(); st = stageOf(el.dataset.st); p.stages.splice(p.stages.indexOf(st), 1); persist(); render(); toastUndo('Stage removed', before); break;
      case 'stageup': case 'stagedown':
        p = curPath(); st = stageOf(el.dataset.st); i = p.stages.indexOf(st); j = name === 'stageup' ? i - 1 : i + 1;
        if (j < 0 || j >= p.stages.length) break; p.stages.splice(i, 1); p.stages.splice(j, 0, st); persist(); render(); break;
      case 'additems': openPicker(el.dataset.st); break;
      case 'doadditems':
        st = stageOf(PICK.st); var ids = Object.keys(PICK.picks).filter(function (k2) { return PICK.picks[k2]; });
        ids.forEach(function (id) { if (st.type === 'choose') st.pool.list.push(id); else st.items.push({ c: id, renew: '' }); });
        persist(); closeDlg(); render(); toast(plural(ids.length, 'item') + ' added'); break;
      case 'rmitem': before = clone(D); st = stageOf(el.dataset.st); st.items.splice(+el.dataset.j, 1); persist(); render(); toastUndo('Item removed from the stage', before); break;
      case 'itemup': case 'itemdown':
        st = stageOf(el.dataset.st); i = +el.dataset.j; j = name === 'itemup' ? i - 1 : i + 1;
        if (j < 0 || j >= st.items.length) break; var mv = st.items.splice(i, 1)[0]; st.items.splice(j, 0, mv); persist(); render(); break;
      case 'rmpool': st = stageOf(el.dataset.st); st.pool.list = st.pool.list.filter(function (c) { return c !== el.dataset.c; }); persist(); render(); break;
      case 'delpath': before = clone(D); p = curPath(); D.paths.splice(D.paths.indexOf(p), 1); persist(); go('#paths'); toastUndo('Path "' + p.name + '" removed', before); break;
    }
  }

  function addSkill(catId) {
    var input = $('[data-addskill="' + catId + '"]'), name = input.value.trim();
    if (!name) { input.focus(); return; }
    if (allSkills(true).some(function (x) { return x.s.name.toLowerCase() === name.toLowerCase(); })) { toast('"' + name + '" is already in the framework'); return; }
    D.categories.filter(function (c) { return c.id === catId; })[0].skills.push(S(uid('s'), name));
    persist(); render(); toast('"' + name + '" added');
    var again = $('[data-addskill="' + catId + '"]'); if (again) again.focus();
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.matches('[data-addskill]')) { e.preventDefault(); addSkill(e.target.dataset.addskill); }
    if (e.key === 'Enter' && e.target.matches('#dlg .in') && $('#dlg [data-save]')) { e.preventDefault(); $('#dlg [data-save]').click(); }
  });

  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.id === 'skillSearch') { UI.q = el.value; var pos = el.selectionStart; render(); var s = $('#skillSearch'); s.focus(); s.setSelectionRange(pos, pos); return; }
    if (el.id === 'pq') { UI.pq = el.value; renderPicker(); var q = $('#pq'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); return; }
    if (el.id === 'mergeName') { MRG.name = el.value; return; }
    // Text fields save as you type, without re-rendering (keeps focus)
    if (el.dataset.rf) { roleById(ROUTE.id)[el.dataset.rf] = el.value; persist(); if (el.dataset.rf === 'title') $('#crumb').lastChild.textContent = ' ' + el.value; return; }
    if (el.dataset.pf === 'name') { curPath().name = el.value; persist(); return; }
    if (el.dataset.sf === 'name') { stageOf(el.dataset.st).name = el.value; persist(); return; }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.dataset.pick) { UI.selected[el.dataset.pick] = el.checked; render(); return; }
    if (el.name === 'sfwsec') { IMP.sector = el.value; IMP.picks = {}; renderImport(); return; }
    if (el.dataset.imppick) { IMP.picks[el.dataset.imppick] = el.checked; renderImport(); return; }
    if (el.id === 'impTarget') { IMP.target = el.value; return; }
    if (el.name === 'keep') { MRG.keep = el.value; renderMerge(); if (el.value === 'new') $('#mergeName').focus(); return; }
    if (el.dataset.cpick) { PICK.picks[el.dataset.cpick] = el.checked; var n = Object.keys(PICK.picks).filter(function (k) { return PICK.picks[k]; }).length; var b = $('[data-act="doadditems"]'); b.disabled = !n; b.textContent = 'Add ' + plural(n, 'item'); $('.dg-f .l').textContent = plural(n, 'item') + ' selected'; return; }
    if (el.id === 'pskill') { UI.pskill = el.value; renderPicker(); return; }
    if (el.name === 'ptype') { $('#fRoleWrap').hidden = el.value !== 'role'; return; }
    if (el.dataset.rf === 'dept' || el.dataset.rf === 'level') { roleById(ROUTE.id)[el.dataset.rf] = el.value; persist(); render(); return; }
    if (el.dataset.pf === 'after') { curPath().after = el.value; persist(); toast('Saved'); return; }
    if (el.dataset.prole) { var p = curPath(); if (el.checked) p.roles.push(el.dataset.prole); else p.roles = p.roles.filter(function (id) { return id !== el.dataset.prole; }); persist(); render(); return; }
    if (el.dataset.renew) { stageOf(el.dataset.st).items[+el.dataset.renew].renew = el.value; persist(); render(); toast(el.value ? 'Renews ' + el.options[el.selectedIndex].text.toLowerCase() + '. HR sees who is due.' : 'No renewal'); return; }
    if (el.dataset.sf === 'n') { var st = stageOf(el.dataset.st), max = Math.max(1, poolItems(st).length); st.n = Math.min(max, Math.max(1, parseInt(el.value, 10) || 1)); persist(); render(); return; }
    if (el.dataset.pmode) { var s2 = stageOf(el.dataset.pmode); s2.pool.mode = el.value; if (el.value === 'category' && !s2.pool.cat && D.categories[0]) s2.pool.cat = D.categories[0].id; persist(); render(); return; }
    if (el.dataset.pcat) { stageOf(el.dataset.pcat).pool.cat = el.value; persist(); render(); return; }
  });

  $('#resetBtn').addEventListener('click', function () {
    D = seed(); UI.selected = {}; UI.dept = 'all'; persist();
    $$('[data-start]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.start === 'setup')); });
    go('#skills'); toast('Demo reset to the sample data');
  });

  // ---------- Phone menu ----------
  function setNav(open) {
    document.body.classList.toggle('nav-open', open);
    $('#menuBtn').setAttribute('aria-expanded', String(open));
    $('#menuBtn').setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    if (open) { var on = $('.side nav a.on') || $('.side nav a'); if (on) on.focus(); }
  }
  $('#menuBtn').addEventListener('click', function () { setNav(!document.body.classList.contains('nav-open')); });
  $('#navScrim').addEventListener('click', function () { setNav(false); });
  $('#sideNav').addEventListener('click', function (e) { if (e.target.closest('a')) setNav(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && document.body.classList.contains('nav-open')) { setNav(false); $('#menuBtn').focus(); } });

  parseRoute(); render();
})();
</script>
</body>
</html>
