<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas Learner Performance</title>
    <style>
@import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap");

@property --value {
  syntax: "<number>";
  inherits: false;
  initial-value: 0;
}

:root {
  --bg: #f5f7fa;
  --surface: #ffffff;
  --line: #dfe5ec;
  --text: #162338;
  --muted: #657184;
  --navy: #31435e;
  --blue: #147fa4;
  --cyan: #20b9cb;
  --yellow: #ffbf2e;
  --shadow: 0 10px 24px rgba(16, 24, 40, 0.06);
  font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
}

h1,
h2,
h3,
.card-value,
.course-card strong {
  font-family: Montserrat, sans-serif;
}

button,
a,
select {
  font: inherit;
}

.topnav {
  height: 65px;
  max-height: 65px;
  background: #fff;
  border-bottom: 1px solid var(--line);
}

.nav-inner {
  height: 100%;
  max-width: 1700px;
  margin: 0 auto;
  padding: 0 72px;
  display: grid;
  grid-template-columns: 250px 1fr 120px;
  align-items: center;
}

.brand {
  width: 145px;
}

.topnav nav {
  display: flex;
  justify-content: center;
  gap: 42px;
  height: 100%;
}

.topnav a {
  position: relative;
  display: inline-flex;
  align-items: center;
  color: #6b7280;
  text-decoration: none;
  font-size: 18px;
  font-weight: 500;
}

.topnav a.active {
  color: #087ca5;
  font-weight: 800;
}

.topnav a.active::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 0;
  width: 42px;
  height: 5px;
  border-radius: 999px 999px 0 0;
  background: var(--yellow);
  transform: translateX(-50%);
}

.nav-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 20px;
}

.nav-actions button {
  width: 32px;
  height: 32px;
  border: 0;
  background: transparent;
  color: #087ca5;
  cursor: pointer;
}

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #22bfd0;
  color: #fff;
  font-weight: 800;
}

.hero {
  min-height: 188px;
  max-height: 188px;
  background:
    radial-gradient(ellipse at -6% 50%, transparent 0 17%, rgba(255,255,255,.08) 17.3% 17.6%, transparent 18% 100%),
    repeating-radial-gradient(ellipse at -6% 50%, transparent 0 135px, rgba(255,255,255,.07) 137px 139px),
    var(--navy);
  color: #fff;
}

.hero-inner {
  max-width: 1700px;
  margin: 0 auto;
  padding: 42px 72px 28px;
}

.hero h1 {
  margin: 0;
  font-size: 38px;
  line-height: 1.1;
  font-weight: 800;
}

.hero p {
  margin: 16px 0 0;
  font-size: 18px;
}

.date-band {
  height: 72px;
  background: #fff;
  display: grid;
  place-items: center;
}

.date-filter {
  width: 380px;
  height: 44px;
  border: 1px solid var(--line);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  color: #7a8495;
  font-size: 16px;
}

.content {
  max-width: 1700px;
  margin: 0 auto;
  padding: 24px 72px 80px;
}

.tabs {
  display: inline-flex;
  gap: 8px;
  padding: 6px;
  border-radius: 14px;
  background: #edf1f5;
  margin-bottom: 16px;
}

.tab {
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  padding: 11px 22px;
  font-weight: 800;
  cursor: pointer;
}

.tab.active {
  background: #fff;
  color: var(--text);
  box-shadow: 0 2px 5px rgba(16, 24, 40, 0.08);
}

.breadcrumb {
  min-height: 30px;
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--muted);
  font-size: 12px;
}

.breadcrumb button,
.back-button {
  border: 1px solid var(--blue);
  border-radius: 10px;
  background: #fff;
  color: var(--blue);
  font-weight: 800;
  cursor: pointer;
  padding: 9px 14px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.breadcrumb button {
  border: 0;
  border-radius: 0;
  padding: 0;
  background: transparent;
}

.summary-grid {
  display: grid;
  grid-template-columns: 420px 1fr;
  gap: 30px;
}

.panel {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 32px;
}

.panel h2 {
  margin: 0;
  font-size: 21px;
  line-height: 1.2;
}

.donut-card {
  min-height: 430px;
}

.donut-wrap {
  min-height: 310px;
  display: grid;
  place-items: center;
}

.donut {
  --size: 210px;
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: conic-gradient(var(--ring-color, var(--blue)) calc(var(--value) * 1%), #e5e8ed 0);
  position: relative;
}

.donut::before {
  content: "";
  position: absolute;
  inset: 34px;
  border-radius: inherit;
  background: #fff;
}

.donut-content {
  position: relative;
  text-align: center;
}

.donut-content strong {
  display: block;
  font-size: 30px;
  line-height: 1;
}

.donut-content span {
  display: block;
  margin-top: 8px;
  color: var(--muted);
  font-size: 14px;
}

.course-tile-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(210px, 1fr));
  gap: 18px;
  margin-top: 18px;
}

.course-tile {
  min-height: 250px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 8px 18px rgba(16, 24, 40, 0.04);
  padding: 20px;
  display: flex;
  flex-direction: column;
  text-align: left;
  cursor: pointer;
  transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
}

.course-tile:hover {
  border-color: #8ccedf;
  box-shadow: 0 14px 28px rgba(20, 127, 164, .13);
  transform: translateY(-2px);
}

.course-tile:focus-visible {
  outline: 3px solid rgba(20, 127, 164, .25);
  outline-offset: 3px;
}

.course-tile-ring {
  display: grid;
  place-items: center;
  min-height: 152px;
  gap: 16px;
  margin-bottom: 8px;
}

.course-tile-ring > span {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.2;
}

.course-tile-copy {
  margin-top: 10px;
}

.course-tile-copy strong {
  display: block;
  font-family: Montserrat, sans-serif;
  font-size: 14px;
  line-height: 1.25;
}

.course-tile-copy span {
  display: block;
  margin-top: 6px;
  color: var(--muted);
  font-size: 12px;
}

.course-tile-footer {
  margin-top: auto;
  display: flex;
  justify-content: flex-end;
}

.course-tile-footer > span {
  justify-self: end;
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
}

.course-tile .progress-wrap {
  grid-template-columns: 1fr 38px;
}

.course-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(220px, 1fr));
  gap: 22px;
}

.course-card {
  min-height: 254px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fff;
  box-shadow: var(--shadow);
  padding: 24px;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  position: relative;
  transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
}

.course-card:hover {
  border-color: #a9d8e7;
  box-shadow: 0 12px 26px rgba(20, 127, 164, .12);
  transform: translateY(-2px);
}

.ring-wrap {
  display: grid;
  place-items: center;
  flex: 1;
}

.ring {
  --size: 112px;
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: conic-gradient(var(--ring-color, var(--blue)) calc(var(--value) * 1%), #e7ebf0 0);
  position: relative;
  animation: ring-grow 0.9s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

@keyframes ring-grow {
  from { --value: 0; }
}

.ring::before {
  content: "";
  position: absolute;
  inset: 14px;
  border-radius: inherit;
  background: #fff;
}

.ring b {
  position: relative;
  font-size: 15px;
}

.course-card strong {
  display: block;
  font-size: 14px;
}

.course-card span {
  display: block;
  margin-top: 6px;
  color: var(--muted);
  font-size: 12px;
}

.course-card::after {
  content: "View details";
  position: absolute;
  right: 18px;
  bottom: 18px;
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
}

.detail-head,
.skills-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 24px;
  margin-bottom: 24px;
}

.detail-head p,
.skills-head p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.detail-grid,
.skills-grid {
  display: grid;
  grid-template-columns: minmax(480px, .95fr) minmax(430px, 1.05fr);
  gap: 24px;
}

.detail-grid {
  grid-template-columns: minmax(420px, .82fr) minmax(480px, 1.18fr);
  align-items: start;
}

.sticky-radar {
  position: sticky;
  top: 24px;
}

.radar-wrap {
  min-height: 360px;
  display: grid;
  place-items: center;
}

.radar {
  width: 440px;
  height: 420px;
  overflow: visible;
}

.radar polygon.grid {
  fill: none;
  stroke: #edf0f3;
  stroke-width: 4;
}

.radar line {
  stroke: #eef1f4;
  stroke-width: 4;
}

.radar polygon.value {
  fill: rgba(20, 127, 164, .22);
  stroke: var(--blue);
  stroke-width: 3;
  transform-origin: 200px 200px;
  animation: radar-grow 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

@keyframes radar-grow {
  from { transform: scale(0); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

.radar text {
  fill: #344054;
  stroke: none;
  font-size: 10px;
  font-weight: 800;
}

.breakdown {
  display: grid;
  gap: 14px;
}

.taxonomy-section {
  margin-top: 0;
}

.sticky-radar h2,
.taxonomy-section h2 {
  font-size: 18px;
  margin-bottom: 14px;
}

.strand-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}

.strand-card[open] {
  background: #fff;
}

.strand-card summary {
  list-style: none;
  cursor: pointer;
}

.strand-card summary::-webkit-details-marker,
.substrand-card summary::-webkit-details-marker {
  display: none;
}

.strand-head {
  display: grid;
  grid-template-columns: minmax(180px, 1fr) 170px 18px;
  gap: 16px;
  align-items: center;
  padding: 15px 16px;
  background: #fbfcfd;
}

.chevron {
  color: var(--blue);
  display: inline-flex;
  transition: transform .16s ease;
}

.chevron svg {
  width: 16px;
  height: 16px;
}

.strand-card:not([open]) .strand-head .chevron,
.substrand-card:not([open]) .substrand-head .chevron {
  transform: rotate(-90deg);
}

.strand-head strong,
.skill-row strong {
  display: block;
  font-size: 12px;
}

.strand-head small,
.skill-row span {
  color: var(--muted);
  font-size: 11px;
}

.progress-wrap {
  display: grid;
  grid-template-columns: 1fr 38px;
  align-items: center;
  gap: 10px;
}

.progress {
  height: 8px;
  border-radius: 999px;
  background: #e7ebf0;
  overflow: hidden;
}

.progress span {
  display: block;
  width: var(--value);
  height: 100%;
  background: var(--bar-color, var(--blue));
}

.course-overview-panel {
  max-width: none;
}

.progress-wrap b {
  text-align: right;
  font-size: 12px;
}

.topic-list {
  padding: 8px 16px 16px;
  display: grid;
  gap: 10px;
}

.substrand-card {
  border-top: 1px solid #eef2f6;
  padding: 10px 0;
}

.substrand-card:first-child {
  border-top: 0;
}

.substrand-head {
  display: grid;
  grid-template-columns: minmax(230px, 1fr) 170px 18px;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  list-style: none;
}

.substrand-head strong {
  display: block;
  font-size: 14px;
}

.topic-rows {
  display: grid;
  gap: 7px;
  margin-top: 8px;
  padding-left: 14px;
}

.topic-row {
  display: grid;
  grid-template-columns: minmax(230px, 1fr) 150px 42px;
  gap: 12px;
  align-items: center;
  font-size: 12px;
  padding: 8px 0;
}

.topic-row span {
  min-width: 0;
  display: block;
}

.topic-row .progress,
.substrand-head .progress,
.strand-head .progress {
  width: 100%;
}

.skills-summary {
  min-width: 120px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  text-align: center;
}

.skills-summary strong {
  display: block;
  font-size: 20px;
  line-height: 1;
}

.skills-summary span {
  color: var(--muted);
  font-size: 11px;
}

.skill-list {
  display: grid;
  gap: 12px;
}

.skill-row {
  display: grid;
  grid-template-columns: 1fr 160px;
  gap: 16px;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}

.skill-row:last-child {
  border-bottom: 0;
}

.cbl-head {
  margin-bottom: 18px;
}

.cbl-head h2,
.cbl-panel-head h2 {
  margin: 0;
  font-size: 21px;
}

.cbl-head p,
.cbl-panel-head p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.cbl-summary {
  display: grid;
  grid-template-columns: repeat(4, minmax(160px, 1fr));
  gap: 16px;
  margin-bottom: 22px;
}

.cbl-stat {
  min-height: 96px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fff;
  box-shadow: var(--shadow);
  padding: 18px;
}

.cbl-stat span {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

.cbl-stat strong {
  display: block;
  margin-top: 8px;
  font-family: Montserrat, sans-serif;
  font-size: 24px;
  line-height: 1;
}

.cbl-panel-head {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  align-items: flex-start;
  margin-bottom: 18px;
}

.cbl-panel-head > span {
  color: var(--muted);
  font-size: 12px;
}

.cbl-list {
  display: grid;
  gap: 12px;
}

.cbl-tile-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(190px, 1fr));
  gap: 14px;
}

.cbl-tile {
  min-height: 286px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  display: flex;
  flex-direction: column;
  padding: 16px;
  transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
}

.cbl-tile:hover {
  border-color: #a7d3e3;
  box-shadow: 0 12px 24px rgba(15, 23, 42, .07);
  transform: translateY(-2px);
}

.cbl-tile-ring {
  display: flex;
  justify-content: center;
  padding: 8px 0 10px;
}

.cbl-score-caption {
  display: block;
  margin-bottom: 20px;
  color: var(--muted);
  text-align: center;
  font-size: 12px;
  font-weight: 700;
}

.empty-ring {
  background: conic-gradient(#e7ebf0 100%, #e7ebf0 0);
}

.cbl-tile-meta {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 14px;
  color: var(--muted);
  font-size: 12px;
}

.cbl-tile-meta strong {
  color: var(--ink);
  font-size: 12px;
  text-align: right;
}

.cbl-tile .cbl-action {
  margin-top: auto;
  padding-top: 16px;
}

.cbl-tile .cbl-action::before {
  content: "";
}

.cbl-tile .cbl-action:has(.mode-pill)::before {
  display: none;
}

.cbl-row {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) 120px minmax(200px, 280px) 140px;
  align-items: center;
  gap: 18px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
}

.cbl-title strong,
.cbl-stage strong {
  display: block;
  font-family: Montserrat, sans-serif;
  font-size: 14px;
}

.mode-label {
  display: inline-flex !important;
  align-items: center;
  gap: 6px;
}

.mode-label svg {
  width: 15px;
  height: 15px;
  color: var(--blue);
}

.cbl-title span,
.cbl-stage span,
.cbl-milestone > span {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

.cbl-title span {
  margin-top: 5px;
}

.cbl-stage strong {
  margin-top: 5px;
}

.cbl-milestone > span {
  margin-bottom: 8px;
}

.cbl-action {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.cbl-action .mode-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 999px;
  background: #eef6f8;
  color: var(--blue);
  padding: 5px 9px;
  font-size: 11px;
  font-weight: 800;
  text-align: right;
}

.cbl-action .mode-pill svg {
  width: 13px;
  height: 13px;
}

.no-attempt-score {
  color: var(--muted);
  font-size: 12px;
  padding: 7px 0;
}

.cbl-action button {
  border: 1px solid var(--blue);
  border-radius: 8px;
  background: #fff;
  color: var(--blue);
  padding: 7px 10px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}

.cbl-detail {
  padding: 40px;
}

.cbl-detail .detail-head {
  margin-bottom: 30px;
}

.cbl-detail .detail-head h2 {
  max-width: 880px;
  line-height: 1.28;
}

.cbl-detail .detail-head p {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.55;
}

.cbl-detail-summary {
  display: grid;
  grid-template-columns: repeat(5, minmax(120px, 1fr));
  gap: 16px;
  margin-bottom: 30px;
}

.cbl-detail-summary article {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px;
  background: #fff;
}

.cbl-detail-summary span {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

.cbl-detail-summary strong {
  display: block;
  margin-top: 9px;
  font-family: Montserrat, sans-serif;
  font-size: 20px;
}

.cbl-detail-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(280px, .75fr);
  gap: 32px;
}

.cbl-detail-actions {
  display: flex;
  gap: 10px;
  margin: -10px 0 24px;
}

.case-context {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
}

.case-context {
  margin-bottom: 26px;
}

.case-context summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 17px 18px;
  color: var(--ink);
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  list-style: none;
}

.case-context summary::-webkit-details-marker {
  display: none;
}

.case-context summary svg {
  width: 16px;
  height: 16px;
  color: var(--blue);
  transition: transform .18s ease;
}

.case-context[open] summary svg {
  transform: rotate(180deg);
}

.case-context-body {
  border-top: 1px solid var(--line);
  padding: 20px 18px 22px;
}

.case-context-body p {
  margin: 0 0 20px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.65;
}

.case-context-body .role-grid {
  margin: 0 0 24px;
}

.case-context-body h3 {
  margin: 0 0 10px;
  font-family: Montserrat, sans-serif;
  font-size: 15px;
}

.case-context-body .criteria-list {

function svgIcon(name) {

function hydrateIcons() {

function progress(value) {
  return `<div class="progress-wrap"><div class="progress"><span style="--value:${value}%; --bar-color:${completionColor(value)}"></span></div><b>${value}%</b></div>`;
}

function completionColor(value) {
  if (value < 50) return "#EF4444";
  if (value <= 75) return "#F5B83D";
  return "#5EC26A";
}

function average(values) {
  return Math.round(values.reduce((total, value) => total + value, 0) / values.length);
}

function subStrandScore(topics) {
  return average(topics.map(([, value]) => value));
}

function radarPoints(items, radius, center, valueKey = "progress") {
  return items.map((item, index) => {
    const angle = -Math.PI / 2 + (Math.PI * 2 * index) / items.length;
    const r = radius * (item[valueKey] / 100);
    return `${center + Math.cos(angle) * r},${center + Math.sin(angle) * r}`;
  }).join(" ");
}

function renderRadar(items) {
  const center = 200;
  const radius = 138;
  const rings = [25, 50, 75, 100].map((value) => {
    const ringItems = items.map((item) => ({ ...item, progress: value }));
    return `<polygon class="grid" points="${radarPoints(ringItems, radius, center)}"></polygon>`;
  }).join("");
  const axes = items.map((_, index) => {
    const angle = -Math.PI / 2 + (Math.PI * 2 * index) / items.length;
    return `<line x1="${center}" y1="${center}" x2="${center + Math.cos(angle) * radius}" y2="${center + Math.sin(angle) * radius}"></line>`;
  }).join("");
  const labels = items.map((item, index) => {
    const angle = -Math.PI / 2 + (Math.PI * 2 * index) / items.length;
    const x = center + Math.cos(angle) * (radius + 34);
    const y = center + Math.sin(angle) * (radius + 30);
    const anchor = Math.abs(Math.cos(angle)) < 0.2 ? "middle" : Math.cos(angle) > 0 ? "start" : "end";
    return `<text x="${x}" y="${y}" text-anchor="${anchor}">${item.label || item.name}</text>`;
  }).join("");
  return `<svg class="radar" viewBox="0 0 400 400">${rings}${axes}<polygon class="value" points="${radarPoints(items, radius, center)}"></polygon>${labels}</svg>`;
}

function strandAvgScore(strand) {
  const allScores = strand.sub
    .flatMap(([, topics]) => topics.map(([,, score]) => score))
    .filter((s) => s !== null);
  return allScores.length > 0 ? Math.round(allScores.reduce((a, b) => a + b, 0) / allScores.length) : 0;
}

function scoringStats() {
  const allTopics = strands.flatMap((s) => s.sub.flatMap(([, topics]) => topics));
  const attempted = allTopics.filter(([,, score]) => score !== null);
  const passedTopics = attempted.filter(([,, score]) => score >= PASS_SCORE);
  const failedTopics = attempted.filter(([,, score]) => score < PASS_SCORE);
  const avgPassed = passedTopics.length > 0
    ? Math.round(passedTopics.reduce((sum, [,, score]) => sum + score, 0) / passedTopics.length)
    : 0;
  return {
    total: allTopics.length,
    passed: passedTopics.length,
    failed: failedTopics.length,
    notAttempted: allTopics.length - attempted.length,
    avgScore: avgPassed,
  };
}

function renderScoringDonut({ avgScore }) {

    </div>
    <span class="scoring-ring-label" data-tooltip="Average of scores from topics the learner has passed (≥70%). Each score reflects their most recent attempt.">Average Score</span>
  `;
}

function scoringBubbleColor(avg) {
  if (!avg) return "#c4c4c4";
  if (avg >= 80) return "#0CAD60";
  if (avg >= 50) return "#f59e0b";
  return "#E73636";
}

                <summary class="substrand-head"><strong>${subName}</strong>${progress(subStrandScore(topics))}<span class="chevron">${svgIcon("chevronDown")}</span></summary>
                <div class="topic-rows">
                  ${topics.map(([topic, value]) => `<div class="topic-row"><span>${topic}</span><div class="progress"><span style="--value:${value}%; --bar-color:${completionColor(value)}"></span></div><b>${value}%</b></div>`).join("")}
                </div>
              </details>
            `).join("")}
          </div>
        </details>
      `).join("")}
    </div>
  `;
}

const PASS_SCORE = 70;

function renderScoringView() {
  return `
    <h2>Review Test Scores</h2>
    <p class="scoring-note">Minimum passing score: ${PASS_SCORE}% per topic.</p>
    <div class="breakdown">
      ${strands.map((strand) => {
        const avg = strandAvgScore(strand);
        return `
          <details class="strand-card" open>
            <summary class="strand-head">
              <div><strong>${strand.name}</strong><small>Avg. ${avg}%</small></div>
              ${progress(avg)}
              <span class="chevron">${svgIcon("chevronDown")}</span>
            </summary>
            <div class="topic-list">
              ${strand.sub.map(([subName, topics]) => `
                <div class="substrand-scoring">
                  <span class="substrand-scoring-label">${subName}</span>
                  <div class="scoring-topic-rows">
                    ${topics.map(([name,, score]) => {
                      const passed = score >= PASS_SCORE;
                      return `
                        <div class="scoring-topic-row">
                          <span>${name}</span>
                          <div class="progress"><span style="--value:${score}%; --bar-color:${completionColor(score)}"></span></div>
                          <b>${score}%</b>
                          <span class="score-badge ${passed ? "passed" : "not-passed"}">${passed ? "Passed" : "Not yet"}</span>
                        </div>
                      `;
                    }).join("")}
                  </div>
                </div>
              `).join("")}
            </div>
          </details>
        `;
      }).join("")}
    </div>
  `;
}

function renderCourseDetail() {
  const stats = scoringStats();
  appView.innerHTML = `
    <section class="panel">
      <div class="detail-head">
        <div>
          <h2>${state.selectedCourse.name}</h2>
          <p>Knowledge progress and review test scores by strand, sub-strand, and topic.</p>
        </div>
        <button class="back-button" type="button" data-action="overview"><i data-icon="arrow"></i> Back to PALS courses</button>
      </div>
      <div class="detail-grid">
        <section class="sticky-radar">
          <h2>Strands</h2>
          <div class="radar-wrap">${renderRadar(strands)}</div>
        </section>
        <section class="taxonomy-section">
          ${renderCompletionView()}
        </section>
      </div>
      <hr class="detail-divider">
      <div class="detail-scoring-section">
        <h2>Review Test Scores</h2>
        <div class="scoring-layout">
          <div class="scoring-chart-panel">
            ${renderScoringDonut(stats)}
            <div class="scoring-legend">
              <p class="scoring-legend-title">Out of ${stats.total} review topics</p>
              <div class="legend-item legend-green">
                <div class="legend-count">${stats.passed}</div>
                <div class="legend-info"><strong>Passed</strong><span>Scored 70% or above</span></div>
              </div>
              <div class="legend-item legend-amber">
                <div class="legend-count">${stats.failed}</div>
                <div class="legend-info"><strong>Not yet</strong><span>Attempted, below 70%</span></div>
              </div>
              <div class="legend-item legend-gray">
                <div class="legend-count">${stats.notAttempted}</div>
                <div class="legend-info"><strong>Not started</strong><span>Review test not taken</span></div>
              </div>
            </div>
          </div>
          <div class="scoring-list-panel">
            ${renderScoringTable()}
          </div>
        </div>
      </div>
    </section>
  `;
  hydrateIcons();
}

function renderSkills() {
  appView.innerHTML = `
    <section class="panel">
      <div class="skills-head">
        <div>
          <h2>Skills Analytics</h2>
          <p>Skill tags are derived from practice and review test questions answered in PALS courses.</p>
        </div>
        <div class="skills-summary"><strong>${skills.length}</strong><span>skills answered</span></div>
      </div>
      <div class="skills-grid">
        <div class="radar-wrap">${renderRadar(skills)}</div>
        <div class="skill-list">
          ${skills.map((skill) => `
            <div class="skill-row">
              <div><strong>${skill.name}</strong><span>${skill.questions} tagged questions</span></div>
              ${progress(skill.progress)}
            </div>
          `).join("")}
        </div>
      </div>
    </section>
  `;
}

function renderCBL() {
  const attemptedCases = cblChallenges.filter((challenge) => challenge.attempts > 0);
  const highestScores = attemptedCases.map((challenge) => Math.max(...challenge.history.map(([, , score]) => score)));
  const averageHighestScore = average(highestScores);
  const totalAttempts = cblChallenges.reduce((total, challenge) => total + challenge.attempts, 0);
  return `
    <section class="cbl-page">
      <div class="cbl-summary">
        <article class="cbl-stat"><span>Cases practised</span><strong>${attemptedCases.length}</strong></article>
        <article class="cbl-stat"><span>Total attempts</span><strong>${totalAttempts}</strong></article>
        <article class="cbl-stat"><span>Average highest score</span><strong>${averageHighestScore}%</strong></article>
        <article class="cbl-stat"><span>Practice time</span><strong>1h 26m</strong></article>
      </div>
      <section class="panel cbl-panel">
        <div class="cbl-panel-head">
          <div>
            <h2>Practice & Roleplay Cases</h2>
            <p>Track your highest score and review feedback from each case.</p>
          </div>
          <span>${cblChallenges.length} available cases</span>
        </div>
        <div class="cbl-tile-grid">
          ${cblChallenges.map((challenge) => {
            const highestScore = challenge.attempts ? Math.max(...challenge.history.map(([, , score]) => score)) : null;
            return `
            <article class="cbl-tile">
              <div class="cbl-tile-ring">
                ${challenge.attempts ? `<div class="ring" style="--value:${highestScore}; --ring-color:${completionColor(highestScore)}"><b>${highestScore}%</b></div>` : `<div class="ring empty-ring"><b>--</b></div>`}
              </div>
              <span class="cbl-score-caption">${challenge.attempts ? "Highest score" : "No score yet"}</span>
              <div class="cbl-title">
                <strong>${challenge.name}</strong>
                <span>Role: ${challenge.role}</span>
              </div>
              <div class="cbl-tile-meta"><span>${challenge.attempts ? challenge.activity : "Not attempted yet"}</span><strong>${challenge.attempts} total attempts</strong></div>
              <div class="cbl-action">
                ${challenge.history[0]?.[3] ? `<span class="mode-pill">${challenge.history[0][3] === "Live" ? svgIcon("mic") : svgIcon("message")} Last attempt: ${challenge.history[0][3]}</span>` : ""}
                <button type="button" ${challenge.attempts ? `data-case="${challenge.id}"` : "data-practice-again"}>${challenge.attempts ? "View details" : "Start practice"}</button>
              </div>
            </article>
          `}).join("")}
        </div>
      </section>
      ${renderPracticeModal("Start a new case-based learning practice session.")}
    </section>
  `;
}

function renderPracticeModal(description) {
  return `
    <dialog class="practice-modal" id="practiceModal">
      <form method="dialog">
        <div class="practice-modal-head">
          <div>
            <h3>Choose practice mode</h3>
            <p>${description}</p>
          </div>
          <button class="modal-close" type="submit" aria-label="Close">x</button>
        </div>
        <div class="practice-mode-grid">
          <button class="practice-mode-card" type="submit" value="turn-based">
            <strong>${svgIcon("message")} Turn-based</strong>
            <span>Exchange messages one turn at a time. Great when you want to think through each response.</span>
          </button>
          <button class="practice-mode-card" type="submit" value="live">
            <strong>${svgIcon("mic")} Live</strong>
            <span>Speak naturally in real time. The AI listens and replies as you talk, like a phone call.</span>
          </button>
        </div>
      </form>
    </dialog>
  `;
}

function renderCBLDetail() {
  const item = state.selectedCase;
  const latestMode = item.history[0]?.[3];
  const itemHighestScore = Math.max(...item.history.map(([, , score]) => score));
  const historyAscending = [...item.history].reverse();
  return `
    <section class="panel cbl-detail">
      <div class="detail-head">
        <div>
          <h2>${item.name}</h2>
          <p>Your role: ${item.role} - AI role: ${item.aiRole}</p>
        </div>
        <button class="back-button" type="button" data-cbl-action="overview">${svgIcon("arrow")} Back to CBL analytics</button>
      </div>
      <div class="cbl-detail-summary">
        <article><span>Highest score</span><strong>${itemHighestScore}%</strong></article>
        <article><span>Latest attempt marks</span><strong>${item.points || Math.round(item.score / 10) + "/10"}</strong></article>
        <article><span>Total attempts</span><strong>${item.attempts}</strong></article>
        <article><span>Total practice time</span><strong>${item.duration}</strong></article>
        <article><span>Last attempt mode</span><strong class="mode-label">${latestMode === "Live" ? svgIcon("mic") : svgIcon("message")} ${latestMode}</strong></article>
      </div>
      <details class="case-context">
        <summary>
          <span>Case scenario and roles</span>
          ${svgIcon("chevronDown")}
        </summary>
        <div class="case-context-body">
          <p>${item.description}</p>
          <div class="role-grid">
            <article><span>Your Role</span><strong>${item.role}</strong></article>
            <article><span>AI Role</span><strong>${item.aiRole}</strong></article>
          </div>
          <h3>Success Criteria</h3>
          <div class="criteria-list">
            ${item.criteria.map(([criterion, points, demonstrated], index) => `
              <article class="criteria-row ${demonstrated ? "demonstrated" : ""}">
                <span class="criteria-number">${index + 1}</span>
                <div>
                  <strong>${criterion}</strong>
                  <div class="criteria-meta">
                    <span>${points} points</span>
                    <b>${demonstrated ? "Demonstrated" : "Not demonstrated"}</b>
                  </div>
                </div>
              </article>
            `).join("")}
          </div>
        </div>
      </details>
      <section class="feedback-summary">
        <div>
          <h3>Summary Feedback</h3>
          <span class="feedback-period">Based on your latest attempt</span>
          <p>${item.feedbackSummary}</p>
        </div>
        <div class="feedback-summary-grid">
          <article>
            <span>What went well</span>
            <strong>${item.strengths}</strong>
          </article>
          <article>
            <span>Focus next</span>
            <strong>${item.nextFocus}</strong>
          </article>
        </div>
      </section>
      <div class="cbl-detail-grid">
        <section>
          <h3>Detailed Feedback</h3>
          <p class="section-note">Category scores and feedback from your latest attempt.</p>
          <div class="criteria-breakdown detail-column-feedback">
            ${item.breakdown.map(([name, score, total, feedback, observed, nextStep]) => `
              <article class="breakdown-card">
                <div class="breakdown-card-head">
                  <div>
                    <strong>${name}</strong>
                    <span>${Math.round((score / total) * 100)}% category score</span>
                  </div>
                  <b>${score}/${total}</b>
                </div>
                <div class="breakdown-feedback">
                  <span>Feedback</span>
                  <p>${feedback}</p>
                </div>
                <div class="breakdown-insights">
                  <div>
                    <span>What you demonstrated</span>
                    <p>${observed}</p>
                  </div>
                  <div>
                    <span>Try in your next attempt</span>
                    <p>${nextStep}</p>
                  </div>
                </div>
              </article>
            `).join("")}
          </div>
        </section>
        <section>
          <h3>Attempt Score Trend</h3>
          <div class="trend-chart">
            <div class="trend-chart-inner">
              ${historyAscending.map(([attempt,, score]) => `
                <div class="trend-column">
                  <b>${score}%</b>
                  <span style="--trend-value:${score}%; --trend-color:${completionColor(score)}"></span>
                  <small>${attempt.replace("Attempt ", "#")}</small>
                </div>
              `).join("")}
            </div>
          </div>
          <h3>Attempt History</h3>
          <div class="attempt-list compact">
            ${item.history.map(([attempt, date, score, mode]) => `
              <article class="attempt-row">
                <div>
                  <strong>${attempt}</strong>
                  <span>${date}</span>
                  <small class="attempt-mode">${mode === "Live" ? svgIcon("mic") : svgIcon("message")} ${mode}</small>
                </div>
                <div class="attempt-row-action">
                  <b>${score}%</b>
                  <button type="button">View record</button>
                </div>
              </article>
            `).join("")}
          </div>
        </section>
      </div>
      ${renderPracticeModal(`Start a new attempt for ${item.name}.`)}
    </section>
  `;
}

function render() {
  document.querySelectorAll("[data-tab]").forEach((tab) => {
    tab.classList.toggle("active", tab.dataset.tab === state.tab);
  });
  renderBreadcrumb();

  if (state.tab === "skills") {
    renderSkills();
    return;
  }

  if (state.tab === "cbl") {
    if (state.selectedCase) {
      appView.innerHTML = renderCBLDetail();
    } else {
      appView.innerHTML = renderCBL();
    }
    return;
  }

  if (state.level === "detail") {
    renderCourseDetail();
  } else {
    renderOverview();
  }
}

document.addEventListener("click", (event) => {
  const tab = event.target.closest("[data-tab]");
  if (tab) {
    state.tab = tab.dataset.tab;
    state.level = "overview";
    state.selectedCourse = null;
    state.selectedCase = null;
    render();
    return;
  }

  const strandToggle = event.target.closest("[data-strand-toggle]");
  if (strandToggle) {
    const name = strandToggle.dataset.strandToggle;
    const rows = [...document.querySelectorAll(`[data-strand-row="${name}"]`)];
    const expanded = rows[0] && rows[0].style.display !== "none";
    strandToggle.classList.toggle("collapsed", expanded);
    rows.forEach((r) => { r.style.display = expanded ? "none" : ""; });
    return;
  }

  const modeBtn = event.target.closest("[data-mode]");
  if (modeBtn) {
    state.viewMode = modeBtn.dataset.mode;
    render();
    return;
  }

  const course = event.target.closest("[data-course]");
  if (course) {
    state.selectedCourse = courses.find((item) => item.id === course.dataset.course);
    state.level = "detail";
    render();
    return;
  }

  const action = event.target.closest("[data-action]");
  if (action) {
    state.level = "overview";
    state.selectedCourse = null;
    render();
  }

  const caseButton = event.target.closest("[data-case]");
  if (caseButton) {
    state.selectedCase = cblChallenges.find((item) => item.id === caseButton.dataset.case);
    render();
    return;
  }

  const cblAction = event.target.closest("[data-cbl-action]");
  if (cblAction) {
    state.selectedCase = null;
    render();
  }

  const practiceAgain = event.target.closest("[data-practice-again]");
  if (practiceAgain) {
    document.querySelector("#practiceModal")?.showModal();
  }
});

hydrateIcons();
render();
    </script>
  </body>
</html>
