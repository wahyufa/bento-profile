<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Psychometric Assessment</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

    :root {
      --bg: #f6f8fa;
      --panel: #ffffff;
      --text: #12263f;
      --muted: #66738a;
      --line: #dbe4ec;
      --line-soft: #eef3f7;
      --brand: #0fb0f8;
      --brand-dark: #078fd0;
      --navy: #31445f;
      --green: #18a777;
      --amber: #c88400;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button { font: inherit; }

    .topbar {
      min-height: 70px;
      background: var(--navy);
      color: #fff;
    }

    .topbar-inner {
      width: min(1250px, calc(100% - 40px));
      margin: 0 auto;
      min-height: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .atlas-brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #111827;
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .atlas-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 2px solid #38a3cf;
      border-radius: 8px;
      color: #ef7d22;
      transform: rotate(-3deg);
    }

    .atlas-mark svg {
      width: 25px;
      height: 25px;
    }

    .atlas-byline {
      display: block;
      margin-top: -5px;
      color: #111827;
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .top-nav {
      display: inline-flex;
      align-items: center;
      gap: 30px;
      color: #687386;
      font-size: 15px;
      font-weight: 500;
    }

    .top-nav span {
      position: relative;
      white-space: nowrap;
    }

    .top-nav span.active {
      color: #0c789d;
      font-weight: 700;
    }

    .top-nav span.active::after {
      position: absolute;
      left: 50%;
      bottom: -22px;
      width: 31px;
      height: 4px;
      border-radius: 999px;
      background: #ffb000;
      content: "";
      transform: translateX(-50%);
    }

    .top-actions {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #0c789d;
    }

    .icon-only {
      display: inline-grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #0c789d;
      cursor: pointer;
    }

    .help-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 0 13px;
      border-radius: 999px;
      background: #0c789d;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .user-dot {
      display: inline-grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 999px;
      background: #20b7c6;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border: 0;
      background: transparent;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,.82);
      font-size: 13px;
      font-weight: 700;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--brand);
    }

    .brand-pill {
      visibility: hidden;
    }

    main {
      width: min(1120px, calc(100% - 36px));
      margin: 0 auto;
      padding: 54px 0 70px;
    }

    .hero {
      display: grid;
      justify-items: center;
      gap: 14px;
      margin: 24px auto 26px;
      text-align: center;
    }

    .hero-icon {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border-radius: 14px;
      background: #e8f7ff;
      color: var(--brand-dark);
      font-size: 23px;
    }

    .hero-icon svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(25px, 3vw, 36px);
      line-height: 1.1;
      font-weight: 700;
    }

    .hero p {
      max-width: 660px;
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .assessment-shell {
      width: min(960px, 100%);
      margin: 0 auto;
    }

    .card, .report-card {
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: none;
    }

    .content-stack { display: grid; gap: 18px; }

    .progress-card {
      padding: 16px 18px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .86);
    }

    .progress-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .progress-track {
      height: 7px;
      padding: 2px;
      overflow: hidden;
      border-radius: 999px;
      background: #eef4f8;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8ddfff 0%, var(--brand) 100%);
      transition: width .35s ease;
    }

    .card { padding: 22px 24px; }

    .dashboard-screen {
      display: block;
      width: 100vw;
      margin-top: -54px;
      margin-left: calc(50% - 50vw);
      padding: 0 0 58px;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .dashboard-banner {
      position: relative;
      overflow: hidden;
      min-height: 228px;
      background: #31445f;
      color: #fff;
    }

    .dashboard-banner::before {
      position: absolute;
      inset: -90px auto auto -70px;
      width: 1250px;
      height: 410px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow:
        145px 0 0 rgba(255,255,255,.07),
        290px 0 0 rgba(255,255,255,.07),
        435px 0 0 rgba(255,255,255,.07),
        580px 0 0 rgba(255,255,255,.07),
        725px 0 0 rgba(255,255,255,.07),
        870px 0 0 rgba(255,255,255,.07),
        1015px 0 0 rgba(255,255,255,.07);
      content: "";
    }

    .dashboard-banner-inner {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      align-items: end;
      width: min(1250px, calc(100% - 40px));
      min-height: 228px;
      margin: 0 auto;
      gap: 32px;
    }

    .dashboard-banner-copy {
      align-self: center;
      max-width: 610px;
      padding: 28px 0;
    }

    .dashboard-banner h2 {
      margin: 0 0 10px;
      color: #fff;
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(31px, 4vw, 40px);
      line-height: 1.12;
      font-weight: 700;
    }

    .dashboard-banner p {
      max-width: 430px;
      margin: 0;
      color: rgba(255,255,255,.92);
      font-size: 17px;
      line-height: 1.45;
    }

    .type-pill {
      display: inline-flex;
      margin-top: 12px;
      min-height: 27px;
      align-items: center;
      padding: 0 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.18);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .banner-person {
      position: relative;
      display: grid;
      width: 235px;
      height: 205px;
      place-items: end center;
      justify-self: center;
    }

    .banner-person::before {
      position: absolute;
      bottom: -54px;
      width: 235px;
      height: 235px;
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      content: "";
    }

    .person-illustration {
      position: relative;
      display: grid;
      width: 144px;
      height: 170px;
      justify-items: center;
      align-content: start;
    }

    .person-hair {
      position: absolute;
      top: 2px;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: #6e3f28;
    }

    .person-face {
      position: relative;
      z-index: 1;
      width: 72px;
      height: 78px;
      margin-top: 17px;
      border-radius: 45% 45% 48% 48%;
      background: #f2c7a7;
    }

    .person-face::before,
    .person-face::after {
      position: absolute;
      top: 28px;
      width: 15px;
      height: 10px;
      border: 2px solid #12263f;
      border-radius: 999px;
      content: "";
    }

    .person-face::before { left: 15px; }
    .person-face::after { right: 15px; }

    .person-body {
      position: relative;
      z-index: 2;
      width: 124px;
      height: 86px;
      margin-top: -6px;
      border-radius: 34px 34px 0 0;
      background: #c99360;
    }

    .person-paper {
      position: absolute;
      z-index: 3;
      bottom: 10px;
      width: 88px;
      height: 64px;
      border-radius: 7px;
      background: #f4eadb;
      transform: rotate(-2deg);
    }

    .dashboard-welcome {
      width: min(840px, calc(100% - 40px));
      margin: 26px auto 30px;
      text-align: center;
    }

    .assistant-avatar {
      display: grid;
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      place-items: center;
      border-radius: 50%;
      background: #f1d2bf;
      color: #8b4e39;
      font-size: 28px;
      font-weight: 700;
    }

    .dashboard-welcome h2 {
      margin: 0 0 8px;
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(25px, 3vw, 32px);
      line-height: 1.12;
      font-weight: 700;
    }

    .dashboard-welcome p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .ask-box {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 42px;
      gap: 8px;
      width: min(670px, 100%);
      margin: 30px auto 12px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
    }

    .ask-placeholder {
      display: flex;
      align-items: center;
      min-height: 42px;
      padding: 0 12px;
      border-radius: 10px;
      background: #f2f4f7;
      color: #7a8394;
      text-align: left;
      font-size: 15px;
    }

    .send-button {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 0;
      border-radius: 12px;
      background: #89bdd0;
      color: #fff;
    }

    .prompt-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      max-width: 620px;
      margin: 0 auto;
    }

    .prompt-chip {
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: #66738a;
      font-size: 12px;
      font-weight: 700;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      width: min(1250px, calc(100% - 40px));
      margin: 0 auto;
    }

    .dashboard-card {
      display: grid;
      gap: 12px;
      min-height: 184px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      text-align: left;
    }

    .dashboard-card-icon {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 700;
    }

    .dashboard-card h3 {
      margin: 2px 0 0;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
    }

    .dashboard-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .dashboard-link {
      align-self: end;
      justify-self: start;
      border: 0;
      background: transparent;
      color: #0c789d;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }

    .section-kicker {
      margin: 0 0 4px;
      color: var(--brand-dark);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .card h2 {
      margin: 0;
      color: var(--text);
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 21px;
      font-weight: 700;
    }

    .card-caption {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .matrix-note {
      margin: 16px 0 0;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f4f7fa;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .question-matrix-wrap {
      margin-top: 0;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-top: 0;
      border-radius: 0 0 16px 16px;
      background: #fff;
    }

    .scale-sticky {
      position: sticky;
      z-index: 8;
      top: 0;
      display: grid;
      grid-template-columns: 44% repeat(6, minmax(0, 1fr));
      align-items: stretch;
      min-width: 820px;
      margin-top: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px 16px 0 0;
      background: var(--navy);
      color: #fff;
    }

    .scale-sticky-spacer,
    .scale-sticky-item {
      padding: 12px 14px;
    }

    .scale-sticky-spacer {
      display: flex;
      align-items: center;
      color: rgba(255,255,255,.8);
      font-size: 12px;
      font-weight: 700;
    }

    .scale-sticky-item {
      display: grid;
      gap: 3px;
      justify-items: center;
      text-align: center;
      line-height: 1.15;
      font-weight: 700;
    }

    .scale-sticky-item strong {
      font-size: 13px;
    }

    .scale-sticky-item span {
      color: rgba(255, 255, 255, 0.78);
      font-size: 10px;
    }

    .question-matrix {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .question-matrix th {
      padding: 13px 14px;
      background: var(--navy);
      color: #fff;
      text-align: center;
      vertical-align: top;
      font-size: 12px;
      font-weight: 700;
    }

    .question-matrix th:first-child {
      width: 44%;
      text-align: left;
    }

    .question-matrix th:not(:first-child),
    .question-matrix td:not(:first-child) {
      width: 9.333%;
    }

    .question-matrix td:first-child {
      width: 44%;
    }

    .scale-head {
      display: grid;
      gap: 3px;
      justify-items: center;
      align-content: start;
      min-height: 48px;
      line-height: 1.15;
    }

    .scale-head strong {
      font-size: 13px;
      font-weight: 700;
    }

    .scale-head span {
      color: rgba(255, 255, 255, 0.78);
      font-size: 10px;
      font-weight: 700;
      text-transform: none;
      white-space: normal;
    }

    .question-matrix td {
      padding: 14px;
      border-bottom: 1px solid var(--line-soft);
      text-align: center;
      vertical-align: middle;
      background: #fff;
    }

    .question-matrix tr:nth-child(even) td {
      background: #fbfcfd;
    }

    .question-matrix tr:last-child td {
      border-bottom: 0;
    }

    .statement-cell {
      display: grid;
      gap: 5px;
      color: var(--text);
      text-align: left;
      font-size: 14px;
      line-height: 1.38;
      font-weight: 700;
    }

    .statement-cell span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .matrix-option {
      position: relative;
      display: inline-grid;
      width: 24px;
      height: 24px;
      place-items: center;
      border: 2px solid #c7ced6;
      border-radius: 999px;
      background: #fff;
      color: transparent;
      cursor: pointer;
    }

    .matrix-option:hover {
      border-color: var(--brand);
      background: #f1fbff;
    }

    .matrix-option.selected {
      border-color: var(--brand);
      background: var(--brand);
    }

    .matrix-option.selected::after {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #fff;
      content: "";
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--brand);
      border-radius: 999px;
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .button.secondary { background: #fff; color: var(--brand-dark); }
    .button:disabled { border-color: #cbd5df; background: #e7edf3; color: #8a97a8; cursor: not-allowed; }

    .hint { color: var(--muted); font-size: 12px; }

    .demo-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 14px;
    }

    .demo-button {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid #c7e8f9;
      border-radius: 999px;
      background: #f2fbff;
      color: var(--brand-dark);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .demo-button:hover {
      border-color: var(--brand);
      background: #e5f7ff;
    }

    .start-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .mini-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fbfdff;
    }

    .mini-card strong { display: block; margin-bottom: 7px; font-size: 15px; }
    .mini-card span { color: var(--muted); font-size: 12px; line-height: 1.45; }

    .review-grid, .report-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .report-card { padding: 18px; }
    .report-card h3 {
      margin: 0 0 10px;
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      font-weight: 700;
    }
    .report-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }

    .score-list { display: grid; gap: 11px; }
    .score-row { display: grid; gap: 6px; }
    .score-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; font-weight: 700; }
    .score-bar { height: 8px; overflow: hidden; border-radius: 999px; background: #e8eef4; }
    .score-bar span { display: block; height: 100%; border-radius: inherit; background: var(--brand); }

    .report-shell {
      display: grid;
      gap: 22px;
    }

    .report-hero {
      display: grid;
      justify-items: center;
      gap: 12px;
      padding: 8px 0 6px;
      text-align: center;
    }

    .profile-illustration {
      display: grid;
      width: 168px;
      height: 138px;
      place-items: center;
      border-radius: 50%;
      background: #f3f7fa;
      color: var(--brand-dark);
    }

    .profile-illustration svg {
      width: 84px;
      height: 84px;
    }

    .role-ribbon {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      margin-top: -30px;
      padding: 0 28px;
      border-radius: 999px;
      background: var(--brand);
      color: #fff;
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
      font-weight: 700;
      transform: rotate(-3deg);
    }

    .role-title {
      margin: 4px 0 0;
      color: var(--text);
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(24px, 3vw, 34px);
      font-weight: 700;
    }

    .role-title span {
      color: var(--brand-dark);
    }

    .profile-quote {
      margin: 0;
      color: #3c4654;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.45;
    }

    .profile-code {
      display: inline-flex;
      align-items: center;

    .teal-heading {

    .horizontal-track span {

    .horizontal-row strong {

      font-weight: 700;

    }

    .preference-grid {

      grid-template-columns: repeat(2, minmax(0, 1fr));

    }

    .split-labels {

    .split-bar span:last-child {

      color: var(--text);

    .preference-bullets {

      padding: 10px 14px;

      color: var(--brand-dark);
      font-size: 22px;
      font-weight: 700;
    }

    .report-pages {
      display: grid;
      gap: 22px;
    }

    .report-page {
      display: grid;
      gap: 22px;
      padding: 28px;
      border: 1px solid var(--line-soft);
      border-radius: 20px;
      background: #fff;

    .report-page-header {
      display: flex;
      align-items: flex-start;

      gap: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line-soft);
    }

    .report-page-label {
      margin: 0 0 6px;
      color: var(--brand-dark);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .report-page-title {
      margin: 0;
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(22px, 3vw, 30px);
      line-height: 1.15;
      font-weight: 700;
    }

    .report-page-subtitle {

      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 13px;

      background: #eef9ff;
      color: var(--brand-dark);
      font-size: 13px;
      font-weight: 700;
    }

      grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr);

      gap: 10px;

      border: 1px solid #d8edf8;
      overflow: hidden;
    }

    .result-big-card span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .result-big-card strong {
      color: var(--text);

      font-weight: 700;
      overflow-wrap: anywhere;

    .result-big-card p {
      margin: 0;
      color: #3d4856;
      font-size: 14px;
      line-height: 1.55;
    }

      box-shadow: 0 10px 28px rgba(39, 103, 223, .08);

    .insight-card-summary {

      list-style: none;

    .insight-card-summary::-webkit-details-marker { display: none; }

    .insight-card-summary > span {

      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .insight-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .insight-title-row strong {
      color: var(--text);
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
      font-weight: 700;
    }

    .insight-chevron {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #eef4ff;
      position: relative;
    }

    .insight-chevron::after {
      content: "";
      position: absolute;
      left: 12px;
      top: 10px;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--brand-dark);
      border-bottom: 2px solid var(--brand-dark);
      transform: rotate(45deg);
      transition: transform .2s ease, top .2s ease;
    }

    .insight-card[open] .insight-chevron::after {
      top: 14px;
      transform: rotate(225deg);
    }

    .insight-card-summary p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .insight-card-body {
      padding: 18px;
      border-top: 1px dashed var(--line-soft);
      background: #fbfdff;
    }

    .insight-card-body h4 {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    .insight-card-body .bullet-list {
      padding-left: 22px;
      font-size: 13px;
      line-height: 1.55;
    }

    .insight-card-body .bullet-list li::marker { color: var(--brand-dark); }

    .interest-strength {
      margin: 16px 0 0;
      padding-top: 14px;
      border-top: 1px dashed var(--line-soft);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .interest-strength strong { color: var(--text); }

    .interest-tabs-wrap { padding-top: 4px; }

    .interest-tabpanel {
      padding-top: 22px;
      border-top: 1px solid var(--line-soft);
    }

    .interest-tab-copy {
      display: grid;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .interest-full-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .interest-full-intro {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .type-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .type-letter {
      padding: 14px;
      border: 1px solid var(--line-soft);
      border-radius: 14px;
      background: #fbfdff;
    }

    .type-letter b {
      display: block;
      color: var(--brand-dark);
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 24px;
      font-weight: 700;
    }

    .type-letter span {
      display: block;
      margin-top: 3px;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
    }

    .type-letter p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .definition-block {
      padding: 16px;
      border-radius: 12px;
      background: #f4f8fb;
      color: #3d4856;
      font-size: 13px;
      line-height: 1.55;
    }

    .personality-result {
      display: grid;
      gap: 0;
      border: 1px solid #d8edf8;
      border-radius: 18px;
      background: linear-gradient(180deg, #f4fbff 0%, #ffffff 100%);
      overflow: hidden;
    }

    .personality-result summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      cursor: pointer;
      list-style: none;
    }

    .personality-result summary:hover .personality-code,
    .personality-result[open] .personality-code {
      background: #088fcb;
      transform: translateY(-1px);
    }

    .personality-result summary::-webkit-details-marker {
      display: none;
    }

    .personality-result-title {
      display: grid;
      gap: 4px;
    }

    .personality-result-title span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .personality-result-title strong {
      color: var(--text);
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 20px;
      font-weight: 700;
    }

    .personality-result-title em {
      color: var(--brand-dark);
      font-style: normal;
      font-size: 12px;
      font-weight: 700;
    }

    .personality-code {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--brand);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      transition: background .18s ease, transform .18s ease;
    }

    .personality-code::after {
      content: "";
      width: 7px;
      height: 7px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg) translateY(-2px);
      transition: transform .18s ease;
    }

    .personality-result[open] .personality-code::after {
      transform: rotate(225deg) translateY(-2px);
    }

    .personality-detail {
      display: grid;
      gap: 14px;
      padding: 0 20px 20px;
      border-top: 1px solid #d8edf8;
    }

    .personality-detail p {
      margin: 14px 0 0;
      color: #3d4856;
      font-size: 13px;
      line-height: 1.55;
    }

    .report-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding-top: 4px;
    }

    .hidden { display: none !important; }

    .preference-tabs-wrap {
      margin-top: 6px;
      padding-top: 22px;
      border-top: 1px solid var(--line-soft);
    }

    .preference-tablist {
      display: flex;
      width: 100%;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: #eef2f6;
    }

    .preference-tab {
      flex: 1;
      min-height: 38px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .preference-tab.active {
      background: #fff;
      color: var(--brand-dark);
      box-shadow: 0 4px 10px rgba(18, 38, 63, .08);
    }

    .preference-tab-intro {
      max-width: 640px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .preference-tabpanel {
      margin-top: 18px;
    }

    .modal-close:hover { background: #e7edf3; }

    @media (max-width: 900px) {
      .question-matrix {
        min-width: 720px;
      }

      .top-nav {
        display: none;
      }

      .dashboard-banner-inner {
        grid-template-columns: 1fr;
      }

      .banner-person {
        display: none;
      }

      .dashboard-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .profile-panels,
      .outcome-grid,
      .preference-grid,
      .snapshot-grid,
      .result-hero-grid,
      .insight-grid,
      .interest-full-grid,
      .type-summary {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 650px) {
      main { width: min(100% - 24px, 1120px); padding-top: 24px; }
      .dashboard-screen { margin-top: -24px; }
      .topbar-inner { width: min(100% - 24px, 1250px); }
      .top-actions { display: none; }
      .atlas-brand { font-size: 23px; }
      .dashboard-grid { grid-template-columns: 1fr; }
      .dashboard-banner-inner,
      .dashboard-welcome,
      .dashboard-grid { width: min(100% - 24px, 1250px); }

      .preference-tablist { display: flex; width: 100%; }
      .interest-tabs-wrap .preference-tab,
      .preference-tab { flex: 1; }
    }
  </style>
</head>
<body>

    <div class="topbar-inner">

    </div>
  </header>

  <main>
    <section class="hero" id="hero">

    function scoresFor(list, assessment) {
      return list.reduce((acc, q) => {
        const value = state.answers[`${assessment}:${q.id}`] || 0;
        acc[q.type] = (acc[q.type] || 0) + value;
        return acc;
      }, {});

    function interestCode(scores) {
      return Object.entries(scores)
        .sort((a, b) => b[1] - a[1] || 'RIASEC'.indexOf(interestLetters[a[0]]) - 'RIASEC'.indexOf(interestLetters[b[0]]))
        .slice(0, 3)
        .map(([type]) => interestLetters[type])
        .join('');
    }

    function preferenceCode(percents) {
      return pairRules.map(([left, right, leftCode, rightCode, tieCode]) => {
        const leftPct = percents[left] || 0;
        const rightPct = percents[right] || 0;
        if (leftPct === rightPct) return tieCode;
        return leftPct > rightPct ? leftCode : rightCode;
      }).join('');
    }

    };

    const preferenceDimensionMeta = [
      { dimension: 'Energy', leftCode: 'E', leftName: 'Extravert', rightCode: 'I', rightName: 'Introvert', tieDefault: 'Introvert', leftColor: '#e6399b', rightColor: '#f8d3ef' },
      { dimension: 'Perception', leftCode: 'S', leftName: 'Sensing', rightCode: 'N', rightName: 'Intuitive', tieDefault: 'Intuitive', leftColor: '#e2600a', rightColor: '#ffe0c7' },
      { dimension: 'Decision-Making', leftCode: 'T', leftName: 'Thinking', rightCode: 'F', rightName: 'Feeling', tieDefault: 'Feeling', leftColor: '#1c7fc4', rightColor: '#d9effb' },
      { dimension: 'Lifestyle', leftCode: 'J', leftName: 'Judging', rightCode: 'P', rightName: 'Perceiving', tieDefault: 'Perceiving', leftColor: '#4f8f2c', rightColor: '#dcefcc' }
    ];

    function preferenceDimensionRows(percents) {
      return preferenceDimensionMeta.map((row) => {
        const leftPct = percents[row.leftName] || 0;
        const rightPct = percents[row.rightName] || 0;
        const winnerName = leftPct === rightPct ? row.tieDefault : (leftPct > rightPct ? row.leftName : row.rightName);
        const bullets = preferenceDimensionBullets[winnerName] || [];
        const total = leftPct + rightPct;
        const leftShare = total ? (leftPct / total) * 100 : 50;
        const rightShare = 100 - leftShare;
        return `
          <article class="preference-card" style="--left-color:${row.leftColor}; --right-color:${row.rightColor};">
            <h4 class="preference-card-title">${row.dimension}</h4>
            <div class="split-labels">
              <div class="split-label-side"><strong>${row.leftCode}</strong><span>${row.leftName}</span></div>
              <div class="split-label-side"><strong>${row.rightCode}</strong><span>${row.rightName}</span></div>
            </div>
            <div class="split-bar">
              <span style="width:${leftShare}%">${formatPercent(leftShare)}</span>
              <span style="width:${rightShare}%">${formatPercent(rightShare)}</span>
            </div>
            <ul class="bullet-list preference-bullets">${bullets.map((item) => `<li>${item}</li>`).join('')}</ul>
          </article>
        `;
      }).join('');
    }

    function preferenceTypeDetail(code) {
      const notes = preferenceTypeNotes[code] || [
        'Your pattern shows a mix of natural preferences.',
        'Use it as a guide for how you like to learn, work, and make decisions.',
        'It is not a fixed label; different situations may bring out different sides.'
      ];
      return notes;
    }

    function latestPreferenceProfile(code) {
      const notes = preferenceTypeDetail(code);
      return latestPreferenceProfiles[code] || {
        overview: 'Your preference type is a guide to how you may prefer to use energy, take in information, make decisions, and organise your work. It describes natural preferences, not fixed ability.',
        characterised: [notes[0], preferenceInfo[code[0]].summary, preferenceInfo[code[1]].summary],
        motivated: [notes[1], preferenceInfo[code[2]].summary, preferenceInfo[code[3]].summary],
        environment: ['Work settings that fit your strongest preferences', 'Tasks that let you use your natural strengths', 'Support when a task requires your less preferred side'],
        strengths: [notes[0], preferenceInfo[code[1]].summary, preferenceInfo[code[2]].summary],
        challenges: [notes[2], 'Situations that require sustained use of the opposite preferences'],
        demotivated: ['Low fit between the task and your natural preferences', 'Unclear expectations or limited support']
      };
    }

    function showSavedSummaryFromUrl() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('summary') !== '1') return;

      fillQuestions(interestQuestions, 'interest');
      fillQuestions(preferenceQuestions, 'preference');
      state.summaryType = params.get('type') || localStorage.getItem('psychometricPreferenceCode') || null;
      state.screen = 'report';
    }

    function renderReport() {
      screenEl.className = 'card';
      const iScores = scoresFor(interestQuestions, 'interest');
      const pScores = scoresFor(preferenceQuestions, 'preference');
      const pPercents = preferencePercents(pScores);
      const iCode = interestCode(iScores);
      const pCode = state.summaryType || preferenceCode(pPercents);
      try {
        localStorage.setItem('psychometricPreferenceCode', pCode);
      } catch (error) {}
      const topInterests = topScoreEntries(iScores, 3);
      const topInterest = topInterests[0] || ['Interest', 0];
      const topInterestPct = Math.round(topInterest[1] / 60 * 100);
      const topInterestInfo = interestInfo[topInterest[0]] || { short: '', detail: '' };
      const typeNotes = preferenceTypeDetail(pCode);
      const preferenceProfile = latestPreferenceProfile(pCode);

      screenEl.innerHTML = `
        <div class="report-shell">
          <div class="report-pages">
            <section class="report-page">
              <div class="report-page-header">
                <div>
                  <p class="report-page-label">Interest result</p>
                  <h2 class="report-page-title">Interest Profile</h2>
                  <p class="report-page-subtitle">Your RIASEC interest pattern highlights activities and work areas that may feel more natural, motivating, or enjoyable for you.</p>
                </div>
                <span class="page-chip">${iCode}</span>
              </div>
              <div class="result-hero-grid">
                <article class="result-big-card">
                  <span>Your strongest interest</span>
                  <strong>${topInterest[0]}</strong>
                  <p>${topInterestInfo.short} Your score for this area is ${topInterestPct}%.</p>
                </article>
                <div class="horizontal-chart">${interestOutcomeChart(iScores)}</div>
              </div>
              <div class="insight-grid">${interestCards(iScores)}</div>
              <div class="definition-block">Interest Profile uses the RIASEC model: Realistic, Investigative, Artistic, Social, Enterprising, and Conventional. Your highest areas can guide career exploration, project choices, and learning activities.</div>

              <div class="interest-tabs-wrap">
                <div class="preference-tablist" role="tablist" aria-label="Interest Profile views">
                  <button id="interestTabSnapshot" class="preference-tab ${state.interestView === 'snapshot' ? 'active' : ''}" type="button" role="tab" aria-selected="${state.interestView === 'snapshot'}" aria-controls="interestPanelSnapshot" tabindex="${state.interestView === 'snapshot' ? '0' : '-1'}" data-interest-tab="snapshot">Interest Snapshot</button>
                  <button id="interestTabDetail" class="preference-tab ${state.interestView === 'detail' ? 'active' : ''}" type="button" role="tab" aria-selected="${state.interestView === 'detail'}" aria-controls="interestPanelDetail" tabindex="${state.interestView === 'detail' ? '0' : '-1'}" data-interest-tab="detail">Full Interest Profile detail</button>
                </div>

                ${state.interestView === 'snapshot' ? `
                  <div id="interestPanelSnapshot" class="interest-tabpanel" role="tabpanel" aria-labelledby="interestTabSnapshot">
                    <div class="interest-tab-copy">
                      <p>Your top three interest areas, at a glance.</p>
                      <p>Open any card above for its work and learning traits, or use the <strong>Full Interest Profile detail</strong> tab for all six RIASEC areas.</p>
                    </div>
                  </div>
                ` : `
                  <div id="interestPanelDetail" class="interest-tabpanel" role="tabpanel" aria-labelledby="interestTabDetail">
                    <p class="interest-full-intro">Explore how every RIASEC area may show up in how you learn, work, solve problems, and contribute.</p>
                    <div class="interest-full-grid">${interestCards(iScores, 6)}</div>
                  </div>
                `}
              </div>
            </section>

            <details class="personality-result">
              <summary>
                <span class="personality-result-title">
                  <span>Personality test result</span>
                  <strong>${pCode} Preference Profile</strong>
                  <em>Click to view details</em>
                </span>
                <span class="personality-code">${pCode}</span>
              </summary>
              <div class="personality-detail">
                <p>${preferenceProfile.overview}</p>
                ${listHtml(preferenceProfile.characterised, 3)}
              </div>
            </details>

            <section class="report-page">
              <div class="report-page-header">
                <div>
                  <p class="report-page-label">Preference overview</p>
                  <h2 class="report-page-title">Preference Profile</h2>
                  <p class="report-page-subtitle">Your preference profile shows how you may prefer to use energy, take in information, make decisions, and organise your work.</p>
                </div>
                <span class="page-chip">${pCode}</span>
              </div>
              <div class="result-hero-grid">
                <article class="result-big-card">
                  <span>Your preference type</span>
                  <strong>${pCode}</strong>
                  <p>${preferenceProfile.overview}</p>
                </article>
                <div class="type-summary">${typeLetters(pCode)}</div>
              </div>

              <div class="preference-tabs-wrap">
                <div class="preference-tablist" role="tablist" aria-label="Preference Profile views">
                  <button class="preference-tab ${state.preferenceView === 'quick' ? 'active' : ''}" type="button" role="tab" aria-selected="${state.preferenceView === 'quick'}" data-preference-tab="quick">Learning &amp; Work Snapshot</button>
                  <button class="preference-tab ${state.preferenceView === 'detail' ? 'active' : ''}" type="button" role="tab" aria-selected="${state.preferenceView === 'detail'}" data-preference-tab="detail">Full ${pCode} detail</button>
                </div>

                ${state.preferenceView === 'quick' ? `
                  <p class="preference-tab-intro">A dimension-by-dimension look at how your ${pCode} result may show up day to day.</p>
                  <div class="preference-tabpanel">
                    <div class="preference-grid">${preferenceDimensionRows(pPercents)}</div>
                  </div>
                ` : `
                  <p class="preference-tab-intro">The full ${pCode} write-up, translated into practical notes from the detailed type description.</p>
                  <div class="preference-tabpanel">
                    <section class="quick-summary">
                      <h3>How to read this result</h3>
                      <p>Your profile describes preferences, not ability. Use it to notice what gives you energy, where you may thrive, and which situations may need extra support.</p>
                    </section>
                    <section class="profile-panels">
                      <article class="profile-panel"><div class="panel-icon">1</div><h3>Often characterised as</h3>${listHtml(preferenceProfile.characterised, 4)}</article>
                      <article class="profile-panel"><div class="panel-icon">2</div><h3>What may motivate you</h3>${listHtml(preferenceProfile.motivated, 4)}</article>
                      <article class="profile-panel"><div class="panel-icon">3</div><h3>Work environments you may thrive in</h3>${listHtml(preferenceProfile.environment, 5)}</article>
                      <article class="profile-panel"><div class="panel-icon">4</div><h3>Strengths</h3>${listHtml(preferenceProfile.strengths, 6)}</article>
                      <article class="profile-panel"><div class="panel-icon">5</div><h3>Possible challenges</h3>${listHtml(preferenceProfile.challenges, 5)}</article>
                      <article class="profile-panel"><div class="panel-icon">6</div><h3>Demotivated by</h3>${listHtml(preferenceProfile.demotivated, 5)}</article>
                    </section>
                  </div>
                `}
              </div>
            </section>
          </div>

          <div class="report-actions">
            <button class="button secondary" type="button" data-edit-interest>Review Interest</button>
            <button class="button" type="button" data-back-dashboard="${pCode}">Back to Dashboard</button>
          </div>
        </div>
      `;
    }

    function render() {
      updateProgress();
      if (state.screen === 'intro') renderIntro();
      if (state.screen === 'questions') renderQuestions();
      if (state.screen === 'loading') renderLoading();
      if (state.screen === 'report') renderReport();
    }

    document.addEventListener('click', (event) => {
      const dashboardButton = event.target.closest('[data-back-dashboard]');
      if (dashboardButton) {
        const type = dashboardButton.dataset.backDashboard;
        if (type) {
          try { localStorage.setItem('psychometricPreferenceCode', type); } catch (error) {}
          window.location.href = `atlas-student-dashboard.html?type=${encodeURIComponent(type)}`;
        } else {
          window.location.href = 'atlas-student-dashboard.html';
        }
        return;
      }
      if (event.target.closest('#backToDashboard')) { window.location.href = 'atlas-student-dashboard.html'; return; }
      const interestTab = event.target.closest('[data-interest-tab]');
      if (interestTab) { state.interestView = interestTab.dataset.interestTab; render(); return; }
      const preferenceTab = event.target.closest('[data-preference-tab]');
      if (preferenceTab) { state.preferenceView = preferenceTab.dataset.preferenceTab; render(); return; }
      const answer = event.target.closest('[data-answer-id]');
      if (answer) { setAnswer(answer.dataset.answerId, Number(answer.dataset.answerValue)); return; }
      if (event.target.closest('[data-start]')) { state.screen = 'questions'; state.assessment = 'interest'; state.page = 0; render(); return; }
      if (event.target.closest('[data-fill-page]')) { fillCurrentPage(); return; }
      if (event.target.closest('[data-fill-all]')) { fillAllAndReview(); return; }
      if (event.target.closest('[data-next]')) {
        const list = currentQuestions();
        const pageCount = Math.ceil(list.length / perPage);
        if (state.page < pageCount - 1) state.page += 1;
        else if (state.assessment === 'interest') { state.assessment = 'preference'; state.page = 0; }
        else { state.screen = 'loading'; render(); setTimeout(showReport, 900); return; }
        render(); return;
      }
      if (event.target.closest('[data-prev]')) {
        if (state.page > 0) state.page -= 1;
        else if (state.assessment === 'preference') { state.assessment = 'interest'; state.page = Math.ceil(interestQuestions.length / perPage) - 1; }
        render(); return;
      }
      if (event.target.closest('[data-edit-preference]')) { state.screen = 'questions'; state.assessment = 'preference'; state.page = 0; render(); return; }
      if (event.target.closest('[data-edit-interest]')) { state.screen = 'questions'; state.assessment = 'interest'; state.page = 0; render(); return; }
      if (event.target.closest('[data-submit]')) { state.screen = 'loading'; render(); setTimeout(showReport, 900); return; }
      if (event.target.closest('[data-restart]')) { state.screen = 'intro'; state.assessment = 'interest'; state.page = 0; state.answers = {}; render(); return; }
    });

    showSavedSummaryFromUrl();
    render();
  </script>
</body>
</html>
