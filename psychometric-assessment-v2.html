<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Psychometric Assessment</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

    :root {
      --bg: #f6f8fa;
      --panel: #ffffff;
      --text: #12263f;
      --muted: #66738a;
      --line: #dbe4ec;
      --line-soft: #eef3f7;
      --brand: #0fb0f8;
      --brand-dark: #078fd0;
      --navy: #31445f;
      --green: #18a777;
      --amber: #c88400;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button { font: inherit; }

    .topbar {
      min-height: 70px;
      background: var(--navy);
      color: #fff;
    }

    .topbar-inner {
      width: min(1250px, calc(100% - 40px));
      margin: 0 auto;
      min-height: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .atlas-brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #111827;
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .atlas-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 2px solid #38a3cf;
      border-radius: 8px;
      color: #ef7d22;
      transform: rotate(-3deg);
    }

    .atlas-mark svg {
      width: 25px;
      height: 25px;
    }

    .atlas-byline {
      display: block;
      margin-top: -5px;
      color: #111827;
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .top-nav {
      display: inline-flex;
      align-items: center;
      gap: 30px;
      color: #687386;
      font-size: 15px;
      font-weight: 500;
    }

    .top-nav span {
      position: relative;
      white-space: nowrap;
    }

    .top-nav span.active {
      color: #0c789d;
      font-weight: 700;
    }

    .top-nav span.active::after {
      position: absolute;
      left: 50%;
      bottom: -22px;
      width: 31px;
      height: 4px;
      border-radius: 999px;
      background: #ffb000;
      content: "";
      transform: translateX(-50%);
    }

    .top-actions {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #0c789d;
    }

    .icon-only {
      display: inline-grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #0c789d;
      cursor: pointer;
    }

    .help-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 0 13px;
      border-radius: 999px;
      background: #0c789d;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .user-dot {
      display: inline-grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 999px;
      background: #20b7c6;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border: 0;
      background: transparent;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,.82);
      font-size: 13px;
      font-weight: 700;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--brand);
    }

    .brand-pill {
      visibility: hidden;
    }

    main {
      width: min(1120px, calc(100% - 36px));
      margin: 0 auto;
      padding: 54px 0 70px;
    }

    .hero {
      display: grid;
      justify-items: center;
      gap: 14px;
      margin: 24px auto 26px;
      text-align: center;
    }

    .hero-icon {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border-radius: 14px;
      background: #e8f7ff;
      color: var(--brand-dark);
      font-size: 23px;
    }

    .hero-icon svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(25px, 3vw, 36px);
      line-height: 1.1;
      font-weight: 700;
    }

    .hero p {
      max-width: 660px;
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .assessment-shell {
      width: min(960px, 100%);
      margin: 0 auto;
    }

    .card, .report-card {
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: none;
    }

    .content-stack { display: grid; gap: 18px; }

    .progress-card {
      padding: 16px 18px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .86);
    }

    .progress-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .progress-track {
      height: 7px;
      padding: 2px;
      overflow: hidden;
      border-radius: 999px;
      background: #eef4f8;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8ddfff 0%, var(--brand) 100%);
      transition: width .35s ease;
    }

    .card { padding: 22px 24px; }

    .dashboard-screen {
      display: block;
      width: 100vw;
      margin-top: -54px;
      margin-left: calc(50% - 50vw);
      padding: 0 0 58px;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .dashboard-banner {
      position: relative;
      overflow: hidden;
      min-height: 228px;
      background: #31445f;
      color: #fff;
    }

    .dashboard-banner::before {
      position: absolute;
      inset: -90px auto auto -70px;
      width: 1250px;
      height: 410px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow:
        145px 0 0 rgba(255,255,255,.07),
        290px 0 0 rgba(255,255,255,.07),
        435px 0 0 rgba(255,255,255,.07),
        580px 0 0 rgba(255,255,255,.07),
        725px 0 0 rgba(255,255,255,.07),
        870px 0 0 rgba(255,255,255,.07),
        1015px 0 0 rgba(255,255,255,.07);
      content: "";
    }

    .dashboard-banner-inner {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      align-items: end;
      width: min(1250px, calc(100% - 40px));
      min-height: 228px;
      margin: 0 auto;
      gap: 32px;
    }

    .dashboard-banner-copy {
      align-self: center;
      max-width: 610px;
      padding: 28px 0;
    }

    .dashboard-banner h2 {
      margin: 0 0 10px;
      color: #fff;
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(31px, 4vw, 40px);
      line-height: 1.12;
      font-weight: 700;
    }

    .dashboard-banner p {
      max-width: 430px;
      margin: 0;
      color: rgba(255,255,255,.92);
      font-size: 17px;
      line-height: 1.45;
    }

    .type-pill {
      display: inline-flex;
      margin-top: 12px;
      min-height: 27px;
      align-items: center;
      padding: 0 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.18);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .banner-person {
      position: relative;
      display: grid;
      width: 235px;
      height: 205px;
      place-items: end center;
      justify-self: center;
    }

    .banner-person::before {
      position: absolute;
      bottom: -54px;
      width: 235px;
      height: 235px;
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      content: "";
    }

    .person-illustration {
      position: relative;
      display: grid;
      width: 144px;
      height: 170px;
      justify-items: center;
      align-content: start;
    }

    .person-hair {
      position: absolute;
      top: 2px;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: #6e3f28;
    }

    .person-face {
      position: relative;
      z-index: 1;
      width: 72px;
      height: 78px;
      margin-top: 17px;
      border-radius: 45% 45% 48% 48%;
      background: #f2c7a7;
    }

    .person-face::before,
    .person-face::after {
      position: absolute;
      top: 28px;
      width: 15px;
      height: 10px;
      border: 2px solid #12263f;
      border-radius: 999px;
      content: "";
    }

    .person-face::before { left: 15px; }
    .person-face::after { right: 15px; }

    .person-body {
      position: relative;
      z-index: 2;
      width: 124px;
      height: 86px;
      margin-top: -6px;
      border-radius: 34px 34px 0 0;
      background: #c99360;
    }

    .person-paper {
      position: absolute;
      z-index: 3;
      bottom: 10px;
      width: 88px;
      height: 64px;
      border-radius: 7px;
      background: #f4eadb;
      transform: rotate(-2deg);
    }

    .dashboard-welcome {
      width: min(840px, calc(100% - 40px));
      margin: 26px auto 30px;
      text-align: center;
    }

    .assistant-avatar {
      display: grid;
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      place-items: center;
      border-radius: 50%;
      background: #f1d2bf;
      color: #8b4e39;
      font-size: 28px;
      font-weight: 700;
    }

    .dashboard-welcome h2 {
      margin: 0 0 8px;
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(25px, 3vw, 32px);
      line-height: 1.12;
      font-weight: 700;
    }

    .dashboard-welcome p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .ask-box {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 42px;
      gap: 8px;
      width: min(670px, 100%);
      margin: 30px auto 12px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
    }

    .ask-placeholder {
      display: flex;
      align-items: center;
      min-height: 42px;
      padding: 0 12px;
      border-radius: 10px;
      background: #f2f4f7;
      color: #7a8394;
      text-align: left;
      font-size: 15px;
    }

    .send-button {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 0;
      border-radius: 12px;
      background: #89bdd0;
      color: #fff;
    }

    .prompt-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      max-width: 620px;
      margin: 0 auto;
    }

    .prompt-chip {
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: #66738a;
      font-size: 12px;
      font-weight: 700;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      width: min(1250px, calc(100% - 40px));
      margin: 0 auto;
    }

    .dashboard-card {
      display: grid;
      gap: 12px;
      min-height: 184px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      text-align: left;
    }

    .dashboard-card-icon {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 700;
    }

    .dashboard-card h3 {
      margin: 2px 0 0;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
    }

    .dashboard-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .dashboard-link {
      align-self: end;
      justify-self: start;
      border: 0;
      background: transparent;
      color: #0c789d;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }

    .section-kicker {
      margin: 0 0 4px;
      color: var(--brand-dark);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .card h2 {
      margin: 0;
      color: var(--text);
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 21px;
      font-weight: 700;
    }

    .card-caption {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .matrix-note {
      margin: 16px 0 0;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f4f7fa;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .question-matrix-wrap {
      margin-top: 0;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-top: 0;
      border-radius: 0 0 16px 16px;
      background: #fff;
    }

    .scale-sticky {
      position: sticky;
      z-index: 8;
      top: 0;
      display: grid;
      grid-template-columns: 44% repeat(6, minmax(0, 1fr));
      align-items: stretch;
      min-width: 820px;
      margin-top: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px 16px 0 0;
      background: var(--navy);
      color: #fff;
    }

    .scale-sticky-spacer,
    .scale-sticky-item {
      padding: 12px 14px;
    }

    .scale-sticky-spacer {
      display: flex;
      align-items: center;
      color: rgba(255,255,255,.8);
      font-size: 12px;
      font-weight: 700;
    }

    .scale-sticky-item {
      display: grid;
      gap: 3px;
      justify-items: center;
      text-align: center;
      line-height: 1.15;
      font-weight: 700;
    }

    .scale-sticky-item strong {
      font-size: 13px;
    }

    .scale-sticky-item span {
      color: rgba(255, 255, 255, 0.78);
      font-size: 10px;
    }

    .question-matrix {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .question-matrix th {
      padding: 13px 14px;
      background: var(--navy);
      color: #fff;
      text-align: center;
      vertical-align: top;
      font-size: 12px;
      font-weight: 700;
    }

    .question-matrix th:first-child {
      width: 44%;
      text-align: left;
    }

    .question-matrix th:not(:first-child),
    .question-matrix td:not(:first-child) {
      width: 9.333%;
    }

    .question-matrix td:first-child {
      width: 44%;
    }

    .scale-head {
      display: grid;
      gap: 3px;
      justify-items: center;
      align-content: start;
      min-height: 48px;
      line-height: 1.15;
    }

    .scale-head strong {
      font-size: 13px;
      font-weight: 700;
    }

    .scale-head span {
      color: rgba(255, 255, 255, 0.78);
      font-size: 10px;
      font-weight: 700;
      text-transform: none;
      white-space: normal;
    }

    .question-matrix td {
      padding: 14px;
      border-bottom: 1px solid var(--line-soft);
      text-align: center;
      vertical-align: middle;
      background: #fff;
    }

    .question-matrix tr:nth-child(even) td {
      background: #fbfcfd;
    }

    .question-matrix tr:last-child td {
      border-bottom: 0;
    }

    .statement-cell {
      display: grid;
      gap: 5px;
      color: var(--text);
      text-align: left;
      font-size: 14px;
      line-height: 1.38;
      font-weight: 700;
    }

    .statement-cell span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .matrix-option {
      position: relative;
      display: inline-grid;
      width: 24px;
      height: 24px;
      place-items: center;
      border: 2px solid #c7ced6;
      border-radius: 999px;
      background: #fff;
      color: transparent;
      cursor: pointer;
    }

    .matrix-option:hover {
      border-color: var(--brand);
      background: #f1fbff;
    }

    .matrix-option.selected {
      border-color: var(--brand);
      background: var(--brand);
    }

    .matrix-option.selected::after {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #fff;
      content: "";
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--brand);
      border-radius: 999px;
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .button.secondary { background: #fff; color: var(--brand-dark); }
    .button:disabled { border-color: #cbd5df; background: #e7edf3; color: #8a97a8; cursor: not-allowed; }

    .hint { color: var(--muted); font-size: 12px; }

    .demo-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 14px;
    }

    .demo-button {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid #c7e8f9;
      border-radius: 999px;
      background: #f2fbff;
      color: var(--brand-dark);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .demo-button:hover {
      border-color: var(--brand);
      background: #e5f7ff;
    }

    .start-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .mini-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fbfdff;
    }

    .mini-card strong { display: block; margin-bottom: 7px; font-size: 15px; }
    .mini-card span { color: var(--muted); font-size: 12px; line-height: 1.45; }

    .review-grid, .report-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .report-card { padding: 18px; }
    .report-card h3 {
      margin: 0 0 10px;
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      font-weight: 700;
    }
    .report-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }

    .score-list { display: grid; gap: 11px; }
    .score-row { display: grid; gap: 6px; }
    .score-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; font-weight: 700; }
    .score-bar { height: 8px; overflow: hidden; border-radius: 999px; background: #e8eef4; }
    .score-bar span { display: block; height: 100%; border-radius: inherit; background: var(--brand); }

    .report-shell {
      display: grid;
      gap: 22px;
    }

    .report-hero {
      display: grid;
      justify-items: center;
      gap: 12px;
      padding: 8px 0 6px;
      text-align: center;
    }

    .profile-illustration {
      display: grid;
      width: 168px;
      height: 138px;
      place-items: center;
      border-radius: 50%;
      background: #f3f7fa;
      color: var(--brand-dark);
    }

    .profile-illustration svg {
      width: 84px;
      height: 84px;
    }

    .role-ribbon {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      margin-top: -30px;
      padding: 0 28px;
      border-radius: 999px;
      background: var(--brand);
      color: #fff;
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
      font-weight: 700;
      transform: rotate(-3deg);
    }

    .role-title {
      margin: 4px 0 0;
      color: var(--text);
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(24px, 3vw, 34px);
      font-weight: 700;
    }

    .role-title span {
      color: var(--brand-dark);
    }

    .profile-quote {
      margin: 0;
      color: #3c4654;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.45;
    }

    .profile-code {
      display: inline-flex;
      align-items: center;

      font-weight: 700;

    .keyword-chip {

      font-weight: 700;

      background: #f1f4f7;

    .profile-panels {

      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;

    }

    .profile-panel {

      padding: 18px;
      border: 1px solid var(--line-soft);
      border-radius: 16px;
      background: #fff;
      text-align: left;

    .panel-icon {
      display: inline-grid;
      width: 38px;
      height: 38px;
      margin: 0 0 10px;
      place-items: center;
      border-radius: 999px;

      color: var(--brand-dark);
      font-size: 16px;
      font-weight: 700;

      display: block;
      margin: 0 0 14px;

    .profile-panel p {

      color: #333d4b;
      font-size: 13px;
      line-height: 1.55;

    }

    .horizontal-chart {

      padding: 18px;

      border-radius: 18px;
      background: #fbfdff;

      grid-template-columns: 112px minmax(0, 1fr) 42px;

      color: var(--muted);

      font-weight: 700;

      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #e8eef4;
    }

    .horizontal-track span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8ddfff 0%, var(--brand) 100%);
    }

    .horizontal-row strong {
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      text-align: right;
    }

    .preference-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .preference-card {
      display: grid;
      gap: 14px;
      padding: 20px;
      border: 1px solid var(--line-soft);
      border-radius: 16px;
      background: #fff;
    }

    .preference-card-title {
      margin: 0;
      color: var(--text);

      font-weight: 700;
    }

    .split-label-side:last-child strong { color: var(--right-color); }

    .split-bar {
      position: relative;
      display: flex;
      height: 34px;
      overflow: hidden;
      border-radius: 999px;
      background: #e8eef4;
      box-shadow: inset 0 1px 3px rgba(18, 38, 63, .12), 0 8px 18px rgba(18, 38, 63, .08);
    }

    .split-bar span {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }

    .split-bar span:first-child {
      border-radius: 999px 0 0 999px;
      background: var(--left-color);
      color: #fff;

    .split-bar span:last-child {
      border-radius: 0 999px 999px 0;
      background: var(--right-color);
      color: var(--text);

    .preference-bullets {

      font-weight: 700;
    }

      gap: 22px;

      font-weight: 700;

      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;

      line-height: 1.55;

      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .insight-title-row strong {
      color: var(--text);
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
      font-weight: 700;

    .insight-card-summary p {

      line-height: 1.55;
    }

      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;

      background: #fbfdff;

      color: var(--brand-dark);

      font-weight: 700;

      line-height: 1.45;

    .personality-result[open] .personality-code {
      background: #088fcb;
      transform: translateY(-1px);

      display: none;
    }

      display: grid;
      gap: 4px;
    }

    .personality-result-title span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .personality-result-title strong {
      color: var(--text);
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 20px;
      font-weight: 700;
    }

    .personality-result-title em {
      color: var(--brand-dark);
      font-style: normal;
      font-size: 12px;
      font-weight: 700;
    }

      transition: transform .18s ease;

      display: grid;
      gap: 14px;

      border-top: 1px solid #d8edf8;

      color: #3d4856;
      font-size: 13px;
      line-height: 1.55;

      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
      padding-top: 4px;

      display: flex;
      gap: 12px;

      border-radius: 999px;
      background: #eef2f6;

    .preference-tab {

      min-height: 38px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);

      font-weight: 700;
      cursor: pointer;

      color: var(--brand-dark);

      box-shadow: 0 4px 10px rgba(18, 38, 63, .12), 0 1px 2px rgba(18, 38, 63, .06);

      box-shadow: 0 6px 14px rgba(18, 38, 63, .16), 0 1px 2px rgba(18, 38, 63, .08);

      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;

      margin-top: 18px;

      display: grid;
      gap: 18px;

      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;

    .combo-pref-row span {

      return pairRules.map(([left, right, leftCode, rightCode, tieCode]) => {
        const leftPct = percents[left] || 0;
        const rightPct = percents[right] || 0;
        if (leftPct === rightPct) return tieCode;
        return leftPct > rightPct ? leftCode : rightCode;
      }).join('');
    }

      book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
      home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
      chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
      star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'
    };

    function renderWorkLearningSection(ctx) {
      const { topInterest, topInterestPct, pCode } = ctx;
      const traits = combinedTraits(topInterest[0], pCode);
      const letter = interestLetters[topInterest[0]];
      const interestAbbrev = topInterest[0].slice(0, 4).toUpperCase();
      const typeTiles = pCode.split('').map((l) => `<div class="combo-tile"><strong>${l}</strong><span>${preferenceInfo[l].label.slice(0, 5).toUpperCase()}</span></div>`).join('');
      const typeFullNames = pCode.split('').map((l) => preferenceInfo[l].label).join(' · ');
      const rows = [
        { icon: traitIcons.compass, label: 'Work orientation', text: traits.drawn },
        { icon: traitIcons.book, label: 'Learning approach', text: traits.learns },
        { icon: traitIcons.home, label: 'Ideal environment', text: traits.thrives },
        { icon: traitIcons.chat, label: 'Communication style', text: traits.communicates },
        { icon: traitIcons.star, label: 'Core strengths', text: traits.strengths }
      ];
      return `
        <div class="report-shell">
          <section class="report-page">
            <div class="report-page-header">
              <div>
                <h2 class="report-page-title">Work &amp; Learning Traits</h2>
                <p class="report-page-subtitle">This page combines your strongest interest area with your preference type to describe how you tend to work, learn, and communicate.</p>
              </div>
            </div>

            <div class="combo-hero-grid">
              <article class="combo-card combo-card-highlight">
                <span class="combo-card-label">Your combination</span>
                <div class="combo-tiles">
                  <div class="combo-tile combo-tile-active"><strong>${letter}</strong><span>${interestAbbrev}</span></div>
                  <span class="combo-tile-sep">&times;</span>
                  ${typeTiles}
                </div>
                <p class="combo-result-line">Result code <strong>${letter}-${pCode}</strong> &mdash; ${topInterest[0]} &times; ${pCode}. One of 96 descriptor sets.</p>
              </article>
              <article class="combo-card">
                <span class="combo-card-label">From your interest profile</span>
                <div class="combo-interest-row"><strong>${topInterest[0]}</strong><span>strongest interest</span><b>${topInterestPct}%</b></div>
                <div class="horizontal-track"><span style="width:${topInterestPct}%"></span></div>
                <span class="combo-card-label combo-card-label-spaced">From your preference profile</span>
                <div class="combo-pref-row"><strong>${pCode}</strong><span>${typeFullNames}</span></div>
              </article>
            </div>

            <h3 class="trait-rows-heading">How this shows up at work</h3>
            <div class="trait-rows">
              ${rows.map((row) => `
                <div class="trait-row">
                  <div class="trait-row-head">
                    <span class="trait-row-icon">${row.icon}</span>
                    <span class="trait-row-label">${row.label}</span>
                  </div>
                  <p class="trait-row-text">${row.text}</p>
                </div>
              `).join('')}
            </div>
          </section>

          <div class="report-actions">
            <div class="report-actions-group">
              <button class="button secondary" type="button" data-report-view="snapshot">Back to Snapshot</button>
              <button class="button" type="button" data-back-dashboard="${pCode}">Back to Dashboard</button>
            </div>
            <button class="button secondary" type="button" data-report-view="${state.reportView === 'detailed' ? 'traits' : 'detailed'}">View ${state.reportView === 'detailed' ? 'Work &amp; Learning Traits' : 'Detailed Report'}</button>
          </div>
        </div>
      `;
    }

    function renderDetailedSection(ctx) {
      const { iScores, pPercents, iCode, pCode, preferenceProfile } = ctx;
      return `
        <div class="report-shell">
          <div class="report-pages">
            <section class="report-page">
              <div class="report-page-header">
                <div>
                  <p class="report-page-label">Interest result</p>
                  <h2 class="report-page-title">Interest Profile</h2>
                  <p class="report-page-subtitle">Your RIASEC interest pattern highlights activities and work areas that may feel more natural, motivating, or enjoyable for you.</p>
                </div>
                <span class="page-chip">${iCode}</span>
              </div>
              <div class="result-hero-grid">
                <article class="result-big-card">
                  <span>Your strongest interest</span>
                  <strong>${ctx.topInterest[0]}</strong>
                  <p>${ctx.topInterestInfo.short} Your score for this area is ${ctx.topInterestPct}%.</p>
                </article>
                <div class="horizontal-chart">${interestOutcomeChart(iScores)}</div>
              </div>
              <div class="insight-grid">${interestCards(iScores)}</div>
            </section>

            <details class="personality-result">
              <summary>
                <span class="personality-result-title">
                  <span>Personality test result</span>
                  <strong>${pCode} Preference Profile</strong>
                  <em>Click to view details</em>
                </span>
                <span class="personality-code">${pCode}</span>
              </summary>
              <div class="personality-detail">
                <p>${preferenceProfile.overview}</p>
                ${listHtml(preferenceProfile.characterised, 3)}
              </div>
            </details>

            <section class="report-page">
              <div class="report-page-header">
                <div>
                  <p class="report-page-label">Preference overview</p>
                  <h2 class="report-page-title">Preference Profile</h2>
                  <p class="report-page-subtitle">Your preference profile shows how you may prefer to use energy, take in information, make decisions, and organise your work.</p>
                </div>
                <span class="page-chip">${pCode}</span>
              </div>
              <div class="result-hero-grid">
                <article class="result-big-card">
                  <span>Your preference type</span>
                  <strong>${pCode}</strong>
                  <p>${preferenceProfile.overview}</p>
                </article>
                <div class="type-summary">${typeLetters(pCode)}</div>
              </div>

              <div class="preference-tabs-wrap">
                <div class="preference-tablist" role="tablist" aria-label="Preference Profile views">
                  <button class="preference-tab ${state.preferenceView === 'quick' ? 'active' : ''}" type="button" role="tab" aria-selected="${state.preferenceView === 'quick'}" data-preference-tab="quick">Learning &amp; Work Snapshot</button>
                  <button class="preference-tab ${state.preferenceView === 'detail' ? 'active' : ''}" type="button" role="tab" aria-selected="${state.preferenceView === 'detail'}" data-preference-tab="detail">Full ${pCode} detail</button>
                </div>

                ${state.preferenceView === 'quick' ? `
                  <p class="preference-tab-intro">A dimension-by-dimension look at how your ${pCode} result may show up day to day.</p>
                  <div class="preference-tabpanel">
                    <div class="preference-grid">${preferenceDimensionRows(pPercents)}</div>
                  </div>
                ` : `
                  <p class="preference-tab-intro">The full ${pCode} write-up, translated into practical notes from the detailed type description.</p>
                  <div class="preference-tabpanel">
                    <section class="quick-summary">
                      <h3>How to read this result</h3>
                      <p>Your profile describes preferences, not ability. Use it to notice what gives you energy, where you may thrive, and which situations may need extra support.</p>
                    </section>
                    <section class="profile-panels">
                      <article class="profile-panel"><div class="panel-icon">1</div><h3>Often characterised as</h3>${listHtml(preferenceProfile.characterised, 4)}</article>
                      <article class="profile-panel"><div class="panel-icon">2</div><h3>What may motivate you</h3>${listHtml(preferenceProfile.motivated, 4)}</article>
                      <article class="profile-panel"><div class="panel-icon">3</div><h3>Work environments you may thrive in</h3>${listHtml(preferenceProfile.environment, 5)}</article>
                      <article class="profile-panel"><div class="panel-icon">4</div><h3>Strengths</h3>${listHtml(preferenceProfile.strengths, 6)}</article>
                      <article class="profile-panel"><div class="panel-icon">5</div><h3>Possible challenges</h3>${listHtml(preferenceProfile.challenges, 5)}</article>
                      <article class="profile-panel"><div class="panel-icon">6</div><h3>Demotivated by</h3>${listHtml(preferenceProfile.demotivated, 5)}</article>
                    </section>
                  </div>
                `}
              </div>
            </section>
          </div>

          <div class="report-actions">
            <div class="report-actions-group">
              <button class="button secondary" type="button" data-report-view="snapshot">Back to Snapshot</button>
              <button class="button" type="button" data-back-dashboard="${pCode}">Back to Dashboard</button>
            </div>
            <button class="button secondary" type="button" data-report-view="${state.reportView === 'detailed' ? 'traits' : 'detailed'}">View ${state.reportView === 'detailed' ? 'Work &amp; Learning Traits' : 'Detailed Report'}</button>
          </div>
        </div>
      `;
    }

    function renderReport() {
      screenEl.className = 'card';
      const iScores = scoresFor(interestQuestions, 'interest');
      const pScores = scoresFor(preferenceQuestions, 'preference');
      const pPercents = preferencePercents(pScores);
      const iCode = interestCode(iScores);
      const pCode = state.summaryType || preferenceCode(pPercents);
      try {
        localStorage.setItem('psychometricPreferenceCode', pCode);
      } catch (error) {}
      const topInterests = topScoreEntries(iScores, 3);
      const topInterest = topInterests[0] || ['Interest', 0];
      const topInterestPct = Math.round(topInterest[1] / 60 * 100);
      const topInterestInfo = interestInfo[topInterest[0]] || { short: '', detail: '' };
      const preferenceProfile = latestPreferenceProfile(pCode);

      const ctx = { iScores, pScores, pPercents, iCode, pCode, topInterest, topInterestPct, topInterestInfo, preferenceProfile };

      if (state.reportView === 'detailed') screenEl.innerHTML = renderDetailedSection(ctx);
      else if (state.reportView === 'traits') screenEl.innerHTML = renderWorkLearningSection(ctx);
      else screenEl.innerHTML = renderSnapshotSection(ctx);
    }

    function render() {
      updateProgress();
      if (state.screen === 'intro') renderIntro();
      if (state.screen === 'questions') renderQuestions();
      if (state.screen === 'loading') renderLoading();
      if (state.screen === 'report') renderReport();
    }

    document.addEventListener('click', (event) => {
      const dashboardButton = event.target.closest('[data-back-dashboard]');
      if (dashboardButton) {
        const type = dashboardButton.dataset.backDashboard;
        if (type) {
          try { localStorage.setItem('psychometricPreferenceCode', type); } catch (error) {}
          window.location.href = `atlas-student-dashboard.html?type=${encodeURIComponent(type)}`;
        } else {
          window.location.href = 'atlas-student-dashboard.html';
        }
        return;
      }
      if (event.target.closest('#backToDashboard')) { window.location.href = 'atlas-student-dashboard.html'; return; }
      const preferenceTab = event.target.closest('[data-preference-tab]');
      if (preferenceTab) { state.preferenceView = preferenceTab.dataset.preferenceTab; render(); return; }
      const reportViewButton = event.target.closest('[data-report-view]');
      if (reportViewButton) { state.reportView = reportViewButton.dataset.reportView; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      const answer = event.target.closest('[data-answer-id]');
      if (answer) { setAnswer(answer.dataset.answerId, Number(answer.dataset.answerValue)); return; }
      if (event.target.closest('[data-start]')) { state.screen = 'questions'; state.assessment = 'interest'; state.page = 0; render(); return; }
      if (event.target.closest('[data-fill-page]')) { fillCurrentPage(); return; }
      if (event.target.closest('[data-fill-all]')) { fillAllAndReview(); return; }
      if (event.target.closest('[data-next]')) {
        const list = currentQuestions();
        const pageCount = Math.ceil(list.length / perPage);
        if (state.page < pageCount - 1) state.page += 1;
        else if (state.assessment === 'interest') { state.assessment = 'preference'; state.page = 0; }
        else { state.screen = 'loading'; render(); setTimeout(showReport, 900); return; }
        render(); return;
      }
      if (event.target.closest('[data-prev]')) {
        if (state.page > 0) state.page -= 1;
        else if (state.assessment === 'preference') { state.assessment = 'interest'; state.page = Math.ceil(interestQuestions.length / perPage) - 1; }
        render(); return;
      }
      if (event.target.closest('[data-edit-preference]')) { state.screen = 'questions'; state.assessment = 'preference'; state.page = 0; render(); return; }
      if (event.target.closest('[data-edit-interest]')) { state.screen = 'questions'; state.assessment = 'interest'; state.page = 0; render(); return; }
      if (event.target.closest('[data-submit]')) { state.screen = 'loading'; render(); setTimeout(showReport, 900); return; }
      if (event.target.closest('[data-restart]')) { state.screen = 'intro'; state.assessment = 'interest'; state.page = 0; state.answers = {}; state.reportView = 'snapshot'; render(); return; }
    });

    showSavedSummaryFromUrl();
    render();
  </script>
</body>
</html>
