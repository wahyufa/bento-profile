    if (t.name === 'gsrc') { G.source = t.value; renderGen(); return; }
    if (t.dataset.lsl) { P.ls.lv = t.value; render(); return; }
    if (t.name === 'nwm') { NC.method = t.value; return; }
    if (t.dataset.oln) { OL.mods = +t.value; return; }
    if (t.dataset.olk) { var ok = t.dataset.olk.split(':'); OL.plan[+ok[0]].lessons[+ok[1]].skip = !t.checked; renderOutline(); return; }
    if (t.dataset.dt === 'difficulty') { D.details.difficulty = t.value; detLive(); return; }
    if (t.dataset.cvs) { COVER_DLG.style = t.value; return; }
    if (t.name === 'cvo') { COVER_DLG.pick = +t.value; return; }
    if (t.dataset.cvup) {
      var cf = t.files && t.files[0]; if (!cf) return;
      if (cf.size > 3000000) { toast('That image is over 3 MB. Choose a smaller one.'); return; }
      var crd = new FileReader();
      crd.onload = function () { D.details.cover = { type: 'image', src: String(crd.result), x: 50, y: 50 }; render(); try { saveState(); } catch (e) { /* large image: kept in memory only */ } toast('Cover changed'); };
      crd.readAsDataURL(cf); return;
    }
    if (t.name === 'gkind') { G.kind = t.value; if (G.kind !== 'blocks' && G.source === 'video') G.source = 'lesson'; renderGen(); return; }
    if (t.dataset.g === 'count') { G.count = +t.value; return; }
    if (t.dataset.resup) {
      var lr = cur(), files = Array.prototype.slice.call(t.files || []);
      if (!files.length) return;
      var left = files.length;
      files.forEach(function (f) {
        var r = { id: uid(), name: f.name, kind: resKind(f.name), size: resSize(f.size) };
        var done = function () { lr.resources.push(r); if (--left === 0) { render(); saveState(); toast(files.length + ' file' + (files.length > 1 ? 's' : '') + ' attached. The file itself is not stored in this preview.'); } };
        if (r.kind === 'TEXT' && f.size < 200000) { var rd2 = new FileReader(); rd2.onload = function () { r.text = String(rd2.result || ''); done(); }; rd2.onerror = done; rd2.readAsText(f); } else done();
      });
      return;
    }
    if (t.dataset.g === 'opt') { G.opts[t.dataset.k] = t.checked; return; }
    if (t.dataset.g === 'inc') { G.plan[+t.dataset.i].skip = !t.checked; renderGen(); return; }
    if (t.dataset.g === 'where') { G.where = t.value; return; }
    if (t.dataset.g === 'file') {
      var f = t.files && t.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () { G.paste = String(rd.result || ''); renderGen(); };
      rd.readAsText(f); return;
    }
    var l = cur();
    // Block form controls that change what is visible (toggles, selects) redraw the form
    if (t.dataset.b && (t.dataset.t === 'toggle' || t.tagName === 'SELECT')) {
      var b = l.blocks.filter(function (x) { return x.id === t.dataset.b; })[0];
      if (b) { setP(b.data, t.dataset.p, t.dataset.t === 'toggle' ? t.checked : t.value); if (b.state === 'reviewed') b.state = 'manual'; render(); saveState(); }
      return;
    }
    if (t.dataset.lm) { var lmv = cur(); D.lessons.splice(D.lessons.indexOf(lmv), 1); lmv.mod = t.value; D.lessons.push(lmv); sortByModule(); render(); saveState(); toast('Moved to ' + modById(t.value).title); return; }
    if (t.dataset.lf === 'type') { l.type = t.value; render(); saveState(); return; }
    if (t.dataset.rv) {
      if (t.dataset.rv === 'mode') { l.review.mode = t.value; if (t.value === 'authored' && !l.review.questions.length) l.review.questions = [{ id: uid(), stem: '', options: ['', '', '', ''], correct: 0, confirmed: false, why: '' }]; render(); }
      else if (t.dataset.rv === 'later') l.review.later = t.checked;
      saveState(); return;
    }
    if (t.dataset.jn === 'on') { l.jen.on = t.checked; render(); saveState(); return; }
    if (t.dataset.dc === 'on') { l.disc.on = t.checked; render(); saveState(); return; }
    if (t.dataset.cauto) { D.course.durationAuto = t.checked; render(); saveState(); return; }
    if (t.dataset.qf === 'correct') {
      var qs = qsFor(t.dataset.prefix), q = qs.filter(function (x) { return x.id === t.dataset.q; })[0];
      if (q) { q.correct = +t.dataset.v; q.confirmed = true; render(); saveState(); }
    }
  });

  // Typing updates the data and the live preview without redrawing the form, so focus stays put
  document.addEventListener('input', function (e) {
    var t = e.target, l = cur();
    if (t.dataset.lsq) { P.ls.q = t.value; $('#lpGrid').innerHTML = gridHtml(); return; }
    if (t.dataset.nwt) { NC.title = t.value; var cg = $('[data-act="creatego"]'); if (cg) cg.disabled = !t.value.trim(); return; }
    if (t.dataset.olt) { OL.topic = t.value; var rg = $('[data-act="olrun"]'); if (rg) rg.disabled = !t.value.trim(); return; }
    if (t.dataset.olm) { OL.material = t.value; return; }
    if (t.dataset.olmt != null) { OL.plan[+t.dataset.olmt].title = t.value; return; }
    if (t.dataset.oll) { var op = t.dataset.oll.split(':'); OL.plan[+op[0]].lessons[+op[1]].title = t.value; return; }
    if (t.dataset.dt) { D.details[t.dataset.dt] = t.value; detLive(); return; }
    if (t.dataset.cvx) { D.details.cover[t.dataset.cvx] = +t.value; $$('.cv img').forEach(function (im) { im.style.objectPosition = D.details.cover.x + '% ' + D.details.cover.y + '%'; }); saveState(); return; }
    if (t.dataset.cvp) { COVER_DLG.prompt = t.value; var gb = $('[data-act="cvgen"]'); if (gb && !COVER_DLG.options) gb.disabled = !t.value.trim(); return; }
    if (t.dataset.resn != null) { l.resources[+t.dataset.resn].name = t.value; saveState(); return; }
    if (t.dataset.os) { P.os = t.value; $('#objList').innerHTML = objListHtml(); return; }
    if (t.dataset.ks) { P.ks = t.value; $('#kmMatrix').innerHTML = kmMatrixHtml(); return; }
    if (t.id === 'gpaste') { G.paste = t.value; var nx = $('[data-g="next1"]'); if (nx) nx.disabled = genText().trim().length < 20; return; }
    if (t.dataset.b && t.dataset.p && t.type !== 'checkbox' && t.tagName !== 'SELECT') {
      var b = l.blocks.filter(function (x) { return x.id === t.dataset.b; })[0];
      if (b) { setP(b.data, t.dataset.p, t.type === 'number' ? +t.value : t.value); if (b.state === 'reviewed') b.state = 'manual'; refreshLive(); }
      return;
    }
    if (t.dataset.lf) {
      l[t.dataset.lf] = t.dataset.lf === 'mins' ? Math.max(1, +t.value || 1) : t.value;
      if (t.dataset.lf === 'mins') l.minsManual = true;
      refreshLive(); return;
    }
    if (t.dataset.mt) { modById(t.dataset.mt).title = t.value; saveState(); return; }
    if (t.dataset.md) { modById(t.dataset.md).desc = t.value; saveState(); return; }
    if (t.dataset.qp) { l.quiz.pass = Math.min(100, Math.max(0, +t.value || 0)); saveState(); return; }
    if (t.dataset.cdur) { D.course.duration = +t.value || 0; saveState(); return; }
    if (t.dataset.rv === 'pass') { l.review.pass = Math.min(100, Math.max(0, +t.value || 0)); saveState(); return; }
    if (t.dataset.dc === 'starter') { l.disc.starter = t.value; saveState(); return; }
    if (t.dataset.jc != null) { l.jen.chips[+t.dataset.jc] = t.value; saveState(); return; }
    if (t.dataset.gt != null) { l.jen.glossary[+t.dataset.gt].term = t.value; saveState(); return; }
    if (t.dataset.gd != null) { l.jen.glossary[+t.dataset.gd].def = t.value; saveState(); return; }
    if (t.dataset.q && t.dataset.qf && t.dataset.qf !== 'correct') {
      var q = qsFor(t.dataset.prefix).filter(function (x) { return x.id === t.dataset.q; })[0]; if (!q) return;
      var m = /^opt(\d)$/.exec(t.dataset.qf);
      if (m) q.options[+m[1]] = t.value; else q[t.dataset.qf] = t.value;
      var pf = $('#pvf'); if (pf && l.quiz) pf.innerHTML = previewHtml(l);
      saveState();
    }
  });

  // Drag a block by its handle to reorder
  var dragId = null;
  document.addEventListener('mousedown', function (e) {
    var g = e.target.closest('[data-grip]'); if (!g) return;
    var card = g.closest('.bl'); if (card) card.setAttribute('draggable', 'true');
  });
  document.addEventListener('dragstart', function (e) {
    var card = e.target.closest && e.target.closest('.bl'); if (!card) return;
    dragId = card.dataset.bid; card.classList.add('drag');
    if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); }
  });
  document.addEventListener('dragover', function (e) {
    if (!dragId) return;
    var card = e.target.closest && e.target.closest('.bl'); if (!card) return;
    e.preventDefault(); $$('.bl.over').forEach(function (x) { x.classList.remove('over'); }); if (card.dataset.bid !== dragId) card.classList.add('over');
  });
  document.addEventListener('drop', function (e) {
    if (!dragId) return;
    var card = e.target.closest && e.target.closest('.bl'); if (!card) return;
    e.preventDefault();
    var l = cur(), from = l.blocks.map(function (b) { return b.id; }).indexOf(dragId), to = l.blocks.map(function (b) { return b.id; }).indexOf(card.dataset.bid);
    if (from > -1 && to > -1 && from !== to) { var it = l.blocks.splice(from, 1)[0]; l.blocks.splice(to, 0, it); }
    dragId = null; render(); saveState();
  });
  document.addEventListener('dragend', function () { dragId = null; $$('.bl').forEach(function (x) { x.classList.remove('drag', 'over'); x.setAttribute('draggable', 'false'); }); });

  // Tooltips for anything with data-tip. One floating box keeps them from being clipped by scrolling panels.
  var tipBox = document.createElement('div');
  tipBox.className = 'tipbox'; tipBox.id = 'tipbox'; tipBox.setAttribute('role', 'tooltip'); document.body.appendChild(tipBox);
  var tipFor = null;
  function showTip(el) {
    tipFor = el; tipBox.textContent = el.getAttribute('data-tip'); tipBox.style.display = 'block';
    var r = el.getBoundingClientRect(), w = tipBox.offsetWidth, h = tipBox.offsetHeight;
    tipBox.style.left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8) + 'px';
    tipBox.style.top = (r.top - h - 8 < 8 ? r.bottom + 8 : r.top - h - 8) + 'px';
    el.setAttribute('aria-describedby', 'tipbox');
  }
  function hideTip() { if (tipFor) tipFor.removeAttribute('aria-describedby'); tipFor = null; tipBox.style.display = 'none'; }
  document.addEventListener('mouseover', function (e) { var el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el); else if (tipFor) hideTip(); });
  document.addEventListener('focusin', function (e) { var el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el); });
  document.addEventListener('focusout', hideTip);
  document.addEventListener('scroll', hideTip, true);
  document.addEventListener('click', hideTip);

  // Escape closes the action menu; closing a dialog stops any running timers
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideTip(); if (e.key === 'Escape' && P.menu) { P.menu = false; render(); } });
  ['genDlg', 'bulkDlg'].forEach(function (id) { $('#' + id).addEventListener('close', function () { clearTimeout(runTimer); clearTimeout(bulkTimer); G.running = false; }); });

  // Saved data from an older version of the prototype may be missing fields
  function migrate(s) {
    s.status = s.status || 'published'; if (s.ver === undefined) s.ver = 'V1';
    if (!s.modules) s.modules = [{ id: 'm1', title: (s.module || {}).title || 'Module 1', desc: (s.module || {}).desc || '' }];
    s.lessons.forEach(function (l) { if (!l.mod) l.mod = s.modules[0].id; l.resources = l.resources || []; l.review = l.review || { mode: 'ai', pass: 80, later: true, questions: [] }; l.jen = l.jen || { on: true, chips: [], glossary: [] }; l.disc = l.disc || { on: true, starter: '' }; });
    s.details = s.details || detailsSeed();
    s.obj = s.obj || { sel: [], custom: [], roles: [] }; s.obj.map = s.obj.map || {}; s.km = s.km || {}; s.kmSug = s.kmSug || {};
  }

  // Deep links: ?mode=old|new, ?lesson=1..13, ?tab=details|content, ?screen=new (an empty new course)
  (function () {
    migrate(STORE.dm); if (STORE.nw) migrate(STORE.nw);
    var q = new URLSearchParams(location.search);
    if (q.get('mode') === 'old') P.mode = 'old';
    var n = +q.get('lesson'); if (n >= 1 && n <= D.lessons.length) P.lid = D.lessons[n - 1].id;
    if (q.get('tab')) P.tab = q.get('tab');
    if (q.get('lesson') || q.get('tab')) P.screen = 'edit';
    if (q.get('screen') === 'new') { STORE.nw = STORE.nw || emptyCourse('Customer Service Essentials'); D = STORE.nw; P.course = 'nw'; P.screen = 'edit'; P.tab = 'content'; }
    P.lid = (D.lessons.filter(function (l) { return l.id === P.lid; })[0] || D.lessons[0] || {}).id; P.kl = P.lid;
  })();

  render();
})();
</script>
</body>
